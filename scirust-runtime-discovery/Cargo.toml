[workspace]
members = ["."]
resolver = "2"

[package]
name = "scirust-runtime-discovery"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89"
description = "Deterministic, leakage-aware discovery of runtime features for SciRust policies"
license-file = "../LICENSE.md"
repository = "https://github.com/Memorithm/scirust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "runtime-feature-discovery"
path = "src/bin/runtime_feature_discovery.rs"

[[bin]]
name = "review-feature-proposals"
path = "src/bin/review_feature_proposals.rs"

[package]
name = "scirust-gpu"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = ["scirust-compute/std"]
cuda = ["std", "dep:scirust-cuda", "scirust-cuda/cuda"]
# Optional product-licensing gate for the GPU module (Module::Gpu). Off by
# default so unlicensed/dev builds behave exactly as today; when enabled a
# deployment calls `license::activate` before arming GPU dispatch. Compiles and
# tests without the heavy `wgpu` backend.
license-gate = ["std", "dep:scirust-license"]
# Portable GPU compute via wgpu (Vulkan/Metal/DX12/GL). Testable in CI with a
# software Vulkan adapter (Mesa lavapipe). See docs/GPU.md (P2.2).
# Pulls in scirust-core to implement its autograd-tape `GpuEngine` hook.
wgpu = ["std", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:scirust-core"]
# Optional zero-copy attention bridge. FLAT is pinned to a reviewed, merged
# caller-owned WGPU commit; enabling this feature also enables SciRust's resident
# WGPU backend. The pinned revision retains the qualified M15 decode contract and
# includes the M19-M30 grouped forward/backward, resident training-chain, runtime
# telemetry and stable api::v1 surfaces without changing the feature from opt-in.
# The exact revision below is a merged, CI-green FLAT default-branch commit.
flat-attention = ["wgpu", "dep:flat-attention"]
# Reusable FLAT planning boundary. ElasticAutoTuner depends only on scirust-compute,
# so this edge stays below model code and introduces no dependency cycle.
flat-autotune = ["flat-attention", "dep:elastic-autotuner"]

[dependencies]
scirust-compute = { path = "../scirust-compute", default-features = false }
elastic-autotuner = { path = "../elastic-autotuner", optional = true }
# Decodes and executes `KernelFormat::Reference` modules on the CPU adapter.
# Depends only on scirust-compute and scirust-tensor-reference, neither of which
# reaches scirust-gpu, so this edge introduces no dependency cycle. It is
# unconditional: scirust-gpu carries no `#![no_std]` attribute and always links
# std, so its `std` feature only forwards `scirust-compute/std`. One consequence
# is documented and accepted: `--no-default-features` now also builds
# scirust-compute with std, through feature unification.
scirust-tensor-reference = { path = "../scirust-tensor-reference" }
scirust-core = { path = "../scirust-core", optional = true }
scirust-cuda = { path = "../scirust-cuda", optional = true }
scirust-license = { path = "../scirust-license", optional = true }
wgpu = { version = "0.20", optional = true }
flat-attention = { git = "https://github.com/Memorithm/FLAT-ATTENTION", rev = "0ffdbde743f86feb6d67b1aeaa177bcbfe28794f", default-features = false, features = ["wgpu"], optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", optional = true }

# The device-parity probe uses the wgpu-gated `ops` / `GpuChain` / `WgpuContext`
# API, so it can only build with the `wgpu` feature. Declaring required-features
# makes `cargo build --all-targets` (without wgpu) skip it instead of failing to
# compile the gated imports.
[[example]]
name = "gpu_attention_probe"
required-features = ["wgpu"]

# The GPU-vs-CPU bench uses the same wgpu-gated `ops` / `GpuChain` API, so it
# likewise only builds with the `wgpu` feature.
[[example]]
name = "gpu_bench"
required-features = ["wgpu"]

# The full-model resident fwd+bwd bench (vs the C1 tape path) — same gating.
[[example]]
name = "gpu_model_bench"
required-features = ["wgpu"]

# Phase 23 sampler characterization exercises the WGPU-resident deterministic
# sampler and is intentionally unavailable without the WGPU feature.
[[example]]
name = "deterministic_sampler_bench"
required-features = ["wgpu"]

# Phase 25 compares the exact Phase 22 and Phase 24 bounded-top-k samplers
# through the same public sample() transfer/synchronization boundary.
[[example]]
name = "deterministic_sampler_compare"
required-features = ["wgpu"]

# Phase 28 resident-generation probes depend on scirust-core through the WGPU
# feature and import WGPU-only public types. Keep CUDA-only/all-target builds
# from compiling examples whose dependencies are intentionally feature-gated.
[[example]]
name = "resident_generation_first_token_probe"
required-features = ["wgpu"]

[[example]]
name = "resident_generation_benchmark"
required-features = ["wgpu"]

# M28 paired resident baseline: production SciRust multi-dispatch attention
# versus the opt-in FLAT fused grouped-forward path.
[[example]]
name = "flat_m28_naive_vs_fused"
required-features = ["wgpu", "flat-attention"]

# M50 product proof: the exact SciAgent GQA prefill attention routes, including
# Q/K RoPE, on one resident WGPU context.
[[example]]
name = "flat_product_prefill_proof"
required-features = ["wgpu", "flat-attention"]

# Test-only: build genuine Reference artefacts through the real
# Graph -> ExecutionPlan -> LoweredPlan -> artefact pipeline, so the CPU
# adapter's tests exercise the same bytes a production caller would produce
# instead of re-encoding the wire format a second time inside this crate.
# Neither crate depends on scirust-gpu, so no cycle is introduced.
[dev-dependencies]
scirust-tensor-compile = { path = "../scirust-tensor-compile" }
scirust-tensor-ir = { path = "../scirust-tensor-ir" }
# Test-only: the canonical plan runtime, so the WGPU Reference adapter is
# exercised through the real Graph -> ... -> ReferencePlanRuntime path instead
# of a hand-built plan. `scirust-tensor-runtime` dev-depends on this crate in
# return; the cycle runs through dev-dependencies only, which Cargo permits and
# which never reaches either crate's production graph.
scirust-tensor-runtime = { path = "../scirust-tensor-runtime" }

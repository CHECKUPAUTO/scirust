[package]
name = "scirust"
version = "0.14.0"
edition = "2021"
publish = false
rust-version = "1.89"
description = "SciRust — pure-Rust deterministic deep-learning & scientific-computing platform with certifiable industrial verticals (estimation, navigation, water, OT security, functional safety), validated from cloud x86 to embedded ARM (Jetson)"
license-file = "LICENSE.md"
repository = "https://github.com/Memorithm/scirust"

[dependencies]
scirust-core = { path = "scirust-core" }
scirust-simd = { path = "scirust-simd" }
elastic-autotuner = { path = "elastic-autotuner", optional = true }
# Host-only ElasticWorld planner rail. These exact revisions are reviewed merge
# commits; no WGPU feature is enabled on the new FLAT dependency.
elastic-core = { git = "https://github.com/Memorithm/ElasticXxx.git", rev = "9130a412857335cc5120b013b91552dd0808f9f1", package = "elastic-core", optional = true }
flat-attention-planner = { git = "https://github.com/Memorithm/FLAT-ATTENTION", rev = "75d3bd684643aedb98f55a892f93d727a8187cea", package = "flat-attention", default-features = false, optional = true }
flat-elastic-kernel = { git = "https://github.com/Memorithm/FLAT-ATTENTION", rev = "75d3bd684643aedb98f55a892f93d727a8187cea", package = "flat-elastic-kernel", optional = true }
scirust-symbolic = { path = "scirust-symbolic" }
scirust-learning = { path = "scirust-learning" }
scirust-solvers = { path = "scirust-solvers" }
scirust-rsi = { path = "scirust-rsi" }
scirust-variational = { path = "scirust-variational" }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
rand = { version = "0.8", optional = true }
# Used only by the bundled `openclaw-u` demo binary (src/main.rs) to
# integrity-protect its `state.json` with an HMAC-SHA256 tag. Already present
# transitively via scirust-trader, so this adds no new download to the lockfile.
sha2 = { version = "0.10", optional = true }

# The canonical tensor facade (`scirust::tensor_canonical`), off by default.
# All four are workspace path crates and none pulls a single external crate, so
# enabling them adds no download and no new lockfile package — only edges.
# `scirust-tensor-core` and `scirust-compute` are direct because the runtime
# re-exports neither `TensorND` nor `ComputeBackend`, and no transitive path to
# them exists.
scirust-tensor-runtime = { path = "scirust-tensor-runtime", optional = true }
scirust-tensor-core = { path = "scirust-tensor-core", optional = true }
scirust-compute = { path = "scirust-compute", optional = true }
# The CPU Reference adapter. The crate is named `scirust-gpu` for historical
# reasons, but its default features are `std` alone: 8 workspace crates, zero
# external ones, no wgpu and no CUDA. Those stay behind `scirust-gpu/wgpu` and
# `scirust-gpu/cuda`, which nothing here activates.
scirust-gpu = { path = "scirust-gpu", optional = true }

[features]
default = []
autotune = ["dep:elastic-autotuner", "dep:scirust-compute"]
# FLAT attention planning through the legacy production ElasticAutoTuner plus
# the new host-only FLAT/ElasticXxx contextual advisory rail. The existing
# scirust-gpu runtime stays on its reviewed WGPU-0.20-compatible FLAT revision;
# the newer FLAT revision is never enabled with WGPU here.
flat-autotune = [
    "autotune",
    "dep:scirust-gpu",
    "scirust-gpu/flat-autotune",
    "dep:elastic-core",
    "dep:flat-attention-planner",
    "dep:flat-elastic-kernel",
]
openclaw = ["dep:tokio", "dep:serde", "dep:serde_json", "dep:chrono", "dep:rand", "dep:sha2"]
# The canonical tensor facade with a backend the caller supplies:
# `scirust::tensor_canonical::{CanonicalProgram, TensorND, ReferencePlanRuntime, …}`.
# Deliberately backend-free — it imposes no adapter and no GPU stack.
tensor-canonical = ["dep:scirust-tensor-runtime", "dep:scirust-tensor-core", "dep:scirust-compute"]
# The facade plus the deterministic CPU adapter, so a program runs out of the
# box: `ReferencePlanRuntime::new(CpuComputeAdapter::new())`. Named `-cpu`
# because that is honestly what it provides; it activates neither wgpu nor CUDA.
tensor-canonical-cpu = ["tensor-canonical", "dep:scirust-gpu"]
# The facade plus the WGPU adapter, which executes the same canonical plans on a
# GPU — or on a software Vulkan adapter such as Mesa lavapipe, which is still a
# genuine WGPU device and is reported as such. This pulls the full wgpu stack
# (~100 crates), so it is a deliberate opt-in and stays out of `default`. It
# activates `scirust-gpu/wgpu` only; CUDA remains untouched.
tensor-canonical-wgpu = ["tensor-canonical", "dep:scirust-gpu", "scirust-gpu/wgpu"]
# The facade plus the CUDA adapter, which executes the same canonical plans on
# an NVIDIA device: one specialised CUDA C kernel per logical kernel, compiled
# by NVRTC at preparation. It adds no external crate beyond the `cudarc` the
# workspace already vendors, and it activates `scirust-gpu/cuda` only; wgpu
# remains untouched. Building it needs no CUDA toolkit; *running* it needs the
# CUDA driver and NVRTC libraries plus a real device, and it never falls back to
# the CPU when they are absent.
tensor-canonical-cuda = ["tensor-canonical", "dep:scirust-gpu", "scirust-gpu/cuda"]

[dev-dependencies]
rand = "0.8"

# The framework itself is exposed as the `scirust` library (src/lib.rs).
# The bundled autonomous-agent demo (src/main.rs, "OpenClaw-U") is a separate,
# clearly-named binary — it is NOT part of the deep-learning framework.
[[bin]]
name = "openclaw-u"
path = "src/main.rs"
required-features = ["openclaw"]

# End-to-end demonstration of the canonical tensor facade on the CPU adapter,
# importing nothing but `scirust::…`. Declared explicitly rather than
# auto-discovered so `required-features` keeps it out of a default build.
[[example]]
name = "canonical_tensor_cpu"
path = "examples/canonical_tensor_cpu.rs"
required-features = ["tensor-canonical-cpu"]


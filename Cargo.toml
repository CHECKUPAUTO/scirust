    # by both scirust-cli and (later) the desktop application.
    "scirust-studio-command",
    "scirust-studio-schema",
    "scirust-studio-registry",
    "scirust-studio-runtime",
    "scirust-studio-ipc",
    "scirust-studio-store",
    "scirust-studio-worker",

exclude = [
    # The desktop application is its own Cargo workspace. Keeping it out of
    # the root one protects the root MSRV gate, the root dependency graph and
    # normal workspace build times from the GUI toolchain — see
    # docs/studio/adr/0005-tauri-dioxus-desktop-architecture.md.
    "apps/scirust-studio",
    # CCOS Core (the agent's causal memory) is vendored with its own Cargo
    # workspace and lockfile; built separately via scripts/ccos/install.sh —
    # see docs/CCOS_MEMORY.md.
    "external/ccos-core",
    "examples/simd_views_demo",
    "examples/benchmarks",
    # Fuzz harness: its own nightly-only workspace (libfuzzer-sys), built only
    # by the dedicated `fuzz` CI job. Never part of the main workspace build.
    "fuzz",
    # Requires `[workspace.dependencies] burn` and the heavy external `burn`
    # crate; kept out of the default workspace build.
    "scirust-burn-bridge",
    # Its own nightly-only workspace: it mandates `scirust-simd/portable-simd`
    # (nightly `feature(portable_simd)`), so it cannot participate in the
    # stable / MSRV `--workspace` build the way `portable-simd` stays optional
    # and off-by-default everywhere else. Built and tested only by the
    # dedicated `hypermemory` CI job (nightly). Keeps the "whole workspace
    # builds on stable" gate intact.
    "scirust-hypermemory",
    # SOS (Scientific Operating System) lives in its OWN Cargo workspace under
    # sos/, and is deliberately NOT part of the SciRust workspace build (see
    # docs/sos/, RFC-0002 §11.6). Excluded so a root `cargo --workspace` never
    # descends into it and the "whole workspace builds on stable" gate is kept.
    "sos",
]
resolver = "2"

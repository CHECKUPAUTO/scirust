[package]
name = "scirust-elliptic-discovery"
version = "0.3.0"
edition = "2021"
publish = false
rust-version = "1.89"
description = "Exact, deterministic discovery experiments on locally generated toy elliptic curves"
license-file = "../LICENSE.md"
repository = "https://github.com/Memorithm/scirust"

[dependencies]
scirust-modalg = { path = "../scirust-modalg" }
scirust-sim = { path = "../scirust-sim", default-features = false }
scirust-simd = { path = "../scirust-simd", optional = true }
scirust-core = { path = "../scirust-core" }
sha2 = "0.10"

[features]
portable-simd = ["dep:scirust-simd", "scirust-simd/portable-simd"]

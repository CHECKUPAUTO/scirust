[package]
name = "sos-scirust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SOS Computational Backend Adapter (Invariant VIII): the sole SOS crate permitted to depend on scirust-* crates, wrapping them behind the engine syscalls that need real numerics. Expected-information-gain estimation in three tiers — closed-form over scirust-gp's exact Gaussian-process posterior variance (L3, zero standard error), a continuous-design-box Bayesian-optimization search reusing scirust-automl's seeded EI loop to maximize sos-planner's own utility policy (L1), and a seeded nested-Monte-Carlo estimator over finite scirust-stats discrete-hypothesis likelihoods with a real, non-fabricated standard error (L1). Six sos-simulation Simulate backends: fixed-step RK4 (L3), adaptive Dormand-Prince 5(4) and adaptive Simpson quadrature and Broyden root-finding (L2, each carrying a real certificate in its output type), a windowed periodogram over scirust-signal's FFT (L3 — bit-reproducible, and documented and tested as being no accuracy claim), and Welch's averaged periodogram (also L3, but whose variance does fall as 1/segments, so its output carries the segment count as a statistical quality descriptor — a third kind of metadata beside L2's tolerance certificate and L1's standard error). Plus a catalogue backend giving scientific models a content address: scirust-sim's oracle-tested domain models (SIR/SEIR, Lotka-Volterra, RC circuits, Van der Pol, damped oscillators) are named structs with scalar parameters rather than closures, so a run's content address determines what will be computed — which a closure-backed ODE config's does not. An exact log10 Bayes factor over scirust-stats discrete likelihoods, supplying the weight of evidence sos-theory ranks rivals by but refuses to compute (L3); the reproduction verdicts sos-repro defers to a backend; and the first real workflow stage handler. Pure Rust, no FFI, no unsafe."
keywords = ["scirust", "backend", "adapter", "gaussian-process", "science"]
categories = ["science"]

[dependencies]
sos-core = { workspace = true }
sos-planner = { workspace = true }
sos-simulation = { workspace = true }
sos-theory = { workspace = true }
sos-store = { workspace = true }
sos-workflow = { workspace = true }
sos-repro = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
scirust-gp = { path = "../../scirust-gp" }
scirust-automl = { path = "../../scirust-automl" }
scirust-stats = { path = "../../scirust-stats" }
scirust-solvers = { path = "../../scirust-solvers" }
scirust-signal = { path = "../../scirust-signal" }
scirust-sim = { path = "../../scirust-sim" }

[dev-dependencies]
serde_json = { workspace = true }
sos-registry = { workspace = true }

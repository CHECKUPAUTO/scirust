# deny.toml — cargo-deny configuration for SciRust (validated with cargo-deny 0.19)
#
# The workspace crates themselves are source-available under
# PolyForm Noncommercial 1.0.0 (see LICENSE.md) and are not published to
# crates.io (`publish = false`), so the license check below covers
# third-party dependencies only.

[graph]
all-features = false

[advisories]
ignore = [
    # Unmaintained notice, not a vulnerability — no CVSS score is assigned
    # (https://rustsec.org/advisories/RUSTSEC-2024-0436).
    #
    # `paste` reaches this workspace through TWO paths, and only one of them can
    # be removed:
    #
    #   nalgebra 0.33 -> simba 0.9  -> paste   (removable: simba 0.10 dropped
    #                                           `paste`, and nalgebra 0.35
    #                                           requires simba ^0.10)
    #   wgpu-hal      -> metal      -> paste   (NOT removable: every published
    #                                           `metal`, through 0.33.0, depends
    #                                           on `paste`)
    #
    # So upgrading nalgebra does NOT clear this advisory, and a major bump
    # undertaken for that reason would be wasted churn. The blocker is the
    # Metal backend of the GPU stack, not the linear-algebra stack.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; reaches the graph via wgpu-hal -> metal, which depends on it in every published version — upgrading nalgebra/simba does not remove it" },
    # Unmaintained notice, not a vulnerability — no CVSS score is assigned.
    # Pulled in only by the optional Intel MKL source package, four levels down:
    #
    #   intel-mkl-src -> ocipkg -> oci-spec -> getset -> proc-macro-error2
    #
    # `getset` is the crate that would have to move; the advisory lists no safe
    # upgrade.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; reaches the graph only via intel-mkl-src -> ocipkg -> oci-spec -> getset, no safe upgrade available" },
]

[licenses]
# Exactly the permissive licenses present in the dependency tree
# (cargo-deny warns on unused allowances, so keep this list tight).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["LicenseRef-Intel-Simplified-Software-License"], crate = "intel-mkl-src@0.8.1" },
]
# Workspace members are unpublished; skip license checks for them.
private = { ignore = true }

# intel-mkl-src ships its license in a non-SPDX license-file field. Pin the
# reviewed Intel Simplified Software License text so an upstream change fails
# closed instead of silently inheriting this clarification.
[[licenses.clarify]]
crate = "intel-mkl-src@0.8.1"
expression = "LicenseRef-Intel-Simplified-Software-License"
license-files = [
    { path = "License.txt", hash = 0x3bf8c2d0 },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

name: Rustdoc fix scirust-machining

on:
  push:
    branches: [codex/gate-workspace-rustdoc]
    paths:
      - .github/workflows/rustdoc-fix-machining.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix machining rustdoc debt and validate
        shell: bash
        run: |
          set -u
          python3 <<'PY'
          from pathlib import Path

          root = Path('scirust-machining/src')

          # High-level crate index: these entries describe modules, not the
          # same-named re-exported functions. Use rustdoc's module namespace.
          lib = root / 'lib.rs'
          text = lib.read_text()
          module_links = [
              'oee', 'blanking_force', 'weld_heat_input', 'machine_hour_rate',
              'cosine_error', 'countersink_depth', 'takt_time', 'nozzle_thrust',
              'abbe_error', 'motor_efficiency', 'cavitation_number', 'lmtd',
              'fin_efficiency', 'gyroscopic_couple', 'thermal_resistance',
              'bend_allowance', 'gear_contact_ratio', 'rolling_force',
              'pump_specific_speed',
          ]
          changed = 0
          for name in module_links:
              old = f'[`{name}`]'
              new = f'[`mod@{name}`]'
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
          lib.write_text(text)

          # Cross-module links where prose refers to the callable calculation.
          callable_links = {
              'maintenance.rs': [('`crate::oee`', '`crate::oee()`')],
              'spot_welding.rs': [('`crate::weld_heat_input`', '`crate::weld_heat_input()`')],
              'abbe_error.rs': [('`crate::cosine_error`', '`crate::cosine_error()`')],
              'weld_cooling_rate.rs': [('`crate::weld_heat_input`', '`crate::weld_heat_input()`')],
              'weld_preheat.rs': [('`crate::weld_heat_input`', '`crate::weld_heat_input()`')],
              'forging_force.rs': [('`crate::blanking_force`', '`crate::blanking_force()`')],
          }
          for rel, replacements in callable_links.items():
              p = root / rel
              s = p.read_text()
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new)
                      changed += 1
              p.write_text(s)

          # Repair genuinely wrong paths to existing public modules.
          link_fixes = {
              'bevel_gear_forces.rs': [
                  ('[`bevel_worm_gears`]', '[`crate::bevel_worm_gears`]'),
              ],
              'shaft_sizing.rs': [
                  ('[`crate::torque`] et [`crate::stress`]',
                   '[`crate::shafts`] et [`crate::combined_stress`]'),
              ],
              'spring_combination.rs': [
                  ('[`crate::helical_springs`]', '[`crate::springs`]'),
              ],
          }
          for rel, replacements in link_fixes.items():
              p = root / rel
              s = p.read_text()
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new)
                      changed += 1
              p.write_text(s)

          # Unit notation in prose must not be parsed as intra-doc links.
          # Keep square brackets in fenced code examples untouched.
          unit_files = [
              'capacity_planning.rs',
              'sound_power_level.rs',
              'sound_pressure_level.rs',
              'three_phase_power.rs',
              'standard_atmosphere.rs',
              'sound_transmission_loss.rs',
              'mixing_power.rs',
          ]
          units = [
              'h', 'W', 'dB', 'm', 'Pa', 'V', 'A', 'VA', 'var', 'K', 'K/m',
              'm/s²', 'kg/mol', 'Hz', 'm²', 'kg·m⁻²', 'm·s⁻¹', 'kg·s⁻¹',
              'J·kg⁻¹', 'J·kg⁻¹·K⁻¹', 'W·m⁻²·K⁻¹', 'm³·s⁻¹', 'N', 'N·m',
              'rad', 'rad/s', 'unités',
          ]
          for rel in unit_files:
              p = root / rel
              lines = p.read_text().splitlines(keepends=True)
              in_fence = False
              out = []
              for line in lines:
                  stripped = line.lstrip()
                  is_doc = stripped.startswith('//!') or stripped.startswith('///')
                  if is_doc and '```' in line:
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if is_doc and not in_fence:
                      new_line = line
                      for unit in units:
                          new_line = new_line.replace(f'[{unit}]', f'({unit})')
                      if new_line != line:
                          changed += 1
                      line = new_line
                  out.append(line)
              p.write_text(''.join(out))

          if changed == 0:
              raise SystemExit('no expected rustdoc replacements were applied')
          print(f'applied {changed} rustdoc replacements')
          PY

          git diff --check
          set +e
          RUSTDOCFLAGS="-D warnings" cargo +stable doc -p scirust-machining --no-deps --locked
          status=$?
          set -e

          git rm .github/workflows/rustdoc-fix-machining.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-machining/src
          git commit -m "docs(machining): fix strict rustdoc links and units"
          git push origin HEAD:codex/gate-workspace-rustdoc
          exit "$status"

name: Rustdoc fix scirust-thermo once

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/rustdoc-fix-thermo-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Apply exact scirust-thermo rustdoc fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-thermo/src/backward.rs')
          text = path.read_text()
          replacements = [
              ('dispatched to fitted sub-region 3a or 3b by [`h_3ab`]. Unlike',
               'dispatched to fitted sub-region 3a or 3b by `h_3ab`. Unlike'),
              ('/// [`S_CRITICAL`] — unlike the `(p,h)` dispatch, no pressure-dependent',
               '/// `S_CRITICAL` — unlike the `(p,h)` dispatch, no pressure-dependent'),
              ('fitted sub-regions 2a/2b/2c (Supp-PHS12-2014 eqs. 3-5) by [`hab_s`]',
               'fitted sub-regions 2a/2b/2c (Supp-PHS12-2014 eqs. 3-5) by `hab_s`'),
              ('/// 3a/3b by [`S_CRITICAL`] (Supp-phs3-2014 eq. 1).',
               '/// 3a/3b by `S_CRITICAL` (Supp-phs3-2014 eq. 1).'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
      - name: Validate strict scirust-thermo rustdoc
        shell: bash
        run: cargo +stable doc -p scirust-thermo --no-deps --locked
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rustdoc-fix-thermo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-thermo/src/backward.rs .github/workflows/rustdoc-fix-thermo-once.yml
          git commit -m 'docs: fix scirust-thermo private rustdoc links'
          git push origin HEAD:codex/gate-workspace-rustdoc

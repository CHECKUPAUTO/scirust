name: ElasticTokenizer Heap compact A/B probe

on:
  pull_request:
    paths:
      - ".github/workflows/elastic-heap-compact-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heap-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout baseline master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 00d868f69e982c5ba72786f5fb2d12dbc77eb57e
          path: baseline

      - name: Checkout compact Heap candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b65471544718daadbe52ff4d499bef9abe664771
          path: candidate

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Record runner identity
        run: |
          {
            uname -a
            echo
            lscpu
          } > /tmp/heap-ab-runner.txt

      - name: Train one deterministic canonical tokenizer
        working-directory: baseline
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin train-tokenizer -- \
            --input scirust-sciagent/src/elastic_heap.rs \
            --input scirust-sciagent/src/model.rs \
            --vocab-size 1024 \
            --min-frequency 2 \
            --merge-semantics canonical-rank-v1 \
            --output /tmp/heap-ab-tokenizer.json

      - name: Measure baseline
        working-directory: baseline
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin tokenizer-autotune -- \
            --tokenizer /tmp/heap-ab-tokenizer.json \
            --input scirust-sciagent/src/elastic_heap.rs \
            --input scirust-sciagent/src/model.rs \
            --output /tmp/heap-ab-baseline-profile.json \
            --report /tmp/heap-ab-baseline-report.json \
            --probe-lengths 8,32,128,512,1024,2048,4096 \
            --cases-per-length 1 \
            --warmup-runs 2 \
            --measured-runs 7 \
            --device same-github-runner

      - name: Measure compact candidate on exact baseline corpus
        working-directory: candidate
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin tokenizer-autotune -- \
            --tokenizer /tmp/heap-ab-tokenizer.json \
            --input ../baseline/scirust-sciagent/src/elastic_heap.rs \
            --input ../baseline/scirust-sciagent/src/model.rs \
            --output /tmp/heap-ab-candidate-profile.json \
            --report /tmp/heap-ab-candidate-report.json \
            --probe-lengths 8,32,128,512,1024,2048,4096 \
            --cases-per-length 1 \
            --warmup-runs 2 \
            --measured-runs 7 \
            --device same-github-runner

      - name: Verify semantic parity and summarize Heap medians
        run: |
          test "$(jq '[.measurements[] | select(.semantic_match == false)] | length' /tmp/heap-ab-baseline-report.json)" = "0"
          test "$(jq '[.measurements[] | select(.semantic_match == false)] | length' /tmp/heap-ab-candidate-report.json)" = "0"

          jq -r '
            [.measurements[] | select(.kernel == "heap" and .semantic_match)]
            | group_by(.piece_len)
            | .[]
            | sort_by(.elapsed_nanos) as $g
            | ($g | length) as $n
            | [
                $g[0].piece_len,
                (if ($n % 2) == 1
                 then $g[($n / 2 | floor)].elapsed_nanos
                 else ((($g[$n / 2 - 1].elapsed_nanos + $g[$n / 2].elapsed_nanos) / 2) | floor)
                 end)
              ]
            | @tsv' /tmp/heap-ab-baseline-report.json > /tmp/heap-ab-baseline.tsv

          jq -r '
            [.measurements[] | select(.kernel == "heap" and .semantic_match)]
            | group_by(.piece_len)
            | .[]
            | sort_by(.elapsed_nanos) as $g
            | ($g | length) as $n
            | [
                $g[0].piece_len,
                (if ($n % 2) == 1
                 then $g[($n / 2 | floor)].elapsed_nanos
                 else ((($g[$n / 2 - 1].elapsed_nanos + $g[$n / 2].elapsed_nanos) / 2) | floor)
                 end)
              ]
            | @tsv' /tmp/heap-ab-candidate-report.json > /tmp/heap-ab-candidate.tsv

          echo -e "piece_len\tbaseline_ns\tcompact_ns\tspeedup_x" | tee /tmp/heap-ab-summary.tsv
          join -t $'\t' -1 1 -2 1 /tmp/heap-ab-baseline.tsv /tmp/heap-ab-candidate.tsv \
            | awk -F '\t' 'BEGIN { OFS="\t" } { printf "%s\t%s\t%s\t%.6f\n", $1, $2, $3, $2 / $3 }' \
            | tee -a /tmp/heap-ab-summary.tsv

      - name: Publish A/B summary
        if: always()
        run: |
          echo "### Heap compact A/B" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/heap-ab-summary.tsv >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline: 00d868f69e982c5ba72786f5fb2d12dbc77eb57e" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: b65471544718daadbe52ff4d499bef9abe664771" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-heap-compact-ab
          path: |
            /tmp/heap-ab-runner.txt
            /tmp/heap-ab-tokenizer.json
            /tmp/heap-ab-baseline-report.json
            /tmp/heap-ab-candidate-report.json
            /tmp/heap-ab-summary.tsv
          if-no-files-found: warn

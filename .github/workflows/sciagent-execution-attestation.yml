name: SciAgent execution attestation

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/src/artifact_provenance.rs"
      - "scirust-sciagent/src/communication.rs"
      - "scirust-sciagent/src/execution_attestation.rs"
      - "scirust-sciagent/src/lib.rs"
      - "scirust-sciagent/src/route_b_execution_attestation.rs"
      - "scirust-sciagent/src/sha256.rs"
      - "scirust-sciagent/src/bpe.rs"
      - "scirust-sciagent/src/bpe_dispatch.rs"
      - "scirust-sciagent/src/canonical_bpe_train.rs"
      - "scirust-sciagent/src/elastic_*.rs"
      - "scirust-sciagent/src/bin/sciagent-dialogue.rs"
      - "scirust-sciagent/src/bin/scientific-orchestrator.rs"
      - "scirust-sciagent/src/bin/tokenizer-*.rs"
      - "scirust-sciagent/src/bin/train-tokenizer.rs"
      - "scirust-sciagent/src/bin/collect-data.rs"
      - "scirust-sciagent/src/bin/legacy-bpe-*.rs"
      - "scirust-sciagent/src/train/checkpoint.rs"
      - "scirust-sciagent/tokenizer/bpe.json"
      - "scirust-agent-protocol/**"
      - "docs/sciagent-runtime-execution-attestation.md"
      - ".github/workflows/sciagent-execution-attestation.yml"

permissions:
  contents: read

jobs:
  contract:
    name: runtime attestation + tokenizer + provenance + MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - run: rustup toolchain install 1.89.0 --profile minimal
      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all -- --check
      - name: Clippy SciAgent integration targets
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Check MSRV SciAgent integration targets
        run: cargo +1.89.0 check -p scirust-sciagent --all-targets --locked
      - name: Test ElasticTokenizer library contracts
        run: cargo +1.89.0 test -p scirust-sciagent --lib elastic_ --locked
      - name: Test BPE compatibility contracts
        run: cargo +1.89.0 test -p scirust-sciagent --lib bpe --locked
      - name: Test SciAgent tokenizer binaries
        run: cargo +1.89.0 test -p scirust-sciagent --bins --locked
      - name: Test agent protocol attestation transport
        run: cargo +1.89.0 test -p scirust-agent-protocol --locked
      - name: Test runtime attestation builder
        run: cargo +1.89.0 test -p scirust-sciagent --lib execution_attestation --locked
      - name: Test Route-B attestation semantics
        run: cargo +1.89.0 test -p scirust-sciagent --lib route_b_execution_attestation --locked
      - name: Test artifact provenance identities
        run: cargo +1.89.0 test -p scirust-sciagent --lib artifact_provenance --locked
      - name: Test checkpoint provenance
        run: cargo +1.89.0 test -p scirust-sciagent --lib checkpoint_provenance --locked

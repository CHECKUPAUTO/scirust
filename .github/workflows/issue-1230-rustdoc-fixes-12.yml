name: Issue 1230 rustdoc fixes 12

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-rustdoc-fixes-12.yml"

permissions:
  contents: write

jobs:
  patch-rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix proof binary rustdoc link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-core/src/bin/proof_tcp_multihost.rs')
          text = path.read_text()
          old = '//! localement, [`tree_allreduce::tree_all_reduce`]) et compare bit à bit —'
          new = '//! localement, `tree_allreduce::tree_all_reduce`) et compare bit à bit —'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit rustdoc fix
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-core/src/bin/proof_tcp_multihost.rs
          git diff --cached --check
          git commit -m "docs(core): avoid proof binary rustdoc link"
          git push origin "HEAD:${HEAD_REF}"

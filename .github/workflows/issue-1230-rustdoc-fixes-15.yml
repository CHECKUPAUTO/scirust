name: Issue 1230 rustdoc fixes 15

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-rustdoc-fixes-15.yml"

permissions:
  contents: write

jobs:
  patch-rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix events-core and radar rustdoc links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'scirust-events-core/src/episodic.rs': [
                  ('//! [`crate::EventRuntime`](scirust_events_runtime::EventRuntime) produces a',
                   '//! `scirust_events_runtime::EventRuntime` produces a'),
              ],
              'scirust-signal/src/radar/mod.rs': [
                  ("//! directly on this crate's [`Complex`] primitive. A",
                   "//! directly on this crate's [`Complex`](crate::complex::Complex) primitive. A"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit rustdoc fixes
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-events-core/src/episodic.rs scirust-signal/src/radar/mod.rs
          git diff --cached --check
          git commit -m "docs: fix remaining events and radar rustdoc links"
          git push origin "HEAD:${HEAD_REF}"

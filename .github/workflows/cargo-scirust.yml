name: cargo-scirust

on:
  pull_request:
    paths:
      - "tools/cargo-scirust/**"
      - ".gitignore"
      - ".github/workflows/cargo-scirust.yml"

permissions:
  contents: write

env:
  CARGO_TARGET_DIR: /tmp/cargo-scirust-target

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Apply reviewed correctness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          commands = Path("tools/cargo-scirust/src/commands.rs")
          text = commands.read_text()
          if "for &byte in bytes {" in text:
              text = text.replace(
                  "    let mut hash = 0xcbf29ce484222325u64;\n    for &byte in bytes {\n",
                  "    let normalized = normalize_newlines(bytes);\n    let mut hash = 0xcbf29ce484222325u64;\n    for byte in normalized {\n",
                  1,
              )
          elif "for byte in normalized {" not in text:
              raise SystemExit("fingerprint loop not found")
          stable = '        assert_eq!(fingerprint(b"hello"), "fnv1a64:a430d84680aabd0b");\n'
          crlf = '        assert_eq!(fingerprint(b"a\\r\\nb\\r\\n"), fingerprint(b"a\\nb\\n"));\n'
          if crlf not in text:
              if stable not in text:
                  raise SystemExit("fingerprint stability assertion not found")
              text = text.replace(stable, stable + crlf, 1)
          commands.write_text(text)

          workspace = Path("tools/cargo-scirust/src/workspace.rs")
          text = workspace.read_text()
          start = text.find("    fn infer_base(&self) -> AppResult<String> {")
          end = text.find("    fn git_ref_exists(&self, reference: &str) -> bool {", start)
          if start < 0 or end < 0:
              raise SystemExit("infer_base boundaries not found")
          current = text[start:end]
          if "fn git_merge_base" not in current:
              block = "\n".join([
                  "    fn infer_base(&self) -> AppResult<String> {",
                  "        if let Ok(base_ref) = env::var(\"GITHUB_BASE_REF\") {",
                  "            if !base_ref.trim().is_empty() {",
                  "                for candidate in [format!(\"origin/{base_ref}\"), base_ref] {",
                  "                    if let Some(base) = self.git_merge_base(&candidate) {",
                  "                        return Ok(base);",
                  "                    }",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        for candidate in [\"origin/master\", \"master\", \"origin/main\", \"main\"] {",
                  "            if let Some(base) = self.git_merge_base(candidate) {",
                  "                return Ok(base);",
                  "            }",
                  "        }",
                  "",
                  "        if self.git_ref_exists(\"HEAD^\") {",
                  "            Ok(\"HEAD^\".to_string())",
                  "        } else {",
                  "            Ok(\"HEAD\".to_string())",
                  "        }",
                  "    }",
                  "",
                  "    fn git_merge_base(&self, reference: &str) -> Option<String> {",
                  "        if !self.git_ref_exists(reference) {",
                  "            return None;",
                  "        }",
                  "        let output = Command::new(\"git\")",
                  "            .current_dir(&self.root)",
                  "            .args([\"merge-base\", \"HEAD\", reference])",
                  "            .output()",
                  "            .ok()?;",
                  "        if !output.status.success() {",
                  "            return None;",
                  "        }",
                  "        let base = String::from_utf8_lossy(&output.stdout).trim().to_string();",
                  "        (!base.is_empty()).then_some(base)",
                  "    }",
                  "",
                  "",
              ])
              text = text[:start] + block + text[end:]
          workspace.write_text(text)
          PY
          cargo +1.89.0 fmt --manifest-path tools/cargo-scirust/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cargo-scirust/src
          if ! git diff --cached --quiet; then
            git commit -m "fix(tooling): compare full branch and normalize fingerprints"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - run: cargo +1.89.0 clippy --locked --manifest-path tools/cargo-scirust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.89.0 test --locked --manifest-path tools/cargo-scirust/Cargo.toml
      - name: Smoke test default affected merge-base analysis
        run: cargo +1.89.0 run --locked --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- affected --json
      - name: Smoke test Cargo plugin dispatcher
        run: cargo +1.89.0 run --locked --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- help
      - name: Smoke test affected help is terminal
        run: |
          out="$(cargo +1.89.0 run --locked --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- affected --help)"
          echo "$out"
          grep -Fq 'cargo scirust affected' <<<"$out"
          if grep -Fq 'SciRust affected analysis' <<<"$out"; then exit 1; fi
      - name: Smoke test workspace feature discovery
        run: cargo +1.89.0 run --locked --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- features scirust-core

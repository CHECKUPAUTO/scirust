name: cargo-scirust

on:
  pull_request:
    paths:
      - "tools/cargo-scirust/**"
      - ".github/workflows/cargo-scirust.yml"

permissions:
  contents: write

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Apply known Clippy fixes and rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/cargo-scirust/src/commands.rs")
          text = path.read_text()
          text = text.replace("use std::env;\n", "")
          text = text.replace("line.strip_suffix('\\r').unwrap_or(line).as_bytes().len()", "line.strip_suffix('\\r').unwrap_or(line).len()")
          path.write_text(text)
          PY
          cargo +1.89.0 fmt --manifest-path tools/cargo-scirust/Cargo.toml
          if ! git diff --quiet -- tools/cargo-scirust; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/cargo-scirust
            git commit -m "fix(tooling): satisfy strict clippy"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - run: cargo +1.89.0 clippy --manifest-path tools/cargo-scirust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.89.0 test --manifest-path tools/cargo-scirust/Cargo.toml
      - name: Smoke test Cargo plugin dispatcher
        run: cargo +1.89.0 run --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- help
      - name: Smoke test workspace feature discovery
        run: cargo +1.89.0 run --quiet --manifest-path tools/cargo-scirust/Cargo.toml -- features scirust-core

name: FLAT M53 asymmetric vec4 Thor candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "scirust-gpu/src/flat_m11.rs"
      - "scirust-gpu/src/chain.rs"
      - "scirust-gpu/examples/flat_m53_prefill_vec4_candidate.rs"
      - "scirust-gpu/Cargo.toml"
      - "Cargo.lock"
      - "docs/FLAT_M53_ASYMMETRIC_VEC4_THOR.md"
      - ".github/workflows/flat-m53-asymmetric-vec4-thor.yml"

permissions:
  contents: read

concurrency:
  group: flat-m53-asymmetric-vec4-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asymmetric-vec4-thor:
    name: Product attention portable vs vec4 on physical Thor
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    defaults:
      run:
        working-directory: _checkout
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /dev/nvidia0
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FLAT_M53_CANDIDATE_REVISION: c74a3806f8cfe621671694692fc14adfe08116f0
      SCIRUST_M53_Q_HEADS: "8"
      SCIRUST_M53_KV_HEADS: "2"
      SCIRUST_M53_WARMUPS: "3"
      SCIRUST_M53_REPEATS: "12"
      SCIRUST_THOR_IDLE_SETTLE_SECONDS: "300"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: _checkout

      - name: Require persistent physical Thor runner
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in
            tarek-scirust-arm64-01|tarek-scirust-arm64-02|tarek-scirust-arm64-03|tarek-scirust-arm64-04) ;;
            *)
              echo "::error::M53 requires one of tarek-scirust-arm64-01..04; refusing $RUNNER_NAME"
              exit 1
              ;;
          esac

      - name: Verify exact source and candidate revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCIRUST_SOURCE_REVISION"
          grep -F "rev = \"$FLAT_M53_CANDIDATE_REVISION\"" scirust-gpu/Cargo.toml >/dev/null
          grep -F "#$FLAT_M53_CANDIDATE_REVISION" Cargo.lock >/dev/null

      - name: Prepare isolated build directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$RUNNER_TEMP/flat-m53.XXXXXX")"
          chmod 700 "$tmpdir"
          mkdir -p "$tmpdir/cargo-home" "$tmpdir/rustup-home" "$tmpdir/target"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt

      - name: Format and build exact M53 benchmark
        shell: bash
        run: |
          set -euo pipefail
          rustup run nightly-2026-07-02 rustfmt --check --edition 2021 \
            scirust-gpu/src/flat_m11.rs \
            scirust-gpu/src/chain.rs \
            scirust-gpu/examples/flat_m53_prefill_vec4_candidate.rs
          rustup run nightly-2026-07-02 cargo build --release --locked \
            -p scirust-gpu --features flat-attention \
            --example flat_m53_prefill_vec4_candidate
          benchmark="$CARGO_TARGET_DIR/release/examples/flat_m53_prefill_vec4_candidate"
          test -x "$benchmark"
          echo "FLAT_M53_BENCHMARK=$benchmark" >> "$GITHUB_ENV"

      - name: Exclusive physical Thor qualification
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          for prerequisite in flock pgrep stat nvidia-smi vulkaninfo; do
            command -v "$prerequisite" >/dev/null || {
              echo "::error::missing physical-Thor prerequisite: $prerequisite"
              exit 1
            }
          done
          training_processes() { pgrep -af '[c]uda_pretrain' || true; }
          compute_processes() {
            nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null
          }
          if [[ ! -c "$SCIRUST_THOR_GPU_LOCK" || ! -r "$SCIRUST_THOR_GPU_LOCK" || ! -w "$SCIRUST_THOR_GPU_LOCK" ]]; then
            echo "::error::physical Thor lock target is not an accessible NVIDIA character device"
            exit 1
          fi
          stat -Lc 'gpu_lock_target=%n st_dev=%d inode=%i rdev_hex=%t:%T mode=%a owner=%U:%G type=%F' "$SCIRUST_THOR_GPU_LOCK"
          exec 9<>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if flock -n "$SCIRUST_THOR_GPU_LOCK" -c 'true'; then
            echo "::error::physical GPU lock does not contend independently"
            exit 1
          fi
          inventory="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader)"
          printf '%s\n' "$inventory"
          grep -F "NVIDIA Thor" <<< "$inventory" >/dev/null
          summary="$(vulkaninfo --summary 2>&1)"
          grep -F "NVIDIA Tegra NVIDIA Thor" <<< "$summary" >/dev/null

          deadline=$((SECONDS + 18000))
          settled=0
          while (( settled < 10#$SCIRUST_THOR_IDLE_SETTLE_SECONDS )); do
            training="$(training_processes)"
            active="$(compute_processes)"
            if [[ -n "${training//[[:space:]]/}" ]]; then
              echo "SciAgent training is active; restarting M53 idle window."
              settled=0
            elif [[ -n "${active//[[:space:]]/}" ]]; then
              echo "GPU activity prevents M53 qualification; restarting idle window:"
              printf '%s\n' "$active"
              settled=0
            else
              settled=$((settled + 5))
              if (( settled == 5 || settled % 60 == 0 )); then
                echo "Thor continuously idle: ${settled}/${SCIRUST_THOR_IDLE_SETTLE_SECONDS}s"
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Thor never reached the required idle window"
              exit 1
            fi
            sleep 5
          done

          echo "source_revision=$(git rev-parse HEAD)"
          echo "flat_candidate_revision=$FLAT_M53_CANDIDATE_REVISION"
          echo "benchmark_scope=product_attention_same_context_upload_readback_excluded"
          contamination="$RUNNER_TEMP/flat-m53-contamination.txt"
          : > "$contamination"
          for seq in 128 512; do
            for dim in 64 128; do
              output="$RUNNER_TEMP/flat-m53-${seq}-${dim}.csv"
              SCIRUST_M53_SEQ_LEN="$seq" SCIRUST_M53_HEAD_DIM="$dim" \
                "$FLAT_M53_BENCHMARK" > "$output" 2>&1 &
              benchmark_pid=$!
              while kill -0 "$benchmark_pid" 2>/dev/null; do
                training="$(training_processes)"
                active="$(compute_processes)"
                foreign="$(awk -F, -v own="$benchmark_pid" '$1 + 0 != own { print }' <<< "$active")"
                if [[ -n "${training//[[:space:]]/}" || -n "${foreign//[[:space:]]/}" ]]; then
                  { date -u +'%Y-%m-%dT%H:%M:%SZ'; printf '%s\n%s\n' "$training" "$foreign"; } >> "$contamination"
                  kill "$benchmark_pid" 2>/dev/null || true
                  break
                fi
                sleep 1
              done
              set +e
              wait "$benchmark_pid"
              status=$?
              set -e
              cat "$output"
              test "$status" -eq 0
              test ! -s "$contamination"
              grep -F 'NVIDIA Tegra NVIDIA Thor,Vulkan,' "$output" >/dev/null
              test "$(grep -c ',none$' "$output")" -eq 2
            done
          done
          post_active="$(compute_processes)"
          if [[ -n "${post_active//[[:space:]]/}" ]]; then
            echo "::error::GPU compute activity remains after M53 timing"
            printf '%s\n' "$post_active"
            exit 1
          fi
          echo "performance_claim=none"

name: Temporary direct-u32 cleanup

on:
  push:
    branches:
      - wip/elastic-tokenizer-direct-u32-ingress

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: wip/elastic-tokenizer-direct-u32-ingress
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Restore exact diagnostic and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-sciagent/src/elastic_text_tokenizer.rs')
          text = path.read_text()
          old = 'write!(f, "unknown elastic tokenizer merge semantics `{value}")'
          new = 'write!(f, "unknown elastic tokenizer merge semantics `{value}`")'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one diagnostic to restore, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo +nightly-2026-07-02 fmt --all
          rm .github/workflows/temp-direct-u32-cleanup.yml
          git diff --check
      - name: Commit cleanup and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-sciagent/src/elastic_engine.rs scirust-sciagent/src/elastic_text_tokenizer.rs scirust-sciagent/src/elastic_tiny.rs .github/workflows/temp-direct-u32-cleanup.yml
          git commit -m "style(sciagent): format direct u32 ingress"
          git push origin HEAD:wip/elastic-tokenizer-direct-u32-ingress

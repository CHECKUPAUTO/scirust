name: Issue 1230 sparse rustdoc fix

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-sparse-rustdoc-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: trigger scirust-sparse rustdoc fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix redundant Result target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-sparse/src/lib.rs')
          text = path.read_text()
          old = '//! Every fallible operation returns [`Result`](std::result::Result) with the'
          new = '//! Every fallible operation returns [`Result`] with the'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one rustdoc target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-sparse/src/lib.rs
          git rm .github/workflows/issue-1230-sparse-rustdoc-fix.yml
          git diff --cached --check
          git commit -m "docs(sparse): fix redundant rustdoc target"
          git push origin "HEAD:${HEAD_REF}"

name: Temporary Heap CSR promoter

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/temp-promote-heap-csr.yml
  push:
    branches:
      - perf/elastic-tokenizer-heap-csr-rules
    paths:
      - .github/workflows/temp-promote-heap-csr.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/elastic-tokenizer-heap-csr-rules
          fetch-depth: 0

      - name: Install pinned toolchains
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.89.0 --profile minimal

      - name: Apply signature-based Heap CSR patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          heap = Path("scirust-sciagent/src/elastic_heap.rs")
          text = heap.read_text()

          old = "PackedRule, PairKey, PriorityKey, try_compact_index,"
          if text.count(old) != 1:
              raise SystemExit(f"expected one Heap PairKey import, found {text.count(old)}")
          text = text.replace(old, "PackedRule, PriorityKey, try_compact_index,", 1)

          token_import = "use crate::elastic_tokenizer::{DuplicateMergeRule, TokenId};"
          if text.count(token_import) != 1:
              raise SystemExit("Heap tokenizer import anchor missing or ambiguous")
          text = text.replace(
              token_import,
              "use crate::elastic_rule_table::AdaptivePackedRuleTable;\n" + token_import,
              1,
          )

          variant = "    Compact(BTreeMap<PairKey, PackedRule>),"
          if text.count(variant) != 1:
              raise SystemExit("Heap compact RuleTable variant anchor missing or ambiguous")
          text = text.replace(variant, "    Compact(AdaptivePackedRuleTable),", 1)

          start = text.index("    fn from_ordered_merges(")
          end = text.index("    fn is_empty(&self)", start)
          text = text[:start] + '''    fn from_ordered_merges(
              merges: &[(TokenId, TokenId, TokenId)],
          ) -> Result<Self, DuplicateMergeRule> {
              if let Some(rules) = AdaptivePackedRuleTable::try_from_ordered_merges(merges)?
              {
                  return Ok(Self::Compact(rules));
              }

              let mut ranked = BTreeMap::new();
              for (rank, &(left, right, output)) in merges.iter().enumerate()
              {
                  if ranked
                      .insert((left, right), HeapRule { output, rank })
                      .is_some()
                  {
                      return Err(DuplicateMergeRule { left, right });
                  }
              }
              Ok(Self::Wide(ranked))
          }

          ''' + text[end:]

          start = text.index("    fn get_compact(&self")
          end = text.index("    fn get(&self, left: TokenId", start)
          text = text[:start] + '''    fn get_compact(&self, left: u32, right: u32) -> Option<PackedRule> {
              match self
              {
                  Self::Compact(rules) => rules.get(left, right),
                  Self::Wide(_) => None,
              }
          }

          ''' + text[end:]

          compact_arm = text.index("            Self::Compact(rules) =>", text.index("    fn get(&self, left: TokenId"))
          wide_arm = text.index("            Self::Wide(rules) =>", compact_arm)
          text = text[:compact_arm] + '''            Self::Compact(rules) =>
              {
                  let left = u32::try_from(left).ok()?;
                  let right = u32::try_from(right).ok()?;
                  let rule = rules.get(left, right)?;
                  Some(HeapRule {
                      output: usize::try_from(rule.output()).ok()?,
                      rank: usize::try_from(rule.rank()).ok()?,
                  })
              },
          ''' + text[wide_arm:]
          heap.write_text(text)

          rules = Path("scirust-sciagent/src/elastic_rule_table.rs")
          text = rules.read_text()
          get_sig = "    #[inline]\n    pub(crate) fn get(&self, left: u32, right: u32) -> Option<PackedRule> {"
          if text.count(get_sig) != 1:
              raise SystemExit("adaptive rule-table get signature missing or ambiguous")
          is_empty = '''    pub(crate) fn is_empty(&self) -> bool {
              match self
              {
                  Self::Csr(table) => table.rules.is_empty(),
                  Self::Flat(table) => table.entries.is_empty(),
              }
          }

          '''
          text = text.replace(get_sig, is_empty + get_sig, 1)
          rules.write_text(text)
          PY

      - name: Format and validate Heap CSR contracts
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
          cargo +1.89.0 check -p scirust-sciagent --all-targets --locked
          cargo +1.89.0 test -p scirust-sciagent --lib elastic_heap --locked
          cargo +1.89.0 test -p scirust-sciagent --lib elastic_rule_table --locked

      - name: Commit validated delta and remove promoter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scirust-sciagent/src/elastic_heap.rs \
            scirust-sciagent/src/elastic_rule_table.rs
          git rm .github/workflows/temp-promote-heap-csr.yml
          git commit -m "perf(sciagent): route Heap through adaptive CSR rules"
          git push origin HEAD:perf/elastic-tokenizer-heap-csr-rules

name: Rustdoc sync master once

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/rustdoc-sync-master-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - name: Merge current master and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git fetch origin master
          git merge --no-edit origin/master
          rm .github/workflows/rustdoc-sync-master-once.yml
          git add -A
          git commit -m "ci: sync rustdoc branch with master"
          git push origin HEAD:codex/gate-workspace-rustdoc

name: tmp-flat-pin-lock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'chore/flat-m21-pin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/flat-m21-pin
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Regenerate only the FLAT git dependency lock entry
        run: |
          set -euo pipefail
          cargo update -p flat-attention --precise 6d59a39fd7d831b236f25c71415d48fe97107627
          grep -F '6d59a39fd7d831b236f25c71415d48fe97107627' Cargo.lock
          if grep -Fq '974ebbaf95f54917dba0dc3f394d9ad1a92e8349' Cargo.lock; then
            echo 'old FLAT revision still present in Cargo.lock' >&2
            exit 1
          fi
      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-flat-pin-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/tmp-flat-pin-lock.yml
          git commit -m 'chore(gpu): regenerate lockfile for FLAT M22 pin'
          git push origin HEAD:chore/flat-m21-pin

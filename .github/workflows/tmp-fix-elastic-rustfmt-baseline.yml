name: tmp restore Elastic rustfmt baseline

on:
  push:
    branches:
      - fix/elastic-rustfmt-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/elastic-rustfmt-baseline')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/elastic-rustfmt-baseline

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Apply pinned rustfmt
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Restore strict Clippy baseline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("elastic-autotuner/src/racing.rs")
          text = path.read_text()
          old_memory = 'records.sort_by(|left, right| memory_key(left).cmp(&memory_key(right)))'
          old_latency = 'records.sort_by(|left, right| latency_key(left).cmp(&latency_key(right)))'
          assert text.count(old_memory) == 1
          assert text.count(old_latency) == 1
          text = text.replace(old_memory, 'records.sort_by_key(|entry| memory_key(entry))', 1)
          text = text.replace(old_latency, 'records.sort_by_key(|entry| latency_key(entry))', 1)
          path.write_text(text)
          PY
          cargo +nightly-2026-07-02 fmt --all

      - name: Restrict repair to Elastic files
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          allowed = {
              "elastic-autotuner/src/measured_selection.rs",
              "elastic-autotuner/src/measurement_protocol.rs",
              "elastic-autotuner/src/persistence.rs",
              "elastic-autotuner/src/racing.rs",
          }
          changed = set(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines() if line
          )
          unexpected = changed - allowed
          assert changed, "repair produced no diff"
          assert not unexpected, f"unexpected repair drift: {sorted(unexpected)}"
          assert changed == allowed, f"expected exactly four Elastic baseline files, got {sorted(changed)}"
          print("canonicalized:", *sorted(changed), sep="\n- ")
          PY
          git diff --check

      - name: Validate both format gates
        run: |
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 fmt --manifest-path scirust-hypermemory/Cargo.toml --all -- --check

      - name: Validate ElasticAutoTuner
        run: |
          cargo test -p elastic-autotuner --locked
          cargo +nightly-2026-07-02 clippy -p elastic-autotuner --all-targets --locked -- -D warnings

      - name: MSRV check
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          cargo +1.89.0 check -p elastic-autotuner --all-targets --locked

      - name: Commit repair and self-clean
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-elastic-rustfmt-baseline.yml
          git rm -f .tmp-elastic-rustfmt-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elastic-autotuner/src/measured_selection.rs \
                  elastic-autotuner/src/measurement_protocol.rs \
                  elastic-autotuner/src/persistence.rs \
                  elastic-autotuner/src/racing.rs
          git diff --cached --check
          git commit -m "style(autotuner): restore pinned-nightly rustfmt and clippy baseline"
          git push origin HEAD:fix/elastic-rustfmt-baseline

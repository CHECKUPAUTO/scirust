name: SciAgent I250 hosted check

on:
  push:
    branches: [perf/sciagent-i250-resident-kv]
    paths:
      - "scirust-core/**"
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - ".github/workflows/sciagent-i250-hosted-check.yml"
  pull_request:
    branches: [ci/i250-hosted-base]
    paths:
      - "scirust-core/**"
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - ".github/workflows/sciagent-i250-hosted-check.yml"

permissions:
  contents: read

concurrency:
  group: sciagent-i250-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  clippy-diagnostic:
    name: I250 strict Clippy diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: clippy
      - name: CUDA strict Clippy short diagnostics
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked --message-format short -- -D warnings

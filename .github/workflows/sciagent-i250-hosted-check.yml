name: SciAgent I250 hosted check

on:
  push:
    branches: [perf/sciagent-i250-resident-kv]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - ".github/workflows/sciagent-i250-hosted-check.yml"

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted-check:
    name: I250 format + CPU algebra + CUDA compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all -- --check
      - name: Elastic decode algebra tests
        run: cargo +nightly-2026-07-02 test -p scirust-sciagent --lib --locked elastic_decode_plan -- --nocapture
      - name: CUDA feature compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: CUDA strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings

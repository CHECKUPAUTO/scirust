name: P10 M24 lock refresh

on:
  push:
    branches:
      - chore/flat-m21-pin
    paths:
      - .github/workflows/p10-m24-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chore/flat-m21-pin
          fetch-depth: 0

      - name: Advance manifest to exact FLAT M24 revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-gpu/Cargo.toml')
          text = path.read_text()
          old = '6d59a39fd7d831b236f25c71415d48fe97107627'
          new = '311f6b89e001d69f53cddcd2f9ba396a6f80c746'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one M22 revision in manifest, found {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace(
              'includes the M19-M22 native GQA/MQA backward, prepared-dispatch and validation\n# surfaces without changing the feature from opt-in.',
              'includes the M19-M24 native GQA/MQA backward, device-resident training-chain and\n# caller-owned grouped-forward surfaces without changing the feature from opt-in.'
          )
          path.write_text(text)
          PY

      - name: Regenerate lock with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p flat-attention --precise 311f6b89e001d69f53cddcd2f9ba396a6f80c746
          grep -F 'rev=311f6b89e001d69f53cddcd2f9ba396a6f80c746#311f6b89e001d69f53cddcd2f9ba396a6f80c746' Cargo.lock
          ! grep -F 'rev=6d59a39fd7d831b236f25c71415d48fe97107627#6d59a39fd7d831b236f25c71415d48fe97107627' Cargo.lock

      - name: Remove temporary workflow and commit final P10.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p10-m24-lock-refresh.yml
          git add scirust-gpu/Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m 'chore(gpu): advance FLAT pin to qualified M24 head'
          git push origin HEAD:chore/flat-m21-pin

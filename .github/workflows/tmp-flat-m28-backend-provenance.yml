name: TEMP FLAT M28 backend provenance patch

on:
  push:
    branches:
      - fix/flat-m28-backend-provenance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/flat-m28-backend-provenance
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Patch backend provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          path = Path("scirust-gpu/src/wgpu_backend.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "    adapter_name: String,\n}",
              "    adapter_name: String,\n    adapter_backend: String,\n}",
              "context backend field",
          )
          text = replace_once(
              text,
              "        let instance = wgpu::Instance::new(wgpu::InstanceDescriptor {\n            backends: wgpu::Backends::all(),\n            ..Default::default()\n        });",
              "        let backends =\n            wgpu::util::backend_bits_from_env().unwrap_or_else(wgpu::Backends::all);\n        let instance = wgpu::Instance::new(wgpu::InstanceDescriptor {\n            backends,\n            ..Default::default()\n        });",
              "backend selection",
          )
          text = replace_once(
              text,
              "        let adapter_name = adapter.get_info().name;",
              "        let adapter_info = adapter.get_info();\n        let adapter_name = adapter_info.name;\n        let adapter_backend = format!(\"{:?}\", adapter_info.backend);",
              "adapter info",
          )
          text = replace_once(
              text,
              "                adapter_name,\n            }),",
              "                adapter_name,\n                adapter_backend,\n            }),",
              "context construction",
          )
          text = replace_once(
              text,
              "    pub fn adapter_name(&self) -> &str {\n        &self.adapter_name\n    }",
              "    pub fn adapter_name(&self) -> &str {\n        &self.adapter_name\n    }\n\n    /// Backend selected for this context (for example `Vulkan`, `Metal`, or `Dx12`).\n    pub fn adapter_backend(&self) -> &str {\n        &self.adapter_backend\n    }",
              "backend accessor",
          )
          path.write_text(text)

          path = Path("scirust-gpu/examples/flat_m28_naive_vs_fused.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "adapter,causal,seq_len,head_dim,warmups,repeats,naive_median_us",
              "adapter,backend,causal,seq_len,head_dim,warmups,repeats,naive_median_us",
              "csv header",
          )
          text = replace_once(
              text,
              '            "{},{},{},{},{},{},{:.3},{:.3},{:.3},{:.3},{:.3},{:.3},{:.6},{:.6},{:.8},{:.8},none",',
              '            "{},{},{},{},{},{},{},{:.3},{:.3},{:.3},{:.3},{:.3},{:.3},{:.6},{:.6},{:.8},{:.8},none",',
              "csv format",
          )
          text = replace_once(
              text,
              "            ctx.adapter_name().replace(',', \";\"),\n            causal,",
              "            ctx.adapter_name().replace(',', \";\"),\n            ctx.adapter_backend().replace(',', \";\"),\n            causal,",
              "csv backend value",
          )
          path.write_text(text)

          path = Path("docs/FLAT_M28_SCIRUST_BASELINE.md")
          text = path.read_text()
          text = replace_once(
              text,
              "The CSV includes median/p95 timings, paired ratios and parity evidence.",
              "The CSV includes the selected WGPU adapter/backend, median/p95 timings, paired ratios and parity evidence.",
              "benchmark docs csv",
          )
          text = replace_once(
              text,
              "forces the Vulkan WGPU backend, and rejects benchmark output unless the selected WGPU adapter reports `NVIDIA Tegra NVIDIA Thor`.",
              "forces the Vulkan WGPU backend, and rejects benchmark output unless the selected WGPU adapter reports `NVIDIA Tegra NVIDIA Thor` and the context reports the actual backend as `Vulkan`.",
              "benchmark docs backend",
          )
          path.write_text(text)
          PY

          rustup run nightly-2026-07-02 cargo fmt --all

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/src/wgpu_backend.rs scirust-gpu/examples/flat_m28_naive_vs_fused.rs docs/FLAT_M28_SCIRUST_BASELINE.md
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix(gpu): honor and report selected WGPU backend"
          git push origin HEAD:fix/flat-m28-backend-provenance

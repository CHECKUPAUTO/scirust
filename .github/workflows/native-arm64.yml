name: Native ARM64

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "scirust-fractional/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "scirust-sim/**"
      - "scirust-special/**"
      - "scirust-compute/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - "scirust-tensor-compile/**"
      - "scirust-tensor-core/**"
      - "scirust-tensor-ir/**"
      - "scirust-tensor-reference/**"
      - "scirust-tensor-runtime/**"
      - "src/lib.rs"
      - "tests/**"
      - ".github/workflows/native-arm64.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "scirust-fractional/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "scirust-sim/**"
      - "scirust-special/**"
      - "scirust-compute/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - "scirust-tensor-compile/**"
      - "scirust-tensor-core/**"
      - "scirust-tensor-ir/**"
      - "scirust-tensor-reference/**"
      - "scirust-tensor-runtime/**"
      - "src/lib.rs"
      - "tests/**"
      - ".github/workflows/native-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm64-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: Native ARM64 (Jetson Thor)

    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - scirust-arm64
      - jetson-thor
      - internal

    timeout-minutes: 120

    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Display native runner information
        run: |
          uname -a
          uname -m
          nproc
          free -h
          rustc --version 2>/dev/null || true

      - name: Prepare executable temporary directory
        run: |
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Pin Cargo bin directory for self-hosted steps
        run: echo "$(dirname "$(rustup which cargo --toolchain nightly-2026-07-02)")" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: native-arm64-jetson-thor

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test fractional calculus
        run: cargo test -p scirust-fractional

      - name: Test relativity and geodesics
        run: cargo test -p scirust-relativity

      - name: Test experimental nonlocal relativity
        run: cargo test -p scirust-nonlocal-relativity

      - name: Detect exposed CUDA device
        id: cuda-device
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "This ARM64 runner does not expose a CUDA device; native CPU/ARM64 checks remain active."
          fi

      - name: Report the CUDA device and libraries
        if: steps.cuda-device.outputs.available == 'true'
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total \
            --format=csv,noheader
          ldconfig -p | grep -E 'libcuda|libnvrtc' || \
            echo "no libcuda/libnvrtc entry in the loader cache"

      - name: Test the canonical Reference kernels on CUDA
        if: steps.cuda-device.outputs.available == 'true'
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        shell: bash
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          cargo test -p scirust-gpu --features cuda --test cuda_reference \
            -- --nocapture

      - name: Test the canonical facade on CUDA
        if: steps.cuda-device.outputs.available == 'true'
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          cargo test -p scirust --features tensor-canonical-cuda \
            --test canonical_tensor_cuda -- --nocapture

      - name: Test the CUDA raw runtime
        if: steps.cuda-device.outputs.available == 'true'
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          cargo test -p scirust-cuda --features cuda -- --nocapture

      - name: Run Clippy
        run: |
          cargo clippy \
            -p scirust-fractional \
            -p scirust-relativity \
            -p scirust-nonlocal-relativity \
            --all-targets \
            -- \
            -D warnings
          cargo clippy -p scirust-cuda --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust-gpu --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust --features tensor-canonical-cuda --all-targets -- -D warnings

name: Native ARM64

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "scirust-fractional/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "scirust-sim/**"
      - "scirust-special/**"
      - "scirust-compute/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - "scirust-sciagent/**"
      - "scirust-tensor-compile/**"
      - "scirust-tensor-core/**"
      - "scirust-tensor-ir/**"
      - "scirust-tensor-reference/**"
      - "scirust-tensor-runtime/**"
      - "src/lib.rs"
      - "tests/**"
      - ".github/workflows/native-arm64.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "scirust-fractional/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "scirust-sim/**"
      - "scirust-special/**"
      - "scirust-compute/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - "scirust-sciagent/**"
      - "scirust-tensor-compile/**"
      - "scirust-tensor-core/**"
      - "scirust-tensor-ir/**"
      - "scirust-tensor-reference/**"
      - "scirust-tensor-runtime/**"
      - "src/lib.rs"
      - "tests/**"
      - ".github/workflows/native-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm64-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: Native ARM64 (Jetson Thor)

    # Never execute untrusted code from a fork on the self-hosted runner.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - scirust-arm64
      - jetson-thor
      - internal

    timeout-minutes: 120

    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Display native runner information
        run: |
          uname -a
          uname -m
          nproc
          free -h
          rustc --version 2>/dev/null || true

      - name: Prepare executable temporary directory
        run: |
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: native-arm64-jetson-thor

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test fractional calculus
        run: cargo test -p scirust-fractional

      - name: Test relativity and geodesics
        run: cargo test -p scirust-relativity

      - name: Test experimental nonlocal relativity
        run: cargo test -p scirust-nonlocal-relativity

      # -------------------------------------------------------------------
      # Real CUDA execution. This runner is the only place in the project
      # where a CUDA device exists, so it is the only place the canonical
      # CUDA path can be proved rather than merely compiled.
      # -------------------------------------------------------------------

      - name: Report the CUDA device and libraries
        continue-on-error: true
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total \
            --format=csv,noheader
          ldconfig -p | grep -E 'libcuda|libnvrtc' || \
            echo "no libcuda/libnvrtc entry in the loader cache"

      - name: Test the canonical Reference kernels on CUDA
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        run: |
          cargo test -p scirust-gpu --features cuda --test cuda_reference \
            -- --nocapture

      - name: Test the canonical facade on CUDA
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        run: |
          cargo test -p scirust --features tensor-canonical-cuda \
            --test canonical_tensor_cuda -- --nocapture

      - name: Test the CUDA raw runtime
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        run: cargo test -p scirust-cuda --features cuda -- --nocapture

      # SCIAGENT Route-B must execute on the real Thor, not merely compile on hosted
      # CI. These tests cover forward/backward parity, training, cached decode parity,
      # and exact optimizer resume against the CPU/naive reference paths.
      - name: Test SCIAGENT Route-B CUDA parity on Thor
        env:
          SCIRUST_REQUIRE_CUDA: "1"
        run: |
          cargo test -p scirust-sciagent --features cuda --test cuda_parity \
            -- --nocapture

      # Short production-shape sweep. The example performs an untimed warm step before
      # each measurement. Four measured steps are enough to expose batch scaling while
      # keeping PR CI bounded; the standalone documented command can run longer.
      - name: Benchmark SCIAGENT 304M production path on Thor
        env:
          SCIAGENT_BENCH_BATCHES: "1,2,4,8"
          SCIAGENT_BENCH_SEQ: "512"
          SCIAGENT_BENCH_STEPS: "4"
          SCIAGENT_BENCH_PROMPT: "128"
          SCIAGENT_BENCH_DECODE_NEW: "8"
        run: |
          cargo run -p scirust-sciagent --features cuda --release \
            --example cuda_production_bench

      - name: Run Clippy
        run: |
          cargo clippy \
            -p scirust-fractional \
            -p scirust-relativity \
            -p scirust-nonlocal-relativity \
            --all-targets \
            -- \
            -D warnings
          cargo clippy -p scirust-cuda --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust-gpu --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust --features tensor-canonical-cuda --all-targets -- -D warnings

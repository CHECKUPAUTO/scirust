name: Algebra lock refresh

on:
  push:
    branches:
      - feat/scirust-algebra-groups

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/scirust-algebra-groups
          fetch-depth: 0
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
      - name: Regenerate lockfile with Cargo
        run: cargo generate-lockfile --offline
      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/algebra-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/algebra-lock-refresh.yml
          if git diff --cached --quiet; then
            echo "No lockfile change required"
            exit 0
          fi
          git commit -m "chore(algebra): refresh workspace lockfile"
          git push origin HEAD:feat/scirust-algebra-groups

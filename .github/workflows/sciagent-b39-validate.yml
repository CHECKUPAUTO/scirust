name: SciAgent B39 Thor production benchmark

on:
  push:
    branches:
      - perf/sciagent-b39-thor-production-bench
    paths:
      - scirust-sciagent/examples/cuda_production_bench.rs
      - .github/workflows/sciagent-b39-validate.yml
  pull_request:
    branches:
      - fix/sciagent-b38-checkpoint-lifecycle

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sciagent-b39-thor-production-bench
          fetch-depth: 0
      - name: Format
        run: cargo fmt --all
      - name: Check production benchmark
        run: cargo check -p scirust-sciagent --features cuda --example cuda_production_bench
      - name: Check CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
      - name: Compile CUDA parity
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Remove one-shot validator
        run: rm -f .github/workflows/sciagent-b39-validate.yml
      - name: Commit formatter output and validator removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "perf(sciagent): validate Thor production benchmark"
            git push origin HEAD:perf/sciagent-b39-thor-production-bench
          fi

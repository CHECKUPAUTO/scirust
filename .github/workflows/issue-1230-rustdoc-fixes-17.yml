name: Issue 1230 rustdoc fixes 17

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-rustdoc-fixes-17.yml"

permissions:
  contents: write

jobs:
  patch-rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix multivariate private rustdoc link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-multivariate/src/envelope.rs')
          text = path.read_text()
          old = '/// matching the reference) with the [`SCALE_FLOOR`] substitution for'
          new = '/// matching the reference) with the `SCALE_FLOOR` substitution for'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit rustdoc fix
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-multivariate/src/envelope.rs
          git diff --cached --check
          git commit -m "docs(multivariate): avoid private scale rustdoc link"
          git push origin "HEAD:${HEAD_REF}"

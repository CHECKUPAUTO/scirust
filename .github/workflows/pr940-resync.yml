name: PR 940 one-shot resynchronization

on:
  push:
    branches:
      - feat/agent-communication-protocol
    paths:
      - .github/workflows/pr940-resync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/agent-communication-protocol
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Synchronize and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin master
          git merge --no-edit origin/master

          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 test -p scirust-agent-protocol --all-targets --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent --all-targets --locked
          cargo +nightly-2026-07-02 clippy -p scirust-agent-protocol --all-targets --locked -- -D warnings
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings

          rm -f .github/workflows/pr940-resync.yml
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No synchronization changes were produced" >&2
            exit 1
          fi

          git commit -m "merge: synchronize agent protocol with tensor parity master"
          git push origin HEAD:feat/agent-communication-protocol

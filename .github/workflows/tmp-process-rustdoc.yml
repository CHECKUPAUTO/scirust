name: Temporary scirust-process rustdoc probe

on:
  push:
    branches: [codex/gate-workspace-rustdoc]
    paths:
      - .github/workflows/tmp-process-rustdoc.yml

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUSTDOCFLAGS: "-D warnings"

jobs:
  probe:
    name: Strict scirust-process rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - name: Render engineering prose as code and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bracket = re.compile(r'\[([^\[\]\n]+)\]')
          simple_units = {
              'm', 's', 'kg', 'g', 'mol', 'kmol', 'Pa', 'kPa', 'MPa', 'bar',
              'K', 'W', 'kW', 'MW', 'J', 'kJ', 'MJ', 'N', 'V', 'A', 'Hz',
              'L', 'rad', 'Wb', 'T', 'Ω', '°C', '°F', 'm²', 'm³', 's⁻¹',
          }
          prose_labels = {'sans dimension', 'dimensionless', 'étages', 'effets', 'cohérentes'}
          unit_tokens = ('m', 's', 'kg', 'g', 'mol', 'Pa', 'bar', 'K', 'W', 'J',
                         'N', 'V', 'A', 'Hz', 'L', 'rad', 'Wb', 'T', 'Ω')

          def unit_like(text: str) -> bool:
              t = text.strip()
              low = t.lower()
              if t in simple_units or low in prose_labels or low.startswith('sans dimension,'):
                  return True
              if re.fullmatch(r'[+−-]?\d+(?:[.,]\d+)?\s*(?:[,;:]\s*[+−-]?\d+(?:[.,]\d+)?)?', t):
                  return True
              if any(ch in t for ch in ('·', '⁻', '⁺', '²', '³', '⁴', '°', 'µ', 'μ', '/')):
                  return len(t) <= 64 and any(tok in t for tok in unit_tokens)
              return False

          def fix_multiline_dimensionless(text: str) -> str:
              # `[sans dimension,\n//! bounds]` -> ``sans dimension`,\n//! bounds`
              text = re.sub(
                  r'\[sans dimension,\s*\n(?P<prefix>\s*(?://!|///)\s*)(?P<body>[^\]\n]+)\]',
                  lambda m: '`sans dimension`,\n' + m.group('prefix') + m.group('body').strip(),
                  text,
              )
              # `[sans\n//! dimension, bounds]` -> ``sans dimension`,\n//! bounds`
              text = re.sub(
                  r'\[sans\s*\n(?P<prefix>\s*(?://!|///)\s*)dimension,\s*(?P<body>[^\]\n]+)\]',
                  lambda m: '`sans dimension`,\n' + m.group('prefix') + m.group('body').strip(),
                  text,
              )
              return text

          changed = []
          for path in sorted(Path('scirust-process/src').rglob('*.rs')):
              original = path.read_text()
              transformed = fix_multiline_dimensionless(original)
              out = []
              for line in transformed.splitlines(keepends=True):
                  stripped = line.lstrip()
                  if stripped.startswith('///') or stripped.startswith('//!'):
                      def repl(match):
                          return f'`{match.group(1).strip()}`' if unit_like(match.group(1)) else match.group(0)
                      line = bracket.sub(repl, line)
                  out.append(line)
              new = ''.join(out)
              if new != original:
                  path.write_text(new)
                  changed.append(str(path))
          print('updated rustdoc engineering prose:', *changed, sep='\n  ')
          PY

          set +e
          cargo +stable doc -p scirust-process --no-deps --locked > /tmp/process-rustdoc.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            {
              echo "Temporary strict rustdoc diagnostic for scirust-process."
              echo
              tail -n 300 /tmp/process-rustdoc.log
            } > .github/process-rustdoc-failure.txt
            git add scirust-process/src .github/process-rustdoc-failure.txt
            git commit -m "docs(process): render engineering prose as code" || true
            git push
            cat /tmp/process-rustdoc.log
            exit "$status"
          fi

          rm -f .github/process-rustdoc-failure.txt .github/workflows/tmp-process-rustdoc.yml
          git add scirust-process/src
          git add -A .github/process-rustdoc-failure.txt .github/workflows/tmp-process-rustdoc.yml
          git commit -m "docs(process): render engineering prose as code"
          git push

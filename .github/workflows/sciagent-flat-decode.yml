name: SciAgent FLAT decode contract

on:
  pull_request:
    paths:
      - "scirust-sciagent/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-flat-decode.yml"
  push:
    branches: [master]
    paths:
      - "scirust-sciagent/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-flat-decode.yml"

permissions:
  contents: read

jobs:
  flat-decode-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - name: Install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile opt-in FLAT decode feature
        run: cargo check -p scirust-sciagent --locked --features flat-attention
      - name: Clippy opt-in FLAT decode feature
        run: cargo clippy -p scirust-sciagent --all-targets --locked --features flat-attention -- -D warnings
      - name: Clippy resident grouped training bridge
        run: cargo clippy -p scirust-gpu --all-targets --locked --features flat-attention -- -D warnings
      - name: Clippy paired FLAT decode benchmark
        run: cargo clippy -p scirust-gpu --locked --features flat-attention --example flat_decode_bench -- -D warnings
      - name: Clippy M28 SciRust naive vs FLAT benchmark
        run: cargo clippy -p scirust-gpu --locked --features flat-attention --example flat_m28_naive_vs_fused -- -D warnings
      - name: M15 compile-time contract
        run: cargo test -p scirust-sciagent --locked --features flat-attention --test flat_feature_contract
      - name: M15 runtime parity on lavapipe
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p scirust-sciagent --locked --features flat-attention --test flat_runtime_decode -- --nocapture
      - name: P10.3 resident grouped training parity on lavapipe
        env:
          WGPU_BACKEND: vulkan
          SCIRUST_REQUIRE_FLAT_GROUPED_WGPU: "1"
        run: cargo test -p scirust-gpu --locked --features flat-attention flat_training -- --nocapture
      - name: Paired old-vs-FLAT decode benchmark smoke on lavapipe
        env:
          WGPU_BACKEND: vulkan
          SCIRUST_FLAT_DECODE_BENCH_Q_HEADS: "4"
          SCIRUST_FLAT_DECODE_BENCH_KV_HEADS: "2"
          SCIRUST_FLAT_DECODE_BENCH_HEAD_DIM: "32"
          SCIRUST_FLAT_DECODE_BENCH_KV_LENS: "1,17"
          SCIRUST_FLAT_DECODE_BENCH_WARMUPS: "1"
          SCIRUST_FLAT_DECODE_BENCH_REPEATS: "3"
        run: |
          cargo run --quiet --release --locked -p scirust-gpu \
            --features flat-attention --example flat_decode_bench \
            > /tmp/flat_decode_bench.csv
          cat /tmp/flat_decode_bench.csv
      - name: Validate paired benchmark CSV contract
        run: |
          python3 - <<'PY'
          import csv
          import math

          with open("/tmp/flat_decode_bench.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 2, rows
          assert {int(row["kv_len"]) for row in rows} == {1, 17}, rows
          for row in rows:
              assert int(row["q_heads"]) == 4, row
              assert int(row["kv_heads"]) == 2, row
              assert int(row["head_dim"]) == 32, row
              assert int(row["warmups"]) == 1, row
              assert int(row["repeats"]) == 3, row
              legacy = float(row["legacy_median_us"])
              flat = float(row["flat_median_us"])
              ratio = float(row["legacy_over_flat"])
              parity = float(row["parity_max_abs"])
              assert math.isfinite(legacy) and legacy > 0.0, row
              assert math.isfinite(flat) and flat > 0.0, row
              assert math.isfinite(ratio) and ratio > 0.0, row
              assert math.isfinite(parity) and parity >= 0.0, row
          print(f"validated {len(rows)} paired FLAT decode benchmark rows")
          PY
      - name: M28 paired resident attention benchmark smoke on lavapipe
        env:
          WGPU_BACKEND: vulkan
          SCIRUST_M28_SEQ_LEN: "16"
          SCIRUST_M28_HEAD_DIM: "32"
          SCIRUST_M28_WARMUPS: "1"
          SCIRUST_M28_REPEATS: "3"
        run: |
          cargo run --quiet --release --locked -p scirust-gpu \
            --features flat-attention --example flat_m28_naive_vs_fused \
            > /tmp/flat_m28_naive_vs_fused.csv
          cat /tmp/flat_m28_naive_vs_fused.csv
      - name: Validate M28 paired benchmark CSV contract
        run: |
          python3 - <<'PY'
          import csv
          import math

          with open("/tmp/flat_m28_naive_vs_fused.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 2, rows
          assert {row["causal"] for row in rows} == {"false", "true"}, rows
          for row in rows:
              assert int(row["seq_len"]) == 16, row
              assert int(row["head_dim"]) == 32, row
              assert int(row["warmups"]) == 1, row
              assert int(row["repeats"]) == 3, row
              for key in (
                  "naive_median_us",
                  "naive_p95_us",
                  "flat_fresh_median_us",
                  "flat_fresh_p95_us",
                  "flat_reused_median_us",
                  "flat_reused_p95_us",
                  "naive_over_flat_fresh",
                  "naive_over_flat_reused",
              ):
                  value = float(row[key])
                  assert math.isfinite(value) and value > 0.0, (key, row)
              for key in ("naive_parity_max_abs", "flat_parity_max_abs"):
                  value = float(row[key])
                  assert math.isfinite(value) and value >= 0.0, (key, row)
              assert row["performance_claim"] == "none", row
          print(f"validated {len(rows)} M28 paired benchmark rows")
          PY

  finalize-sandbox-escalation:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sciagent-sandbox-escalation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-sandbox-escalation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy
      - name: Apply final one-shot escalation integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-sandbox-escalation-1266.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          cargo +nightly-2026-07-02 fmt --all"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_sandbox_escalation_1266.py').write_text(script)
          PY
          python3 /tmp/apply_sandbox_escalation_1266.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-sciagent/src/agentic/sandbox.rs')
          text = path.read_text()
          obsolete = '''    fn from_env() -> Result<Self, String> {
        Self::from_env_with_override(None)
    }

'''
          if text.count(obsolete) != 1:
              raise SystemExit(
                  f'obsolete SandboxConfig::from_env wrapper: expected 1 match, found {text.count(obsolete)}'
              )
          path.write_text(text.replace(obsolete, '', 1))
          PY
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Prove final SciAgent escalation seam
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::sandbox_approval --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::tool_runtime --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::sandbox --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::tests --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Publish product-only branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/master -- .github/workflows/rustdoc.yml
          git checkout origin/master -- .github/workflows/sciagent-flat-decode.yml
          git rm .github/workflows/tmp-sandbox-escalation-1266.yml
          git rm .github/workflows/tmp-run-sandbox-escalation-1266.yml
          git rm .github/workflows/tmp-retry-sandbox-escalation-1266.yml
          git add scirust-sciagent/src/agentic .github/workflows/rustdoc.yml .github/workflows/sciagent-flat-decode.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sciagent): enforce one-shot sandbox escalation"
          git push origin HEAD:feat/sciagent-sandbox-escalation

name: tmp-m33-clippy-doc

on:
  push:
    branches:
      - feat/m33-sciagent-flat-decode-qualification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/m33-sciagent-flat-decode-qualification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Fix M33 rustdoc and remove helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-sciagent/src/gpu.rs')
          text = path.read_text()
          old = '''    /// **EOS-aware KV-cached greedy generation** — the same resident M32 prefill
    /// + M15 incremental decode route as [`Self::generate_cached`], terminating
    /// immediately after a generated token matches `eos_tokens`. An empty EOS
    /// set is behaviorally identical to ordinary cached greedy generation.
'''
          new = '''    /// **EOS-aware KV-cached greedy generation** — the same resident M32 prefill
    /// plus M15 incremental decode route as [`Self::generate_cached`], terminating
    /// immediately after a generated token matches `eos_tokens`. An empty EOS
    /// set is behaviorally identical to ordinary cached greedy generation.
'''
          if old not in text:
              raise SystemExit('M33 EOS rustdoc block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup run nightly-2026-07-02 cargo fmt --all
          git rm .github/workflows/tmp-m33-clippy-doc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-sciagent/src/gpu.rs
          git commit -m 'style(sciagent): fix M33 EOS rustdoc'
          git push origin HEAD:feat/m33-sciagent-flat-decode-qualification

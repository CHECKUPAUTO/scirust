name: Issue 1230 final rustdoc fix

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-final-rustdoc-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix final relativity rustdoc links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              Path('scirust-relativity/src/action.rs'): [
                  ('/// The grid resolution is even or below [`MIN_GRID`] (Simpson needs an odd',
                   '/// The grid resolution is even or below `MIN_GRID` (Simpson needs an odd'),
              ],
              Path('scirust-relativity/src/curvature.rs'): [
                  ('/// All tensors use the conventions in the [module documentation](self).',
                   '/// All tensors use the conventions described in this module documentation.'),
              ],
          }

          for path, replacements in fixes.items():
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-relativity/src/action.rs scirust-relativity/src/curvature.rs
          git diff --cached --check
          git commit -m "docs(relativity): fix final rustdoc links"
          git push origin "HEAD:${HEAD_REF}"

name: SciAgent B44 KV diagnostics

on:
  push:
    branches:
      - perf/sciagent-b39-thor-production-bench
    paths:
      - scripts/sciagent_b44_patch.py
      - .github/workflows/sciagent-b44-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/sciagent-b39-thor-production-bench
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply B44
        run: python3 scripts/sciagent_b44_patch.py
      - name: Format and validate portable CUDA surface
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --example cuda_production_bench
          cargo +nightly-2026-07-02 test -p scirust-sciagent --features cuda --test cuda_parity --no-run
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
      - name: Commit code only
        run: |
          rm -f scripts/sciagent_b44_patch.py
          git restore -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): diagnose production KV cache parity"
          git push origin HEAD:perf/sciagent-b39-thor-production-bench

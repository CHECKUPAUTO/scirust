name: SciAgent FLAT M33 Thor

on:
  pull_request:
    branches: [master]
    paths:
      - "scirust-sciagent/**"
      - "scirust-gpu/**"
      - "docs/FLAT_M33_SCIAGENT_DECODE_KV.md"
      - ".github/workflows/sciagent-flat-m33-thor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-flat-m33-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m33-thor:
    name: FLAT M33 resident decode + KV benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SCIRUST_THOR_IDLE_SETTLE_SECONDS: "300"
      SCIAGENT_FLAT_M33_PROMPT: "64"
      SCIAGENT_FLAT_M33_NEW: "16"
      SCIAGENT_FLAT_M33_WARMUPS: "2"
      SCIAGENT_FLAT_M33_REPEATS: "5"
      SCIAGENT_FLAT_M33_D_MODEL: "512"
      SCIAGENT_FLAT_M33_LAYERS: "8"
      SCIAGENT_FLAT_M33_Q_HEADS: "8"
      SCIAGENT_FLAT_M33_KV_HEADS: "2"
      SCIAGENT_FLAT_M33_D_FF: "1408"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "source_revision=$actual"
          test "$actual" = "$SCIRUST_SOURCE_REVISION"
      - name: Prepare executable temporary directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Format
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: Build M33 qualification binaries without touching the GPU
        shell: bash
        run: |
          set -euo pipefail
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent \
            --features flat-attention --test flat_m33_lifecycle --locked --no-run
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent \
            --features flat-attention --test flat_runtime_decode --locked --no-run
          rustup run nightly-2026-07-02 cargo build -p scirust-sciagent \
            --features flat-attention --release --locked --example flat_m33_thor_bench
      - name: Exclusive M33 correctness + real Thor model-level benchmark
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          command -v pgrep >/dev/null
          command -v nvidia-smi >/dev/null
          command -v vulkaninfo >/dev/null

          training_processes() {
            pgrep -af 'cuda_pretrain' || true
          }

          compute_processes() {
            nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null
          }

          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9

          gpu_inventory="$(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader)" || {
            echo "::error::cannot query NVIDIA GPU inventory"
            exit 1
          }
          printf '%s\n' "$gpu_inventory"
          grep -F "NVIDIA Thor" <<< "$gpu_inventory" >/dev/null || {
            echo "::error::expected physical NVIDIA Thor was not found"
            exit 1
          }

          vulkan_summary="$(vulkaninfo --summary 2>&1)" || {
            printf '%s\n' "$vulkan_summary"
            echo "::error::cannot query Vulkan adapter inventory"
            exit 1
          }
          printf '%s\n' "$vulkan_summary"
          grep -F "NVIDIA Tegra NVIDIA Thor" <<< "$vulkan_summary" >/dev/null || {
            echo "::error::physical Thor is not exposed through Vulkan"
            exit 1
          }

          deadline=$((SECONDS + 18000))
          settle_step=5
          settle_required="$SCIRUST_THOR_IDLE_SETTLE_SECONDS"
          settled=0
          while (( settled < settle_required )); do
            training="$(training_processes)"
            if ! active="$(compute_processes)"; then
              echo "::error::M33 cannot verify Thor compute occupancy"
              exit 1
            fi

            if [[ -n "${training//[[:space:]]/}" ]]; then
              echo "SciAgent cuda_pretrain is active; M33 qualification remains blocked."
              printf '%s\n' "$training"
              settled=0
            elif [[ -n "${active//[[:space:]]/}" ]]; then
              echo "::error::Unknown GPU compute activity is active while M33 owns the Thor reservation:"
              printf '%s\n' "$active"
              exit 1
            else
              settled=$((settled + settle_step))
              if (( settled == settle_step || settled % 60 == 0 )); then
                echo "Thor continuously idle: ${settled}/${settle_required}s"
              fi
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::Thor never reached the required ${settle_required}s continuous idle window before the five-hour deadline"
              exit 1
            fi
            sleep "$settle_step"
          done

          echo "Thor idle/cooldown qualification satisfied for ${settle_required}s."
          nvidia-smi --query-gpu=temperature.gpu,utilization.gpu,clocks.gr,clocks.sm,power.draw --format=csv,noheader || true

          contamination="$RUNNER_TEMP/flat-m33-thor-contamination.txt"
          : > "$contamination"
          (
            while true; do
              training="$(training_processes)"
              if [[ -n "${training//[[:space:]]/}" ]]; then
                {
                  date -u +'%Y-%m-%dT%H:%M:%SZ'
                  printf '%s\n' "$training"
                } >> "$contamination"
                exit 0
              fi
              sleep 1
            done
          ) &
          watchdog_pid=$!
          cleanup_watchdog() {
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
          }
          trap cleanup_watchdog EXIT

          echo "source_revision=$(git rev-parse HEAD)"
          echo "thor_idle_settle_seconds=$SCIRUST_THOR_IDLE_SETTLE_SECONDS"
          echo "sciagent_contamination_watch=continuous_1s"

          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent \
            --features flat-attention --test flat_m33_lifecycle --locked -- --nocapture
          if [[ -s "$contamination" ]]; then
            echo "::error::SciAgent training appeared during M33 lifecycle parity; qualification invalid"
            cat "$contamination"
            exit 1
          fi

          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent \
            --features flat-attention --test flat_runtime_decode --locked -- --nocapture
          if [[ -s "$contamination" ]]; then
            echo "::error::SciAgent training appeared during M32/M15 parity; qualification invalid"
            cat "$contamination"
            exit 1
          fi

          rustup run nightly-2026-07-02 cargo run -p scirust-sciagent \
            --features flat-attention --release --locked --example flat_m33_thor_bench \
            | tee "$RUNNER_TEMP/flat-m33-thor.csv"

          if [[ -s "$contamination" ]]; then
            echo "::error::SciAgent training appeared during the measured M33 window; all timing evidence from this run is invalid"
            cat "$contamination"
            exit 1
          fi
          if [[ -n "$(training_processes)" ]]; then
            echo "::error::SciAgent training is active immediately after M33 timing"
            training_processes
            exit 1
          fi

          test "$(wc -l < "$RUNNER_TEMP/flat-m33-thor.csv")" -ge 2
          grep -F ',none' "$RUNNER_TEMP/flat-m33-thor.csv"

          cleanup_watchdog
          trap - EXIT

          if ! post_active="$(compute_processes)"; then
            echo "::error::M33 cannot verify post-benchmark Thor compute occupancy"
            exit 1
          fi
          if [[ -n "${post_active//[[:space:]]/}" ]]; then
            echo "::error::GPU compute activity is present immediately after M33 qualification; evidence is not accepted"
            printf '%s\n' "$post_active"
            exit 1
          fi

          nvidia-smi --query-gpu=temperature.gpu,utilization.gpu,clocks.gr,clocks.sm,power.draw --format=csv,noheader || true
          echo "performance_claim=none"

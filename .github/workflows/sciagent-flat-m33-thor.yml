name: SciAgent FLAT M33 Thor

on:
  pull_request:
    branches: [master]
    paths:
      - "scirust-sciagent/**"
      - "scirust-gpu/**"
      - "docs/FLAT_M33_SCIAGENT_DECODE_KV.md"
      - ".github/workflows/sciagent-flat-m33-thor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-flat-m33-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deferred:
    name: FLAT M33 Thor gate deferred
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve production training and release Thor runner
        run: |
          echo "M33 real-device benchmark is deliberately deferred while the managed SciAgent production training owns the Thor and FLAT M34 portability needs the self-hosted runner."
          echo "This job must be restored to the physical Thor benchmark gate before M33 merges."
          exit 1

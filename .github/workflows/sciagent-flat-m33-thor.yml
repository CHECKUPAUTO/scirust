name: SciAgent FLAT M33 Thor

on:
  pull_request:
    branches: [master]
    paths:
      - "scirust-sciagent/**"
      - "scirust-gpu/**"
      - "docs/FLAT_M33_SCIAGENT_DECODE_KV.md"
      - ".github/workflows/sciagent-flat-m33-thor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-flat-m33-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m33-thor:
    name: FLAT M33 resident decode + KV benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SCIAGENT_FLAT_M33_PROMPT: "64"
      SCIAGENT_FLAT_M33_NEW: "16"
      SCIAGENT_FLAT_M33_WARMUPS: "2"
      SCIAGENT_FLAT_M33_REPEATS: "5"
      SCIAGENT_FLAT_M33_D_MODEL: "512"
      SCIAGENT_FLAT_M33_LAYERS: "8"
      SCIAGENT_FLAT_M33_Q_HEADS: "8"
      SCIAGENT_FLAT_M33_KV_HEADS: "2"
      SCIAGENT_FLAT_M33_D_FF: "1408"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare executable temporary directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Format
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: M33 lifecycle parity
        run: >-
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent
          --features flat-attention --test flat_m33_lifecycle --locked -- --nocapture
      - name: M32 prefill + M15 decode parity
        run: >-
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent
          --features flat-attention --test flat_runtime_decode --locked -- --nocapture
      - name: M33 real Thor model-level benchmark
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::nvidia-smi is required to qualify the physical Thor state"
            exit 1
          fi

          # Reserve the next idle-device boundary before inspecting occupancy. Holding
          # this shared SciRust lock prevents another cooperative GPU workflow from
          # taking the Thor between the idle observation and the M33 benchmark.
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || true

          deadline=$((SECONDS + 18000))
          while true; do
            if ! active="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
              echo "::error::M33 cannot verify Thor compute occupancy"
              exit 1
            fi
            if [[ -z "${active//[[:space:]]/}" ]]; then
              echo "Thor is idle and reserved; proceeding with M33 qualification."
              break
            fi

            # A detached production cuda_pretrain is a known, valuable workload. It
            # may finish naturally; never kill/reset it. Any other activity is not a
            # controlled qualification environment and therefore fails closed.
            managed_training=true
            while IFS=',' read -r raw_pid process_name; do
              pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
              process_name="$(printf '%s' "$process_name" | xargs)"
              [[ "$pid" =~ ^[0-9]+$ ]] || { managed_training=false; continue; }
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              proc_user="$(ps -p "$pid" -o user= 2>/dev/null | xargs || true)"
              ppid="$(ps -p "$pid" -o ppid= 2>/dev/null | tr -d '[:space:]')"
              cgroup="$(cat "/proc/$pid/cgroup" 2>/dev/null || true)"
              echo "pid=$pid user=$proc_user ppid=$ppid process=$process_name"
              if [[ "$process_name" != "/root/scirust/target/release/examples/cuda_pretrain" ]] \
                || [[ "$cmdline" != *"/root/scirust/target/release/examples/cuda_pretrain"* ]] \
                || [[ "$proc_user" != "root" ]] \
                || [[ "$ppid" != "1" ]] \
                || [[ "$cgroup" != 0::/user.slice/user-0.slice/session-*.scope ]]; then
                managed_training=false
              fi
            done <<< "$active"

            if [[ "$managed_training" != true ]]; then
              echo "::error::Unknown GPU compute activity is active while M33 owns the SciRust reservation:"
              printf '%s\n' "$active"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Managed production training still owns the Thor after the five-hour M33 reservation window; benchmark was not run concurrently or fabricated:"
              printf '%s\n' "$active"
              exit 1
            fi

            echo "Managed production training owns the Thor; M33 keeps the next-device reservation and waits without interruption."
            sleep 60
          done

          # The same lock descriptor remains held here, making the idle check and the
          # benchmark one atomic qualification boundary with respect to SciRust jobs.
          rustup run nightly-2026-07-02 cargo run -p scirust-sciagent \
            --features flat-attention --release --locked --example flat_m33_thor_bench \
            | tee "$RUNNER_TEMP/flat-m33-thor.csv"
          test "$(wc -l < "$RUNNER_TEMP/flat-m33-thor.csv")" -ge 2
          grep -F ',none' "$RUNNER_TEMP/flat-m33-thor.csv"

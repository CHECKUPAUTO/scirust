name: Elastic Latent KV Phase 22

on:
  pull_request:
    paths:
      - "scirust-gpu/src/deterministic_sampling_device.rs"
      - "scirust-gpu/tests/deterministic_sampling_resident.rs"
      - "scirust-gpu/tests/elastic_latent_minillm_device_feedback.rs"
      - "experiments/elastic-latent-kv/PHASE22_SPEC.md"
      - ".github/workflows/elastic-latent-kv-phase22.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +nightly-2026-07-02 fmt --all -- --check
      - run: cargo +nightly-2026-07-02 clippy -p scirust-gpu --all-targets --features wgpu --locked -- -D warnings
      - run: cargo +1.89.0 check -p scirust-gpu --all-targets --features wgpu --locked

  wgpu-lavapipe:
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan
      SCIRUST_REQUIRE_WGPU: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: cargo +1.89.0 test -p scirust-gpu --features wgpu --test deterministic_sampling_resident --locked -- --test-threads=1
      - run: cargo +1.89.0 test -p scirust-gpu --features wgpu --test elastic_latent_minillm_device_feedback --locked -- --test-threads=1

name: GraphSession compiler pipeline one-shot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'research/tensor-graph-session-pipeline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/tensor-graph-session-pipeline
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy

      - name: Apply GraphSession compiler-pipeline migration
        shell: python3 {0}
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}"
                  )
              p.write_text(text.replace(old, new, expected))

          # --------------------------------------------------------------
          # GraphSession: default prepare uses an empty CompilerPipeline;
          # callers may supply a pass-configured pipeline explicitly.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/src/graph_session.rs",
              """use scirust_tensor_compile::{
              CanonicalCompiler, ExternalBindings, ExternalValueKind, KernelLowerer, LogicalBindingId,
          };
          """,
              """use scirust_tensor_compile::{
              CanonicalCompiler, CompilerPipeline, ExternalValueKind, LogicalBindingId,
          };
          """,
          )

          old_prepare = """    pub fn prepare(
              runtime: ReferencePlanRuntime<B>,
              graph: &Graph,
              constants: &GraphConstants<'_>,
          ) -> Result<Self, GraphSessionPreparationError> {
              // 1. Canonical compilation. Validates the graph and eliminates every
              //    node unreachable from the declared outputs.
              let execution_plan = CanonicalCompiler::new()
                  .compile(graph)
                  .map_err(|source| GraphSessionPreparationError::GraphCompilation { source })?;

              // 2. External binding table, in the canonical order of the retained
              //    instructions. The caller never chooses this order.
              let bindings = ExternalBindings::derive(&execution_plan);

              // 3. Lowering.
              let lowered = KernelLowerer::new()
                  .lower(&execution_plan, &bindings)
                  .map_err(|source| GraphSessionPreparationError::KernelLowering { source })?;

              // 4-6. Walk the plan's own binding table — the post-elimination source
              //      of truth — and correlate every entry with the graph.
              let resolved = resolve_bindings(graph, &lowered)?;

              // 7-8. Validate the whole constant store, then clone only what survives.
              let (payloads, constant_bindings) = resolve_constants(graph, &resolved, constants)?;

              // 9. Physical preparation. The graph-supplied types complete the
              //    metadata a lowered plan cannot carry.
              let prepared = runtime
                  .prepare_with_external_types(&lowered, &resolved.external_types)
                  .map_err(|source| GraphSessionPreparationError::PlanPreparation { source })?;

              // 10. The prepared plan must describe exactly the bindings we resolved.
              check_prepared_externals(&prepared, &resolved)?;

              // 11. The prepared outputs must be the graph's outputs, in order.
              let outputs = resolve_outputs(graph, &prepared)?;

              // 12. Immutable session.
              Ok(Self {
                  runtime,
                  prepared,
                  inputs: resolved.inputs,
                  input_bindings: resolved.input_bindings,
                  input_lengths: resolved.input_lengths,
                  constants: resolved.constants,
                  constant_bindings,
                  payloads,
                  outputs,
              })
          }
          """

          new_prepare = """    pub fn prepare(
              runtime: ReferencePlanRuntime<B>,
              graph: &Graph,
              constants: &GraphConstants<'_>,
          ) -> Result<Self, GraphSessionPreparationError> {
              let mut pipeline = CompilerPipeline::new();
              Self::prepare_with_pipeline(runtime, graph, constants, &mut pipeline)
          }

              /// Compiles, optimizes, lowers and prepares `graph` through `pipeline`.
              ///
              /// The caller controls the compiler-pass sequence while the session keeps
              /// ownership of runtime preparation. The pipeline is run exactly once;
              /// execution never reruns compiler passes.
              pub fn prepare_with_pipeline(
                  runtime: ReferencePlanRuntime<B>,
                  graph: &Graph,
                  constants: &GraphConstants<'_>,
                  pipeline: &mut CompilerPipeline,
              ) -> Result<Self, GraphSessionPreparationError> {
                  // 1. Canonical compilation. Validates the graph and eliminates every
                  //    node unreachable from the declared outputs.
                  let execution_plan = CanonicalCompiler::new()
                      .compile(graph)
                      .map_err(|source| GraphSessionPreparationError::GraphCompilation { source })?;

                  // 2. Compiler SSA, caller-selected passes, post-pass memory planning
                  //    and logical lowering. The transformed IR, memory and lowered plan
                  //    are kept coherent by CompilerPipeline.
                  let compiled = pipeline
                      .compile_execution_plan(&execution_plan)
                      .map_err(|source| GraphSessionPreparationError::CompilerPipeline { source })?;
                  let lowered = compiled.lowered_plan();

                  // 3-5. Walk the post-pass plan's own binding table — the source of
                  //      truth — and correlate every entry with the canonical graph.
                  let resolved = resolve_bindings(graph, lowered)?;

                  // 6-7. Validate the whole constant store, then clone only what survives.
                  let (payloads, constant_bindings) = resolve_constants(graph, &resolved, constants)?;

                  // 8. Physical preparation. The graph-supplied types complete the
                  //    metadata a lowered plan cannot carry.
                  let prepared = runtime
                      .prepare_with_external_types(lowered, &resolved.external_types)
                      .map_err(|source| GraphSessionPreparationError::PlanPreparation { source })?;

                  // 9. The prepared plan must describe exactly the bindings we resolved.
                  check_prepared_externals(&prepared, &resolved)?;

                  // 10. The prepared outputs must be the graph's outputs, in order.
                  let outputs = resolve_outputs(graph, &prepared)?;

                  // 11. Immutable session. `compiled` can now be dropped: everything
                  //     execution needs is owned by `prepared` and the metadata below.
                  Ok(Self {
                      runtime,
                      prepared,
                      inputs: resolved.inputs,
                      input_bindings: resolved.input_bindings,
                      input_lengths: resolved.input_lengths,
                      constants: resolved.constants,
                      constant_bindings,
                      payloads,
                      outputs,
                  })
              }
          """
          replace_exact("scirust-tensor-runtime/src/graph_session.rs", old_prepare, new_prepare)

          # --------------------------------------------------------------
          # Typed GraphSession preparation error for compiler pipeline.
          # Retain legacy KernelLowering for public compatibility.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              """    BufferSlot, CompileError, ExternalValueKind, LogicalBindingId, LogicalKernelId, LoweringError,
          """,
              """    BufferSlot, CompileError, CompilerPipelineError, ExternalValueKind, LogicalBindingId,
              LogicalKernelId, LoweringError,
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              """/// The three encapsulating variants keep the underlying compiler, lowerer and
          /// plan-runtime errors intact and reachable through [`core::error::Error::source`]
          """,
              """/// The encapsulating variants keep the underlying compiler, compiler-pipeline,
          /// legacy lowerer and plan-runtime errors intact and reachable through
          /// [`core::error::Error::source`]
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              """    /// `KernelLowerer` rejected the execution plan.
              KernelLowering { source: LoweringError },
              /// The Reference plan runtime rejected the lowered plan.
          """,
              """    /// Legacy direct `KernelLowerer` failure, retained for API compatibility.
              KernelLowering { source: LoweringError },
              /// `CompilerPipeline` rejected the canonical execution plan.
              CompilerPipeline { source: CompilerPipelineError },
              /// The Reference plan runtime rejected the lowered plan.
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              """            Self::KernelLowering { source } =>
              {
                  write!(formatter, \"kernel lowering failed: {source}\")
              },
              Self::PlanPreparation { source } =>
          """,
              """            Self::KernelLowering { source } =>
              {
                  write!(formatter, \"kernel lowering failed: {source}\")
              },
              Self::CompilerPipeline { source } =>
              {
                  write!(formatter, \"compiler pipeline failed: {source}\")
              },
              Self::PlanPreparation { source } =>
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              """            Self::GraphCompilation { source } => Some(source),
              Self::KernelLowering { source } => Some(source),
              Self::PlanPreparation { source } => Some(source),
          """,
              """            Self::GraphCompilation { source } => Some(source),
              Self::KernelLowering { source } => Some(source),
              Self::CompilerPipeline { source } => Some(source),
              Self::PlanPreparation { source } => Some(source),
          """,
          )

          # --------------------------------------------------------------
          # End-to-end tests: custom pass reaches real Reference CPU session;
          # rejection tests preserve the underlying LoweringError nested in the
          # compiler-pipeline error.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              """use scirust_tensor_compile::{CompileError, LoweringError};
          """,
              """use scirust_tensor_compile::{
              CompileError, CompilerIrLoweringError, CompilerPipeline, CompilerPipelineError, LoweringError,
              ScaleZeroCanonicalizationPass,
          };
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              "// The eight supported opcodes",
              "// The nine supported opcodes",
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              """#[test]
          fn executes_scale() {
          """,
              """#[test]
          fn custom_compiler_pipeline_reaches_graph_session_execution() {
              let (graph, input) = unary_graph(
                  Operation::Scale {
                      factor: Scalar::f32(0.0),
                  },
                  vec![5],
              );
              let mut pipeline = CompilerPipeline::new();
              pipeline.push_pass(ScaleZeroCanonicalizationPass);

              let session = ReferenceGraphSession::prepare_with_pipeline(
                  runtime(),
                  &graph,
                  &GraphConstants::new(),
                  &mut pipeline,
              )
              .expect(\"preparable graph through compiler pipeline\");

              let values = [f32::NAN, f32::INFINITY, f32::NEG_INFINITY, -0.0, 7.5];
              let mut inputs = GraphInputs::new();
              inputs.bind(input, &values);

              let outputs = session.execute(&inputs).expect(\"successful run\");
              assert_eq!(bits(&outputs.into_values()[0].values), vec![0u32; values.len()]);
          }

          #[test]
          fn executes_scale() {
          """,
          )

          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              """        Some(GraphSessionPreparationError::KernelLowering {
              source: LoweringError::UnsupportedOperation {
                  node: product,
                  operation: Operation::MatMul,
              },
          })
          """,
              """        Some(GraphSessionPreparationError::CompilerPipeline {
              source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(
                  LoweringError::UnsupportedOperation {
                      node: product,
                      operation: Operation::MatMul,
                  },
              )),
          })
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              """        Some(GraphSessionPreparationError::KernelLowering {
              source: LoweringError::InvalidReshape { node: reshaped },
          })
          """,
              """        Some(GraphSessionPreparationError::CompilerPipeline {
              source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(
                  LoweringError::InvalidReshape { node: reshaped },
              )),
          })
          """,
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              """            Some(GraphSessionPreparationError::KernelLowering {
                  source: LoweringError::OperandTypeMismatch { .. },
              })
          """,
              """            Some(GraphSessionPreparationError::CompilerPipeline {
                  source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(
                      LoweringError::OperandTypeMismatch { .. },
                  )),
              })
          """,
          )

      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Test Reference graph session
        run: cargo test -p scirust-tensor-runtime --test reference_graph_session

      - name: Clippy tensor runtime
        run: cargo +nightly-2026-07-02 clippy -p scirust-tensor-runtime --all-targets -- -D warnings

      - name: Commit validated source patch and remove staging workflow
        run: |
          rm .github/workflows/graph-session-pipeline-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tensor-runtime): route graph sessions through compiler pipeline"
          git push origin HEAD:research/tensor-graph-session-pipeline

name: tmp-persistent-approval-1268

on:
  push:
    branches: [feat/sciagent-persistent-approvals]
    paths:
      - ".github/workflows/tmp-persistent-approval-1268.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-persistent-approvals
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy
      - name: Apply persistent approval seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          permission = Path('scirust-sciagent/src/agentic/permission.rs')
          text = permission.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''    pub fn decide_subject(&self, tool: &str, read_only: bool, subject: &str) -> PermissionDecision {
          ''',
          '''    fn explicitly_asks(&self, call: &ToolCall) -> bool {
              let subjects = call_subjects(call);
              if subjects.is_empty()
              {
                  return matches_any(&self.ask, &call.tool, "");
              }
              subjects
                  .iter()
                  .any(|subject| matches_any(&self.ask, &call.tool, subject))
          }

              pub fn decide_subject(&self, tool: &str, read_only: bool, subject: &str) -> PermissionDecision {
          ''',
          'insert explicit ask detector')

          replace_once(
          '''    /// Permit this tool family for the lifetime of this gate/session.
              Session,
              /// Refuse this call; do not remember the refusal.
              Decline,
          ''',
          '''    /// Permit this tool family for the lifetime of this gate/session.
              Session,
              /// Persist a tool-wide allow rule through the explicitly installed store.
              Always,
              /// Refuse this call; do not remember the refusal.
              Decline,
          ''',
          'add Always choice')

          replace_once(
          '''pub trait ScopedToolApprover: Send + Sync {
              fn approve(
                  &self,
                  call: &ToolCall,
                  tool: &Tool,
                  subject: &str,
              ) -> Result<ApprovalChoice, String>;
          }

          /// One-shot resolver with a closed, fail-closed outcome vocabulary.
          ''',
          '''pub trait ScopedToolApprover: Send + Sync {
              fn approve(
                  &self,
                  call: &ToolCall,
                  tool: &Tool,
                  subject: &str,
              ) -> Result<ApprovalChoice, String>;
          }

          /// Opt-in persistence seam for an explicit `Always` approval.
          ///
          /// SciAgent never chooses a storage location itself. Front-ends may install
          /// a store that persists the supplied config-style bare allow rule. Store
          /// failure is treated as authorization failure and no session grant is added.
          pub trait PermissionRuleStore: Send + Sync {
              fn remember_allow(&self, rule: &str) -> Result<(), String>;
          }

          /// One-shot resolver with a closed, fail-closed outcome vocabulary.
          ''',
          'insert rule store trait')

          replace_once(
          '''/// persisted. Static `Deny` rules are evaluated first and therefore always
          /// override a remembered session approval.
          ''',
          '''/// persisted unless the operator explicitly chooses `Always` and a
          /// [`PermissionRuleStore`] is installed. Static `Deny` and `Ask` rules keep
          /// their precedence over remembered grants.
          ''',
          'update gate docs')

          replace_once(
          '''    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,
              session_approved_tools: Arc<RwLock<HashSet<String>>>,
          ''',
          '''    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,
              rule_store: Option<Arc<dyn PermissionRuleStore>>,
              session_approved_tools: Arc<RwLock<HashSet<String>>>,
          ''',
          'add gate store field')

          text = text.replace(
          '''            scoped_approver: None,
                      session_approved_tools: Arc::new(RwLock::new(HashSet::new())),
          ''',
          '''            scoped_approver: None,
                      rule_store: None,
                      session_approved_tools: Arc::new(RwLock::new(HashSet::new())),
          ''')
          text = text.replace(
          '''            scoped_approver: Some(approver),
                      session_approved_tools: Arc::new(RwLock::new(HashSet::new())),
          ''',
          '''            scoped_approver: Some(approver),
                      rule_store: None,
                      session_approved_tools: Arc::new(RwLock::new(HashSet::new())),
          ''')
          if text.count('rule_store: None,') != 3:
              raise SystemExit(f'constructors: expected 3 rule_store initializers, found {text.count("rule_store: None,")}')

          replace_once(
          '''    pub fn policy(&self) -> &PermissionPolicy {
                  &self.policy
              }

              /// Remember one tool family for this in-memory session.
          ''',
          '''    pub fn policy(&self) -> &PermissionPolicy {
                  &self.policy
              }

              /// Install the opt-in persistence sink used only for `ApprovalChoice::Always`.
              pub fn with_rule_store(mut self, store: Arc<dyn PermissionRuleStore>) -> Self {
                  self.rule_store = Some(store);
                  self
              }

              /// Remember one tool family for this in-memory session.
          ''',
          'add store builder')

          replace_once(
          '''                if self.is_tool_approved_for_session(&call.tool)?
                      {
                          return Ok(());
                      }
          ''',
          '''                if !self.policy.explicitly_asks(call)
                          && self.is_tool_approved_for_session(&call.tool)?
                      {
                          return Ok(());
                      }
          ''',
          'preserve explicit ask precedence')

          replace_once(
          '''                        ApprovalChoice::Session =>
                          {
                              self.approve_tool_for_session(&call.tool)?;
                              Ok(())
                          },
                          ApprovalChoice::Decline => Err(
          ''',
          '''                        ApprovalChoice::Session =>
                          {
                              self.approve_tool_for_session(&call.tool)?;
                              Ok(())
                          },
                          ApprovalChoice::Always =>
                          {
                              let rule = session_tool_key(&call.tool)?;
                              let Some(store) = self.rule_store.as_ref()
                              else
                              {
                                  return Err(
                                      "persistent approval requested but no permission rule store is configured; refusing to execute"
                                          .to_string(),
                                  );
                              };
                              store
                                  .remember_allow(&rule)
                                  .map_err(|error| format!("failed to persist approval rule: {error}"))?;
                              self.approve_tool_for_session(&rule)?;
                              Ok(())
                          },
                          ApprovalChoice::Decline => Err(
          ''',
          'handle Always choice')

          replace_once(
          '''    struct SequenceScopedApprover {
          ''',
          '''    struct MemoryRuleStore {
              rules: Mutex<Vec<String>>,
              fail: bool,
          }

              impl MemoryRuleStore {
                  fn new(fail: bool) -> Self {
                      Self {
                          rules: Mutex::new(Vec::new()),
                          fail,
                      }
                  }

                  fn rules(&self) -> Vec<String> {
                      self.rules.lock().unwrap().clone()
                  }
              }

              impl PermissionRuleStore for MemoryRuleStore {
                  fn remember_allow(&self, rule: &str) -> Result<(), String> {
                      if self.fail
                      {
                          return Err("rule store unavailable".to_string());
                      }
                      self.rules
                          .lock()
                          .map_err(|_| "rule store poisoned".to_string())?
                          .push(rule.to_string());
                      Ok(())
                  }
              }

              struct SequenceScopedApprover {
          ''',
          'insert memory rule store test helper')

          replace_once(
          '''    #[test]
              fn static_deny_overrides_remembered_session_approval() {
          ''',
          '''    #[test]
              fn persistent_choice_requires_an_explicit_store() {
                  let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
                  let gate =
                      PermissionGate::with_scoped_approver(PermissionPolicy::default(), approver);
                  let error = gate
                      .before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
                      .expect_err("Always without a store must fail closed");
                  assert!(error.contains("no permission rule store"), "{error}");
                  assert!(gate.session_approved_tools().unwrap().is_empty());
              }

              #[test]
              fn persistent_choice_stores_bare_rule_and_grants_current_session() {
                  let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
                  let store = Arc::new(MemoryRuleStore::new(false));
                  let gate = PermissionGate::with_scoped_approver(
                      PermissionPolicy::default(),
                      approver.clone(),
                  )
                  .with_rule_store(store.clone());

                  gate.before_execute(&call("Build", &[("crate", "scirust-core")]), &tool("build"))
                      .expect("persistent approval should authorize the call");
                  gate.before_execute(
                      &call("build", &[("crate", "scirust-stats")]),
                      &tool("build"),
                  )
                  .expect("persisted choice should also grant the current session");

                  assert_eq!(store.rules(), vec!["build"]);
                  assert_eq!(gate.session_approved_tools().unwrap(), vec!["build"]);
                  assert_eq!(approver.calls.load(Ordering::SeqCst), 1);
              }

              #[test]
              fn persistent_store_failure_fails_closed_without_session_grant() {
                  let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
                  let store = Arc::new(MemoryRuleStore::new(true));
                  let gate = PermissionGate::with_scoped_approver(
                      PermissionPolicy::default(),
                      approver,
                  )
                  .with_rule_store(store);

                  let error = gate
                      .before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
                      .expect_err("store failure must fail closed");
                  assert!(error.contains("failed to persist approval rule"), "{error}");
                  assert!(gate.session_approved_tools().unwrap().is_empty());
              }

              #[test]
              fn static_ask_overrides_remembered_session_approval() {
                  let policy = PermissionPolicy::new(
                      PermissionDecision::Ask,
                      Vec::new(),
                      vec![rule("build(secret-*)")],
                      Vec::new(),
                  );
                  let gate = PermissionGate::new(policy);
                  gate.approve_tool_for_session("build").unwrap();

                  gate.before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
                      .expect("fallback ask may be satisfied by a remembered tool grant");
                  let error = gate
                      .before_execute(&call("build", &[("crate", "secret-model")]), &tool("build"))
                      .expect_err("explicit ask must still require an approval service");
                  assert!(error.contains("no approval service is available"), "{error}");
              }

              #[test]
              fn static_deny_overrides_remembered_session_approval() {
          ''',
          'add persistent and ask precedence tests')

          permission.write_text(text)

          audit = Path('scirust-sciagent/src/agentic/approval_audit.rs')
          audit_text = audit.read_text()

          def audit_replace(old, new, label):
              global audit_text
              count = audit_text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              audit_text = audit_text.replace(old, new, 1)

          audit_replace(
          '''    AllowedOnce,
              AllowedSession,
              Rejected,
          ''',
          '''    AllowedOnce,
              AllowedSession,
              AllowedPersistent,
              Rejected,
          ''',
          'add persistent audit resolution')

          audit_replace(
          '''            ApprovalChoice::Once => ApprovalResolution::AllowedOnce,
                  ApprovalChoice::Session => ApprovalResolution::AllowedSession,
                  ApprovalChoice::Decline => ApprovalResolution::Rejected,
          ''',
          '''            ApprovalChoice::Once => ApprovalResolution::AllowedOnce,
                  ApprovalChoice::Session => ApprovalResolution::AllowedSession,
                  ApprovalChoice::Always => ApprovalResolution::AllowedPersistent,
                  ApprovalChoice::Decline => ApprovalResolution::Rejected,
          ''',
          'map persistent audit resolution')

          audit_replace(
          '''    struct AllowSession;

              impl ScopedToolApprover for AllowSession {
          ''',
          '''    struct AllowSession;

              impl ScopedToolApprover for AllowSession {
          ''',
          'anchor allow session')

          audit_replace(
          '''    #[test]
              fn audited_sandbox_approval_records_requested_mode_and_justification() {
          ''',
          '''    struct AllowPersistent;

              impl ScopedToolApprover for AllowPersistent {
                  fn approve(
                      &self,
                      _call: &ToolCall,
                      _tool: &Tool,
                      _subject: &str,
                  ) -> Result<ApprovalChoice, String> {
                      Ok(ApprovalChoice::Always)
                  }
              }

              #[test]
              fn audited_scoped_tool_approval_records_persistent_resolution() {
                  let audit = Arc::new(InMemoryApprovalAudit::new(8).unwrap());
                  let approver =
                      AuditedScopedToolApprover::new(Arc::new(AllowPersistent), audit.clone());
                  let call = ToolCall::new("call-persist", "build", HashMap::new());
                  assert_eq!(
                      approver.approve(&call, &tool(), "scirust-core").unwrap(),
                      ApprovalChoice::Always
                  );
                  let events = audit.snapshot().unwrap();
                  assert_eq!(
                      events[1].resolution,
                      Some(ApprovalResolution::AllowedPersistent)
                  );
              }

              #[test]
              fn audited_sandbox_approval_records_requested_mode_and_justification() {
          ''',
          'add persistent audit test')

          audit.write_text(audit_text)

          mod = Path('scirust-sciagent/src/agentic/mod.rs')
          mod_text = mod.read_text()
          old = '''    ApprovalChoice, ApprovalOutcome, PermissionDecision, PermissionGate, PermissionPolicy,\n    PermissionRule, ScopedToolApprover, ToolApprover,\n'''
          new = '''    ApprovalChoice, ApprovalOutcome, PermissionDecision, PermissionGate, PermissionPolicy,\n    PermissionRule, PermissionRuleStore, ScopedToolApprover, ToolApprover,\n'''
          if mod_text.count(old) != 1:
              raise SystemExit('mod export anchor mismatch')
          mod.write_text(mod_text.replace(old, new, 1))
          PY

          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Validate permission and audit contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 test -p scirust-sciagent permission::tests --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent approval_audit::tests --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Commit proven product changes and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-persistent-approval-1268.yml
          git add scirust-sciagent/src/agentic/permission.rs \
                  scirust-sciagent/src/agentic/approval_audit.rs \
                  scirust-sciagent/src/agentic/mod.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sciagent): add persistent approval scope"
          git push origin HEAD:feat/sciagent-persistent-approvals

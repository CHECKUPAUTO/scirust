name: tmp-persistent-approval-1268

on:
  push:
    branches: [feat/sciagent-persistent-approvals]
    paths:
      - ".github/workflows/tmp-persistent-approval-1268.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-persistent-approvals
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          p = Path("scirust-sciagent/src/agentic/permission.rs")
          t = p.read_text()

          t = once(t,
              "    pub fn decide_subject(&self, tool: &str, read_only: bool, subject: &str) -> PermissionDecision {\n",
              "    fn explicitly_asks(&self, call: &ToolCall) -> bool {\n        let subjects = call_subjects(call);\n        if subjects.is_empty()\n        {\n            return matches_any(&self.ask, &call.tool, \"\");\n        }\n        subjects\n            .iter()\n            .any(|subject| matches_any(&self.ask, &call.tool, subject))\n    }\n\n    pub fn decide_subject(&self, tool: &str, read_only: bool, subject: &str) -> PermissionDecision {\n",
              "explicit ask helper")

          t = once(t,
              "    /// Permit this tool family for the lifetime of this gate/session.\n    Session,\n    /// Refuse this call; do not remember the refusal.\n    Decline,\n",
              "    /// Permit this tool family for the lifetime of this gate/session.\n    Session,\n    /// Persist a tool-wide allow rule through the explicitly installed store.\n    Always,\n    /// Refuse this call; do not remember the refusal.\n    Decline,\n",
              "Always choice")

          marker = "/// One-shot resolver with a closed, fail-closed outcome vocabulary.\n"
          insert = "/// Opt-in persistence seam for an explicit `Always` approval.\n///\n/// SciAgent never chooses a storage location itself. Front-ends may install\n/// a store that persists the supplied config-style bare allow rule. Store\n/// failure is authorization failure and leaves no session grant behind.\npub trait PermissionRuleStore: Send + Sync {\n    fn remember_allow(&self, rule: &str) -> Result<(), String>;\n}\n\n"
          t = once(t, marker, insert + marker, "rule store trait")

          t = once(t,
              "/// memory is process-local, shared only by clones of this gate, and never\n/// persisted. Static `Deny` rules are evaluated first and therefore always\n/// override a remembered session approval.\n",
              "/// memory is process-local, shared only by clones of this gate, and never\n/// persisted unless the operator explicitly chooses `Always` and a\n/// [`PermissionRuleStore`] is installed. Static `Deny` and explicit `Ask` rules\n/// keep their precedence over remembered grants.\n",
              "gate docs")

          t = once(t,
              "    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,\n    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n",
              "    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,\n    rule_store: Option<Arc<dyn PermissionRuleStore>>,\n    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n",
              "gate field")

          old_none = "            scoped_approver: None,\n            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n"
          if t.count(old_none) != 2:
              raise SystemExit(f"constructor None anchors: {t.count(old_none)}")
          t = t.replace(old_none,
              "            scoped_approver: None,\n            rule_store: None,\n            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n")
          t = once(t,
              "            scoped_approver: Some(approver),\n            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n",
              "            scoped_approver: Some(approver),\n            rule_store: None,\n            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n",
              "scoped constructor")

          t = once(t,
              "    pub fn policy(&self) -> &PermissionPolicy {\n        &self.policy\n    }\n\n",
              "    pub fn policy(&self) -> &PermissionPolicy {\n        &self.policy\n    }\n\n    /// Install the opt-in persistence sink used only for `ApprovalChoice::Always`.\n    pub fn with_rule_store(mut self, store: Arc<dyn PermissionRuleStore>) -> Self {\n        self.rule_store = Some(store);\n        self\n    }\n\n",
              "store builder")

          t = once(t,
              "                if self.is_tool_approved_for_session(&call.tool)?\n                {\n                    return Ok(());\n                }\n",
              "                if !self.policy.explicitly_asks(call)\n                    && self.is_tool_approved_for_session(&call.tool)?\n                {\n                    return Ok(());\n                }\n",
              "ask precedence")

          t = once(t,
              "                    ApprovalChoice::Session =>\n                    {\n                        self.approve_tool_for_session(&call.tool)?;\n                        Ok(())\n                    },\n                    ApprovalChoice::Decline => Err(\n",
              "                    ApprovalChoice::Session =>\n                    {\n                        self.approve_tool_for_session(&call.tool)?;\n                        Ok(())\n                    },\n                    ApprovalChoice::Always =>\n                    {\n                        let rule = session_tool_key(&call.tool)?;\n                        let Some(store) = self.rule_store.as_ref()\n                        else\n                        {\n                            return Err(\n                                \"persistent approval requested but no permission rule store is configured; refusing to execute\"\n                                    .to_string(),\n                            );\n                        };\n                        store\n                            .remember_allow(&rule)\n                            .map_err(|error| format!(\"failed to persist approval rule: {error}\"))?;\n                        self.approve_tool_for_session(&rule)?;\n                        Ok(())\n                    },\n                    ApprovalChoice::Decline => Err(\n",
              "Always handling")

          test_insert = r'''

    struct MemoryRuleStore {
        rules: Mutex<Vec<String>>,
        fail: bool,
    }

    impl MemoryRuleStore {
        fn new(fail: bool) -> Self {
            Self {
                rules: Mutex::new(Vec::new()),
                fail,
            }
        }

        fn rules(&self) -> Vec<String> {
            self.rules.lock().unwrap().clone()
        }
    }

    impl PermissionRuleStore for MemoryRuleStore {
        fn remember_allow(&self, rule: &str) -> Result<(), String> {
            if self.fail
            {
                return Err("rule store unavailable".to_string());
            }
            self.rules
                .lock()
                .map_err(|_| "rule store poisoned".to_string())?
                .push(rule.to_string());
            Ok(())
        }
    }

    #[test]
    fn persistent_choice_requires_an_explicit_store() {
        let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
        let gate = PermissionGate::with_scoped_approver(PermissionPolicy::default(), approver);
        let error = gate
            .before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
            .expect_err("Always without a store must fail closed");
        assert!(error.contains("no permission rule store"), "{error}");
        assert!(gate.session_approved_tools().unwrap().is_empty());
    }

    #[test]
    fn persistent_choice_stores_bare_rule_and_grants_current_session() {
        let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
        let store = Arc::new(MemoryRuleStore::new(false));
        let gate = PermissionGate::with_scoped_approver(PermissionPolicy::default(), approver.clone())
            .with_rule_store(store.clone());

        gate.before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
            .expect("persistent approval should authorize the call");
        gate.before_execute(
            &call("build", &[("crate", "scirust-stats")]),
            &tool("build"),
        )
        .expect("persistent approval should grant the current session");

        assert_eq!(store.rules(), vec!["build"]);
        assert_eq!(gate.session_approved_tools().unwrap(), vec!["build"]);
        assert_eq!(approver.calls.load(Ordering::SeqCst), 1);
    }

    #[test]
    fn persistent_store_failure_fails_closed_without_session_grant() {
        let approver = Arc::new(SequenceScopedApprover::new([ApprovalChoice::Always]));
        let gate = PermissionGate::with_scoped_approver(PermissionPolicy::default(), approver)
            .with_rule_store(Arc::new(MemoryRuleStore::new(true)));
        let error = gate
            .before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
            .expect_err("store failure must fail closed");
        assert!(error.contains("failed to persist approval rule"), "{error}");
        assert!(gate.session_approved_tools().unwrap().is_empty());
    }

    #[test]
    fn static_ask_overrides_remembered_session_approval() {
        let policy = PermissionPolicy::new(
            PermissionDecision::Ask,
            Vec::new(),
            vec![rule("build(secret-*)")],
            Vec::new(),
        );
        let gate = PermissionGate::new(policy);
        gate.approve_tool_for_session("build").unwrap();

        gate.before_execute(&call("build", &[("crate", "scirust-core")]), &tool("build"))
            .expect("fallback ask may be satisfied by remembered approval");
        let error = gate
            .before_execute(&call("build", &[("crate", "secret-model")]), &tool("build"))
            .expect_err("explicit ask must still require approval");
        assert!(error.contains("no approval service is available"), "{error}");
    }
'''
          pos = t.rfind("\n}")
          if pos < 0 or "persistent_choice_requires_an_explicit_store" in t:
              raise SystemExit("permission test insertion anchor invalid")
          t = t[:pos] + test_insert + t[pos:]
          p.write_text(t)

          a = Path("scirust-sciagent/src/agentic/approval_audit.rs")
          u = a.read_text()
          u = once(u,
              "    AllowedOnce,\n    AllowedSession,\n    Rejected,\n",
              "    AllowedOnce,\n    AllowedSession,\n    AllowedPersistent,\n    Rejected,\n",
              "audit resolution variant")
          u = once(u,
              "            ApprovalChoice::Once => ApprovalResolution::AllowedOnce,\n            ApprovalChoice::Session => ApprovalResolution::AllowedSession,\n            ApprovalChoice::Decline => ApprovalResolution::Rejected,\n",
              "            ApprovalChoice::Once => ApprovalResolution::AllowedOnce,\n            ApprovalChoice::Session => ApprovalResolution::AllowedSession,\n            ApprovalChoice::Always => ApprovalResolution::AllowedPersistent,\n            ApprovalChoice::Decline => ApprovalResolution::Rejected,\n",
              "audit choice mapping")
          audit_test = r'''

    struct AllowPersistent;

    impl ScopedToolApprover for AllowPersistent {
        fn approve(
            &self,
            _call: &ToolCall,
            _tool: &Tool,
            _subject: &str,
        ) -> Result<ApprovalChoice, String> {
            Ok(ApprovalChoice::Always)
        }
    }

    #[test]
    fn audited_scoped_tool_approval_records_persistent_resolution() {
        let audit = Arc::new(InMemoryApprovalAudit::new(8).unwrap());
        let approver = AuditedScopedToolApprover::new(Arc::new(AllowPersistent), audit.clone());
        let call = ToolCall::new("call-persist", "build", HashMap::new());
        assert_eq!(
            approver.approve(&call, &tool(), "scirust-core").unwrap(),
            ApprovalChoice::Always
        );
        let events = audit.snapshot().unwrap();
        assert_eq!(
            events[1].resolution,
            Some(ApprovalResolution::AllowedPersistent)
        );
    }
'''
          pos = u.rfind("\n}")
          if pos < 0 or "audited_scoped_tool_approval_records_persistent_resolution" in u:
              raise SystemExit("audit test insertion anchor invalid")
          u = u[:pos] + audit_test + u[pos:]
          a.write_text(u)

          m = Path("scirust-sciagent/src/agentic/mod.rs")
          v = m.read_text()
          v = once(v,
              "    PermissionRule, ScopedToolApprover, ToolApprover,\n",
              "    PermissionRule, PermissionRuleStore, ScopedToolApprover, ToolApprover,\n",
              "public export")
          m.write_text(v)
          PY
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Commit product changes and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-persistent-approval-1268.yml
          git add scirust-sciagent/src/agentic/permission.rs \
                  scirust-sciagent/src/agentic/approval_audit.rs \
                  scirust-sciagent/src/agentic/mod.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sciagent): add persistent approval scope"
          git push origin HEAD:feat/sciagent-persistent-approvals
# retrigger 2026-08-19

name: Elastic Latent KV Phase 12

on:
  push:
    branches:
      - research/elastic-latent-kv-phase12-kernels
    paths:
      - scirust-core/src/nn/latent_kv_kernels.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE12_SPEC.md
      - .github/workflows/elastic-latent-kv-phase12.yml
  pull_request:
    branches:
      - research/elastic-latent-kv-phase11-lifecycle
    paths:
      - scirust-core/src/nn/latent_kv_kernels.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE12_SPEC.md
      - .github/workflows/elastic-latent-kv-phase12.yml

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +nightly-2026-07-02 fmt --all -- --check
      - run: cargo +nightly-2026-07-02 clippy -p scirust-core --all-targets --locked -- -D warnings
      - run: cargo +1.89.0 check -p scirust-core --all-targets --locked
      - run: cargo +1.89.0 test -p scirust-core latent_kv_kernels --locked -- --test-threads=1

  portable-simd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal
      - run: cargo +nightly-2026-07-02 test -p scirust-core latent_kv_kernels --features portable-simd --locked -- --test-threads=1

name: ZerosLike one-shot patch

on:
  push:
    branches:
      - research/tensor-zeroslike-lowering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/tensor-zeroslike-lowering
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt

      - name: Apply ZerosLike compiler and Reference support
        shell: python3 {0}
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"{path}: replacement anchor not found: {old!r}")
              p.write_text(text.replace(old, new, count))

          # ------------------------------------------------------------------
          # Logical lowering
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-compile/src/lowering.rs",
              """pub enum UnaryKernel {
              Relu,
              Exp,
              Log,
              Scale { factor: Scalar },
          }
          """,
              """pub enum UnaryKernel {
              Relu,
              Exp,
              Log,
              ZerosLike,
              Scale { factor: Scalar },
          }
          """,
          )
          replace(
              "scirust-tensor-compile/src/lowering.rs",
              """        Operation::Log => uniform_unary(node, UnaryKernel::Log, instruction, operands),
              Operation::Scale { factor } => uniform_unary(
          """,
              """        Operation::Log => uniform_unary(node, UnaryKernel::Log, instruction, operands),
              Operation::ZerosLike => {
                  uniform_unary(node, UnaryKernel::ZerosLike, instruction, operands)
              },
              Operation::Scale { factor } => uniform_unary(
          """,
          )

          replace(
              "scirust-tensor-compile/src/lib.rs",
              """//! * `Relu`, `Exp`, `Log`, `Scale` — [`KernelFamily::ElementwiseUnary`];
          """,
              """//! * `Relu`, `Exp`, `Log`, `ZerosLike`, `Scale` — [`KernelFamily::ElementwiseUnary`];
          """,
          )

          # ------------------------------------------------------------------
          # Reference generator: format v1.1 already owns opcode 0x0006.
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-reference/src/generator.rs",
              """            UnaryKernel::Log => Ok((ReferenceOpcode::Log, AttributeSource::None)),
              UnaryKernel::Scale { factor } => Ok((
          """,
              """            UnaryKernel::Log => Ok((ReferenceOpcode::Log, AttributeSource::None)),
              UnaryKernel::ZerosLike => Ok((ReferenceOpcode::ZerosLike, AttributeSource::None)),
              UnaryKernel::Scale { factor } => Ok((
          """,
          )

          # ------------------------------------------------------------------
          # Reference CPU interpreter + invocation validation.
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-reference/src/interpreter.rs",
              """            ReferenceOpcode::ReluGrad
              | ReferenceOpcode::ZerosLike
              | ReferenceOpcode::OnesLike
          """,
              """            ReferenceOpcode::ReluGrad
              | ReferenceOpcode::OnesLike
          """,
          )
          replace(
              "scirust-tensor-reference/src/interpreter.rs",
              """            ReferenceOpcode::Relu
              | ReferenceOpcode::Scale
          """,
              """            ReferenceOpcode::Relu
              | ReferenceOpcode::ZerosLike
              | ReferenceOpcode::Scale
          """,
          )
          replace(
              "scirust-tensor-reference/src/interpreter.rs",
              """                ReferenceOpcode::Relu
                  | ReferenceOpcode::Add
          """,
              """                ReferenceOpcode::Relu
                  | ReferenceOpcode::ZerosLike
                  | ReferenceOpcode::Add
          """,
          )
          replace(
              "scirust-tensor-reference/src/interpreter.rs",
              """            ReferenceOpcode::Scale =>
              {
          """,
              """            ReferenceOpcode::ZerosLike =>
              {
                  // Keep the unary operand in the ABI/provenance even though
                  // the value bits do not affect the result.
                  let _ = first_operand(operands)?;
                  output.fill(0.0);
              },
              ReferenceOpcode::Scale =>
              {
          """,
          )
          replace(
              "scirust-tensor-reference/src/interpreter.rs",
              """            ReferenceOpcode::ReluGrad
              | ReferenceOpcode::ZerosLike
              | ReferenceOpcode::OnesLike
          """,
              """            ReferenceOpcode::ReluGrad
              | ReferenceOpcode::OnesLike
          """,
          )

          replace(
              "scirust-tensor-reference/src/invocation.rs",
              """        ReferenceOpcode::Relu
              | ReferenceOpcode::Scale
          """,
              """        ReferenceOpcode::Relu
              | ReferenceOpcode::ZerosLike
              | ReferenceOpcode::Scale
          """,
          )
          replace(
              "scirust-tensor-reference/src/invocation.rs",
              """        ReferenceOpcode::ReluGrad
              | ReferenceOpcode::ZerosLike
              | ReferenceOpcode::OnesLike
          """,
              """        ReferenceOpcode::ReluGrad
              | ReferenceOpcode::OnesLike
          """,
          )
          replace(
              "scirust-tensor-reference/src/invocation.rs",
              """                ReferenceOpcode::Relu
                  | ReferenceOpcode::Add
          """,
              """                ReferenceOpcode::Relu
                  | ReferenceOpcode::ZerosLike
                  | ReferenceOpcode::Add
          """,
          )

          # ------------------------------------------------------------------
          # Generator regression using the existing one-op fixture.
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-reference/src/tests.rs",
              """#[test]
          fn add_generates_the_add_opcode_with_two_operands() {
          """,
              """#[test]
          fn zeros_like_generates_the_v1_1_zeros_like_opcode() {
              let plan = single_unary_plan(Operation::ZerosLike, f32_type(vec![4]));
              let artifact = only_artifact(&plan);

              assert_eq!(artifact.opcode(), ReferenceOpcode::ZerosLike);
              assert_eq!(artifact.operands().len(), 1);
              assert_eq!(artifact.attributes(), &ReferenceAttributes::None);
              assert_eq!(artifact.version(), REFERENCE_FORMAT_VERSION);
          }

          #[test]
          fn add_generates_the_add_opcode_with_two_operands() {
          """,
          )

          # ------------------------------------------------------------------
          # End-to-end compiler pass regression: real Scale(0) canonicalization.
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              """    use scirust_tensor_ir::{DType, Graph, Operation, Shape, TensorType};
          """,
              """    use scirust_tensor_ir::{DType, Graph, Operation, Scalar, Shape, TensorType};
          """,
          )
          replace(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              """        KernelLowerer, OperationRewrite, PassResult, Rewriter, UnaryKernel,
          """,
              """        KernelLowerer, OperationRewrite, PassResult, Rewriter,
                  ScaleZeroCanonicalizationPass, UnaryKernel,
          """,
          )
          replace(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              """    #[test]
              fn pipeline_lowers_the_post_pass_operation() {
          """,
              """    #[test]
              fn scale_zero_pass_lowers_to_zeros_like_end_to_end() {
                  let mut graph = Graph::new();
                  let input = graph.add_input("input", ty()).unwrap();
                  let scaled = graph
                      .add_node(
                          Operation::Scale {
                              factor: Scalar::f32(0.0),
                          },
                          vec![input],
                          ty(),
                      )
                      .unwrap();
                  graph.set_outputs(vec![scaled]).unwrap();

                  let execution = CanonicalCompiler::new().compile(&graph).unwrap();
                  let mut pipeline = CompilerPipeline::new();
                  pipeline.push_pass(ScaleZeroCanonicalizationPass);
                  let compiled = pipeline.compile_execution_plan(&execution).unwrap();

                  assert!(matches!(
                      compiled.compiler_ir().operations()[1].operation(),
                      Operation::ZerosLike
                  ));
                  assert!(matches!(
                      compiled
                          .lowered_plan()
                          .kernel(compiled.lowered_plan().instructions()[0].kernel)
                          .unwrap()
                          .family(),
                      KernelFamily::ElementwiseUnary(UnaryKernel::ZerosLike)
                  ));
              }

              #[test]
              fn pipeline_lowers_the_post_pass_operation() {
          """,
          )

          # ------------------------------------------------------------------
          # Real CPU plan execution: all inputs, including NaN/Inf/-0, become +0.
          # ------------------------------------------------------------------
          replace(
              "scirust-tensor-runtime/tests/reference_cpu_plan.rs",
              """// The eight supported opcodes
          """,
              """// The nine supported opcodes
          """,
          )
          replace(
              "scirust-tensor-runtime/tests/reference_cpu_plan.rs",
              """#[test]
          fn executes_scale() {
          """,
              """#[test]
          fn executes_zeros_like_as_positive_zero_for_every_input_class() {
              let plan = unary_plan(Operation::ZerosLike, vec![5]);
              let input = [f32::NAN, f32::INFINITY, f32::NEG_INFINITY, -0.0, 7.5];
              let output = run_unary(&plan, &input);

              assert_eq!(bits(&output), vec![0u32; input.len()]);
          }

          #[test]
          fn executes_scale() {
          """,
          )

      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Test tensor compiler
        run: cargo test -p scirust-tensor-compile --all-targets

      - name: Test Reference format and interpreter
        run: cargo test -p scirust-tensor-reference --all-targets

      - name: Test Reference CPU runtime
        run: cargo test -p scirust-tensor-runtime --test reference_cpu_plan

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/zeroslike-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-tensor-compile/src/lowering.rs \
                  scirust-tensor-compile/src/lib.rs \
                  scirust-tensor-compile/src/compiler_pipeline.rs \
                  scirust-tensor-reference/src/generator.rs \
                  scirust-tensor-reference/src/interpreter.rs \
                  scirust-tensor-reference/src/invocation.rs \
                  scirust-tensor-reference/src/tests.rs \
                  scirust-tensor-runtime/tests/reference_cpu_plan.rs \
                  .github/workflows/zeroslike-one-shot.yml
          git diff --cached --check
          git commit -m "feat(tensor): lower zeros-like through reference CPU"
          git push origin HEAD:research/tensor-zeroslike-lowering

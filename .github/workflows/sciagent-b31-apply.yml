name: SciAgent B31 CUDA KV cache

on:
  pull_request:
    branches:
      - perf/sciagent-b30-deferred-telemetry

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sciagent-b31-cuda-kv-cache
          fetch-depth: 0
      - name: Apply B31 source patch
        run: python3 scripts/sciagent_b31_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check CUDA backend
        run: cargo check -p scirust-cuda --features cuda
      - name: Check SciAgent CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
      - name: Compile CUDA parity test
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Test SciAgent CPU surface
        run: cargo test -p scirust-sciagent --lib
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b31_patch.py .github/workflows/sciagent-b31-apply.yml
      - name: Commit and push validated B31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sciagent): add CUDA KV-cached generation"
          git push origin HEAD:perf/sciagent-b31-cuda-kv-cache

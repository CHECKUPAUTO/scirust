name: Temporary FLAT main pin regeneration

on:
  push:
    branches: ["perf/flat-main-pin-m28-requalify"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/flat-main-pin-m28-requalify
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Update exact FLAT pin and lockfile
        shell: bash
        run: |
          set -euo pipefail
          old=24d3340edeb059e40e0fe0c400e814685701d855
          new=f8e1be6a073596b446d298910eb04c122c7e29b0
          sed -i "s/$old/$new/g" scirust-gpu/Cargo.toml scirust-gpu/src/flat_autotune.rs
          rustup run nightly-2026-07-02 cargo update -p flat-attention --precise "$new"
          rustup run nightly-2026-07-02 cargo fmt --all -- --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/Cargo.toml scirust-gpu/src/flat_autotune.rs Cargo.lock
          git commit -m "perf(flat): pin latest qualified FLAT main for M28 requalification"
          git push origin HEAD:perf/flat-main-pin-m28-requalify

name: tmp-session-approvals-pr-1264

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/tmp-session-approvals-pr-1264.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-session-approvals
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 scripts/.tmp_session_approvals_1264.py
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
          cargo +nightly-2026-07-02 test -p scirust-sciagent permission --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Commit product files and remove all helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-session-approvals-1263.yml
          git rm .github/workflows/tmp-session-approvals-pr-1264.yml
          git rm scripts/.tmp_session_approvals_1264.py
          git add scirust-sciagent/src/agentic/permission.rs scirust-sciagent/src/agentic/mod.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(sciagent): remember scoped tool approvals per session"
          git push origin HEAD:feat/sciagent-session-approvals

name: Phase 18 Final Autofmt

on:
  push:
    branches:
      - research/phase18-wgpu-resident-minillm
    paths:
      - .github/workflows/phase18-final-autofmt.yml

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase18-wgpu-resident-minillm
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit exact repository formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-core/src/nn/transformer/mini_llm.rs scirust-gpu/src/elastic_latent_encoder_device.rs scirust-gpu/src/elastic_latent_encoder_device/minillm.rs scirust-gpu/src/lib.rs scirust-gpu/tests/elastic_latent_minillm_resident.rs
          git commit -m "style(gpu): rustfmt Phase 18"
          git push origin HEAD:research/phase18-wgpu-resident-minillm

name: Upgrade Rust Performance Evidence

on:
  pull_request:
    paths:
      - "scirust-simd/**"
      - ".github/workflows/upgrade-rust-perf.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark-smoke:
    name: Compile performance benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Compile SGEMM workspace benchmark
        run: cargo bench -p scirust-simd --bench gemm_workspace_bench --no-run

  benchmark-evidence:
    name: Collect non-gating benchmark evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Record runner and toolchain identity
        run: |
          {
            echo "=== rustc ==="
            rustc -Vv
            echo
            echo "=== cargo ==="
            cargo -V
            echo
            echo "=== uname ==="
            uname -a
            echo
            echo "=== lscpu ==="
            lscpu
          } > upgrade-rust-perf-host.txt

      - name: Run SGEMM workspace benchmark
        run: |
          cargo bench -p scirust-simd --bench gemm_workspace_bench -- \
            --sample-size 20 \
            --warm-up-time 1 \
            --measurement-time 3

      - name: Upload Criterion evidence
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-rust-sgemm-workspace-${{ github.run_id }}
          if-no-files-found: error
          path: |
            upgrade-rust-perf-host.txt
            target/criterion/sgemm_workspace_256/**

name: tmp-m28-rustfmt

on:
  push:
    branches:
      - bench/m28-scirust-naive-vs-flat

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/m28-scirust-naive-vs-flat
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply repository-pinned rustfmt
        run: cargo fmt --all
      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-m28-rustfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/examples/flat_m28_naive_vs_fused.rs .github/workflows/tmp-m28-rustfmt.yml
          git commit -m 'style(gpu): normalize M28 benchmark formatting'
          git push origin HEAD:bench/m28-scirust-naive-vs-flat

name: Rustdoc fix scirust-sim

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/rustdoc-fix-sim.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - name: Apply scirust-sim rustdoc fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('scirust-sim/src/lib.rs'): [
                  ('**A gym-style interaction layer** ([`env`])', '**A gym-style interaction layer** ([`mod@env`])'),
                  ('[`rl_bridge::RlEnv`], an adapter', '`rl_bridge::RlEnv`, an adapter'),
              ],
              Path('scirust-sim/src/grid.rs'): [
                  ('[`SecondOrderSystem`](crate::engine::SecondOrderSystem)', '[`SecondOrderSystem`]'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rustdoc-fix-sim.yml
          git config user.name "CHECKUPAUTO"
          git config user.email "194770978+CHECKUPAUTO@users.noreply.github.com"
          git add scirust-sim/src/lib.rs scirust-sim/src/grid.rs .github/workflows/rustdoc-fix-sim.yml
          git commit -m "docs: fix scirust-sim strict rustdoc links"
          git push origin HEAD:codex/gate-workspace-rustdoc

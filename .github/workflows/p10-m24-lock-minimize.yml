name: P10 M24 minimal lock validation

on:
  push:
    branches:
      - chore/flat-m21-pin
    paths:
      - .github/workflows/p10-m24-lock-minimize.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chore/flat-m21-pin
          fetch-depth: 0

      - name: Restore base lock and retain only exact FLAT provenance advance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git show origin/master:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('Cargo.lock')
          text = lock.read_text()
          old = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=974ebbaf95f54917dba0dc3f394d9ad1a92e8349#974ebbaf95f54917dba0dc3f394d9ad1a92e8349'
          new = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=311f6b89e001d69f53cddcd2f9ba396a6f80c746#311f6b89e001d69f53cddcd2f9ba396a6f80c746'
          if text.count(old) != 1:
              raise SystemExit(f'expected one base FLAT source, found {text.count(old)}')
          lock.write_text(text.replace(old, new))

          manifest = Path('scirust-gpu/Cargo.toml')
          m = manifest.read_text()
          m = m.replace(
              '# caller-owned grouped-forward surfaces without changing the feature from opt-in. The exact revision below is\n# a merged, CI-green FLAT default-branch commit.',
              '# caller-owned grouped-forward surfaces without changing the feature from opt-in.\n# The exact revision below is a merged, CI-green FLAT default-branch commit.'
          )
          manifest.write_text(m)
          PY

      - name: Prove the minimized lock differs from master only by FLAT source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = subprocess.check_output(['git', 'show', 'origin/master:Cargo.lock'], text=True)
          current = Path('Cargo.lock').read_text()
          old = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=974ebbaf95f54917dba0dc3f394d9ad1a92e8349#974ebbaf95f54917dba0dc3f394d9ad1a92e8349'
          new = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=311f6b89e001d69f53cddcd2f9ba396a6f80c746#311f6b89e001d69f53cddcd2f9ba396a6f80c746'
          if base.replace(old, new) != current:
              raise SystemExit('Cargo.lock contains drift beyond the exact FLAT source revision')
          PY

      - name: Validate exact M24 lock with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check -p scirust-gpu --features flat-attention --locked

      - name: Remove temporary workflow and commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p10-m24-lock-minimize.yml
          git add Cargo.lock scirust-gpu/Cargo.toml
          git diff --cached --check
          git commit -m 'fix(gpu): keep FLAT M24 lock provenance-only'
          git push origin HEAD:chore/flat-m21-pin

name: FLAT grouped MHA subgroup Thor evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "scirust-gpu/**"
      - ".github/scripts/prepare_flat_mha_subgroup_candidate.py"
      - ".github/workflows/flat-m28-thor-release-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flat-mha-subgroup-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mha-subgroup-thor:
    name: SciRust vs FLAT portable/subgroup on physical Thor
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SCIRUST_M28_WARMUPS: "3"
      SCIRUST_M28_REPEATS: "12"
      SCIRUST_M28_CANDIDATE_FLAT_REV: "a49ef227e3e90a60c4680400b97c6870f0b8e07f"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "source_revision=$actual"
          test "$actual" = "$SCIRUST_SOURCE_REVISION"
          sha256sum .github/scripts/prepare_flat_mha_subgroup_candidate.py
      - name: Prepare executable temporary directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Materialize exact FLAT subgroup candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_flat_mha_subgroup_candidate.py
          grep -F "rev = \"$SCIRUST_M28_CANDIDATE_FLAT_REV\"" scirust-gpu/Cargo.toml
          rustup run nightly-2026-07-02 cargo update -p flat-attention --precise "$SCIRUST_M28_CANDIDATE_FLAT_REV"
          rustup run nightly-2026-07-02 cargo fmt --all
          git diff --check
          echo "candidate_flat_revision=$SCIRUST_M28_CANDIDATE_FLAT_REV"
          git diff -- scirust-gpu/Cargo.toml Cargo.lock scirust-gpu/src/wgpu_backend.rs scirust-gpu/examples/flat_mha_subgroup_candidate.rs
      - name: Format candidate
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: Build candidate benchmark
        run: >-
          rustup run nightly-2026-07-02 cargo build --release --locked -p scirust-gpu
          --features flat-attention --example flat_mha_subgroup_candidate
      - name: Physical Thor portable vs subgroup benchmark
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::nvidia-smi is required to qualify the physical Thor state"
            exit 1
          fi
          if ! command -v vulkaninfo >/dev/null 2>&1; then
            echo "::error::vulkaninfo is required to qualify the physical Thor Vulkan adapter"
            exit 1
          fi

          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9

          gpu_inventory="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader)" || {
            echo "::error::cannot query NVIDIA GPU inventory"
            exit 1
          }
          printf '%s\n' "$gpu_inventory"
          grep -F "NVIDIA Thor" <<< "$gpu_inventory" >/dev/null || {
            echo "::error::expected physical NVIDIA Thor was not found"
            exit 1
          }

          vulkan_summary="$(vulkaninfo --summary 2>&1)" || {
            printf '%s\n' "$vulkan_summary"
            echo "::error::cannot query Vulkan adapter inventory"
            exit 1
          }
          printf '%s\n' "$vulkan_summary"
          grep -F "NVIDIA Tegra NVIDIA Thor" <<< "$vulkan_summary" >/dev/null || {
            echo "::error::physical Thor is not exposed through Vulkan"
            exit 1
          }

          deadline=$((SECONDS + 18000))
          while true; do
            if ! active="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
              echo "::error::cannot verify Thor compute occupancy"
              exit 1
            fi
            if [[ -z "${active//[[:space:]]/}" ]]; then
              echo "Thor is idle and reserved; proceeding with subgroup qualification."
              break
            fi

            managed_training=true
            while IFS=',' read -r raw_pid process_name; do
              pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
              process_name="$(printf '%s' "$process_name" | xargs)"
              [[ "$pid" =~ ^[0-9]+$ ]] || { managed_training=false; continue; }
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              proc_user="$(ps -p "$pid" -o user= 2>/dev/null | xargs || true)"
              ppid="$(ps -p "$pid" -o ppid= 2>/dev/null | tr -d '[:space:]')"
              cgroup="$(cat "/proc/$pid/cgroup" 2>/dev/null || true)"
              echo "pid=$pid user=$proc_user ppid=$ppid process=$process_name"
              if [[ "$process_name" != "/root/scirust/target/release/examples/cuda_pretrain" ]] \
                || [[ "$cmdline" != *"/root/scirust/target/release/examples/cuda_pretrain"* ]] \
                || [[ "$proc_user" != "root" ]] \
                || [[ "$ppid" != "1" ]] \
                || [[ "$cgroup" != 0::/user.slice/user-0.slice/session-*.scope ]]; then
                managed_training=false
              fi
            done <<< "$active"

            if [[ "$managed_training" != true ]]; then
              echo "::error::Unknown GPU compute activity is active while the subgroup benchmark owns the SciRust reservation:"
              printf '%s\n' "$active"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Managed production training still owns Thor after the five-hour reservation window; benchmark was not run concurrently or fabricated:"
              printf '%s\n' "$active"
              exit 1
            fi

            echo "Managed production training owns Thor; the benchmark keeps the next-device reservation and waits without interruption."
            sleep 60
          done

          echo "source_revision=$(git rev-parse HEAD)"
          echo "candidate_flat_revision=$SCIRUST_M28_CANDIDATE_FLAT_REV"
          echo "benchmark_scope=resident_same_context_portable_vs_subgroup_upload_readback_excluded"
          echo "warmups=$SCIRUST_M28_WARMUPS repeats=$SCIRUST_M28_REPEATS"

          for seq in 128 512; do
            for dim in 64 128; do
              echo "=== geometry seq_len=$seq head_dim=$dim ==="
              out="$RUNNER_TEMP/flat-mha-subgroup-${seq}-${dim}.csv"
              SCIRUST_M28_SEQ_LEN="$seq" \
              SCIRUST_M28_HEAD_DIM="$dim" \
              rustup run nightly-2026-07-02 cargo run --release --locked -p scirust-gpu \
                --features flat-attention --example flat_mha_subgroup_candidate \
                | tee "$out"
              head -n 1 "$out" | grep -F "portable_over_subgroup" >/dev/null || {
                echo "::error::subgroup candidate benchmark columns are missing"
                exit 1
              }
              grep -F "NVIDIA Tegra NVIDIA Thor,Vulkan," "$out" >/dev/null || {
                echo "::error::benchmark did not execute through Vulkan on the physical Thor WGPU adapter"
                exit 1
              }
              grep -F "Q4PortableGrouped,Q4SubgroupMha" "$out" >/dev/null || {
                echo "::error::benchmark did not prove portable/subgroup kernel selection"
                exit 1
              }
              grep -F ',none' "$out" >/dev/null
            done
          done

          echo "performance_claim=none"

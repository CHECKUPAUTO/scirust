name: FLAT kernel generations Thor evidence

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/scripts/prepare_flat_kernel_generations_candidate.py"
      - ".github/workflows/flat-m28-thor-release-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flat-kernel-generations-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generations-thor:
    name: FLAT Q4 generations on physical Thor
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FLAT_CANDIDATE_REV: "f8e1be6a073596b446d298910eb04c122c7e29b0"
      FLAT_M28_GENERATIONS_WARMUP: "3"
      FLAT_M28_GENERATIONS_ITERATIONS: "12"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact evidence source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "source_revision=$actual"
          test "$actual" = "$SCIRUST_SOURCE_REVISION"
          sha256sum .github/scripts/prepare_flat_kernel_generations_candidate.py
      - name: Prepare executable temporary directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Materialize exact FLAT generation candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_flat_kernel_generations_candidate.py
          grep -F "rev = \"$FLAT_CANDIDATE_REV\"" scirust-gpu/Cargo.toml
          rustup run nightly-2026-07-02 cargo update -p flat-attention --precise "$FLAT_CANDIDATE_REV"
          rustup run nightly-2026-07-02 cargo fmt --all
          git diff --check
          echo "candidate_flat_revision=$FLAT_CANDIDATE_REV"
      - name: Build generation benchmark
        run: >-
          rustup run nightly-2026-07-02 cargo build --release --locked -p scirust-gpu
          --features flat-attention --example flat_kernel_generations_candidate
      - name: Physical Thor generation ranking
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          command -v nvidia-smi >/dev/null
          command -v vulkaninfo >/dev/null

          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9

          gpu_inventory="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader)" || {
            echo "::error::cannot query NVIDIA GPU inventory"
            exit 1
          }
          printf '%s\n' "$gpu_inventory"
          grep -F "NVIDIA Thor" <<< "$gpu_inventory" >/dev/null || {
            echo "::error::expected physical NVIDIA Thor was not found"
            exit 1
          }

          vulkan_summary="$(vulkaninfo --summary 2>&1)" || {
            printf '%s\n' "$vulkan_summary"
            echo "::error::cannot query Vulkan adapter inventory"
            exit 1
          }
          printf '%s\n' "$vulkan_summary"
          grep -F "NVIDIA Tegra NVIDIA Thor" <<< "$vulkan_summary" >/dev/null || {
            echo "::error::physical Thor is not exposed through Vulkan"
            exit 1
          }

          deadline=$((SECONDS + 18000))
          while true; do
            if ! active="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
              echo "::error::cannot verify Thor compute occupancy"
              exit 1
            fi
            if [[ -z "${active//[[:space:]]/}" ]]; then
              echo "Thor is idle and reserved; proceeding with generation ranking."
              break
            fi

            managed_training=true
            while IFS=',' read -r raw_pid process_name; do
              pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
              process_name="$(printf '%s' "$process_name" | xargs)"
              [[ "$pid" =~ ^[0-9]+$ ]] || { managed_training=false; continue; }
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              proc_user="$(ps -p "$pid" -o user= 2>/dev/null | xargs || true)"
              ppid="$(ps -p "$pid" -o ppid= 2>/dev/null | tr -d '[:space:]')"
              cgroup="$(cat "/proc/$pid/cgroup" 2>/dev/null || true)"
              echo "pid=$pid user=$proc_user ppid=$ppid process=$process_name"
              if [[ "$process_name" != "/root/scirust/target/release/examples/cuda_pretrain" ]] \
                || [[ "$cmdline" != *"/root/scirust/target/release/examples/cuda_pretrain"* ]] \
                || [[ "$proc_user" != "root" ]] \
                || [[ "$ppid" != "1" ]] \
                || [[ "$cgroup" != 0::/user.slice/user-0.slice/session-*.scope ]]; then
                managed_training=false
              fi
            done <<< "$active"

            if [[ "$managed_training" != true ]]; then
              echo "::error::Unknown GPU compute activity is active while generation ranking owns the SciRust reservation:"
              printf '%s\n' "$active"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Managed production training still owns Thor after the five-hour reservation window; ranking was not run concurrently or fabricated:"
              printf '%s\n' "$active"
              exit 1
            fi
            echo "Managed production training owns Thor; generation ranking reserves the next idle boundary."
            sleep 60
          done

          echo "source_revision=$(git rev-parse HEAD)"
          echo "candidate_flat_revision=$FLAT_CANDIDATE_REV"
          echo "timing_scope=public_forward_including_upload_dispatch_readback"

          for seq in 128 512; do
            for dim in 64 128; do
              echo "=== geometry seq_len=$seq head_dim=$dim causal=true ==="
              out="$RUNNER_TEMP/flat-generations-${seq}-${dim}.csv"
              FLAT_M28_GENERATIONS_SEQ_LEN="$seq" \
              FLAT_M28_GENERATIONS_HEAD_DIM="$dim" \
              rustup run nightly-2026-07-02 cargo run --quiet --release --locked -p scirust-gpu \
                --features flat-attention --example flat_kernel_generations_candidate \
                | tee "$out"
              test "$(wc -l < "$out")" -eq 5
              grep -F "q4_portable,Q4Portable,NVIDIA Tegra NVIDIA Thor,Vulkan," "$out" >/dev/null
              grep -F "q4_vec4_portable,Q4Vec4Portable,NVIDIA Tegra NVIDIA Thor,Vulkan," "$out" >/dev/null
              grep -F "q4_vec4_double_buffered,Q4Vec4DoubleBuffered,NVIDIA Tegra NVIDIA Thor,Vulkan," "$out" >/dev/null
              grep -F ',none' "$out" >/dev/null
            done
          done

          echo "performance_claim=none"

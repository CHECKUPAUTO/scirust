name: SciAgent Thor gate
# I250 diagnostic dispatch marker.

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sciagent-thor:
    name: SCIAGENT CUDA parity + 304M benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_REQUIRE_CUDA: "1"
      SCIRUST_THOR_GPU_LOCK: /dev/nvidia0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated executable build directory
        run: |
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Report Thor CUDA
        run: nvidia-smi || true
      - name: Format
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: Classify CUDA runtime availability
        id: cuda-runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/nvidia0 ]] || ! ldconfig -p 2>/dev/null | grep -q 'libcuda\.so'; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-unexposed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-unqueryable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${compute_apps//[[:space:]]/}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=gpu-busy" >> "$GITHUB_OUTPUT"
            echo "::notice::Thor GPU busy; hardware tests deferred."
          fi
      - name: Require CUDA device
        if: steps.cuda-runtime.outputs.available == 'true'
        run: rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_required -- --nocapture
      - name: Validate CUDA hardware profile
        if: steps.cuda-runtime.outputs.available == 'true'
        run: rustup run nightly-2026-07-02 cargo test -p scirust-gpu --features cuda --test cuda_hardware_capabilities -- --nocapture
      - name: SCIAGENT CUDA parity
        if: steps.cuda-runtime.outputs.available == 'true'
        run: rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_parity -- --nocapture
      - name: SCIAGENT I250 decode parity
        if: steps.cuda-runtime.outputs.available == 'true'
        run: rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_decode_parity -- --nocapture
      - name: SCIAGENT CUDA clippy
        run: rustup run nightly-2026-07-02 cargo clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
      - name: Report deferred CUDA execution
        if: steps.cuda-runtime.outputs.available != 'true'
        run: echo "CUDA execution deferred: ${{ steps.cuda-runtime.outputs.reason }}"

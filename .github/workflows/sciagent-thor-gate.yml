name: SciAgent Thor gate

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sciagent-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sciagent-thor:
    name: SCIAGENT CUDA parity + 304M benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - scirust-arm64
      - jetson-thor
      - internal
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_REQUIRE_CUDA: "1"
    steps:
      - name: Check out tested branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply B45 once and publish code only
        if: hashFiles('scripts/sciagent_b45_layer_trace.py') != ''
        run: |
          python3 scripts/sciagent_b45_layer_trace.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scirust-sciagent/src/cuda_model.rs')
          s = p.read_text()
          old = '''        for step in 0..target_step {
              let token = forced_tokens[step];
          '''
          new = '''        for (step, &token) in forced_tokens.iter().take(target_step).enumerate() {
          '''
          if old not in s:
              raise SystemExit('B45 Clippy loop anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --example cuda_production_bench
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
          rm -f scripts/sciagent_b45_layer_trace.py
          git restore -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(sciagent): localize production KV drift by layer"
          git push origin HEAD:perf/sciagent-b39-thor-production-bench
      - name: Report Thor CUDA
        run: |
          uname -a
          free -h
          nvidia-smi
          nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader
      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all -- --check
      - name: SCIAGENT CUDA parity
        run: cargo +nightly-2026-07-02 test -p scirust-sciagent --features cuda --test cuda_parity -- --nocapture
      - name: SCIAGENT CUDA clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
      - name: SCIAGENT 304M production sweep
        env:
          SCIAGENT_BENCH_BATCHES: "1,2,4,8"
          SCIAGENT_BENCH_SEQ: "512"
          SCIAGENT_BENCH_STEPS: "4"
          SCIAGENT_BENCH_PROMPT: "128"
          SCIAGENT_BENCH_DECODE_NEW: "8"
        run: |
          cargo +nightly-2026-07-02 run -p scirust-sciagent --features cuda --release --example cuda_production_bench

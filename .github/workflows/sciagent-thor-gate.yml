name: SciAgent Thor gate
# I250 diagnostic dispatch marker.

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sciagent-thor:
    name: SCIAGENT CUDA parity + 304M benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_REQUIRE_CUDA: "1"
      SCIRUST_THOR_GPU_LOCK: /dev/nvidia0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated executable build directory
        run: |
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          mkdir -p "$tmpdir/cargo-home" "$tmpdir/rustup-home"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Report Thor CUDA
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader || true
          else
            echo "nvidia-smi unavailable on this runner"
          fi
          ldconfig -p | grep -E 'libcuda|libnvrtc' || true
      - name: Format
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: Classify CUDA runtime availability
        id: cuda-runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/nvidia0 ]] || ! ldconfig -p 2>/dev/null | grep -q 'libcuda\.so'; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-unexposed" >> "$GITHUB_OUTPUT"
            echo "::notice::CUDA runtime is not exposed on this self-hosted runner; keeping compile/lint checks active and skipping hardware execution."
            exit 0
          fi

          command -v flock >/dev/null
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-unqueryable" >> "$GITHUB_OUTPUT"
            echo "::notice::CUDA device exists but nvidia-smi cannot query compute occupancy on this runner; hardware execution is skipped."
            exit 0
          fi

          if [[ -z "${compute_apps//[[:space:]]/}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          managed_training=true
          printf '%s\n' "$compute_apps"
          while IFS=',' read -r raw_pid process_name; do
            pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
            [[ "$pid" =~ ^[0-9]+$ ]] || { managed_training=false; continue; }
            cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
            proc_user="$(ps -p "$pid" -o user= 2>/dev/null | xargs || true)"
            ppid="$(ps -p "$pid" -o ppid= 2>/dev/null | tr -d '[:space:]')"
            cgroup="$(cat "/proc/$pid/cgroup" 2>/dev/null || true)"
            echo "pid=$pid user=$proc_user ppid=$ppid cmdline=$cmdline cgroup=$cgroup"
            if [[ "${process_name# }" != "/root/scirust/target/release/examples/cuda_pretrain" ]] \
              || [[ "$cmdline" != *"/root/scirust/target/release/examples/cuda_pretrain"* ]] \
              || [[ "$proc_user" != "root" ]] \
              || [[ "$ppid" != "1" ]] \
              || [[ "$cgroup" != 0::/user.slice/user-0.slice/session-*.scope ]]; then
              managed_training=false
            fi
          done <<< "$compute_apps"

          if [[ "$managed_training" == true ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=managed-production-training" >> "$GITHUB_OUTPUT"
            echo "::notice::Detached SciAgent production training owns the GPU; CUDA runtime tests/benchmark are deferred and the training process is left untouched."
            exit 0
          fi

          echo "::error::Unknown GPU compute activity remains after acquiring the shared SciRust lock; refusing concurrent CUDA execution."
          exit 1
      - name: Require CUDA device
        if: steps.cuda-runtime.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_required -- --nocapture
      - name: Validate CUDA hardware profile
        if: steps.cuda-runtime.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          rustup run nightly-2026-07-02 cargo test -p scirust-gpu --features cuda --test cuda_hardware_capabilities -- --nocapture
      - name: SCIAGENT CUDA parity
        if: steps.cuda-runtime.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_parity -- --nocapture
      - name: SCIAGENT I250 decode parity
        if: steps.cuda-runtime.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_decode_parity -- --nocapture
      - name: SCIAGENT I250 fourth-token diagnostics
        if: steps.cuda-runtime.outputs.available == 'true'
        env:
          SCIAGENT_DECODE_PROMPT: "128"
          SCIAGENT_DECODE_TRACE_TOKENS: "4"
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          rustup run nightly-2026-07-02 cargo run -p scirust-sciagent --features cuda --release --example cuda_decode_token_trace
      - name: SCIAGENT CUDA clippy
        run: rustup run nightly-2026-07-02 cargo clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
      - name: SCIAGENT I250 304M decode benchmark
        if: steps.cuda-runtime.outputs.available == 'true'
        env:
          SCIAGENT_DECODE_PROMPT: "128"
          SCIAGENT_DECODE_NEW: "64"
          SCIAGENT_DECODE_TARGET_TPS: "250"
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "::error::I250 cannot verify that the Thor is idle."
            exit 1
          fi
          if [[ -n "${compute_apps//[[:space:]]/}" ]]; then
            echo "::error::I250 benchmark requires an idle Thor; unexpected compute processes are active:"
            printf '%s\n' "$compute_apps"
            exit 1
          fi
          rustup run nightly-2026-07-02 cargo run -p scirust-sciagent --features cuda --release --example cuda_decode_bench
      - name: SCIAGENT production sweep
        if: steps.cuda-runtime.outputs.available == 'true'
        env:
          SCIAGENT_BENCH_BATCHES: "8"
          SCIAGENT_BENCH_SEQ: "512"
          SCIAGENT_BENCH_STEPS: "1"
          SCIAGENT_BENCH_PROMPT: "128"
          SCIAGENT_BENCH_DECODE_NEW: "8"
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "::error::SCIAGENT cannot verify that the Thor is idle."
            exit 1
          fi
          if [[ -n "${compute_apps//[[:space:]]/}" ]]; then
            echo "::error::SCIAGENT production benchmark requires an idle Thor; unexpected compute processes are active:"
            printf '%s\n' "$compute_apps"
            exit 1
          fi
          rustup run nightly-2026-07-02 cargo run -p scirust-sciagent --features cuda --release --example cuda_production_bench
      - name: Report deferred CUDA execution
        if: steps.cuda-runtime.outputs.available != 'true'
        run: |
          echo "CUDA execution deferred: ${{ steps.cuda-runtime.outputs.reason }}"

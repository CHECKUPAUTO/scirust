name: SciAgent Thor gate

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "scirust-sciagent/**"
      - "scirust-cuda/**"
      - "scirust-gpu/**"
      - ".github/workflows/sciagent-thor-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sciagent-thor:
    name: SCIAGENT CUDA parity + 304M benchmark
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_REQUIRE_CUDA: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated executable build directory
        run: |
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          mkdir -p "$tmpdir/cargo-home" "$tmpdir/rustup-home"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Report Thor CUDA
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            if ! nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader; then
              echo "nvidia-smi reporting failed on this Jetson runner; the functional CUDA preflight below determines availability."
            fi
          else
            echo "nvidia-smi is unavailable on this Jetson runner; the functional CUDA preflight below determines availability."
          fi
      - name: Format
        run: rustup run nightly-2026-07-02 cargo fmt --all -- --check
      - name: Require CUDA device
        run: rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_required -- --nocapture
      - name: SCIAGENT CUDA parity
        run: rustup run nightly-2026-07-02 cargo test -p scirust-sciagent --features cuda --test cuda_parity -- --nocapture
      - name: SCIAGENT CUDA clippy
        run: rustup run nightly-2026-07-02 cargo clippy -p scirust-sciagent --features cuda --all-targets -- -D warnings
      - name: SCIAGENT production sweep
        env:
          SCIAGENT_BENCH_BATCHES: "8"
          SCIAGENT_BENCH_SEQ: "512"
          SCIAGENT_BENCH_STEPS: "1"
          SCIAGENT_BENCH_PROMPT: "128"
          SCIAGENT_BENCH_DECODE_NEW: "8"
        run: rustup run nightly-2026-07-02 cargo run -p scirust-sciagent --features cuda --release --example cuda_production_bench

name: SciAgent Thor gate

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/sciagent-thor-gate.yml"
      - ".github/workflows/sciagent-v2-preflight-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciagent-v2-production-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: SCIAGENT v2 production preflight (read-only)
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 20
    steps:
      - name: Identity, mounts and root-path permissions
        shell: bash
        run: |
          set -euo pipefail
          echo "SCIAGENT_PREFLIGHT_USER=$(id -un)"
          echo "SCIAGENT_PREFLIGHT_HOME=$HOME"
          id
          echo "--- GPU / memory / disk ---"
          nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv,noheader
          free -h
          df -hT /
          echo "--- mounts ---"
          findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS | head -n 250 || true
          echo "--- known root path permissions ---"
          ls -ld /root /root/scirust /root/scirust/data /root/scirust/data/shards_v4 2>&1 || true
          command -v namei >/dev/null && namei -l /root/scirust/data/shards_v4 2>&1 || true
          for p in /root/scirust/data/shards_v4 /root/scirust /data /mnt /srv /home /opt /var/lib/github-runner; do
            if [[ -e "$p" ]]; then
              echo "SCIAGENT_PREFLIGHT_PATH path=$p readable=$([[ -r "$p" ]] && echo yes || echo no) searchable=$([[ -x "$p" ]] && echo yes || echo no)"
            else
              echo "SCIAGENT_PREFLIGHT_PATH path=$p exists=no"
            fi
          done
          echo "--- existing training processes ---"
          pgrep -af 'cuda_pretrain|sciagent.*pretrain' || true

      - name: Search all readable storage roots for corpus candidates
        shell: bash
        run: |
          set -euo pipefail
          roots=(/opt /var/lib/github-runner /var/tmp /tmp /home /data /mnt /srv /media)
          echo "--- shard_v4 directories visible to ghrunner ---"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 9 -type d -name shards_v4 -print 2>/dev/null || true
          done
          echo "--- likely SciRust / SciAgent data paths visible to ghrunner ---"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 7 \( -type d -o -type l \) \
              \( -iname 'scirust' -o -iname 'sciagent*' -o -iname 'shards*' -o -iname 'checkpoints*' \) \
              -print 2>/dev/null | head -n 400 || true
          done
          echo "--- large readable u32 shard-like files ---"
          for root in /opt /var/lib/github-runner /home /data /mnt /srv /media; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 9 -type f -name 'shard_*.bin' -size +1M -printf '%p %s\n' 2>/dev/null | head -n 40 || true
          done

      - name: Report conclusion without modifying host
        shell: bash
        run: |
          set -euo pipefail
          echo "SCIAGENT_PREFLIGHT_READ_ONLY=confirmed"
          echo "SCIAGENT_PREFLIGHT_NOTE=training_not_started"

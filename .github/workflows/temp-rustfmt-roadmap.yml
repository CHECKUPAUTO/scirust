name: Temporary roadmap rustfmt

on:
  push:
    branches:
      - feat/trader-roadmap-execution-core

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/trader-roadmap-execution-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply pinned rustfmt and remove temporary workflow
        run: |
          cargo +nightly-2026-07-02 fmt --all
          rm .github/workflows/temp-rustfmt-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-trader .github/workflows/temp-rustfmt-roadmap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(trader): apply pinned rustfmt"
          git push origin HEAD:feat/trader-roadmap-execution-core

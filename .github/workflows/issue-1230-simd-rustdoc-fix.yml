name: Issue 1230 simd rustdoc fix

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-simd-rustdoc-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix obsolete scirust-simd rustdoc links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('scirust-simd/src').rglob('*.rs'):
              text = path.read_text()
              original = text
              text = re.sub(r'\[`(crate::fixed::[^`]+)`\]', r'`\1`', text)
              text = text.replace('[`crate::fixed`]', '`crate::fixed`')
              text = text.replace('[`crate::quant`]', '`crate::quant`')
              text = text.replace('[`attention_backward`]', '`attention_backward`')
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          if not changed:
              raise SystemExit('no scirust-simd rustdoc links were changed')
          print('changed:', *changed, sep='\n  ')
          PY

          if grep -RInE '\[`crate::fixed(::[^`]*)?`\]|\[`crate::quant`\]|\[`attention_backward`\]' scirust-simd/src; then
            echo 'obsolete rustdoc link remains' >&2
            exit 1
          fi
      - name: Commit fixes and remove helper
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-simd/src
          git rm .github/workflows/issue-1230-simd-rustdoc-fix.yml
          git diff --cached --check
          git commit -m "docs(simd): fix obsolete rustdoc links"
          git push origin "HEAD:${HEAD_REF}"

name: Temporary rustfmt PR 1100

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/temp-rustfmt-1100.yml
  push:
    branches:
      - perf/elastic-tokenizer-direct-u32-ingress
    paths:
      - .github/workflows/temp-rustfmt-1100.yml

permissions:
  contents: write

jobs:
  rustfmt-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/elastic-tokenizer-direct-u32-ingress
          fetch-depth: 0

      - name: Install pinned formatter
        run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Commit formatted production files and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scirust-sciagent/src/elastic_tiny.rs \
            scirust-sciagent/src/elastic_engine.rs \
            scirust-sciagent/src/elastic_text_tokenizer.rs
          git rm .github/workflows/temp-rustfmt-1100.yml
          git commit -m "style(sciagent): apply pinned rustfmt to direct u32 ingress"
          git push origin HEAD:perf/elastic-tokenizer-direct-u32-ingress

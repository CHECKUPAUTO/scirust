name: tmp-sandbox-escalation-1266

on:
  push:
    branches: [feat/sciagent-sandbox-escalation]
    paths:
      - ".github/workflows/tmp-sandbox-escalation-1266.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-sandbox-escalation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy
      - name: Integrate escalation context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # permission.rs
          path = Path('scirust-sciagent/src/agentic/permission.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'use super::tool_runtime::{ToolCall, ToolPolicy};\n',
              'use super::sandbox_approval::{SandboxApprovalRequest, SandboxApprovalService};\nuse super::tool_runtime::{ToolCall, ToolPolicy};\n',
              'permission import',
          )
          text = replace_once(
              text,
              '    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,\n    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n',
              '    scoped_approver: Option<Arc<dyn ScopedToolApprover>>,\n    sandbox_approver: Option<Arc<dyn SandboxApprovalService>>,\n    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n',
              'permission field',
          )
          text = text.replace(
              '            scoped_approver: None,\n            session_approved_tools:',
              '            scoped_approver: None,\n            sandbox_approver: None,\n            session_approved_tools:',
          )
          text = text.replace(
              '            scoped_approver: Some(approver),\n            session_approved_tools:',
              '            scoped_approver: Some(approver),\n            sandbox_approver: None,\n            session_approved_tools:',
          )
          if text.count('sandbox_approver: None,') != 3:
              raise SystemExit('permission constructors did not receive exactly three sandbox approver defaults')
          text = replace_once(
              text,
              '    pub fn policy(&self) -> &PermissionPolicy {\n',
              '''    /// Install the independent one-shot sandbox widening approval channel.\n    /// Tool/session approval never implies sandbox escalation approval.\n    pub fn with_sandbox_approval_service(\n        mut self,\n        approver: Arc<dyn SandboxApprovalService>,\n    ) -> Self {\n        self.sandbox_approver = Some(approver);\n        self\n    }\n\n    pub fn policy(&self) -> &PermissionPolicy {\n''',
              'permission builder',
          )
          marker = '''    }\n}\n\nfn approval_unavailable_error() -> String {\n'''
          replacement = '''    }\n\n    fn approve_sandbox_escalation(\n        &self,\n        _call: &ToolCall,\n        _tool: &Tool,\n        request: &SandboxApprovalRequest,\n    ) -> Result<(), String> {\n        let Some(approver) = self.sandbox_approver.as_ref() else {\n            return Err(\n                "sandbox escalation approval required but no sandbox approval service is available; refusing to execute"\n                    .to_string(),\n            );\n        };\n        let outcome = approver\n            .request_approval(request)\n            .unwrap_or(ApprovalOutcome::Unavailable);\n        match outcome {\n            ApprovalOutcome::AllowedOnce => Ok(()),\n            ApprovalOutcome::Rejected => Err(\n                "the user rejected this sandbox escalation; do not retry it unchanged".to_string(),\n            ),\n            ApprovalOutcome::Cancelled => Err(\n                "sandbox escalation approval was cancelled; do not retry it unchanged".to_string(),\n            ),\n            ApprovalOutcome::Unavailable => Err(\n                "sandbox escalation approval is unavailable; refusing to execute".to_string(),\n            ),\n        }\n    }\n}\n\nfn approval_unavailable_error() -> String {\n'''
          text = replace_once(text, marker, replacement, 'permission policy method')
          path.write_text(text)

          # tool_runtime.rs
          path = Path('scirust-sciagent/src/agentic/tool_runtime.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'use super::tools::{Tool, ToolParam};\n',
              'use super::sandbox_approval::SandboxApprovalRequest;\nuse super::tools::{Tool, ToolParam};\n',
              'runtime import',
          )
          text = replace_once(
              text,
              'use std::collections::{HashMap, HashSet};\n',
              'use std::collections::{HashMap, HashSet};\n\npub const SANDBOX_PERMISSIONS_METADATA: &str = "sandbox_permissions";\npub const JUSTIFICATION_METADATA: &str = "justification";\n',
              'runtime constants',
          )
          text = replace_once(
              text,
              '    pub params: HashMap<String, String>,\n',
              '    pub params: HashMap<String, String>,\n    pub sandbox_permissions: Option<String>,\n    pub justification: Option<String>,\n',
              'runtime call fields',
          )
          text = replace_once(
              text,
              '            params,\n        }\n    }\n}\n',
              '''            params,\n            sandbox_permissions: None,\n            justification: None,\n        }\n    }\n\n    pub fn with_sandbox_metadata(\n        mut self,\n        sandbox_permissions: Option<String>,\n        justification: Option<String>,\n    ) -> Self {\n        self.sandbox_permissions = sandbox_permissions;\n        self.justification = justification;\n        self\n    }\n}\n''',
              'runtime constructor',
          )
          text = replace_once(
              text,
              '    fn after_execute(&self, _call: &ToolCall, _tool: &Tool, _output: &str) {}\n',
              '''    fn approve_sandbox_escalation(\n        &self,\n        _call: &ToolCall,\n        _tool: &Tool,\n        _request: &SandboxApprovalRequest,\n    ) -> Result<(), String> {\n        Err("sandbox escalation is not supported by this tool policy".to_string())\n    }\n\n    fn after_execute(&self, _call: &ToolCall, _tool: &Tool, _output: &str) {}\n''',
              'runtime policy seam',
          )
          text = replace_once(
              text,
              '    UndeclaredParameter { tool: String, parameter: String },\n    PolicyDenied { tool: String, reason: String },\n',
              '    UndeclaredParameter { tool: String, parameter: String },\n    ReservedParameter { tool: String, parameter: String },\n    PolicyDenied { tool: String, reason: String },\n    SandboxEscalationDenied { tool: String, reason: String },\n',
              'runtime error variants',
          )
          text = replace_once(
              text,
              '''            Self::PolicyDenied { tool, reason } =>\n            {\n                write!(f, "Tool {tool:?} denied by policy: {reason}")\n            },\n''',
              '''            Self::ReservedParameter { tool, parameter } => write!(\n                f,\n                "Parameter {parameter:?} is reserved runtime metadata for tool {tool:?}"\n            ),\n            Self::PolicyDenied { tool, reason } =>\n            {\n                write!(f, "Tool {tool:?} denied by policy: {reason}")\n            },\n            Self::SandboxEscalationDenied { tool, reason } => write!(\n                f,\n                "Sandbox escalation for tool {tool:?} was refused: {reason}"\n            ),\n''',
              'runtime display',
          )
          old_execute = '''    pub fn execute(&self, call: &ToolCall) -> Result<String, ToolRuntimeError> {\n        let tool = self.validate_call(call)?;\n        self.policy.before_execute(call, tool).map_err(|reason| {\n            ToolRuntimeError::PolicyDenied {\n                tool: call.tool.clone(),\n                reason,\n            }\n        })?;\n        let output = (tool.execute)(call.params.clone());\n        self.policy.after_execute(call, tool, &output);\n        Ok(output)\n    }\n'''
          new_execute = '''    pub fn execute(&self, call: &ToolCall) -> Result<String, ToolRuntimeError> {\n        let tool = self.validate_call(call)?;\n        self.policy.before_execute(call, tool).map_err(|reason| {\n            ToolRuntimeError::PolicyDenied {\n                tool: call.tool.clone(),\n                reason,\n            }\n        })?;\n\n        let escalation = sandbox_request(call)?;\n        let mut params = call.params.clone();\n        if let Some(request) = escalation.as_ref() {\n            self.policy\n                .approve_sandbox_escalation(call, tool, request)\n                .map_err(|reason| ToolRuntimeError::SandboxEscalationDenied {\n                    tool: call.tool.clone(),\n                    reason,\n                })?;\n            super::sandbox::install_one_shot_override(&mut params, request.requested);\n        }\n\n        let output = (tool.execute)(params);\n        self.policy.after_execute(call, tool, &output);\n        Ok(output)\n    }\n'''
          text = replace_once(text, old_execute, new_execute, 'runtime execute')
          old_named = '''    pub fn execute_named(\n        &self,\n        tool: &str,\n        params: HashMap<String, String>,\n    ) -> Result<String, ToolRuntimeError> {\n        self.execute(&ToolCall::new("legacy", tool, params))\n    }\n}\n'''
          new_named = '''    pub fn execute_named(\n        &self,\n        tool: &str,\n        mut params: HashMap<String, String>,\n    ) -> Result<String, ToolRuntimeError> {\n        let sandbox_permissions = params.remove(SANDBOX_PERMISSIONS_METADATA);\n        let justification = params.remove(JUSTIFICATION_METADATA);\n        self.execute(\n            &ToolCall::new("legacy", tool, params)\n                .with_sandbox_metadata(sandbox_permissions, justification),\n        )\n    }\n}\n\nfn sandbox_request(call: &ToolCall) -> Result<Option<SandboxApprovalRequest>, ToolRuntimeError> {\n    if call.sandbox_permissions.is_none() && call.justification.is_none() {\n        return Ok(None);\n    }\n    if !super::sandbox::tool_supports_sandbox(&call.tool) {\n        return Err(ToolRuntimeError::SandboxEscalationDenied {\n            tool: call.tool.clone(),\n            reason: "this tool does not execute through the process sandbox".to_string(),\n        });\n    }\n    let current = super::sandbox::configured_permission().map_err(|reason| {\n        ToolRuntimeError::SandboxEscalationDenied {\n            tool: call.tool.clone(),\n            reason,\n        }\n    })?;\n    SandboxApprovalRequest::from_metadata(\n        call.id.clone(),\n        call.tool.clone(),\n        current,\n        call.sandbox_permissions.as_deref(),\n        call.justification.as_deref(),\n    )\n    .map_err(|error| ToolRuntimeError::SandboxEscalationDenied {\n        tool: call.tool.clone(),\n        reason: error.to_string(),\n    })\n}\n'''
          text = replace_once(text, old_named, new_named, 'runtime execute_named')
          text = replace_once(
              text,
              '''        for parameter in &tool.parameters\n        {\n            if !params.insert(parameter.name)\n''',
              '''        for parameter in &tool.parameters\n        {\n            if matches!(\n                parameter.name,\n                SANDBOX_PERMISSIONS_METADATA | JUSTIFICATION_METADATA\n            )\n            {\n                return Err(ToolRuntimeError::ReservedParameter {\n                    tool: tool.name.to_string(),\n                    parameter: parameter.name.to_string(),\n                });\n            }\n            if !params.insert(parameter.name)\n''',
              'runtime registry reserved metadata',
          )
          test_marker = '''    #[test]\n    fn duplicate_tool_registration_is_refused() {\n'''
          test_insert = '''    #[test]\n    fn allow_all_policy_cannot_approve_sandbox_escalation() {\n        use super::super::sandbox_approval::{SandboxApprovalRequest, SandboxPermission};\n\n        let policy = AllowAllPolicy;\n        let request = SandboxApprovalRequest::new(\n            "call-1",\n            "status",\n            SandboxPermission::WorkspaceWrite,\n            SandboxPermission::DangerFullAccess,\n            "one exact status call needs an explicit wider policy",\n        )\n        .unwrap();\n        let tool = Tool {\n            name: "status",\n            description: "synthetic status",\n            parameters: Vec::new(),\n            execute: panic_tool,\n        };\n        let call = ToolCall::new("call-1", "status", HashMap::new());\n        assert!(policy\n            .approve_sandbox_escalation(&call, &tool, &request)\n            .is_err());\n    }\n\n    #[test]\n    fn reserved_metadata_cannot_be_registered_as_tool_parameter() {\n        let mut tool = synthetic_tool(ok_tool);\n        tool.parameters.push(ToolParam {\n            name: SANDBOX_PERMISSIONS_METADATA,\n            param_type: "string",\n            description: "must stay runtime metadata",\n            required: false,\n        });\n        let error = match ToolRuntime::new(vec![tool], AllowAllPolicy) {\n            Ok(_) => panic!("reserved runtime metadata must not enter a tool schema"),\n            Err(error) => error,\n        };\n        assert!(matches!(error, ToolRuntimeError::ReservedParameter { .. }));\n    }\n\n    #[test]\n    fn duplicate_tool_registration_is_refused() {\n'''
          text = replace_once(text, test_marker, test_insert, 'runtime tests')
          path.write_text(text)

          # sandbox.rs
          path = Path('scirust-sciagent/src/agentic/sandbox.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'use super::tools::Tool;\n',
              'use super::sandbox_approval::SandboxPermission;\nuse super::tools::Tool;\n',
              'sandbox import',
          )
          text = replace_once(
              text,
              'const BWRAP_RUNNER_FAILURE_SIGNATURE: &str = "bwrap: ";\n',
              'const BWRAP_RUNNER_FAILURE_SIGNATURE: &str = "bwrap: ";\nconst INTERNAL_SANDBOX_OVERRIDE: &str = "__sciagent_sandbox_override";\n',
              'sandbox internal key',
          )
          text = replace_once(
              text,
              '''    fn is_confined(self) -> bool {\n''',
              '''    fn from_permission(permission: SandboxPermission) -> Self {\n        match permission {\n            SandboxPermission::ReadOnly => Self::ReadOnly,\n            SandboxPermission::WorkspaceWrite => Self::WorkspaceWrite,\n            SandboxPermission::DangerFullAccess => Self::DangerFullAccess,\n        }\n    }\n\n    fn permission(self) -> SandboxPermission {\n        match self {\n            Self::ReadOnly => SandboxPermission::ReadOnly,\n            Self::WorkspaceWrite => SandboxPermission::WorkspaceWrite,\n            Self::DangerFullAccess => SandboxPermission::DangerFullAccess,\n        }\n    }\n\n    fn is_confined(self) -> bool {\n''',
              'sandbox conversions',
          )
          old_config = '''impl SandboxConfig {\n    fn from_env() -> Result<Self, String> {\n        let mode = SandboxMode::parse(std::env::var("SCIAGENT_SANDBOX_MODE").ok().as_deref())?;\n        let bwrap = if cfg!(target_os = "linux")\n        {\n            std::env::var_os("SCIAGENT_BWRAP")\n                .map(PathBuf::from)\n                .or_else(find_bwrap_on_path)\n        }\n        else\n        {\n            None\n        };\n        Ok(Self { mode, bwrap })\n    }\n'''
          new_config = '''impl SandboxConfig {\n    fn from_env() -> Result<Self, String> {\n        Self::from_env_with_override(None)\n    }\n\n    fn from_env_with_override(\n        requested: Option<SandboxPermission>,\n    ) -> Result<Self, String> {\n        let configured =\n            SandboxMode::parse(std::env::var("SCIAGENT_SANDBOX_MODE").ok().as_deref())?;\n        let mode = resolve_effective_mode(configured, requested)?;\n        let bwrap = if cfg!(target_os = "linux")\n        {\n            std::env::var_os("SCIAGENT_BWRAP")\n                .map(PathBuf::from)\n                .or_else(find_bwrap_on_path)\n        }\n        else\n        {\n            None\n        };\n        Ok(Self { mode, bwrap })\n    }\n'''
          text = replace_once(text, old_config, new_config, 'sandbox config')
          marker = '''pub(crate) fn install_process_sandbox(tools: &mut [Tool]) {\n'''
          helpers = '''pub(crate) fn configured_permission() -> Result<SandboxPermission, String> {\n    SandboxMode::parse(std::env::var("SCIAGENT_SANDBOX_MODE").ok().as_deref())\n        .map(SandboxMode::permission)\n}\n\npub(crate) fn tool_supports_sandbox(name: &str) -> bool {\n    matches!(name, "search" | "grep" | "build" | "test" | "status")\n}\n\npub(crate) fn install_one_shot_override(\n    params: &mut HashMap<String, String>,\n    permission: SandboxPermission,\n) {\n    params.insert(\n        INTERNAL_SANDBOX_OVERRIDE.to_string(),\n        permission.label().to_string(),\n    );\n}\n\nfn take_one_shot_override(\n    params: &mut HashMap<String, String>,\n) -> Result<Option<SandboxPermission>, String> {\n    params\n        .remove(INTERNAL_SANDBOX_OVERRIDE)\n        .map(|value| SandboxPermission::parse(&value).map_err(|error| error.to_string()))\n        .transpose()\n}\n\nfn resolve_effective_mode(\n    configured: SandboxMode,\n    requested: Option<SandboxPermission>,\n) -> Result<SandboxMode, String> {\n    let Some(requested) = requested else {\n        return Ok(configured);\n    };\n    if !configured.permission().can_escalate_to(requested) {\n        return Err(format!(\n            "Refused non-widening sandbox override from {:?} to {:?}",\n            configured.label(),\n            requested.label()\n        ));\n    }\n    Ok(SandboxMode::from_permission(requested))\n}\n\npub(crate) fn install_process_sandbox(tools: &mut [Tool]) {\n'''
          text = replace_once(text, marker, helpers, 'sandbox helpers')
          text = replace_once(
              text,
              '''fn sandboxed_search(params: HashMap<String, String>) -> String {\n    search_workspace(&params, "10")\n}\n\nfn sandboxed_grep(params: HashMap<String, String>) -> String {\n    search_workspace(&params, "15")\n}\n\nfn search_workspace(params: &HashMap<String, String>, max_count: &str) -> String {\n''',
              '''fn sandboxed_search(mut params: HashMap<String, String>) -> String {\n    let requested = match take_one_shot_override(&mut params) {\n        Ok(requested) => requested,\n        Err(error) => return error,\n    };\n    search_workspace(&params, "10", requested)\n}\n\nfn sandboxed_grep(mut params: HashMap<String, String>) -> String {\n    let requested = match take_one_shot_override(&mut params) {\n        Ok(requested) => requested,\n        Err(error) => return error,\n    };\n    search_workspace(&params, "15", requested)\n}\n\nfn search_workspace(\n    params: &HashMap<String, String>,\n    max_count: &str,\n    requested: Option<SandboxPermission>,\n) -> String {\n''',
              'sandbox search signatures',
          )
          text = text.replace('match run_sandboxed("rg", &rg_args, &root)\n', 'match run_sandboxed("rg", &rg_args, &root, requested)\n', 1)
          text = text.replace('match run_sandboxed("grep", &grep_args, &root)\n', 'match run_sandboxed("grep", &grep_args, &root, requested)\n', 1)
          text = replace_once(
              text,
              'fn sandboxed_build(params: HashMap<String, String>) -> String {\n',
              '''fn sandboxed_build(mut params: HashMap<String, String>) -> String {\n    let requested = match take_one_shot_override(&mut params) {\n        Ok(requested) => requested,\n        Err(error) => return error,\n    };\n''',
              'sandbox build signature',
          )
          text = text.replace('match run_sandboxed("cargo", &args, &root)\n', 'match run_sandboxed("cargo", &args, &root, requested)\n', 1)
          text = replace_once(
              text,
              'fn sandboxed_test(params: HashMap<String, String>) -> String {\n',
              '''fn sandboxed_test(mut params: HashMap<String, String>) -> String {\n    let requested = match take_one_shot_override(&mut params) {\n        Ok(requested) => requested,\n        Err(error) => return error,\n    };\n''',
              'sandbox test signature',
          )
          text = text.replace('match run_sandboxed("cargo", &args, &root)\n', 'match run_sandboxed("cargo", &args, &root, requested)\n', 1)
          text = replace_once(
              text,
              'fn sandboxed_status(_params: HashMap<String, String>) -> String {\n',
              '''fn sandboxed_status(mut params: HashMap<String, String>) -> String {\n    let requested = match take_one_shot_override(&mut params) {\n        Ok(requested) => requested,\n        Err(error) => return error,\n    };\n''',
              'sandbox status signature',
          )
          text = text.replace('match run_sandboxed("git", &args, &root)\n', 'match run_sandboxed("git", &args, &root, requested)\n', 1)
          text = replace_once(
              text,
              '''fn run_sandboxed(program: &str, args: &[OsString], cwd: &Path) -> Result<LimitedOutput, String> {\n    run_sandboxed_with_config(program, args, cwd, SandboxConfig::from_env()?, TOOL_TIMEOUT)\n}\n''',
              '''fn run_sandboxed(\n    program: &str,\n    args: &[OsString],\n    cwd: &Path,\n    requested: Option<SandboxPermission>,\n) -> Result<LimitedOutput, String> {\n    run_sandboxed_with_config(\n        program,\n        args,\n        cwd,\n        SandboxConfig::from_env_with_override(requested)?,\n        TOOL_TIMEOUT,\n    )\n}\n''',
              'sandbox runner signature',
          )
          test_marker = '''    #[test]\n    fn confined_modes_fail_closed_without_backend() {\n'''
          test_insert = '''    #[test]\n    fn one_shot_override_is_strictly_widening() {\n        assert_eq!(\n            resolve_effective_mode(\n                SandboxMode::ReadOnly,\n                Some(SandboxPermission::WorkspaceWrite),\n            )\n            .unwrap(),\n            SandboxMode::WorkspaceWrite\n        );\n        assert_eq!(\n            resolve_effective_mode(\n                SandboxMode::WorkspaceWrite,\n                Some(SandboxPermission::DangerFullAccess),\n            )\n            .unwrap(),\n            SandboxMode::DangerFullAccess\n        );\n        assert!(resolve_effective_mode(\n            SandboxMode::WorkspaceWrite,\n            Some(SandboxPermission::ReadOnly),\n        )\n        .is_err());\n        assert!(resolve_effective_mode(\n            SandboxMode::WorkspaceWrite,\n            Some(SandboxPermission::WorkspaceWrite),\n        )\n        .is_err());\n    }\n\n    #[test]\n    fn internal_override_round_trip_is_not_public_tool_metadata() {\n        let mut params = HashMap::new();\n        install_one_shot_override(&mut params, SandboxPermission::DangerFullAccess);\n        assert_eq!(\n            take_one_shot_override(&mut params).unwrap(),\n            Some(SandboxPermission::DangerFullAccess)\n        );\n        assert!(params.is_empty());\n    }\n\n    #[test]\n    fn confined_modes_fail_closed_without_backend() {\n'''
          text = replace_once(text, test_marker, test_insert, 'sandbox tests')
          path.write_text(text)

          # mod.rs
          path = Path('scirust-sciagent/src/agentic/mod.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'pub mod permission;\nmod sandbox;\n',
              'pub mod permission;\nmod sandbox;\npub mod sandbox_approval;\n',
              'mod module',
          )
          text = replace_once(
              text,
              'pub use tool_runtime::{AllowAllPolicy, ToolCall, ToolPolicy, ToolRuntime, ToolRuntimeError};\n',
              '''pub use sandbox_approval::{\n    NoSandboxApprovalService, SandboxApprovalError, SandboxApprovalRequest, SandboxApprovalService,\n    SandboxPermission,\n};\npub use tool_runtime::{\n    AllowAllPolicy, ToolCall, ToolPolicy, ToolRuntime, ToolRuntimeError, JUSTIFICATION_METADATA,\n    SANDBOX_PERMISSIONS_METADATA,\n};\n''',
              'mod exports',
          )
          text = replace_once(
              text,
              '        let params: HashMap<String, String> = json\n',
              '        let mut params: HashMap<String, String> = json\n',
              'mod mutable params',
          )
          marker = '''            .unwrap_or_default();\n\n        if self.runtime.has_tool(name)\n'''
          insertion = '''            .unwrap_or_default();\n\n        for key in [SANDBOX_PERMISSIONS_METADATA, JUSTIFICATION_METADATA]\n        {\n            if let Some(value) = json.get(key).and_then(|value| value.as_str())\n            {\n                if let Some(existing) = params.get(key)\n                {\n                    if existing != value\n                    {\n                        return None;\n                    }\n                }\n                params.insert(key.to_string(), value.to_string());\n            }\n        }\n\n        if self.runtime.has_tool(name)\n'''
          text = replace_once(text, marker, insertion, 'mod metadata parser')
          test_marker = '''    #[test]\n    fn test_parse_respond() {\n'''
          test_insert = '''    #[test]\n    fn test_parse_tool_call_sandbox_metadata() {\n        let router = AgentRouter::new();\n        let text = r#"{\"name\":\"build\",\"params\":{\"crate\":\"scirust-core\"},\"sandbox_permissions\":\"danger-full-access\",\"justification\":\"requires one exact wider call\"}"#;\n        let action = router.parse_action(text);\n        let AgentAction::Call { tool, params } = action else {\n            panic!("expected tool call");\n        };\n        assert_eq!(tool, "build");\n        assert_eq!(\n            params.get(SANDBOX_PERMISSIONS_METADATA).map(String::as_str),\n            Some("danger-full-access")\n        );\n        assert_eq!(\n            params.get(JUSTIFICATION_METADATA).map(String::as_str),\n            Some("requires one exact wider call")\n        );\n    }\n\n    #[test]\n    fn conflicting_sandbox_metadata_is_not_parsed_as_a_tool_call() {\n        let router = AgentRouter::new();\n        let text = r#"{\"name\":\"build\",\"params\":{\"crate\":\"scirust-core\",\"sandbox_permissions\":\"workspace-write\"},\"sandbox_permissions\":\"danger-full-access\",\"justification\":\"conflict\"}"#;\n        assert_eq!(\n            router.parse_action(text),\n            AgentAction::Respond {\n                text: text.to_string()\n            }\n        );\n    }\n\n    #[test]\n    fn test_parse_respond() {\n'''
          text = replace_once(text, test_marker, test_insert, 'mod tests')
          path.write_text(text)
          PY

          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Validate SciAgent escalation seam
        shell: bash
        run: |

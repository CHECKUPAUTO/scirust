name: SciAgent B41 checkpoint cadence

on:
  push:
    branches:
      - perf/sciagent-b39-thor-production-bench
    paths:
      - scripts/sciagent_b41_patch.py
      - .github/workflows/sciagent-b41-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/sciagent-b39-thor-production-bench
          fetch-depth: 0
      - name: Apply B41
        run: python3 scripts/sciagent_b41_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test SciAgent CPU surface
        run: cargo test -p scirust-sciagent --lib
      - name: Check CUDA pretrain and benchmark
        run: |
          cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
          cargo check -p scirust-sciagent --features cuda --example cuda_production_bench
      - name: Compile CUDA parity
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b41_patch.py .github/workflows/sciagent-b41-apply.yml
      - name: Commit validated B41
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): use time-based production checkpoint cadence"
          git push origin HEAD:perf/sciagent-b39-thor-production-bench

name: Algebra minimal lock refresh

on:
  push:
    branches:
      - feat/scirust-algebra-groups

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/scirust-algebra-groups
          fetch-depth: 0
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
      - name: Restore pre-refresh lock and minimally resolve workspace
        shell: bash
        run: |
          set -euo pipefail
          git checkout 2ff57250b55ec2bbc0d8af5fb4cd0d7d41a135d1 -- Cargo.lock
          cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Commit minimal lock update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/algebra-lock-minimal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/algebra-lock-minimal.yml
          git commit -m "chore(algebra): minimally update workspace lockfile"
          git push origin HEAD:feat/scirust-algebra-groups

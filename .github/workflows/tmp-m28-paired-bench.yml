name: tmp-m28-paired-bench

on:
  push:
    branches:
      - bench/m28-scirust-naive-vs-flat

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/m28-scirust-naive-vs-flat
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Wire benchmark into Cargo and FLAT CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('scirust-gpu/Cargo.toml')
          text = cargo.read_text()
          block = '''\n# M28 paired resident benchmark: existing SciRust multi-dispatch attention versus FLAT.\n[[example]]\nname = "flat_m28_naive_vs_fused"\nrequired-features = ["wgpu", "flat-attention"]\n'''
          if 'name = "flat_m28_naive_vs_fused"' not in text:
              marker = '\n# Test-only: build genuine Reference artefacts'
              if marker not in text:
                  raise SystemExit('Cargo.toml insertion marker not found')
              text = text.replace(marker, block + marker, 1)
              cargo.write_text(text)

          workflow = Path('.github/workflows/sciagent-flat-decode.yml')
          text = workflow.read_text()
          anchor = '''      - name: Clippy paired FLAT decode benchmark\n        run: cargo clippy -p scirust-gpu --locked --features flat-attention --example flat_decode_bench -- -D warnings\n'''
          addition = '''      - name: Clippy M28 SciRust naive vs FLAT benchmark\n        run: cargo clippy -p scirust-gpu --locked --features flat-attention --example flat_m28_naive_vs_fused -- -D warnings\n'''
          if 'Clippy M28 SciRust naive vs FLAT benchmark' not in text:
              if anchor not in text:
                  raise SystemExit('workflow clippy insertion marker not found')
              text = text.replace(anchor, anchor + addition, 1)

          tail = '''          print(f"validated {len(rows)} paired FLAT decode benchmark rows")\n          PY\n'''
          smoke = '''      - name: M28 paired resident attention benchmark smoke on lavapipe\n        env:\n          WGPU_BACKEND: vulkan\n          SCIRUST_M28_SEQ_LEN: "16"\n          SCIRUST_M28_HEAD_DIM: "32"\n          SCIRUST_M28_WARMUPS: "1"\n          SCIRUST_M28_REPEATS: "3"\n        run: |\n          cargo run --quiet --release --locked -p scirust-gpu \\\n            --features flat-attention --example flat_m28_naive_vs_fused \\\n            > /tmp/flat_m28_naive_vs_fused.csv\n          cat /tmp/flat_m28_naive_vs_fused.csv\n      - name: Validate M28 paired benchmark CSV contract\n        run: |\n          python3 - <<'PY'\n          import csv\n          import math\n\n          with open("/tmp/flat_m28_naive_vs_fused.csv", newline="", encoding="utf-8") as handle:\n              rows = list(csv.DictReader(handle))\n\n          assert len(rows) == 2, rows\n          assert {row["causal"] for row in rows} == {"false", "true"}, rows\n          for row in rows:\n              assert int(row["seq_len"]) == 16, row\n              assert int(row["head_dim"]) == 32, row\n              assert int(row["warmups"]) == 1, row\n              assert int(row["repeats"]) == 3, row\n              for key in (\n                  "naive_median_us",\n                  "naive_p95_us",\n                  "flat_fresh_median_us",\n                  "flat_fresh_p95_us",\n                  "flat_reused_median_us",\n                  "flat_reused_p95_us",\n                  "naive_over_flat_fresh",\n                  "naive_over_flat_reused",\n              ):\n                  value = float(row[key])\n                  assert math.isfinite(value) and value > 0.0, (key, row)\n              for key in ("naive_parity_max_abs", "flat_parity_max_abs"):\n                  value = float(row[key])\n                  assert math.isfinite(value) and value >= 0.0, (key, row)\n              assert row["performance_claim"] == "none", row\n          print(f"validated {len(rows)} M28 paired benchmark rows")\n          PY\n'''
          if 'M28 paired resident attention benchmark smoke on lavapipe' not in text:
              if tail not in text:
                  raise SystemExit('workflow smoke insertion marker not found')
              text = text.replace(tail, tail + smoke, 1)
          workflow.write_text(text)
          PY
          cargo fmt --all
      - name: Commit materialized benchmark wiring and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-m28-paired-bench.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/examples/flat_m28_naive_vs_fused.rs scirust-gpu/Cargo.toml .github/workflows/sciagent-flat-decode.yml .github/workflows/tmp-m28-paired-bench.yml
          git commit -m 'bench(gpu): wire paired M28 resident baseline into CI'
          git push origin HEAD:bench/m28-scirust-naive-vs-flat

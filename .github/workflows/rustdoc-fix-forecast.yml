name: Rustdoc fix scirust-forecast

on:
  push:
    branches: [codex/gate-workspace-rustdoc]
    paths:
      - .github/workflows/rustdoc-fix-forecast.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix and validate forecast rustdoc
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scirust-forecast/src/lib.rs')
          s = p.read_text()
          replacements = {
              '[`mae`](metrics::mae)': '[`mae`]',
              '[`rmse`](metrics::rmse)': '[`rmse`]',
              '[`mape`](metrics::mape)': '[`mape`]',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected rustdoc link: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          RUSTDOCFLAGS="-D warnings" cargo +stable doc -p scirust-forecast --no-deps --locked
          git rm .github/workflows/rustdoc-fix-forecast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-forecast/src/lib.rs
          git commit -m "docs(forecast): remove redundant rustdoc link targets"
          git push origin HEAD:codex/gate-workspace-rustdoc

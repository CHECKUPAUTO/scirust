name: P10.3 grouped training bridge qualification
# bootstrap push: workflow already exists on branch

on:
  push:
    branches:
      - feat/p10-3-flat-grouped-training-bridge

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P10.3 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/p10-3-flat-grouped-training-bridge
          fetch-depth: 0

      - name: Wire the bridge into scirust-gpu public API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-gpu/src/lib.rs')
          text = path.read_text()

          module_anchor = '#[cfg(feature = "flat-attention")]\nmod flat_m11;\n'
          module_insert = module_anchor + '#[cfg(feature = "flat-attention")]\nmod flat_training;\n'
          if 'mod flat_training;' not in text:
              if text.count(module_anchor) != 1:
                  raise SystemExit('expected exactly one flat_m11 module anchor')
              text = text.replace(module_anchor, module_insert, 1)

          export_anchor = '#[cfg(feature = "flat-attention")]\npub use flat_m11::{FlatM11ResidentConfig, WgpuFlatM11Bridge};\n'
          export_insert = export_anchor + '#[cfg(feature = "flat-attention")]\npub use flat_training::{\n    FlatGroupedTrainingConfig, FlatGroupedTrainingResult, WgpuFlatGroupedTrainingBridge,\n};\n'
          if 'pub use flat_training::' not in text:
              if text.count(export_anchor) != 1:
                  raise SystemExit('expected exactly one flat_m11 export anchor')
              text = text.replace(export_anchor, export_insert, 1)

          path.write_text(text)
          PY

      - name: Format with repository-pinned nightly
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          unexpected="$(git diff --name-only | grep -vE '^(scirust-gpu/src/lib.rs|scirust-gpu/src/flat_training.rs|\.github/workflows/p10-3-flat-grouped-training-qualify.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "rustfmt touched files outside P10.3 scope:"
            echo "$unexpected"
            exit 1
          fi
          cargo fmt --all -- --check

      - name: Check opt-in grouped training API
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p scirust-gpu --features flat-attention --locked

      - name: Clippy strict on scirust-gpu flat-attention
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p scirust-gpu --all-targets --features flat-attention --locked -- -D warnings

      - name: Run grouped training bridge tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p scirust-gpu --features flat-attention --locked flat_training -- --nocapture

      - name: Verify P10.3 scope and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p10-3-flat-grouped-training-qualify.yml
          changed="$(git status --short | awk '{print $2}')"
          bad="$(printf '%s\n' "$changed" | grep -vE '^(scirust-gpu/src/lib.rs|scirust-gpu/src/flat_training.rs|\.github/workflows/p10-3-flat-grouped-training-qualify.yml)$' || true)"
          if [[ -n "$bad" ]]; then
            echo "unexpected P10.3 files:"
            echo "$bad"
            exit 1
          fi

      - name: Commit final workflow-free candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-gpu/src/lib.rs scirust-gpu/src/flat_training.rs .github/workflows/p10-3-flat-grouped-training-qualify.yml
          git diff --cached --check
          git commit -m 'feat(gpu): expose resident FLAT grouped training bridge'
          git push origin HEAD:feat/p10-3-flat-grouped-training-bridge

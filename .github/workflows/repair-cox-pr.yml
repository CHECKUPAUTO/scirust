name: Repair Cox PR branch

on:
  push:
    branches:
      - fix/cox-numerical-scaling

permissions:
  contents: write

jobs:
  rebase-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/cox-numerical-scaling
          fetch-depth: 0
      - name: Rebase on current master
        run: |
          git fetch origin master
          git rebase origin/master
      - name: Install nightly rustfmt
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply repository formatting
        run: cargo +nightly fmt --all
      - name: Commit repair and update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'style(stats): apply repository rustfmt'
          fi
          git push --force-with-lease origin HEAD:fix/cox-numerical-scaling

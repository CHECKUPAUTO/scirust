name: Temporary CUDA canonical attestation v2 promoter

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: feat/cuda-runtime-canonical-attestation-v2
  SOURCE_BASE: 5bd11e6d459338aac2b5a63d18c0fdce48dd2785
  SOURCE_HEAD: cbf0f31a45a183cbe3888a40a3d6453c2ffc8d74

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Apply the four-file reviewed functional delta
        shell: bash
        run: |
          set -euo pipefail
          git diff "$SOURCE_BASE" "$SOURCE_HEAD" -- \
            scirust-gpu/src/cuda_hardware_profile.rs \
            scirust-sciagent/Cargo.toml \
            scirust-sciagent/src/cuda_decode_execution_attestation.rs \
            scirust-sciagent/src/lib.rs > /tmp/cuda-canonical-v2.patch
          test -s /tmp/cuda-canonical-v2.patch
          git apply --3way /tmp/cuda-canonical-v2.patch
          git diff --check
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Qualify host-build surfaces
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +1.89.0 check -p scirust-sciagent --locked
          cargo +1.89.0 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Commit rebuilt delta
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-cuda-canonical-v2-promote.yml
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add scirust-gpu/src/cuda_hardware_profile.rs scirust-sciagent/Cargo.toml scirust-sciagent/src/cuda_decode_execution_attestation.rs scirust-sciagent/src/lib.rs
          git commit -m 'feat(sciagent): bind CUDA attestation to acquired canonical profile'
          git push origin HEAD:${BRANCH}

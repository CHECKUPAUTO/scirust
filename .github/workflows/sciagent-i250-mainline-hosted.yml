name: SciAgent I250 mainline hosted

on:
  pull_request:
    branches: [ci/i250-mainline-base]
    paths:
      - "scirust-cuda/**"
      - "scirust-sciagent/**"
      - ".github/workflows/sciagent-i250-mainline-hosted.yml"

permissions:
  contents: write

concurrency:
  group: sciagent-i250-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: I250 validate + record rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply pinned rustfmt and exact greedy edge case
        run: |
          cargo +nightly-2026-07-02 fmt --all
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scirust-cuda/src/decode.rs")
          text = path.read_text()
          old = "float local_value = -3.402823466e+38F;"
          new = "float local_value = -__int_as_float(0x7f800000);"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit("greedy argmax local-value marker not found")
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: CUDA feature compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings
      - name: Commit only validated I250 source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scirust-cuda/src/decode.rs \
            scirust-sciagent/src/cuda_decode.rs \
            scirust-sciagent/examples/cuda_decode_bench.rs \
            scirust-sciagent/tests/cuda_decode_parity.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(i250): record validated device-feedback sources"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

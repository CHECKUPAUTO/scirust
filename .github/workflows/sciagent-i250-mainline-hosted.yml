name: SciAgent I250 mainline hosted

on:
  pull_request:
    branches: [ci/i250-mainline-base]
    paths:
      - "scirust-cuda/**"
      - "scirust-sciagent/**"
      - ".github/workflows/sciagent-i250-mainline-hosted.yml"

permissions:
  contents: read

concurrency:
  group: sciagent-i250-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: I250 format + CUDA compile + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply pinned rustfmt in ephemeral checkout
        run: cargo +nightly-2026-07-02 fmt --all
      - name: Collect formatted I250 files
        run: |
          mkdir -p /tmp/i250-formatted/scirust-cuda/src
          mkdir -p /tmp/i250-formatted/scirust-sciagent/src
          mkdir -p /tmp/i250-formatted/scirust-sciagent/examples
          mkdir -p /tmp/i250-formatted/scirust-sciagent/tests
          cp scirust-cuda/src/decode.rs /tmp/i250-formatted/scirust-cuda/src/decode.rs
          cp scirust-sciagent/src/cuda_decode.rs /tmp/i250-formatted/scirust-sciagent/src/cuda_decode.rs
          cp scirust-sciagent/examples/cuda_decode_bench.rs /tmp/i250-formatted/scirust-sciagent/examples/cuda_decode_bench.rs
          cp scirust-sciagent/tests/cuda_decode_parity.rs /tmp/i250-formatted/scirust-sciagent/tests/cuda_decode_parity.rs
      - name: Upload formatted I250 files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i250-rustfmt-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: /tmp/i250-formatted
      - name: CUDA feature compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings

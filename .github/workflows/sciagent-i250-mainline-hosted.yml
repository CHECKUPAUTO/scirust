name: SciAgent I250 mainline hosted

on:
  pull_request:
    branches: [ci/i250-mainline-base]
    paths:
      - "scirust-cuda/**"
      - "scirust-sciagent/**"
      - ".github/workflows/sciagent-i250-mainline-hosted.yml"

permissions:
  contents: write

concurrency:
  group: sciagent-i250-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: Tiled down A/B compile + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Wire tiled FFN down candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"{label} marker not found")
              return text.replace(old, new, 1)

          runtime = Path("scirust-cuda/src/decode.rs")
          text = runtime.read_text()
          text = replace_once(
              text,
              "use crate::bf16_lm_head_argmax::{CudaBf16LmHeadArgmax, CudaBf16LmHeadArgmaxWorkspace};\n",
              "use crate::bf16_lm_head_argmax::{CudaBf16LmHeadArgmax, CudaBf16LmHeadArgmaxWorkspace};\nuse crate::bf16_tiled_gemv::{CudaBf16TiledGemv, CudaBf16TiledGemvWorkspace};\n",
              "runtime import",
          )
          text = replace_once(
              text,
              "    lm_head_argmax: CudaBf16LmHeadArgmax,\n    kernels: DecodeKernels,\n",
              "    lm_head_argmax: CudaBf16LmHeadArgmax,\n    tiled_gemv: CudaBf16TiledGemv,\n    kernels: DecodeKernels,\n",
              "runtime field",
          )
          text = replace_once(
              text,
              "        let lm_head_argmax = CudaBf16LmHeadArgmax::from_context(ctx.clone(), stream.clone())?;\n",
              "        let lm_head_argmax = CudaBf16LmHeadArgmax::from_context(ctx.clone(), stream.clone())?;\n        let tiled_gemv = CudaBf16TiledGemv::from_context(ctx.clone(), stream.clone())?;\n",
              "runtime constructor",
          )
          text = replace_once(
              text,
              "            lm_head_argmax,\n            kernels,\n",
              "            lm_head_argmax,\n            tiled_gemv,\n            kernels,\n",
              "runtime initializer",
          )
          method_marker = "    #[must_use]\n    pub fn lm_head_argmax_workspace(&self, vocab: usize) -> CudaBf16LmHeadArgmaxWorkspace {\n"
          method_text = '''    #[must_use]\n    pub fn tiled_gemv_workspace(&self, k: usize, n: usize) -> CudaBf16TiledGemvWorkspace {\n        self.tiled_gemv.workspace(k, n)\n    }\n\n    pub fn tiled_gemv_into(\n        &self,\n        input: &CudaDecodeMatrix,\n        weight: &CudaDecodeMatrix,\n        workspace: &mut CudaBf16TiledGemvWorkspace,\n        output: &mut CudaDecodeMatrix,\n    ) {\n        assert_eq!(input.rows, 1, "tiled decode GEMV is batch-one only");\n        assert_eq!(weight.rows, input.cols, "tiled decode GEMV input width");\n        assert_eq!(output.rows, 1, "tiled decode GEMV output rows");\n        assert_eq!(weight.cols, output.cols, "tiled decode GEMV output width");\n        self.tiled_gemv.gemv_kn_into(\n            &input.buf,\n            &weight.buf,\n            workspace,\n            &mut output.buf,\n            input.cols,\n            output.cols,\n        );\n    }\n\n'''
          if "pub fn tiled_gemv_into(" not in text:
              if method_marker not in text:
                  raise SystemExit("runtime tiled method marker not found")
              text = text.replace(method_marker, method_text + method_marker, 1)
          runtime.write_text(text)

          model = Path("scirust-sciagent/src/cuda_decode.rs")
          text = model.read_text()
          text = replace_once(
              text,
              "    CudaBf16LmHeadArgmaxWorkspace, CudaDecodeGreedyFeedback, CudaDecodeKvCache, CudaDecodeMatrix,\n    CudaDecodeRuntime,\n",
              "    CudaBf16LmHeadArgmaxWorkspace, CudaBf16TiledGemvWorkspace, CudaDecodeGreedyFeedback,\n    CudaDecodeKvCache, CudaDecodeMatrix, CudaDecodeRuntime,\n",
              "model import",
          )
          text = replace_once(
              text,
              "    gate_up: CudaDecodeMatrix,\n    act: CudaDecodeMatrix,\n    logits: CudaDecodeMatrix,\n",
              "    gate_up: CudaDecodeMatrix,\n    act: CudaDecodeMatrix,\n    down_tiled: CudaBf16TiledGemvWorkspace,\n    logits: CudaDecodeMatrix,\n",
              "workspace field",
          )
          down_enum = '''/// FFN down-projection implementation used by batch-one decode.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum CudaDecodeDownMode {\n    /// Existing cuBLASLt down projection.\n    CublasLt,\n    /// Deterministic two-stage tiled BF16 GEMV candidate.\n    TiledGemv,\n}\n\n'''
          if "pub enum CudaDecodeDownMode" not in text:
              marker = "/// Runtime-selectable exact/deterministic decode implementation choices.\n"
              if marker not in text:
                  raise SystemExit("down enum marker not found")
              text = text.replace(marker, down_enum + marker, 1)
          text = replace_once(
              text,
              "pub struct CudaDecodeModes {\n    pub ffn: CudaDecodeFfnMode,\n    pub lm_head: CudaDecodeLmHeadMode,\n}\n",
              "pub struct CudaDecodeModes {\n    pub ffn: CudaDecodeFfnMode,\n    pub down: CudaDecodeDownMode,\n    pub lm_head: CudaDecodeLmHeadMode,\n}\n",
              "decode modes",
          )
          text = replace_once(
              text,
              "            ffn: CudaDecodeFfnMode::FusedGemv,\n            lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n",
              "            ffn: CudaDecodeFfnMode::FusedGemv,\n            down: CudaDecodeDownMode::CublasLt,\n            lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n",
              "decode modes default",
          )
          text = replace_once(
              text,
              "            gate_up: runtime.matrix(1, 2 * self.d_ff),\n            act: runtime.matrix(1, self.d_ff),\n            logits: runtime.matrix(1, self.vocab),\n",
              "            gate_up: runtime.matrix(1, 2 * self.d_ff),\n            act: runtime.matrix(1, self.d_ff),\n            down_tiled: runtime.tiled_gemv_workspace(self.d_ff, self.d_model),\n            logits: runtime.matrix(1, self.vocab),\n",
              "workspace allocation",
          )

          # Add down_mode as a separate internal parameter; leave host-sampler FFN API unchanged.
          text = text.replace(
              "        ffn_mode: CudaDecodeFfnMode,\n    ) {\n",
              "        ffn_mode: CudaDecodeFfnMode,\n        down_mode: CudaDecodeDownMode,\n    ) {\n",
          )
          text = text.replace(
              "        self.forward_embedded_hidden_resident(pos, caches, workspace, ffn_mode);\n",
              "        self.forward_embedded_hidden_resident(\n            pos,\n            caches,\n            workspace,\n            ffn_mode,\n            down_mode,\n        );\n",
          )

          text = replace_once(
              text,
              "            runtime.matmul_into(&workspace.act, &block.down, &mut workspace.tmp_d);\n            runtime.add_into(&workspace.h, &workspace.tmp_d, &mut workspace.x);\n",
              '''            match down_mode\n            {\n                CudaDecodeDownMode::CublasLt =>\n                {\n                    runtime.matmul_into(&workspace.act, &block.down, &mut workspace.tmp_d);\n                },\n                CudaDecodeDownMode::TiledGemv =>\n                {\n                    runtime.tiled_gemv_into(\n                        &workspace.act,\n                        &block.down,\n                        &mut workspace.down_tiled,\n                        &mut workspace.tmp_d,\n                    );\n                },\n            }\n            runtime.add_into(&workspace.h, &workspace.tmp_d, &mut workspace.x);\n''',
              "down dispatch",
          )

          # Existing host-sampler calls use the safe cuBLASLt down path.
          text = text.replace(
              "                CudaDecodeFfnMode::FusedGemv,\n            );\n",
              "                CudaDecodeFfnMode::FusedGemv,\n                CudaDecodeDownMode::CublasLt,\n            );\n",
          )
          # Device-feedback calls use the per-burst candidate choice.
          text = text.replace(
              "                modes.ffn,\n            );\n",
              "                modes.ffn,\n                modes.down,\n            );\n",
          )
          model.write_text(text)

          bench = Path("scirust-sciagent/examples/cuda_decode_bench.rs")
          text = bench.read_text()
          text = replace_once(
              text,
              "    CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel, CudaDecodeModes,\n",
              "    CudaDecodeDownMode, CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel,\n    CudaDecodeModes,\n",
              "benchmark import",
          )
          text = text.replace(
              "        ffn: CudaDecodeFfnMode::CublasLt,\n        lm_head:",
              "        ffn: CudaDecodeFfnMode::CublasLt,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head:",
          )
          text = text.replace(
              "        ffn: CudaDecodeFfnMode::FusedGemv,\n        lm_head:",
              "        ffn: CudaDecodeFfnMode::FusedGemv,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head:",
          )
          dense = '''    let dense_i250 = CudaDecodeModes {\n        ffn: CudaDecodeFfnMode::CublasLt,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head: CudaDecodeLmHeadMode::FullLogits,\n    };\n'''
          if "let down_candidate" not in text:
              if dense not in text:
                  raise SystemExit("benchmark dense mode marker not found")
              text = text.replace(
                  dense,
                  dense + '''    let down_candidate = CudaDecodeModes {\n        ffn: CudaDecodeFfnMode::FusedGemv,\n        down: CudaDecodeDownMode::TiledGemv,\n        lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n    };\n''',
                  1,
              )
          warm = "    let _ = fast.generate_greedy_device_feedback_with_modes(&prompt, 1, dense_i250);\n"
          if "down_candidate);" not in text[text.index("// Warm"):text.index("let (fast_tokens")]:
              text = text.replace(
                  warm,
                  warm + "    let _ = fast.generate_greedy_device_feedback_with_modes(&prompt, 1, down_candidate);\n",
                  1,
              )
          timing = '''    let (dense_tokens, dense_seconds, dense_tps) =\n        timed_generate(&fast, &prompt, max_new, dense_i250);\n'''
          if "let (down_tokens" not in text:
              if timing not in text:
                  raise SystemExit("benchmark timing marker not found")
              text = text.replace(
                  timing,
                  timing + '''    let (down_tokens, down_seconds, down_tps) =\n        timed_generate(&fast, &prompt, max_new, down_candidate);\n''',
                  1,
              )
          text = replace_once(
              text,
              "    let dense_parity = dense_tokens == oracle_tokens;\n",
              "    let dense_parity = dense_tokens == oracle_tokens;\n    let down_parity = down_tokens == oracle_tokens;\n",
              "benchmark down parity",
          )
          text = replace_once(
              text,
              "    let stack_gain = fast_tps / dense_tps.max(1e-9);\n",
              "    let stack_gain = fast_tps / dense_tps.max(1e-9);\n    let down_gain = down_tps / fast_tps.max(1e-9);\n",
              "benchmark down gain",
          )
          marker = '''    if !parity || !ffn_parity || !lm_parity || !dense_parity\n'''
          text = replace_once(
              text,
              marker,
              "    println!(\n        \"SCIAGENT_I250_DOWN baseline_tok_s={:.3} tiled_tok_s={:.3} gain={:.3} seconds={:.6} parity={}\",\n        fast_tps, down_tps, down_gain, down_seconds, down_parity\n    );\n\n    if !parity || !ffn_parity || !lm_parity || !dense_parity || !down_parity\n",
              "benchmark down report",
          )
          bench.write_text(text)

          tests = Path("scirust-sciagent/tests/cuda_decode_parity.rs")
          text = tests.read_text()
          text = replace_once(
              text,
              "    CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel, CudaDecodeModes,\n",
              "    CudaDecodeDownMode, CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel,\n    CudaDecodeModes,\n",
              "parity import",
          )
          text = text.replace(
              "                ffn: CudaDecodeFfnMode::CublasLt,\n                lm_head:",
              "                ffn: CudaDecodeFfnMode::CublasLt,\n                down: CudaDecodeDownMode::CublasLt,\n                lm_head:",
          )
          text = text.replace(
              "                ffn: CudaDecodeFfnMode::FusedGemv,\n                lm_head:",
              "                ffn: CudaDecodeFfnMode::FusedGemv,\n                down: CudaDecodeDownMode::CublasLt,\n                lm_head:",
          )
          marker = '''        assert_eq!(\n            lm_baseline, expected,\n            "full-logits LM baseline diverged for {prompt:?}"\n        );\n'''
          if "tiled down candidate diverged" not in text:
              if marker not in text:
                  raise SystemExit("parity insertion marker not found")
              text = text.replace(
                  marker,
                  marker + '''        let down_candidate = fast.generate_greedy_device_feedback_with_modes(\n            &prompt,\n            max_new,\n            CudaDecodeModes {\n                ffn: CudaDecodeFfnMode::FusedGemv,\n                down: CudaDecodeDownMode::TiledGemv,\n                lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n            },\n        );\n        assert_eq!(\n            down_candidate, expected,\n            "tiled down candidate diverged for {prompt:?}"\n        );\n''',
                  1,
              )
          tests.write_text(text)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: CUDA SCIAGENT compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings
      - name: Commit validated down-candidate sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scirust-cuda/src/decode.rs \
            scirust-sciagent/src/cuda_decode.rs \
            scirust-sciagent/examples/cuda_decode_bench.rs \
            scirust-sciagent/tests/cuda_decode_parity.rs
          if ! git diff --cached --quiet; then
            git commit -m "bench(sciagent): add deterministic tiled down-projection candidate"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

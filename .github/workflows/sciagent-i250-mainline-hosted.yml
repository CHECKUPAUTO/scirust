name: SciAgent I250 mainline hosted

on:
  pull_request:
    branches: [ci/i250-mainline-base]
    paths:
      - "scirust-cuda/**"
      - "scirust-sciagent/**"
      - ".github/workflows/sciagent-i250-mainline-hosted.yml"

permissions:
  contents: write

concurrency:
  group: sciagent-i250-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: Integrate FFN GEMV + validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Wire fused gate-up GEMV into I250 only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          decode = Path("scirust-cuda/src/decode.rs")
          text = decode.read_text()
          import_marker = "use half::bf16;\n"
          import_insert = "use half::bf16;\n\nuse crate::bf16_gemv::CudaBf16Gemv;\n"
          if "use crate::bf16_gemv::CudaBf16Gemv;" not in text:
              if import_marker not in text:
                  raise SystemExit("decode import marker not found")
              text = text.replace(import_marker, import_insert, 1)

          field_marker = "    blas: CudaBlasLT,\n    kernels: DecodeKernels,\n"
          field_insert = "    blas: CudaBlasLT,\n    gemv: CudaBf16Gemv,\n    kernels: DecodeKernels,\n"
          if "    gemv: CudaBf16Gemv," not in text:
              if field_marker not in text:
                  raise SystemExit("decode runtime field marker not found")
              text = text.replace(field_marker, field_insert, 1)

          ctor_marker = "        let blas = CudaBlasLT::new(stream.clone()).ok()?;\n"
          ctor_insert = (
              "        let blas = CudaBlasLT::new(stream.clone()).ok()?;\n"
              "        let gemv = CudaBf16Gemv::from_context(ctx.clone(), stream.clone())?;\n"
          )
          if "let gemv = CudaBf16Gemv::from_context" not in text:
              if ctor_marker not in text:
                  raise SystemExit("decode constructor marker not found")
              text = text.replace(ctor_marker, ctor_insert, 1)

          init_marker = "            blas,\n            kernels,\n"
          init_insert = "            blas,\n            gemv,\n            kernels,\n"
          if "            gemv,\n            kernels," not in text:
              if init_marker not in text:
                  raise SystemExit("decode runtime init marker not found")
              text = text.replace(init_marker, init_insert, 1)

          method_marker = "    pub fn swiglu_split_into(&self, gate_up: &CudaDecodeMatrix, out: &mut CudaDecodeMatrix) {\n"
          method = '''    /// Fused batch-one gate/up projection + SwiGLU using the decode-native GEMV kernel.\n    pub fn swiglu_gemv_into(\n        &self,\n        input: &CudaDecodeMatrix,\n        gate_up_weight: &CudaDecodeMatrix,\n        out: &mut CudaDecodeMatrix,\n    ) {\n        assert_eq!(input.rows, 1, "decode fused SwiGLU is batch-one only");\n        assert_eq!(gate_up_weight.rows, input.cols, "decode fused SwiGLU input width");\n        assert_eq!(gate_up_weight.cols, out.cols * 2, "decode fused SwiGLU weight width");\n        assert_eq!(out.rows, 1, "decode fused SwiGLU output rows");\n        self.gemv.swiglu_kn_into(\n            &input.buf,\n            &gate_up_weight.buf,\n            &mut out.buf,\n            input.cols,\n            out.cols,\n        );\n    }\n\n'''
          if "pub fn swiglu_gemv_into(" not in text:
              if method_marker not in text:
                  raise SystemExit("decode SwiGLU method marker not found")
              text = text.replace(method_marker, method + method_marker, 1)
          decode.write_text(text)

          model = Path("scirust-sciagent/src/cuda_decode.rs")
          text = model.read_text()
          workspace_field = "    gate_up: CudaDecodeMatrix,\n"
          if workspace_field in text:
              text = text.replace(workspace_field, "", 1)
          workspace_alloc = "            gate_up: runtime.matrix(1, 2 * self.d_ff),\n"
          if workspace_alloc in text:
              text = text.replace(workspace_alloc, "", 1)
          old = '''            runtime.matmul_into(&workspace.norm, &block.gate_up, &mut workspace.gate_up);\n            runtime.swiglu_split_into(&workspace.gate_up, &mut workspace.act);\n'''
          new = '''            runtime.swiglu_gemv_into(&workspace.norm, &block.gate_up, &mut workspace.act);\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("SCIAGENT FFN marker not found")
              text = text.replace(old, new, 1)
          model.write_text(text)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: CUDA SCIAGENT compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings
      - name: Commit validated FFN integration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-cuda/src/decode.rs scirust-sciagent/src/cuda_decode.rs
          if ! git diff --cached --quiet; then
            git commit -m "perf(sciagent): fuse batch-one gate-up GEMV with SwiGLU"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

name: SciAgent I250 mainline hosted

on:
  pull_request:
    branches: [ci/i250-mainline-base]
    paths:
      - "scirust-cuda/**"
      - "scirust-sciagent/**"
      - ".github/workflows/sciagent-i250-mainline-hosted.yml"

permissions:
  contents: write

concurrency:
  group: sciagent-i250-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: Tiled down A/B compile + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Wire deterministic tiled GEMV into FFN down as opt-in mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("scirust-cuda/src/decode.rs")
          text = runtime.read_text()
          import_marker = "use crate::bf16_lm_head_argmax::{CudaBf16LmHeadArgmax, CudaBf16LmHeadArgmaxWorkspace};\n"
          import_insert = (
              import_marker
              + "use crate::bf16_tiled_gemv::{CudaBf16TiledGemv, CudaBf16TiledGemvWorkspace};\n"
          )
          if "CudaBf16TiledGemvWorkspace" not in text:
              if import_marker not in text:
                  raise SystemExit("tiled runtime import marker not found")
              text = text.replace(import_marker, import_insert, 1)

          field_marker = "    lm_head_argmax: CudaBf16LmHeadArgmax,\n    kernels: DecodeKernels,\n"
          field_insert = "    lm_head_argmax: CudaBf16LmHeadArgmax,\n    tiled_gemv: CudaBf16TiledGemv,\n    kernels: DecodeKernels,\n"
          if "    tiled_gemv: CudaBf16TiledGemv," not in text:
              if field_marker not in text:
                  raise SystemExit("tiled runtime field marker not found")
              text = text.replace(field_marker, field_insert, 1)

          ctor_marker = '''        let lm_head_argmax = CudaBf16LmHeadArgmax::from_context(\n            ctx.clone(),\n            stream.clone(),\n        )?;\n'''
          ctor_insert = ctor_marker + "        let tiled_gemv = CudaBf16TiledGemv::from_context(ctx.clone(), stream.clone())?;\n"
          if "let tiled_gemv = CudaBf16TiledGemv::from_context" not in text:
              if ctor_marker not in text:
                  raise SystemExit("tiled runtime constructor marker not found")
              text = text.replace(ctor_marker, ctor_insert, 1)

          init_marker = "            lm_head_argmax,\n            kernels,\n"
          init_insert = "            lm_head_argmax,\n            tiled_gemv,\n            kernels,\n"
          if "            tiled_gemv,\n            kernels," not in text:
              if init_marker not in text:
                  raise SystemExit("tiled runtime init marker not found")
              text = text.replace(init_marker, init_insert, 1)

          method_marker = "    #[must_use]\n    pub fn lm_head_argmax_workspace(&self, vocab: usize) -> CudaBf16LmHeadArgmaxWorkspace {\n"
          methods = '''    #[must_use]\n    pub fn tiled_gemv_workspace(&self, k: usize, n: usize) -> CudaBf16TiledGemvWorkspace {\n        self.tiled_gemv.workspace(k, n)\n    }\n\n    pub fn tiled_gemv_into(\n        &self,\n        input: &CudaDecodeMatrix,\n        weight: &CudaDecodeMatrix,\n        workspace: &mut CudaBf16TiledGemvWorkspace,\n        output: &mut CudaDecodeMatrix,\n    ) {\n        assert_eq!(input.rows, 1, "tiled decode GEMV is batch-one only");\n        assert_eq!(weight.rows, input.cols, "tiled decode GEMV input width");\n        assert_eq!(output.rows, 1, "tiled decode GEMV output rows");\n        assert_eq!(weight.cols, output.cols, "tiled decode GEMV output width");\n        self.tiled_gemv.gemv_kn_into(\n            &input.buf,\n            &weight.buf,\n            workspace,\n            &mut output.buf,\n            input.cols,\n            output.cols,\n        );\n    }\n\n'''
          if "pub fn tiled_gemv_into(" not in text:
              if method_marker not in text:
                  raise SystemExit("tiled runtime method marker not found")
              text = text.replace(method_marker, methods + method_marker, 1)
          runtime.write_text(text)

          model = Path("scirust-sciagent/src/cuda_decode.rs")
          text = model.read_text()
          text = text.replace(
              "    CudaBf16LmHeadArgmaxWorkspace, CudaDecodeGreedyFeedback, CudaDecodeKvCache, CudaDecodeMatrix,\n    CudaDecodeRuntime,\n",
              "    CudaBf16LmHeadArgmaxWorkspace, CudaBf16TiledGemvWorkspace, CudaDecodeGreedyFeedback,\n    CudaDecodeKvCache, CudaDecodeMatrix, CudaDecodeRuntime,\n",
              1,
          )

          enum_marker = "/// Runtime-selectable exact/deterministic decode implementation choices.\n"
          down_enum = '''/// FFN down-projection implementation used by batch-one decode.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum CudaDecodeDownMode {\n    /// Existing cuBLASLt down projection.\n    CublasLt,\n    /// Deterministic two-stage tiled BF16 GEMV candidate.\n    TiledGemv,\n}\n\n'''
          if "pub enum CudaDecodeDownMode" not in text:
              if enum_marker not in text:
                  raise SystemExit("down mode insertion marker not found")
              text = text.replace(enum_marker, down_enum + enum_marker, 1)

          modes_old = '''pub struct CudaDecodeModes {\n    pub ffn: CudaDecodeFfnMode,\n    pub lm_head: CudaDecodeLmHeadMode,\n}\n'''
          modes_new = '''pub struct CudaDecodeModes {\n    pub ffn: CudaDecodeFfnMode,\n    pub down: CudaDecodeDownMode,\n    pub lm_head: CudaDecodeLmHeadMode,\n}\n'''
          if modes_new not in text:
              if modes_old not in text:
                  raise SystemExit("decode modes struct marker not found")
              text = text.replace(modes_old, modes_new, 1)
          default_old = '''            ffn: CudaDecodeFfnMode::FusedGemv,\n            lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n'''
          default_new = '''            ffn: CudaDecodeFfnMode::FusedGemv,\n            down: CudaDecodeDownMode::CublasLt,\n            lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n'''
          if default_new not in text:
              if default_old not in text:
                  raise SystemExit("decode modes default marker not found")
              text = text.replace(default_old, default_new, 1)

          workspace_marker = "    gate_up: CudaDecodeMatrix,\n    act: CudaDecodeMatrix,\n"
          workspace_insert = "    gate_up: CudaDecodeMatrix,\n    act: CudaDecodeMatrix,\n    down_tiled: CudaBf16TiledGemvWorkspace,\n"
          if "    down_tiled: CudaBf16TiledGemvWorkspace," not in text:
              if workspace_marker not in text:
                  raise SystemExit("down workspace field marker not found")
              text = text.replace(workspace_marker, workspace_insert, 1)

          alloc_marker = "            act: runtime.matrix(1, self.d_ff),\n            logits: runtime.matrix(1, self.vocab),\n"
          alloc_insert = "            act: runtime.matrix(1, self.d_ff),\n            down_tiled: runtime.tiled_gemv_workspace(self.d_ff, self.d_model),\n            logits: runtime.matrix(1, self.vocab),\n"
          if "down_tiled: runtime.tiled_gemv_workspace" not in text:
              if alloc_marker not in text:
                  raise SystemExit("down workspace allocation marker not found")
              text = text.replace(alloc_marker, alloc_insert, 1)

          text = text.replace(
              "        ffn_mode: CudaDecodeFfnMode,\n",
              "        modes: CudaDecodeModes,\n",
          )
          text = text.replace("            match ffn_mode\n", "            match modes.ffn\n", 1)
          text = text.replace(
              "        self.forward_embedded_hidden_resident(pos, caches, workspace, ffn_mode);\n",
              "        self.forward_embedded_hidden_resident(pos, caches, workspace, modes);\n",
          )
          text = text.replace(
              "                CudaDecodeFfnMode::FusedGemv,\n",
              "                CudaDecodeModes::default(),\n",
          )
          text = text.replace(
              "                modes.ffn,\n",
              "                modes,\n",
          )

          down_old = '''            runtime.matmul_into(&workspace.act, &block.down, &mut workspace.tmp_d);\n            runtime.add_into(&workspace.h, &workspace.tmp_d, &mut workspace.x);\n'''
          down_new = '''            match modes.down\n            {\n                CudaDecodeDownMode::CublasLt =>\n                {\n                    runtime.matmul_into(&workspace.act, &block.down, &mut workspace.tmp_d);\n                },\n                CudaDecodeDownMode::TiledGemv =>\n                {\n                    runtime.tiled_gemv_into(\n                        &workspace.act,\n                        &block.down,\n                        &mut workspace.down_tiled,\n                        &mut workspace.tmp_d,\n                    );\n                },\n            }\n            runtime.add_into(&workspace.h, &workspace.tmp_d, &mut workspace.x);\n'''
          if "match modes.down" not in text:
              if down_old not in text:
                  raise SystemExit("down projection dispatch marker not found")
              text = text.replace(down_old, down_new, 1)
          model.write_text(text)

          bench = Path("scirust-sciagent/examples/cuda_decode_bench.rs")
          text = bench.read_text()
          text = text.replace(
              "    CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel, CudaDecodeModes,\n",
              "    CudaDecodeDownMode, CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel,\n    CudaDecodeModes,\n",
              1,
          )
          text = text.replace(
              "        ffn: CudaDecodeFfnMode::CublasLt,\n        lm_head:",
              "        ffn: CudaDecodeFfnMode::CublasLt,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head:",
          )
          text = text.replace(
              "        ffn: CudaDecodeFfnMode::FusedGemv,\n        lm_head:",
              "        ffn: CudaDecodeFfnMode::FusedGemv,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head:",
          )
          dense_marker = '''    let dense_i250 = CudaDecodeModes {\n        ffn: CudaDecodeFfnMode::CublasLt,\n        down: CudaDecodeDownMode::CublasLt,\n        lm_head: CudaDecodeLmHeadMode::FullLogits,\n    };\n'''
          down_candidate = dense_marker + '''    let down_candidate = CudaDecodeModes {\n        ffn: CudaDecodeFfnMode::FusedGemv,\n        down: CudaDecodeDownMode::TiledGemv,\n        lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n    };\n'''
          if "let down_candidate" not in text:
              if dense_marker not in text:
                  raise SystemExit("benchmark down candidate insertion marker not found")
              text = text.replace(dense_marker, down_candidate, 1)
          warm_marker = "    let _ = fast.generate_greedy_device_feedback_with_modes(&prompt, 1, dense_i250);\n"
          if "down_candidate);" not in text[text.index("// Warm"):text.index("let (fast_tokens")]:
              text = text.replace(
                  warm_marker,
                  warm_marker
                  + "    let _ = fast.generate_greedy_device_feedback_with_modes(&prompt, 1, down_candidate);\n",
                  1,
              )
          timed_marker = '''    let (dense_tokens, dense_seconds, dense_tps) =\n        timed_generate(&fast, &prompt, max_new, dense_i250);\n'''
          timed_insert = timed_marker + '''    let (down_tokens, down_seconds, down_tps) =\n        timed_generate(&fast, &prompt, max_new, down_candidate);\n'''
          if "let (down_tokens" not in text:
              if timed_marker not in text:
                  raise SystemExit("benchmark down timing marker not found")
              text = text.replace(timed_marker, timed_insert, 1)
          parity_marker = "    let dense_parity = dense_tokens == oracle_tokens;\n"
          text = text.replace(
              parity_marker,
              parity_marker + "    let down_parity = down_tokens == oracle_tokens;\n",
              1,
          )
          gain_marker = "    let stack_gain = fast_tps / dense_tps.max(1e-9);\n"
          text = text.replace(
              gain_marker,
              gain_marker + "    let down_gain = down_tps / fast_tps.max(1e-9);\n",
              1,
          )
          old_print_piece = "dense_i250=cublaslt+full_logits dense_seconds={:.6} dense_tok_s={:.3} stack_gain={:.3} b49_seconds="
          new_print_piece = "dense_i250=cublaslt+full_logits dense_seconds={:.6} dense_tok_s={:.3} stack_gain={:.3} down_candidate=tiled_gemv down_seconds={:.6} down_tok_s={:.3} down_gain={:.3} b49_seconds="
          if old_print_piece not in text:
              raise SystemExit("benchmark print down marker not found")
          text = text.replace(old_print_piece, new_print_piece, 1)
          args_marker = '''        dense_seconds,\n        dense_tps,\n        stack_gain,\n        oracle_seconds,\n'''
          args_insert = '''        dense_seconds,\n        dense_tps,\n        stack_gain,\n        down_seconds,\n        down_tps,\n        down_gain,\n        oracle_seconds,\n'''
          if args_marker not in text:
              raise SystemExit("benchmark print args marker not found")
          text = text.replace(args_marker, args_insert, 1)
          text = text.replace(
              "dense_parity={}\"",
              "dense_parity={} down_parity={}\"",
              1,
          )
          text = text.replace(
              "        dense_parity,\n    );\n",
              "        dense_parity,\n        down_parity,\n    );\n",
              1,
          )
          text = text.replace(
              "    if !parity || !ffn_parity || !lm_parity || !dense_parity\n",
              "    if !parity || !ffn_parity || !lm_parity || !dense_parity || !down_parity\n",
              1,
          )
          bench.write_text(text)

          tests = Path("scirust-sciagent/tests/cuda_decode_parity.rs")
          text = tests.read_text()
          text = text.replace(
              "    CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel, CudaDecodeModes,\n",
              "    CudaDecodeDownMode, CudaDecodeFfnMode, CudaDecodeLmHeadMode, CudaDecodeModel,\n    CudaDecodeModes,\n",
              1,
          )
          text = text.replace(
              "                ffn: CudaDecodeFfnMode::CublasLt,\n                lm_head:",
              "                ffn: CudaDecodeFfnMode::CublasLt,\n                down: CudaDecodeDownMode::CublasLt,\n                lm_head:",
          )
          text = text.replace(
              "                ffn: CudaDecodeFfnMode::FusedGemv,\n                lm_head:",
              "                ffn: CudaDecodeFfnMode::FusedGemv,\n                down: CudaDecodeDownMode::CublasLt,\n                lm_head:",
          )
          marker = '''        assert_eq!(lm_baseline, expected, "full-logits LM baseline diverged for {prompt:?}");\n'''
          insert = marker + '''        let down_candidate = fast.generate_greedy_device_feedback_with_modes(\n            &prompt,\n            max_new,\n            CudaDecodeModes {\n                ffn: CudaDecodeFfnMode::FusedGemv,\n                down: CudaDecodeDownMode::TiledGemv,\n                lm_head: CudaDecodeLmHeadMode::FusedArgmax,\n            },\n        );\n        assert_eq!(down_candidate, expected, "tiled down candidate diverged for {prompt:?}");\n'''
          if "tiled down candidate diverged" not in text:
              if marker not in text:
                  raise SystemExit("parity down candidate marker not found")
              text = text.replace(marker, insert, 1)
          tests.write_text(text)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: CUDA SCIAGENT compile
        run: cargo +nightly-2026-07-02 check -p scirust-sciagent --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-sciagent --features cuda --all-targets --locked -- -D warnings
      - name: Commit validated down-candidate sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scirust-cuda/src/decode.rs \
            scirust-sciagent/src/cuda_decode.rs \
            scirust-sciagent/examples/cuda_decode_bench.rs \
            scirust-sciagent/tests/cuda_decode_parity.rs
          if ! git diff --cached --quiet; then
            git commit -m "bench(sciagent): add deterministic tiled down-projection candidate"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

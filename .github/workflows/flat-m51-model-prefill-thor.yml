name: FLAT M51 model prefill route ablation

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "scirust-sciagent/src/gpu.rs"
      - "scirust-sciagent/tests/flat_runtime_decode.rs"
      - "scirust-sciagent/examples/flat_m51_prefill_routes.rs"
      - "scirust-sciagent/Cargo.toml"
      - "docs/FLAT_M51_MODEL_PREFILL_ROUTES.md"
      - ".github/workflows/flat-m51-model-prefill-thor.yml"

permissions:
  contents: read

concurrency:
  group: flat-m51-model-prefill-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-prefill-thor:
    name: Model prefill routes on physical Thor
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings"
      SCIRUST_THOR_GPU_LOCK: /dev/nvidia0
      SCIRUST_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SCIAGENT_FLAT_M51_WARMUPS: "2"
      SCIAGENT_FLAT_M51_REPEATS: "7"
      SCIRUST_THOR_IDLE_SETTLE_SECONDS: "300"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require persistent physical Thor runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            tarek-scirust-arm64-01|tarek-scirust-arm64-02|tarek-scirust-arm64-03|tarek-scirust-arm64-04) ;;
            *)
              echo "::error::M51 requires one of the persistent tarek-scirust-arm64-01..04 runners; refusing $RUNNER_NAME"
              exit 1
              ;;
          esac

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "source_revision=$actual"
          test "$actual" = "$SCIRUST_SOURCE_REVISION"

      - name: Prepare isolated build directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-tmp.XXXXXX")"
          chmod 700 "$tmpdir"
          mkdir -p "$tmpdir/cargo-home" "$tmpdir/rustup-home" "$tmpdir/target"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt

      - name: Format and build exact M51 benchmark
        shell: bash
        run: |
          set -euo pipefail
          rustup run nightly-2026-07-02 rustfmt --check --edition 2021 \
            scirust-sciagent/src/gpu.rs \
            scirust-sciagent/tests/flat_runtime_decode.rs \
            scirust-sciagent/examples/flat_m51_prefill_routes.rs
          rustup run nightly-2026-07-02 cargo build --release --locked \
            -p scirust-sciagent --features flat-attention \
            --example flat_m51_prefill_routes
          benchmark="$CARGO_TARGET_DIR/release/examples/flat_m51_prefill_routes"
          test -x "$benchmark"
          echo "FLAT_M51_BENCHMARK=$benchmark" >> "$GITHUB_ENV"

      - name: Exclusive physical Thor model prefill ablation
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          for prerequisite in flock pgrep stat nvidia-smi vulkaninfo; do
            command -v "$prerequisite" >/dev/null || {
              echo "::error::required physical-Thor prerequisite is missing: $prerequisite"
              exit 1
            }
          done

          training_processes() { pgrep -af '[c]uda_pretrain' || true; }
          compute_processes() {
            nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null
          }
          if [[ ! -c "$SCIRUST_THOR_GPU_LOCK" || ! -r "$SCIRUST_THOR_GPU_LOCK" || ! -w "$SCIRUST_THOR_GPU_LOCK" ]]; then
            echo "::error::physical Thor lock target is not an accessible NVIDIA character device"
            exit 1
          fi
          stat -Lc 'gpu_lock_target=%n st_dev=%d inode=%i rdev_hex=%t:%T mode=%a owner=%U:%G type=%F' "$SCIRUST_THOR_GPU_LOCK"
          exec 9<>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          echo "gpu_lock_acquired=true runner=$RUNNER_NAME"
          if flock -n "$SCIRUST_THOR_GPU_LOCK" -c 'true'; then
            echo "::error::physical GPU lock does not contend across independent file descriptions"
            exit 1
          fi

          gpu_inventory="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader)"
          printf '%s\n' "$gpu_inventory"
          grep -F "NVIDIA Thor" <<< "$gpu_inventory" >/dev/null
          vulkan_summary="$(vulkaninfo --summary 2>&1)"
          grep -F "NVIDIA Tegra NVIDIA Thor" <<< "$vulkan_summary" >/dev/null

          deadline=$((SECONDS + 18000))
          settled=0
          settle_step=5
          while (( settled < 10#$SCIRUST_THOR_IDLE_SETTLE_SECONDS )); do
            training="$(training_processes)"
            active="$(compute_processes)"
            if [[ -n "${training//[[:space:]]/}" ]]; then
              echo "SciAgent cuda_pretrain is active; M51 remains blocked."
              settled=0
            elif [[ -n "${active//[[:space:]]/}" ]]; then
              echo "GPU activity prevents M51 qualification; restarting idle window:"
              printf '%s\n' "$active"
              settled=0
            else
              settled=$((settled + settle_step))
              if (( settled == settle_step || settled % 60 == 0 )); then
                echo "Thor continuously idle: ${settled}/${SCIRUST_THOR_IDLE_SETTLE_SECONDS}s"
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Thor never reached the required continuous idle window"
              exit 1
            fi
            sleep "$settle_step"
          done

          echo "source_revision=$(git rev-parse HEAD)"
          echo "benchmark_scope=model_prefill_same_instance_weights_and_wgpu_context"
          output="$RUNNER_TEMP/flat-m51-model-prefill.csv"
          "$FLAT_M51_BENCHMARK" > "$output" 2>&1 &
          benchmark_pid=$!
          contamination="$RUNNER_TEMP/flat-m51-contamination.txt"
          : > "$contamination"
          while kill -0 "$benchmark_pid" 2>/dev/null; do
            training="$(training_processes)"
            active="$(compute_processes)"
            foreign="$(awk -F, -v own="$benchmark_pid" '$1 + 0 != own { print }' <<< "$active")"
            if [[ -n "${training//[[:space:]]/}" || -n "${foreign//[[:space:]]/}" ]]; then
              { date -u +'%Y-%m-%dT%H:%M:%SZ'; printf '%s\n%s\n' "$training" "$foreign"; } >> "$contamination"
              kill "$benchmark_pid" 2>/dev/null || true
              break
            fi
            sleep 1
          done
          set +e
          wait "$benchmark_pid"
          benchmark_status=$?
          set -e
          cat "$output"
          if [[ -s "$contamination" ]]; then
            echo "::error::foreign GPU activity appeared during M51 timing; evidence is invalid"
            cat "$contamination"
            exit 1
          fi
          test "$benchmark_status" -eq 0
          post_active="$(compute_processes)"
          if [[ -n "${post_active//[[:space:]]/}" ]]; then
            echo "::error::GPU compute activity is present after M51 timing"
            printf '%s\n' "$post_active"
            exit 1
          fi
          grep -F 'NVIDIA Tegra NVIDIA Thor' "$output" >/dev/null
          grep -F ',none' "$output" >/dev/null
          echo "performance_claim=none"

name: Temporary Landlock portability fix

on:
  push:
    branches: [feat/sciagent-landlock-sandbox]
    paths:
      - ".github/workflows/tmp-landlock-portability-fix.yml"

permissions:
  contents: write

jobs:
  patch-format-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Gate Linux-only Landlock execution machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-sciagent/src/agentic/landlock.rs')
          text = path.read_text()

          replacements = [
              ('use command_group::{CommandGroup, GroupChild};', '#[cfg(target_os = "linux")]\nuse command_group::{CommandGroup, GroupChild};'),
              ('use std::io::Read;', '#[cfg(target_os = "linux")]\nuse std::io::Read;'),
              ('use std::process::{Command, ExitStatus, Stdio};', '#[cfg(target_os = "linux")]\nuse std::process::{Command, ExitStatus, Stdio};'),
              ('use std::sync::{Arc, Mutex};', '#[cfg(target_os = "linux")]\nuse std::sync::{Arc, Mutex};'),
              ('use std::time::{Duration, Instant};', 'use std::time::Duration;\n#[cfg(target_os = "linux")]\nuse std::time::Instant;'),
              ('const MAX_TOOL_OUTPUT_BYTES: usize = 64 * 1024;', '#[cfg(target_os = "linux")]\nconst MAX_TOOL_OUTPUT_BYTES: usize = 64 * 1024;'),
              ('const REAP_GRACE: Duration = Duration::from_secs(2);', '#[cfg(target_os = "linux")]\nconst REAP_GRACE: Duration = Duration::from_secs(2);'),
              ('const PROCESS_POLL_INTERVAL: Duration = Duration::from_millis(10);', '#[cfg(target_os = "linux")]\nconst PROCESS_POLL_INTERVAL: Duration = Duration::from_millis(10);'),
              ('const SECRET_ENV_VARS: &[&str] = &[', '#[cfg(target_os = "linux")]\nconst SECRET_ENV_VARS: &[&str] = &['),
              ('struct PipeDrain {', '#[cfg(target_os = "linux")]\nstruct PipeDrain {'),
              ('impl PipeDrain {', '#[cfg(target_os = "linux")]\nimpl PipeDrain {'),
              ("fn drain_pipe<R: Read + Send + 'static>(mut pipe: R) -> PipeDrain {", "#[cfg(target_os = \"linux\")]\nfn drain_pipe<R: Read + Send + 'static>(mut pipe: R) -> PipeDrain {"),
              ('fn spawn_process_group(command: &mut Command) -> std::io::Result<GroupChild> {', '#[cfg(target_os = "linux")]\nfn spawn_process_group(command: &mut Command) -> std::io::Result<GroupChild> {'),
              ('fn defer_group_cleanup(child: GroupChild, stdout: PipeDrain, stderr: PipeDrain) {', '#[cfg(target_os = "linux")]\nfn defer_group_cleanup(child: GroupChild, stdout: PipeDrain, stderr: PipeDrain) {'),
              ('fn terminate_and_reap(\n', '#[cfg(target_os = "linux")]\nfn terminate_and_reap(\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          # Avoid probing Landlock at all when the mode is direct or bwrap is executable.
          old = '''fn should_use_landlock_fallback() -> bool {\n    let Ok(mode) = SandboxMode::from_env()\n    else\n    {\n        return false;\n    };\n    fallback_policy(mode, bubblewrap_is_executable(), landlock_abi())\n}'''
          new = '''fn should_use_landlock_fallback() -> bool {\n    let Ok(mode) = SandboxMode::from_env()\n    else\n    {\n        return false;\n    };\n    if !mode.confined() || !cfg!(target_os = "linux") || bubblewrap_is_executable()\n    {\n        return false;\n    }\n    landlock_abi().is_some_and(|abi| abi >= MIN_LANDLOCK_ABI)\n}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected should_use_landlock_fallback body once, found {count}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rustup run nightly-2026-07-02 cargo fmt --all
          git diff --check
      - name: Commit source fix and remove helper
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-sciagent/src/agentic/landlock.rs
          git rm .github/workflows/tmp-landlock-portability-fix.yml
          git diff --cached --check
          git commit -m "fix(sciagent): gate Landlock execution internals to Linux"
          git push origin "HEAD:${HEAD_REF}"

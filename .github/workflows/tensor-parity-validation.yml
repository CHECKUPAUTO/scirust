name: Tensor Parity Validation

on:
  push:
    branches: [master]
    paths:
      - scirust-core/src/**
      - scirust-core/tests/parity_differential.rs
      - scirust-core/tests/production_parity_*.rs
      - tensor-operators.toml
      - tests/parity/fixtures/**
      - artifacts/tensor-coverage.csv
      - artifacts/tensor-coverage.json
      - docs/tensor-parity/**
      - tools/tensor-parity/**
      - .github/workflows/tensor-parity-validation.yml
  pull_request:
    branches: [master]
    paths:
      - scirust-core/src/**
      - scirust-core/tests/parity_differential.rs
      - scirust-core/tests/production_parity_*.rs
      - tensor-operators.toml
      - tests/parity/fixtures/**
      - artifacts/tensor-coverage.csv
      - artifacts/tensor-coverage.json
      - docs/tensor-parity/**
      - tools/tensor-parity/**
      - .github/workflows/tensor-parity-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.89.0 --profile minimal
      - name: Check formatting
        run: cargo +nightly-2026-07-02 fmt --all -- --check
      - name: Run strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-core --all-targets --locked -- -D warnings
      - name: Check MSRV
        run: cargo +1.89.0 check -p scirust-core --all-targets --locked
      - name: Check fixture generator provenance invariants
        run: python3 tools/tensor-parity/check_generator_provenance.py
      - name: Verify fixture manifest checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          fixture_root = Path('tests/parity/fixtures')
          manifest = json.loads((fixture_root / 'manifest.json').read_text())

          expected_commit = 'cf30153c4c131c8164ee7798e5022d810682e2cb'
          version = manifest.get('pytorch', {}).get('version', '')
          commit = manifest.get('pytorch', {}).get('source_commit')

          provenance_errors = []
          if not version.startswith('2.13.0'):
              provenance_errors.append(
                  f'manifest PyTorch version is not 2.13.0: {version!r}'
              )
          if commit != expected_commit:
              provenance_errors.append(
                  f'manifest source commit mismatch: expected={expected_commit} actual={commit}'
              )

          listed = set(manifest['files'])
          actual_files = {
              str(path.relative_to(fixture_root))
              for path in fixture_root.glob('*/*.json')
              if path.name != 'manifest.json'
          }

          missing = sorted(listed - actual_files)
          unlisted = sorted(actual_files - listed)
          mismatched = []

          for relative, expected in sorted(manifest['files'].items()):
              path = fixture_root / relative
              if not path.is_file():
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  mismatched.append((relative, expected, actual))

          if provenance_errors or missing or unlisted or mismatched:
              for error in provenance_errors:
                  print(error)
              for relative in missing:
                  print(f'missing fixture: {relative}')
              for relative in unlisted:
                  print(f'unlisted fixture: {relative}')
              for relative, expected, actual in mismatched:
                  print(
                      f'checksum mismatch: {relative}: '
                      f'expected={expected} actual={actual}'
                  )
              raise SystemExit(1)

          print(
              f"verified exhaustive manifest for {len(listed)} reference fixtures "
              f"at PyTorch {version} commit {commit}"
          )
          PY
      - name: Run reference differential harness
        run: cargo +1.89.0 test -p scirust-core --test parity_differential --locked

      - name: Run 2D production differential harness
        run: cargo +1.89.0 test -p scirust-core --test production_parity_2d --locked
      - name: Regenerate coverage artifacts with pinned tooling
        run: cargo +1.89.0 run --quiet --manifest-path tools/tensor-parity/Cargo.toml --locked
      - name: Assert generated coverage is current
        run: git diff --exit-code -- artifacts/tensor-coverage.csv artifacts/tensor-coverage.json

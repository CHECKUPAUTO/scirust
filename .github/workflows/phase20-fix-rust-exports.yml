name: Phase 20 Rust Export Fix

on:
  push:
    branches:
      - research/phase20-wgpu-resident-sampled-minillm
    paths:
      - .github/workflows/phase20-fix-rust-exports.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase20-wgpu-resident-sampled-minillm
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Fix sampled type exports and encoder error conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parent = Path('scirust-gpu/src/elastic_latent_encoder_device.rs')
          text = parent.read_text()
          old = 'pub use minillm::{WgpuResidentMiniLlm, WgpuResidentMiniLlmError, WgpuResidentMiniLlmTelemetry};'
          new = '''pub use minillm::{
              WgpuResidentMiniLlm, WgpuResidentMiniLlmError, WgpuResidentMiniLlmTelemetry,
              WgpuResidentSampledMiniLlm, WgpuResidentSampledMiniLlmError,
              WgpuResidentSampledMiniLlmTelemetry,
          };'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'WgpuResidentSampledMiniLlmTelemetry' not in text.split('use crate::{', 1)[0]:
              raise SystemExit('encoder export insertion point not found')
          parent.write_text(text)

          sampled = Path('scirust-gpu/src/elastic_latent_encoder_device/minillm/sampled.rs')
          text = sampled.read_text()
          if 'impl From<super::super::WgpuResidentTransformerEncoderError>' not in text:
              marker = '''impl From<WgpuResidentMiniLlmError> for WgpuResidentSampledMiniLlmError {
              fn from(error: WgpuResidentMiniLlmError) -> Self {
                  Self::MiniLlm(error)
              }
          }
          '''
              insertion = marker + '''
          impl From<super::super::WgpuResidentTransformerEncoderError>
              for WgpuResidentSampledMiniLlmError
          {
              fn from(error: super::super::WgpuResidentTransformerEncoderError) -> Self {
                  Self::MiniLlm(error.into())
              }
          }
          '''
              if marker not in text:
                  raise SystemExit('sampled error conversion insertion point not found')
              text = text.replace(marker, insertion, 1)
          sampled.write_text(text)
          PY
      - run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit isolated Rust wiring fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-gpu/src/elastic_latent_encoder_device.rs scirust-gpu/src/elastic_latent_encoder_device/minillm/sampled.rs
          git commit -m "fix(kv-cache): expose sampled MiniLLM and convert encoder errors"
          git push origin HEAD:research/phase20-wgpu-resident-sampled-minillm

name: Elastic Latent KV Phase 25

on:
  pull_request:
    paths:
      - "scirust-gpu/Cargo.toml"
      - "scirust-gpu/examples/deterministic_sampler_compare.rs"
      - "experiments/elastic-latent-kv/PHASE25_SPEC.md"
      - ".github/workflows/elastic-latent-kv-phase25.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +nightly-2026-07-02 fmt --all -- --check
      - run: cargo +nightly-2026-07-02 clippy -p scirust-gpu --all-targets --features wgpu --locked -- -D warnings
      - run: cargo +1.89.0 check -p scirust-gpu --all-targets --features wgpu --locked

  compare-smoke-lavapipe:
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan
      SCIRUST_REQUIRE_WGPU: "1"
      SCIRUST_SAMPLER_COMPARE_VOCABS: 64
      SCIRUST_SAMPLER_COMPARE_TOP_KS: 5,16
      SCIRUST_SAMPLER_COMPARE_REPEATS: 2
      SCIRUST_SAMPLER_COMPARE_WARMUP: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: |
          cargo +1.89.0 run --quiet --release --locked -p scirust-gpu \
            --features wgpu --example deterministic_sampler_compare > phase25-lavapipe.csv
          cat phase25-lavapipe.csv
      - run: |
          python3 - <<'PY'
          import csv
          import math
          with open('phase25-lavapipe.csv', newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 2, rows
          assert {int(row['top_k']) for row in rows} == {5, 16}
          for row in rows:
              assert int(row['vocab_size']) == 64
              assert int(row['repeats']) == 2
              assert int(row['sequential_median_ns']) > 0
              assert int(row['parallel_median_ns']) > 0
              speedup = float(row['speedup_parallel_vs_sequential'])
              assert math.isfinite(speedup) and speedup > 0.0
              assert int(row['exact_stream_match']) == 1, row
              assert row['sequential_fingerprint'] == row['parallel_fingerprint'], row
              assert int(row['sequential_ranking_passes']) == int(row['top_k'])
              assert int(row['parallel_ranking_passes']) == int(row['top_k'])
              assert int(row['parallel_lanes']) == 64
          PY

  compare-jetson-thor:
    name: Phase 25 benchmark (Jetson Thor WGPU)
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - scirust-arm64
      - jetson-thor
      - internal
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phase25-checkout
    env:
      WGPU_BACKEND: vulkan
      SCIRUST_REQUIRE_WGPU: "1"
      SCIRUST_SAMPLER_COMPARE_VOCABS: 4096
      SCIRUST_SAMPLER_COMPARE_TOP_KS: 5,50,200
      SCIRUST_SAMPLER_COMPARE_REPEATS: 7
      SCIRUST_SAMPLER_COMPARE_WARMUP: 3
      SCIRUST_THOR_GPU_LOCK: /tmp/scirust-thor-gpu.lock
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          path: phase25-checkout
      - name: Detect a real WGPU-capable Thor
        id: thor
        shell: bash
        run: |
          set -euo pipefail
          if command -v nvidia-smi >/dev/null 2>&1 \
            && nvidia-smi -L 2>/dev/null | grep -q 'NVIDIA Thor' \
            && command -v vulkaninfo >/dev/null 2>&1 \
            && vulkaninfo --summary 2>/dev/null | grep -q 'NVIDIA Tegra NVIDIA Thor'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Real NVIDIA Thor WGPU/Vulkan device detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Runner is labelled jetson-thor but does not expose the real Thor WGPU/Vulkan device; Phase 25 hardware evidence is deferred."
          fi
      - name: Classify Thor occupancy
        if: steps.thor.outputs.available == 'true'
        id: occupancy
        shell: bash
        run: |
          set -euo pipefail
          command -v flock >/dev/null
          sudo touch -- "$SCIRUST_THOR_GPU_LOCK"
          sudo chmod 0666 -- "$SCIRUST_THOR_GPU_LOCK"
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9

          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "::error::Phase 25 cannot verify Thor occupancy."
            exit 1
          fi
          if [[ -z "${compute_apps//[[:space:]]/}" ]]; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
            echo "Thor is idle; Phase 25 hardware comparison will run."
            exit 0
          fi

          managed_training=true
          printf '%s\n' "$compute_apps"
          while IFS=',' read -r raw_pid process_name; do
            pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
            [[ "$pid" =~ ^[0-9]+$ ]] || { managed_training=false; continue; }
            process_name="${process_name# }"
            cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
            proc_user="$(ps -p "$pid" -o user= 2>/dev/null | xargs || true)"
            ppid="$(ps -p "$pid" -o ppid= 2>/dev/null | tr -d '[:space:]')"
            cgroup="$(cat "/proc/$pid/cgroup" 2>/dev/null || true)"
            echo "pid=$pid user=$proc_user ppid=$ppid process=$process_name cmdline=$cmdline cgroup=$cgroup"
            if [[ "$process_name" != "/root/scirust/target/release/examples/cuda_pretrain" ]] \
              || [[ "$cmdline" != *"/root/scirust/target/release/examples/cuda_pretrain"* ]] \
              || [[ "$proc_user" != "root" ]] \
              || [[ "$ppid" != "1" ]] \
              || [[ "$cgroup" != 0::/user.slice/user-0.slice/session-*.scope ]]; then
              managed_training=false
            fi
          done <<< "$compute_apps"

          if [[ "$managed_training" == true ]]; then
            echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Phase 25 Thor benchmark deferred: detached SciAgent cuda_pretrain owns the GPU. No WGPU workload is launched and training is left untouched."
            exit 0
          fi

          echo "::error::Phase 25 found unknown GPU compute activity after acquiring the SciRust lock."
          exit 1
      - name: Report deferred Phase 25 hardware comparison
        if: steps.thor.outputs.available != 'true' || steps.occupancy.outputs.run_benchmark == 'false'
        run: |
          echo "Phase 25 real-Thor sampler comparison DEFERRED."
          echo "Static and lavapipe validation remain active; no new hardware evidence is claimed."
          {
            echo "## Phase 25 Thor comparison: DEFERRED"
            echo
            echo "A real idle Thor was not available to this job."
            echo "No hardware result is reused or fabricated; the PR remains draft until hardware evidence can be refreshed if required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare isolated executable build directory
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        run: |
          tmpdir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/scirust-phase25.XXXXXX")"
          chmod 700 "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        with:
          shared-key: phase25-wgpu-thor
          cache-targets: false
          workspaces: phase25-checkout
      - name: Report WGPU/Vulkan environment
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        run: |
          uname -a
          nvidia-smi
          vulkaninfo --summary
      - name: Run real-device sampler comparison
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if ! compute_apps="$(nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null)"; then
            echo "::error::Phase 25 cannot verify the Thor remained idle."
            exit 1
          fi
          if [[ -n "${compute_apps//[[:space:]]/}" ]]; then
            echo "::error::GPU occupancy changed after Phase 25 preflight; refusing a contaminated comparison."
            printf '%s\n' "$compute_apps"
            exit 1
          fi
          rustup run 1.89.0 cargo run --quiet --release --locked -p scirust-gpu \
            --features wgpu --example deterministic_sampler_compare > phase25-thor.csv
          cat phase25-thor.csv
      - name: Validate exact real-device rows
        if: steps.thor.outputs.available == 'true' && steps.occupancy.outputs.run_benchmark == 'true'
        run: |
          python3 - <<'PY'
          import csv
          import math
          with open('phase25-thor.csv', newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 3, rows
          assert {int(row['top_k']) for row in rows} == {5, 50, 200}
          for row in rows:
              assert int(row['vocab_size']) == 4096
              assert int(row['repeats']) == 7
              assert int(row['sequential_median_ns']) > 0
              assert int(row['parallel_median_ns']) > 0
              speedup = float(row['speedup_parallel_vs_sequential'])
              assert math.isfinite(speedup) and speedup > 0.0
              assert int(row['exact_stream_match']) == 1, row
              assert row['sequential_fingerprint'] == row['parallel_fingerprint'], row
              assert int(row['sequential_ranking_passes']) == int(row['top_k'])
              assert int(row['parallel_ranking_passes']) == int(row['top_k'])
              assert int(row['parallel_lanes']) == 64
          PY

name: Phase 7 Bootstrap

on:
  push:
    branches:
      - research/elastic-latent-kv-phase7-runtime
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: phase7-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.event.pull_request.number == 945
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: research/elastic-latent-kv-phase7-runtime
          fetch-depth: 0

      - name: Install toolchains
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
          rustup toolchain install 1.89.0 --profile minimal --component clippy

      - name: Apply compiler and Clippy corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache_path = Path("scirust-core/src/nn/latent_kv_cache.rs")
          cache = cache_path.read_text(encoding="utf-8")

          cache_constructor = """    pub fn new(
          capacity_tokens: usize,
          dimension: usize,
          key_rank: usize,
          value_rank: usize,
          key_format: LatentStorageFormat,
          value_format: LatentStorageFormat,
          key_basis: Vec<f32>,
          value_basis: Vec<f32>,
      ) -> Result<Self, LatentCacheError> {"""
          if cache_constructor not in cache:
              raise SystemExit("cache constructor not found")
          cache = cache.replace(
              cache_constructor,
              "    #[allow(clippy::too_many_arguments)]\n" + cache_constructor,
              1,
          )

          old_assertion = """        assert_eq!(
              QuantizedLatentKvCache::new(
                  2,
                  4,
                  5,
                  2,
                  LatentStorageFormat::F32,
                  LatentStorageFormat::F32,
                  vec![0.0; 20],
                  vec![0.0; 8],
              ),
              Err(LatentCacheError::RankTooLarge {
                  name: \"key\",
                  rank: 5,
                  dimension: 4,
              })
          );"""
          new_assertion = """        assert!(matches!(
              QuantizedLatentKvCache::new(
                  2,
                  4,
                  5,
                  2,
                  LatentStorageFormat::F32,
                  LatentStorageFormat::F32,
                  vec![0.0; 20],
                  vec![0.0; 8],
              ),
              Err(LatentCacheError::RankTooLarge {
                  name: \"key\",
                  rank: 5,
                  dimension: 4,
              })
          ));"""
          if old_assertion not in cache:
              raise SystemExit("rank assertion not found")
          cache = cache.replace(old_assertion, new_assertion, 1)

          old_chunks = "source.iter().zip(target.chunks_exact_mut(4))"
          new_chunks = "source.iter().zip(target.as_chunks_mut::<4>().0)"
          if old_chunks not in cache:
              raise SystemExit("FP32 chunk encoder not found")
          cache = cache.replace(old_chunks, new_chunks, 1)
          cache_path.write_text(cache, encoding="utf-8")

          backend_path = Path("scirust-core/src/nn/latent_kv_backend.rs")
          backend = backend_path.read_text(encoding="utf-8")
          backend_constructor = """    pub fn new(
          capacity_tokens: usize,
          dimension: usize,
          key_rank: usize,
          value_rank: usize,
          key_format: LatentStorageFormat,
          value_format: LatentStorageFormat,
          key_basis: Vec<f32>,
          value_basis: Vec<f32>,
      ) -> Result<Self, LatentCacheError> {"""
          if backend_constructor not in backend:
              raise SystemExit("backend constructor not found")
          backend = backend.replace(
              backend_constructor,
              "    #[allow(clippy::too_many_arguments)]\n" + backend_constructor,
              1,
          )
          backend_path.write_text(backend, encoding="utf-8")
          PY

      - name: Canonical formatting
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Clippy
        run: cargo +1.89.0 clippy -p scirust-core --all-targets -- -D warnings

      - name: Focused and library tests
        run: |
          cargo +1.89.0 test -p scirust-core latent_kv -- --test-threads=1
          cargo +1.89.0 test -p scirust-core --lib -- --test-threads=1

      - name: Deterministic runtime harness
        run: |
          cargo +1.89.0 run --quiet --release -p scirust-core --example latent_kv_phase7 > phase7-a.csv
          cargo +1.89.0 run --quiet --release -p scirust-core --example latent_kv_phase7 > phase7-b.csv
          cmp phase7-a.csv phase7-b.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("phase7-a.csv").open("r", encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames
          assert fields is not None and len(fields) == 12
          assert len(rows) == 4
          assert all(row["quality_guard_met"] == "1" for row in rows)
          assert len({row["output_fingerprint"] for row in rows}) == 4
          assert {row["format"] for row in rows} == {"f32", "int8", "int4"}
          PY

      - name: Remove bootstrap and commit canonical result
        run: |
          rm .github/workflows/phase7-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/workflows/phase7-bootstrap.yml \
            scirust-core/src/nn/latent_kv_cache.rs \
            scirust-core/src/nn/latent_kv_backend.rs \
            scirust-core/src/nn/mod.rs \
            scirust-core/examples/latent_kv_phase7.rs
          git diff --cached --check
          git commit -m "fix(kv-cache): canonicalize Phase 7 runtime"
          git push origin HEAD:research/elastic-latent-kv-phase7-runtime

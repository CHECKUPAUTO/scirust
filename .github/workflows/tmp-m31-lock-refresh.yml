name: tmp-m31-lock-refresh

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m31-stable-flat-adapter
          fetch-depth: 0
      - name: Regenerate FLAT git dependency lock entry
        run: |
          set -euo pipefail
          cargo update -p flat-attention --precise 24d3340edeb059e40e0fe0c400e814685701d855
          grep -F '24d3340edeb059e40e0fe0c400e814685701d855' Cargo.lock
          if grep -Fq '311f6b89e001d69f53cddcd2f9ba396a6f80c746' Cargo.lock; then
            echo 'old FLAT revision still present in Cargo.lock' >&2
            exit 1
          fi
      - name: Commit regenerated lockfile only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git commit -m 'chore(gpu): regenerate lockfile for FLAT M30 pin'
          git push origin HEAD:feat/m31-stable-flat-adapter

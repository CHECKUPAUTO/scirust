name: Temporary rustdoc reference patch

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/_tmp_patch_rustdoc_reference.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - name: Align quality-gate documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/REFERENCE.md")
          text = path.read_text()
          old_intro = '''These are the exact commands run by `.github/workflows/ci.yml`. A change is\nreleasable only when all six pass:\n'''
          new_intro = '''These are the release-quality commands enforced by `.github/workflows/ci.yml`\nand `.github/workflows/rustdoc.yml`. A change is releasable only when all seven\npass:\n'''
          old_row = '''| Tests | `cargo test --workspace` | the entire suite |\n| Multi-arch |'''
          new_row = '''| Tests | `cargo test --workspace` | the entire suite |\n| Rustdoc | `RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --no-deps --locked` | authoritative public docs build; broken intra-doc links and rustdoc warnings fail CI |\n| Multi-arch |'''
          if text.count(old_intro) != 1:
              raise SystemExit("quality-gate intro anchor not unique")
          if text.count(old_row) != 1:
              raise SystemExit("quality-gate row anchor not unique")
          text = text.replace(old_intro, new_intro, 1).replace(old_row, new_row, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- docs/REFERENCE.md
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/_tmp_patch_rustdoc_reference.yml
          git add docs/REFERENCE.md
          git config user.name "scirust-rustdoc-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs(ci): document workspace rustdoc release gate"
          git push origin HEAD:codex/gate-workspace-rustdoc

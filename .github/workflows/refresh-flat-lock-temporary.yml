name: Refresh FLAT lockfile (temporary)

on:
  push:
    branches: [feat/flat-m15-prerotated-k-bridge]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-m15-prerotated-k-bridge
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Refresh exact FLAT git lock entry
        run: cargo +stable update -p flat-attention
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(gpu): refresh FLAT lock revision"
          git push origin HEAD:feat/flat-m15-prerotated-k-bridge

name: Phase 17 Wire Autofmt

on:
  push:
    branches:
      - research/phase17-wgpu-resident-transformer-encoder
    paths:
      - scirust-gpu/src/elastic_latent_encoder_device.rs
      - scirust-gpu/tests/elastic_latent_encoder_resident.rs
      - .github/workflows/phase17-wire-autofmt.yml

permissions:
  contents: write

jobs:
  wire-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase17-wgpu-resident-transformer-encoder
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Wire Phase 17 module and exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-gpu/src/lib.rs')
          text = path.read_text()
          module_needle = '#[cfg(feature = "wgpu")]\nmod elastic_latent_device;'
          module_insert = '#[cfg(feature = "wgpu")]\nmod elastic_latent_encoder_device;\n' + module_needle
          if 'mod elastic_latent_encoder_device;' not in text:
              if module_needle not in text:
                  raise SystemExit('module insertion point not found')
              text = text.replace(module_needle, module_insert, 1)
          export_needle = '#[cfg(feature = "wgpu")]\npub use elastic_latent_device::{'
          export_insert = '''#[cfg(feature = "wgpu")]
          pub use elastic_latent_encoder_device::{
              WgpuLatentLayerBasis, WgpuResidentTransformerEncoder,
              WgpuResidentTransformerEncoderError, WgpuResidentTransformerEncoderTelemetry,
          };
          ''' + export_needle
          if 'pub use elastic_latent_encoder_device::' not in text:
              if export_needle not in text:
                  raise SystemExit('export insertion point not found')
              text = text.replace(export_needle, export_insert, 1)
          path.write_text(text)
          PY
      - run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit deterministic wiring and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-gpu/src/lib.rs scirust-gpu/src/elastic_latent_encoder_device.rs scirust-gpu/tests/elastic_latent_encoder_resident.rs
          git commit -m "style(gpu): wire and rustfmt Phase 17"
          git push origin HEAD:research/phase17-wgpu-resident-transformer-encoder

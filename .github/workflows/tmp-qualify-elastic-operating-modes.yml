name: tmp qualify Elastic operating modes

on:
  push:
    branches:
      - feat/elastic-operating-modes
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'feat/elastic-operating-modes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: feat/elastic-operating-modes

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Expose operating-mode API
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("elastic-autotuner/src/lib.rs")
          text = path.read_text()
          marker = 'pub mod measurement_protocol;\n'
          assert text.count(marker) == 1
          assert 'pub mod operating_mode;' not in text
          text = text.replace(marker, marker + 'pub mod operating_mode;\n', 1)
          path.write_text(text)
          PY

      - name: Canonical format
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Apply inherited strict-Clippy baseline locally
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("elastic-autotuner/src/racing.rs")
          text = path.read_text()
          old_memory = 'records.sort_by(|left, right| memory_key(left).cmp(&memory_key(right)))'
          old_latency = 'records.sort_by(|left, right| latency_key(left).cmp(&latency_key(right)))'
          assert text.count(old_memory) == 1
          assert text.count(old_latency) == 1
          text = text.replace(old_memory, 'records.sort_by_key(|entry| memory_key(entry))', 1)
          text = text.replace(old_latency, 'records.sort_by_key(|entry| latency_key(entry))', 1)
          path.write_text(text)
          PY
          cargo +nightly-2026-07-02 fmt --all

      - name: Test ElasticAutoTuner
        run: cargo test -p elastic-autotuner --locked

      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p elastic-autotuner --all-targets --locked -- -D warnings

      - name: MSRV check
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          cargo +1.89.0 check -p elastic-autotuner --all-targets --locked

      - name: Verify intended diff and self-clean
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/tmp-qualify-elastic-operating-modes.yml
          git rm -f .tmp-elastic-mode-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elastic-autotuner/src/lib.rs elastic-autotuner/src/operating_mode.rs
          git diff --cached --check
          git commit -m "feat(autotuner): enforce Cold Learn Locked Audit semantics"
          git push origin HEAD:feat/elastic-operating-modes

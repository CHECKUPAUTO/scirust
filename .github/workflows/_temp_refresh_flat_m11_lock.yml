name: Temporary FLAT M11 lock refresh

on:
  push:
    branches:
      - feat/flat-m11-resident-bridge

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-m11-resident-bridge
          fetch-depth: 0
      - name: Install exact MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Regenerate only the FLAT git lock entry
        run: |
          cargo +1.89.0 update -p flat-attention
          git diff -- Cargo.lock
      - name: Commit generated lock and remove this temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git rm .github/workflows/_temp_refresh_flat_m11_lock.yml
          git commit -m "build(gpu): regenerate FLAT M11 lockfile with Cargo"
          git push origin HEAD:feat/flat-m11-resident-bridge

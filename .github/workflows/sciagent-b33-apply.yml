name: SciAgent B33 head-local RoPE

on:
  pull_request:
    branches:
      - fix/sciagent-b32-exact-resume

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sciagent-b33-head-local-rope
          fetch-depth: 0
      - name: Normalize repeated CUDA replacement sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/sciagent_b33_patch.py")
          s = p.read_text()
          old = '    if n != count:\n        raise SystemExit(f"expected {count}, found {n}: {old[:150]!r}")\n    return text.replace(old, new, count)\n'
          new = '    if n < count:\n        raise SystemExit(f"expected at least {count}, found {n}: {old[:150]!r}")\n    return text.replace(old, new, count)\n'
          if old not in s:
              raise SystemExit("B33 replacement helper shape changed")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply B33 source patch
        run: python3 scripts/sciagent_b33_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test SciAgent CPU attention/model
        run: cargo test -p scirust-sciagent --lib
      - name: Test scirust-gpu CPU oracles
        run: cargo test -p scirust-gpu --lib
      - name: Check WGPU+CUDA SciAgent
        run: cargo check -p scirust-sciagent --features gpu,cuda
      - name: Compile WGPU parity
        run: cargo test -p scirust-sciagent --features gpu --test gpu_parity --no-run
      - name: Compile CUDA parity
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b33_patch.py .github/workflows/sciagent-b33-apply.yml
      - name: Commit and push validated B33
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): make GQA RoPE head-local"
          git push origin HEAD:fix/sciagent-b33-head-local-rope

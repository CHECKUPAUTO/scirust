name: tmp-wire-approval-audit

on:
  push:
    branches: [feat/sciagent-approval-audit]
    paths:
      - ".github/workflows/tmp-wire-approval-audit.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-approval-audit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy
      - name: Wire audit sink into approval gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          mod = Path("scirust-sciagent/src/agentic/mod.rs")
          replace_once(mod, "pub mod guard;\n", "pub mod approval_audit;\npub mod guard;\n")
          replace_once(
              mod,
              "pub use guard::{ConformalGuard, GuardVerdict};\n",
              "pub use approval_audit::{\n    ApprovalAuditEvent, ApprovalAuditSink, ApprovalChannel, ApprovalLifecycle, ApprovalResolution,\n    InMemoryApprovalAudit,\n};\npub use guard::{ConformalGuard, GuardVerdict};\n",
          )

          permission = Path("scirust-sciagent/src/agentic/permission.rs")
          replace_once(
              permission,
              "use super::tool_runtime::{ToolCall, ToolPolicy};\n",
              "use super::approval_audit::{ApprovalAuditEvent, ApprovalAuditSink, ApprovalResolution};\nuse super::tool_runtime::{ToolCall, ToolPolicy};\n",
          )
          replace_once(
              permission,
              "    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n}",
              "    session_approved_tools: Arc<RwLock<HashSet<String>>>,\n    audit_sink: Option<Arc<dyn ApprovalAuditSink>>,\n}",
          )
          permission_text = permission.read_text().replace(
              "            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n        }",
              "            session_approved_tools: Arc::new(RwLock::new(HashSet::new())),\n            audit_sink: None,\n        }",
          )
          if permission_text.count("audit_sink: None") != 3:
              raise SystemExit("permission constructors did not all receive audit sink")
          permission.write_text(permission_text)
          replace_once(
              permission,
              "    pub fn policy(&self) -> &PermissionPolicy {\n        &self.policy\n    }\n",
              "    pub fn policy(&self) -> &PermissionPolicy {\n        &self.policy\n    }\n\n    /// Attach a supervision sink. Once installed, audit recording is part of\n    /// the authorization contract and failures therefore fail closed.\n    pub fn with_audit_sink(mut self, audit_sink: Arc<dyn ApprovalAuditSink>) -> Self {\n        self.audit_sink = Some(audit_sink);\n        self\n    }\n\n    fn audit(&self, event: ApprovalAuditEvent) -> Result<(), String> {\n        match self.audit_sink.as_ref() {\n            Some(sink) => sink\n                .record(event)\n                .map_err(|error| format!(\"approval audit failed: {error}\")),\n            None => Ok(()),\n        }\n    }\n",
          )
          start = permission.read_text().index("impl ToolPolicy for PermissionGate {")
          end = permission.read_text().index("\nfn approval_unavailable_error()", start)
          old_impl = permission.read_text()[start:end]
          new_impl = '''impl ToolPolicy for PermissionGate {
    fn before_execute(&self, call: &ToolCall, tool: &Tool) -> Result<(), String> {
        match self.policy.decide(call, tool_is_read_only(tool))
        {
            PermissionDecision::Allow => Ok(()),
            PermissionDecision::Deny => Err(
                "denied by permission policy; do not retry this tool call unchanged".to_string(),
            ),
            PermissionDecision::Ask =>
            {
                if self.is_tool_approved_for_session(&call.tool)?
                {
                    return Ok(());
                }

                let subject = primary_subject(call);
                self.audit(ApprovalAuditEvent::tool_requested(
                    &call.id,
                    &call.tool,
                    &subject,
                ))?;

                if let Some(approver) = self.scoped_approver.as_ref()
                {
                    let choice = match approver.approve(call, tool, &subject)
                    {
                        Ok(choice) => choice,
                        Err(error) =>
                        {
                            self.audit(ApprovalAuditEvent::tool_resolved(
                                &call.id,
                                &call.tool,
                                &subject,
                                ApprovalResolution::Unavailable,
                            ))?;
                            return Err(error);
                        },
                    };
                    let resolution = match choice
                    {
                        ApprovalChoice::Once => ApprovalResolution::AllowedOnce,
                        ApprovalChoice::Session => ApprovalResolution::AllowedSession,
                        ApprovalChoice::Decline => ApprovalResolution::Rejected,
                    };
                    if matches!(choice, ApprovalChoice::Session)
                    {
                        if let Err(error) = self.approve_tool_for_session(&call.tool)
                        {
                            self.audit(ApprovalAuditEvent::tool_resolved(
                                &call.id,
                                &call.tool,
                                &subject,
                                ApprovalResolution::Unavailable,
                            ))?;
                            return Err(error);
                        }
                    }
                    self.audit(ApprovalAuditEvent::tool_resolved(
                        &call.id,
                        &call.tool,
                        &subject,
                        resolution,
                    ))?;
                    return match choice
                    {
                        ApprovalChoice::Once | ApprovalChoice::Session => Ok(()),
                        ApprovalChoice::Decline => Err(
                            "the user declined this tool call; do not retry it unchanged"
                                .to_string(),
                        ),
                    };
                }

                let Some(approver) = self.approver.as_ref()
                else
                {
                    self.audit(ApprovalAuditEvent::tool_resolved(
                        &call.id,
                        &call.tool,
                        &subject,
                        ApprovalResolution::Unavailable,
                    ))?;
                    return Err(approval_unavailable_error());
                };
                let outcome = approver
                    .approve(call, tool, &subject)
                    .unwrap_or(ApprovalOutcome::Unavailable);
                let resolution = match outcome
                {
                    ApprovalOutcome::AllowedOnce => ApprovalResolution::AllowedOnce,
                    ApprovalOutcome::Rejected => ApprovalResolution::Rejected,
                    ApprovalOutcome::Cancelled => ApprovalResolution::Cancelled,
                    ApprovalOutcome::Unavailable => ApprovalResolution::Unavailable,
                };
                self.audit(ApprovalAuditEvent::tool_resolved(
                    &call.id,
                    &call.tool,
                    &subject,
                    resolution,
                ))?;
                match outcome
                {
                    ApprovalOutcome::AllowedOnce => Ok(()),
                    ApprovalOutcome::Rejected => Err(
                        "the user declined this tool call; do not retry it unchanged".to_string(),
                    ),
                    ApprovalOutcome::Cancelled => Err(
                        "approval for this tool call was cancelled; do not retry it unchanged"
                            .to_string(),
                    ),
                    ApprovalOutcome::Unavailable => Err(approval_unavailable_error()),
                }
            },
        }
    }
}
'''
          text = permission.read_text()
          permission.write_text(text[:start] + new_impl + text[end:])

          sandbox = Path("scirust-sciagent/src/agentic/sandbox_approval.rs")
          replace_once(
              sandbox,
              "use super::permission::{ApprovalOutcome, PermissionGate};\n",
              "use super::approval_audit::{ApprovalAuditEvent, ApprovalAuditSink, ApprovalResolution};\nuse super::permission::{ApprovalOutcome, PermissionGate};\n",
          )
          replace_once(
              sandbox,
              "    sandbox_approver: Option<Arc<dyn SandboxApprovalService>>,\n}",
              "    sandbox_approver: Option<Arc<dyn SandboxApprovalService>>,\n    audit_sink: Option<Arc<dyn ApprovalAuditSink>>,\n}",
          )
          sandbox_text = sandbox.read_text().replace(
              "            sandbox_approver: None,\n        }",
              "            sandbox_approver: None,\n            audit_sink: None,\n        }",
          ).replace(
              "            sandbox_approver: Some(sandbox_approver),\n        }",
              "            sandbox_approver: Some(sandbox_approver),\n            audit_sink: None,\n        }",
          )
          if sandbox_text.count("audit_sink: None") != 2:
              raise SystemExit("sandbox constructors did not receive audit sink")
          sandbox.write_text(sandbox_text)
          replace_once(
              sandbox,
              "    pub fn permission_gate(&self) -> &PermissionGate {\n        &self.permission\n    }\n",
              "    pub fn permission_gate(&self) -> &PermissionGate {\n        &self.permission\n    }\n\n    /// Attach the same structured lifecycle sink used by supervision clients.\n    pub fn with_audit_sink(mut self, audit_sink: Arc<dyn ApprovalAuditSink>) -> Self {\n        self.audit_sink = Some(audit_sink);\n        self\n    }\n\n    fn audit(&self, event: ApprovalAuditEvent) -> Result<(), String> {\n        match self.audit_sink.as_ref() {\n            Some(sink) => sink\n                .record(event)\n                .map_err(|error| format!(\"approval audit failed: {error}\")),\n            None => Ok(()),\n        }\n    }\n",
          )
          text = sandbox.read_text()
          start = text.index("    fn approve_sandbox_escalation(")
          end = text.index("\n    fn after_execute", start)
          old = text[start:end]
          new = '''    fn approve_sandbox_escalation(
        &self,
        _call: &ToolCall,
        _tool: &Tool,
        request: &SandboxApprovalRequest,
    ) -> Result<(), String> {
        self.audit(ApprovalAuditEvent::sandbox_requested(
            &request.call_id,
            &request.tool,
            request.requested.label(),
            &request.justification,
        ))?;

        let Some(approver) = self.sandbox_approver.as_ref()
        else
        {
            self.audit(ApprovalAuditEvent::sandbox_resolved(
                &request.call_id,
                &request.tool,
                request.requested.label(),
                &request.justification,
                ApprovalResolution::Unavailable,
            ))?;
            return Err(
                "sandbox escalation approval required but no sandbox approval service is available; refusing to execute"
                    .to_string(),
            );
        };

        let outcome = approver
            .request_approval(request)
            .unwrap_or(ApprovalOutcome::Unavailable);
        let resolution = match outcome
        {
            ApprovalOutcome::AllowedOnce => ApprovalResolution::AllowedOnce,
            ApprovalOutcome::Rejected => ApprovalResolution::Rejected,
            ApprovalOutcome::Cancelled => ApprovalResolution::Cancelled,
            ApprovalOutcome::Unavailable => ApprovalResolution::Unavailable,
        };
        self.audit(ApprovalAuditEvent::sandbox_resolved(
            &request.call_id,
            &request.tool,
            request.requested.label(),
            &request.justification,
            resolution,
        ))?;
        match outcome
        {
            ApprovalOutcome::AllowedOnce => Ok(()),
            ApprovalOutcome::Rejected => Err(
                "the user rejected this sandbox escalation; do not retry it unchanged".to_string(),
            ),
            ApprovalOutcome::Cancelled => Err(
                "sandbox escalation approval was cancelled; do not retry it unchanged".to_string(),
            ),
            ApprovalOutcome::Unavailable =>
            {
                Err("sandbox escalation approval is unavailable; refusing to execute".to_string())
            },
        }
    }
'''
          sandbox.write_text(text[:start] + new + text[end:])
          PY
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Validate approval lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 test -p scirust-sciagent approval_audit --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent permission::tests --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent sandbox_approval::tests --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Commit product changes and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wire-approval-audit.yml
          git add scirust-sciagent/src/agentic/approval_audit.rs \
                  scirust-sciagent/src/agentic/mod.rs \
                  scirust-sciagent/src/agentic/permission.rs \
                  scirust-sciagent/src/agentic/sandbox_approval.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sciagent): audit approval request lifecycles"
          git push origin HEAD:feat/sciagent-approval-audit

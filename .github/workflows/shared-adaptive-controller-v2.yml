name: Shared adaptive controller v2

on:
  push:
    branches:
      - work/shared-adaptive-controller-v2

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: github.repository == 'Memorithm/scirust' && github.actor == 'CHECKUPAUTO'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: work/shared-adaptive-controller-v2
          fetch-depth: 0

      - name: Install pinned nightly and MSRV
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.89.0 --profile minimal

      - name: Wire shared controller consumers
        shell: python
        run: |
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          if '"scirust-adaptive-control",' not in text:
              text = text.replace('    "scirust-special",\n', '    "scirust-special",\n    "scirust-adaptive-control",\n', 1)
          root.write_text(text)

          nonlocal_manifest = Path('scirust-nonlocal-relativity/Cargo.toml')
          text = nonlocal_manifest.read_text()
          if 'scirust-adaptive-control = { path = "../scirust-adaptive-control" }' not in text:
              text = text.replace('[dependencies]\n', '[dependencies]\nscirust-adaptive-control = { path = "../scirust-adaptive-control" }\n', 1)
          nonlocal_manifest.write_text(text)

          sim_manifest = Path('scirust-sim/Cargo.toml')
          text = sim_manifest.read_text()
          text = text.replace('the core crate stays zero-dependency', 'the core crate stays free of third-party dependencies')
          if 'scirust-adaptive-control = { path = "../scirust-adaptive-control" }' not in text:
              text = text.replace('[dependencies]\n', '[dependencies]\nscirust-adaptive-control = { path = "../scirust-adaptive-control" }\n', 1)
          sim_manifest.write_text(text)

          sim_lib = Path('scirust-sim/src/lib.rs')
          text = sim_lib.read_text()
          text = text.replace('There are no dependencies,', 'There are no third-party dependencies in the core path,')
          sim_lib.write_text(text)

          adaptive = Path('scirust-nonlocal-relativity/src/adaptive_control.rs')
          text = adaptive.read_text()
          if 'use scirust_adaptive_control::IController;\n' not in text:
              text = text.replace('use crate::{NonlocalRelativityError, NonlocalResult, WorldlineState, validate_scalar};\n', 'use crate::{NonlocalRelativityError, NonlocalResult, WorldlineState, validate_scalar};\nuse scirust_adaptive_control::IController;\n', 1)
          old = '''pub(crate) fn grow_accepted_step(\n    step: f64,\n    normalized_error: f64,\n    min_step: f64,\n    max_step: f64,\n) -> f64 {\n    let growth = if normalized_error > 0.0\n    {\n        STEP_SAFETY_FACTOR * normalized_error.powf(-FIRST_ORDER_STEP_EXPONENT)\n    }\n    else\n    {\n        STEP_GROWTH_CAP\n    };\n    (step * growth.min(STEP_GROWTH_CAP)).clamp(min_step, max_step)\n}\n\n/// Shrink a rejected step by the same control law, bounded below by\n/// `STEP_SHRINK_FLOOR` per rejection. The result is *not* clamped to\n/// `min_step`; the caller decides whether crossing `min_step` is an error.\n#[must_use]\npub(crate) fn shrink_rejected_step(step: f64, normalized_error: f64) -> f64 {\n    let shrink = STEP_SAFETY_FACTOR * normalized_error.powf(-FIRST_ORDER_STEP_EXPONENT);\n    step * shrink.max(STEP_SHRINK_FLOOR)\n}\n'''
          new = '''fn step_controller() -> IController {\n    IController::new(\n        STEP_SAFETY_FACTOR,\n        STEP_SHRINK_FLOOR,\n        STEP_GROWTH_CAP,\n        FIRST_ORDER_STEP_EXPONENT,\n    )\n    .expect("nonlocal adaptive-controller constants are valid")\n}\n\n#[must_use]\npub(crate) fn grow_accepted_step(\n    step: f64,\n    normalized_error: f64,\n    min_step: f64,\n    max_step: f64,\n) -> f64 {\n    let scale = step_controller()\n        .evaluate(normalized_error)\n        .expect("scaled_local_error_norm produces a finite non-negative error")\n        .scale();\n    (step * scale).clamp(min_step, max_step)\n}\n\n/// Shrink a rejected step by the same control law, bounded below by\n/// `STEP_SHRINK_FLOOR` per rejection. The result is *not* clamped to\n/// `min_step`; the caller decides whether crossing `min_step` is an error.\n#[must_use]\npub(crate) fn shrink_rejected_step(step: f64, normalized_error: f64) -> f64 {\n    let scale = step_controller()\n        .evaluate(normalized_error)\n        .expect("scaled_local_error_norm produces a finite non-negative error")\n        .scale();\n    step * scale\n}\n'''
          if old not in text and 'fn step_controller() -> IController' not in text:
              raise SystemExit('nonlocal adaptive control block not found')
          text = text.replace(old, new, 1)
          adaptive.write_text(text)

          engine = Path('scirust-sim/src/engine.rs')
          text = engine.read_text()
          if 'use scirust_adaptive_control::{IController, StepDecision};\n' not in text:
              text = text.replace('use std::error::Error;\n', 'use scirust_adaptive_control::{IController, StepDecision};\nuse std::error::Error;\n', 1)
          old = '''        // Elementary I-controller; the estimator has order 4, hence the 1/5\n        // exponent. Safety and clamp factors are the textbook defaults.\n        const SAFETY: f64 = 0.9;\n        const MIN_SCALE: f64 = 0.2;\n        const MAX_SCALE: f64 = 5.0;\n        let scale = if err_norm == 0.0\n        {\n            MAX_SCALE\n        }\n        else\n        {\n            (SAFETY * err_norm.powf(-0.2)).clamp(MIN_SCALE, MAX_SCALE)\n        };\n\n        if err_norm <= 1.0\n        {\n'''
          new = '''        // Elementary I-controller; the estimator has order 4, hence the 1/5\n        // exponent. Parameters preserve this integrator's historical textbook defaults.\n        let control = IController::new(0.9, 0.2, 5.0, 0.2)\n            .expect("Dormand-Prince adaptive-controller constants are valid")\n            .evaluate(err_norm)\n            .expect("finite non-negative Dormand-Prince error norm");\n        let scale = control.scale();\n\n        if control.decision() == StepDecision::Accept\n        {\n'''
          if old not in text and 'let control = IController::new(0.9, 0.2, 5.0, 0.2)' not in text:
              raise SystemExit('sim adaptive control block not found')
          text = text.replace(old, new, 1)
          engine.write_text(text)

      - name: Refresh lockfile
        run: cargo +1.89.0 check -p scirust-adaptive-control -p scirust-nonlocal-relativity -p scirust-sim

      - name: Format and validate consumers
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 clippy -p scirust-adaptive-control -p scirust-nonlocal-relativity -p scirust-sim --all-targets --locked -- -D warnings
          cargo +1.89.0 test -p scirust-adaptive-control --locked
          cargo +1.89.0 test -p scirust-nonlocal-relativity --locked
          cargo +1.89.0 test -p scirust-sim --locked
          cargo +1.89.0 doc -p scirust-adaptive-control -p scirust-nonlocal-relativity -p scirust-sim --no-deps --locked

      - name: Commit validated wiring
        shell: bash
        run: |
          set -euo pipefail
          allowed='^( M Cargo.lock| M Cargo.toml| M scirust-adaptive-control/src/lib.rs| M scirust-nonlocal-relativity/Cargo.toml| M scirust-nonlocal-relativity/src/adaptive_control.rs| M scirust-sim/Cargo.toml| M scirust-sim/src/engine.rs| M scirust-sim/src/lib.rs)$'
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          if git diff --quiet -- Cargo.lock Cargo.toml scirust-adaptive-control/src/lib.rs scirust-nonlocal-relativity/Cargo.toml scirust-nonlocal-relativity/src/adaptive_control.rs scirust-sim/Cargo.toml scirust-sim/src/engine.rs scirust-sim/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml scirust-adaptive-control/src/lib.rs scirust-nonlocal-relativity/Cargo.toml scirust-nonlocal-relativity/src/adaptive_control.rs scirust-sim/Cargo.toml scirust-sim/src/engine.rs scirust-sim/src/lib.rs
          git commit -m "feat(adaptive): share bounded I-controller law"
          git push origin HEAD:work/shared-adaptive-controller-v2

name: SciAgent B28 true CUDA batch

on:
  pull_request:
    branches:
      - perf/sciagent-b27-training-cache

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sciagent-b28-true-batch
          fetch-depth: 0

      - name: Apply B28 source patch
        run: python3 scripts/sciagent_b28_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Check CUDA backend
        run: cargo check -p scirust-cuda --features cuda

      - name: Check SciAgent CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain

      - name: Check SciAgent CUDA library
        run: cargo check -p scirust-sciagent --features cuda

      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b28_patch.py .github/workflows/sciagent-b28-apply.yml

      - name: Commit and push validated B28
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sciagent): add true packed CUDA training batch"
          git push origin HEAD:perf/sciagent-b28-true-batch

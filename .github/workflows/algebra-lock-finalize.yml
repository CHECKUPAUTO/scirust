name: Algebra finalize minimal lock

on:
  push:
    branches:
      - feat/scirust-algebra-groups

permissions:
  contents: write

jobs:
  finalize-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/scirust-algebra-groups
          fetch-depth: 0
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
      - name: Restore clean lock and let Cargo add the new path package
        shell: bash
        run: |
          set -euo pipefail
          git checkout 2ff57250b55ec2bbc0d8af5fb4cd0d7d41a135d1 -- Cargo.lock
          cargo check -p scirust-algebra || true
          git diff -- Cargo.lock
      - name: Commit only the minimal Cargo-generated lock delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/algebra-lock-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/algebra-lock-finalize.yml
          git commit -m "chore(algebra): add workspace lock entry"
          git push origin HEAD:feat/scirust-algebra-groups

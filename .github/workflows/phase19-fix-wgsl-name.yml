name: Phase 19 WGSL Name Fix

on:
  push:
    branches:
      - research/phase19-wgpu-deterministic-sampling
    paths:
      - .github/workflows/phase19-fix-wgsl-name.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase19-wgpu-deterministic-sampling
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Rename WGSL reserved identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-gpu/src/deterministic_sampling_device.rs')
          text = path.read_text()
          old = '@group(0) @binding(2) var<storage, read_write> sampler: SamplerState;'
          new = '@group(0) @binding(2) var<storage, read_write> sampling_state: SamplerState;'
          if old not in text and 'sampling_state: SamplerState' not in text:
              raise SystemExit('WGSL sampler declaration not found')
          text = text.replace(old, new)
          text = text.replace('sampler.', 'sampling_state.')
          path.write_text(text)
          PY
      - run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit isolated WGSL rename
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-gpu/src/deterministic_sampling_device.rs
          git commit -m "fix(sampling): avoid reserved WGSL sampler identifier"
          git push origin HEAD:research/phase19-wgpu-deterministic-sampling

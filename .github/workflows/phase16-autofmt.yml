name: Phase 16 Autofmt

on:
  push:
    branches:
      - research/phase16-wgpu-resident-transformer-block
    paths:
      - scirust-gpu/src/elastic_latent_block_device.rs
      - scirust-gpu/src/lib.rs
      - scirust-gpu/tests/elastic_latent_block_resident.rs
      - .github/workflows/phase16-autofmt.yml

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase16-wgpu-resident-transformer-block
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-07-02 fmt --all
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-gpu/src/elastic_latent_block_device.rs scirust-gpu/src/lib.rs scirust-gpu/tests/elastic_latent_block_resident.rs
          git commit -m "style(gpu): rustfmt Phase 16"
          git push origin HEAD:research/phase16-wgpu-resident-transformer-block

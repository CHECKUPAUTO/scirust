name: Temporary minimal FLAT M11 lock pin

on:
  push:
    branches:
      - feat/flat-m11-resident-bridge

permissions:
  contents: write

jobs:
  minimal-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-m11-resident-bridge
          fetch-depth: 0
      - name: Install exact MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Replace only the reviewed FLAT source entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.lock')
          s = p.read_text()
          old = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=e665abee4f803d73668c2d08aaa093a155caa482#e665abee4f803d73668c2d08aaa093a155caa482'
          new = 'git+https://github.com/Memorithm/FLAT-ATTENTION?rev=ac24e843c38202c3a2e5049935ca62699d786358#ac24e843c38202c3a2e5049935ca62699d786358'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old FLAT lock source, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- Cargo.lock
      - name: Prove the minimal lock is accepted
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 >/dev/null
          cargo +1.89.0 check -p scirust-gpu --features flat-attention --locked
      - name: Commit minimal lock and remove this temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git rm .github/workflows/_temp_minimal_flat_m11_lock.yml
          git commit -m "build(gpu): pin FLAT M11 in canonical lockfile"
          git push origin HEAD:feat/flat-m11-resident-bridge

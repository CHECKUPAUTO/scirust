name: cache-policy-discovery

on:
  pull_request:
    paths:
      - "experiments/elastic-cache-policy/**"
      - "scirust-evo/**"
      - "scirust-symreg/**"
      - "scirust-symbolic/**"
      - ".github/workflows/cache-policy-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: deterministic policy discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/elastic-cache-policy-discovery
          persist-credentials: true
      - name: Install formatting toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Apply deterministic API fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sequential = Path("experiments/elastic-cache-policy/src/trajectory/sequential.rs")
          text = sequential.read_text()
          old = "use scirust_sequential::{FeatureFn, LinearChainCRF};"
          new = "use scirust_sequential::LinearChainCRF;\nuse scirust_sequential::crf::FeatureFn;"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected FeatureFn import count: {text.count(old)}")
          sequential.write_text(text.replace(old, new, 1))

          policy = Path("experiments/elastic-cache-policy/src/trajectory/policy.rs")
          text = policy.read_text()
          old = "minimum_skip_margin: f64::INFINITY,"
          new = "minimum_skip_margin: 1.0e300,"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected deny-all sentinel count: {text.count(old)}")
          policy.write_text(text.replace(old, new, 1))
          PY
          cargo +nightly-2026-07-02 fmt --manifest-path experiments/elastic-cache-policy/Cargo.toml
          if ! git diff --quiet -- experiments/elastic-cache-policy; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/elastic-cache-policy
            git commit -m "fix(cache-policy): align sequential API and finite fallback"
            git push origin HEAD:research/elastic-cache-policy-discovery
          fi
      - name: Format check
        run: cargo +nightly-2026-07-02 fmt --manifest-path experiments/elastic-cache-policy/Cargo.toml -- --check
      - name: Clippy
        run: cargo +nightly-2026-07-02 clippy --manifest-path experiments/elastic-cache-policy/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo +nightly-2026-07-02 test --manifest-path experiments/elastic-cache-policy/Cargo.toml
      - name: Jetson harness static checks
        run: |
          python3 -m py_compile \
            experiments/elastic-cache-policy/jetson/analyze_end_to_end_report.py \
            experiments/elastic-cache-policy/jetson/diagnose_guarded_independent_quality.py \
            experiments/elastic-cache-policy/jetson/dream_jetson_proof.py \
            experiments/elastic-cache-policy/jetson/dream_trace_only.py \
            experiments/elastic-cache-policy/jetson/finalize_dream_proof.py \
            experiments/elastic-cache-policy/jetson/frozen_policy_confirmatory.py \
            experiments/elastic-cache-policy/jetson/robust_cross_validation.py \
            experiments/elastic-cache-policy/jetson/select_trajectory_stability_guard.py \
            experiments/elastic-cache-policy/jetson/summarize_guarded_independent.py \
            experiments/elastic-cache-policy/jetson/summarize_repeated_crossover.py \
            experiments/elastic-cache-policy/real/dream/benchmark_frozen_ensemble.py \
            experiments/elastic-cache-policy/real/dream/benchmark_guarded_independent.py \
            experiments/elastic-cache-policy/real/dream/benchmark_repeated_crossover.py \
            experiments/elastic-cache-policy/real/dream/collect_trajectory_branch_dataset.py \
            experiments/elastic-cache-policy/real/dream/patch_elastic_cache.py \
            experiments/elastic-cache-policy/real/dream/patch_trajectory_probe.py
          bash -n \
            experiments/elastic-cache-policy/jetson/finalize_end_to_end_diagnostic.sh \
            experiments/elastic-cache-policy/jetson/finalize_guarded_independent_summary.sh \
            experiments/elastic-cache-policy/jetson/finalize_guarded_quality_diagnostic.sh \
            experiments/elastic-cache-policy/jetson/finalize_repeated_crossover_summary.sh \
            experiments/elastic-cache-policy/jetson/run_confirmatory_dream_proof.sh \
            experiments/elastic-cache-policy/jetson/run_end_to_end_gsm8k.sh \
            experiments/elastic-cache-policy/jetson/run_guarded_independent_gsm8k.sh \
            experiments/elastic-cache-policy/jetson/run_jetson_dream_proof.sh \
            experiments/elastic-cache-policy/jetson/run_repeated_crossover_gsm8k.sh \
            experiments/elastic-cache-policy/jetson/run_robust_cross_validation.sh \
            experiments/elastic-cache-policy/jetson/run_trajectory_branch_development.sh \
            experiments/elastic-cache-policy/jetson/run_trajectory_stability_guard_selection.sh
      - name: Synthetic discovery comparison
        run: cargo +nightly-2026-07-02 test --release --manifest-path experiments/elastic-cache-policy/Cargo.toml -- --ignored
      - name: CLI discovery report
        run: |
          cargo +nightly-2026-07-02 run --release \
            --manifest-path experiments/elastic-cache-policy/Cargo.toml -- \
            --seed 20260804 \
            --steps 600 \
            --max-quality-loss 0.05

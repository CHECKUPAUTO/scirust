name: cache-policy-discovery

on:
  pull_request:
    paths:
      - "experiments/elastic-cache-policy/**"
      - "scirust-evo/**"
      - "scirust-symreg/**"
      - "scirust-symbolic/**"
      - ".github/workflows/cache-policy-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: deterministic policy discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path experiments/elastic-cache-policy/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path experiments/elastic-cache-policy/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path experiments/elastic-cache-policy/Cargo.toml
      - name: Synthetic discovery comparison
        run: cargo test --release --manifest-path experiments/elastic-cache-policy/Cargo.toml -- --ignored
      - name: CLI smoke test
        run: |
          cargo run --release \
            --manifest-path experiments/elastic-cache-policy/Cargo.toml -- \
            --seed 20260804 \
            --steps 200 \
            --max-quality-loss 0.05

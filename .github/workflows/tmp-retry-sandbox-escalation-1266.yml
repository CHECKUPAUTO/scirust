name: tmp-retry-sandbox-escalation-1266

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/sciagent-sandbox-escalation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy
      - name: Apply integration and remove obsolete wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-sandbox-escalation-1266.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          cargo +nightly-2026-07-02 fmt --all"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_sandbox_escalation_1266.py').write_text(script)
          PY
          python3 /tmp/apply_sandbox_escalation_1266.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-sciagent/src/agentic/sandbox.rs')
          text = path.read_text()
          obsolete = '''    fn from_env() -> Result<Self, String> {
        Self::from_env_with_override(None)
    }

'''
          if text.count(obsolete) != 1:
              raise SystemExit(
                  f'obsolete SandboxConfig::from_env wrapper: expected 1 match, found {text.count(obsolete)}'
              )
          path.write_text(text.replace(obsolete, '', 1))
          PY
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Validate final SciAgent escalation seam
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::sandbox_approval --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::tool_runtime --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::sandbox --lib --locked
          cargo +nightly-2026-07-02 test -p scirust-sciagent agentic::tests --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-sciagent --all-targets --locked -- -D warnings
      - name: Commit product-only tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sandbox-escalation-1266.yml
          git rm .github/workflows/tmp-run-sandbox-escalation-1266.yml
          git rm .github/workflows/tmp-retry-sandbox-escalation-1266.yml
          git add scirust-sciagent/src/agentic
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sciagent): enforce one-shot sandbox escalation"
          git push origin HEAD:feat/sciagent-sandbox-escalation

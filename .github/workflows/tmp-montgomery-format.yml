name: Temporary Montgomery rustfmt

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: feat/elliptic-montgomery-toy-clean

jobs:
  format-and-promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BRANCH }}
      - name: Install pinned formatter
        run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Format and verify
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 fmt --all -- --check
          git diff --check
      - name: Commit formatted source only
        run: |
          git rm .github/workflows/tmp-montgomery-format.yml
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add scirust-elliptic-discovery/src/montgomery.rs scirust-elliptic-discovery/src/lib.rs
          git commit -m 'style(elliptic): format Montgomery toy model'
          git push origin HEAD:${BRANCH}

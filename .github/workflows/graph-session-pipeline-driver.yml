name: GraphSession compiler pipeline driver

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'research/tensor-graph-session-pipeline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/tensor-graph-session-pipeline
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt,clippy

      - name: Apply GraphSession compiler-pipeline migration
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          import textwrap

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}"
                  )
              p.write_text(text.replace(old, new, expected))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex matched {count} times: {pattern!r}")
              p.write_text(updated)

          # --------------------------------------------------------------
          # GraphSession migration.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/src/graph_session.rs",
              "CanonicalCompiler, ExternalBindings, ExternalValueKind, KernelLowerer, LogicalBindingId,",
              "CanonicalCompiler, CompilerPipeline, ExternalValueKind, LogicalBindingId,",
          )

          prepare_body = textwrap.indent(
              textwrap.dedent(
                  """\
          pub fn prepare(
              runtime: ReferencePlanRuntime<B>,
              graph: &Graph,
              constants: &GraphConstants<'_>,
          ) -> Result<Self, GraphSessionPreparationError> {
              let mut pipeline = CompilerPipeline::new();
              Self::prepare_with_pipeline(runtime, graph, constants, &mut pipeline)
          }

          /// Compiles, optimizes, lowers and prepares `graph` through `pipeline`.
          ///
          /// The caller controls the compiler-pass sequence while the session keeps
          /// ownership of runtime preparation. This method runs the pipeline once;
          /// [`Self::execute`] never reruns compiler passes.
          pub fn prepare_with_pipeline(
              runtime: ReferencePlanRuntime<B>,
              graph: &Graph,
              constants: &GraphConstants<'_>,
              pipeline: &mut CompilerPipeline,
          ) -> Result<Self, GraphSessionPreparationError> {
              // 1. Canonical compilation. Validates the graph and eliminates every
              //    node unreachable from the declared outputs.
              let execution_plan = CanonicalCompiler::new()
                  .compile(graph)
                  .map_err(|source| GraphSessionPreparationError::GraphCompilation { source })?;

              // 2. Compiler SSA, caller-selected passes, post-pass memory planning
              //    and logical lowering. CompilerPipeline keeps these artefacts coherent.
              let compiled = pipeline
                  .compile_execution_plan(&execution_plan)
                  .map_err(|source| GraphSessionPreparationError::CompilerPipeline { source })?;
              let lowered = compiled.lowered_plan();

              // 3-5. Walk the post-pass plan's own binding table and correlate every
              //      entry with the canonical graph.
              let resolved = resolve_bindings(graph, lowered)?;

              // 6-7. Validate the whole constant store, then clone only what survives.
              let (payloads, constant_bindings) = resolve_constants(graph, &resolved, constants)?;

              // 8. Physical preparation. The graph-supplied types complete metadata
              //    that a lowered plan cannot carry on external-only outputs.
              let prepared = runtime
                  .prepare_with_external_types(lowered, &resolved.external_types)
                  .map_err(|source| GraphSessionPreparationError::PlanPreparation { source })?;

              // 9. The prepared plan must describe exactly the bindings we resolved.
              check_prepared_externals(&prepared, &resolved)?;

              // 10. The prepared outputs must be the graph's outputs, in order.
              let outputs = resolve_outputs(graph, &prepared)?;

              // 11. Immutable session. `compiled` can now be dropped: execution owns
              //     only the prepared backend plan and resolved graph metadata.
              Ok(Self {
                  runtime,
                  prepared,
                  inputs: resolved.inputs,
                  input_bindings: resolved.input_bindings,
                  input_lengths: resolved.input_lengths,
                  constants: resolved.constants,
                  constant_bindings,
                  payloads,
                  outputs,
              })
          }
          """
              ),
              "    ",
          )
          replace_regex(
              "scirust-tensor-runtime/src/graph_session.rs",
              r"    pub fn prepare\(.*?\n    \}\n\n(?=    pub const fn runtime)",
              prepare_body + "\n",
          )

          # --------------------------------------------------------------
          # Typed pipeline error. Keep legacy direct-lowering variant public.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              "BufferSlot, CompileError, ExternalValueKind, LogicalBindingId, LogicalKernelId, LoweringError,",
              "BufferSlot, CompileError, CompilerPipelineError, ExternalValueKind, LogicalBindingId, LogicalKernelId, LoweringError,",
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              "/// The three encapsulating variants keep the underlying compiler, lowerer and\n/// plan-runtime errors intact and reachable through [`core::error::Error::source`]",
              "/// The encapsulating variants keep compiler, compiler-pipeline, legacy lowerer\n/// and plan-runtime errors intact and reachable through [`core::error::Error::source`]",
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              "    /// `KernelLowerer` rejected the execution plan.\n    KernelLowering { source: LoweringError },\n",
              "    /// Legacy direct `KernelLowerer` failure, retained for API compatibility.\n    KernelLowering { source: LoweringError },\n    /// `CompilerPipeline` rejected the canonical execution plan.\n    CompilerPipeline { source: CompilerPipelineError },\n",
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              "            Self::PlanPreparation { source } =>\n",
              "            Self::CompilerPipeline { source } =>\n            {\n                write!(formatter, \"compiler pipeline failed: {source}\")\n            },\n            Self::PlanPreparation { source } =>\n",
          )
          replace_exact(
              "scirust-tensor-runtime/src/error.rs",
              "            Self::KernelLowering { source } => Some(source),\n            Self::PlanPreparation { source } => Some(source),\n",
              "            Self::KernelLowering { source } => Some(source),\n            Self::CompilerPipeline { source } => Some(source),\n            Self::PlanPreparation { source } => Some(source),\n",
          )

          # --------------------------------------------------------------
          # Integration tests.
          # --------------------------------------------------------------
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              "use scirust_tensor_compile::{CompileError, LoweringError};",
              "use scirust_tensor_compile::{\n    CompileError, CompilerIrLoweringError, CompilerPipeline, CompilerPipelineError, LoweringError,\n    ScaleZeroCanonicalizationPass,\n};",
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              "// The eight supported opcodes",
              "// The nine supported opcodes",
          )

          custom_test = """#[test]
          fn custom_compiler_pipeline_reaches_graph_session_execution() {
              let (graph, input) = unary_graph(
                  Operation::Scale {
                      factor: Scalar::f32(0.0),
                  },
                  vec![5],
              );
              let mut pipeline = CompilerPipeline::new();
              pipeline.push_pass(ScaleZeroCanonicalizationPass);

              let session = ReferenceGraphSession::prepare_with_pipeline(
                  runtime(),
                  &graph,
                  &GraphConstants::new(),
                  &mut pipeline,
              )
              .expect("preparable graph through compiler pipeline");

              let values = [f32::NAN, f32::INFINITY, f32::NEG_INFINITY, -0.0, 7.5];
              let mut inputs = GraphInputs::new();
              inputs.bind(input, &values);

              let outputs = session.execute(&inputs).expect("successful run");
              assert_eq!(bits(&outputs.into_values()[0].values), vec![0u32; values.len()]);
          }

          """
          replace_exact(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              "#[test]\nfn executes_scale() {",
              custom_test + "#[test]\nfn executes_scale() {",
          )

          replace_regex(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              r"Some\(GraphSessionPreparationError::KernelLowering \{\s*source: LoweringError::UnsupportedOperation \{\s*node: product,\s*operation: Operation::MatMul,\s*\},\s*\}\)",
              "Some(GraphSessionPreparationError::CompilerPipeline {\n            source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(\n                LoweringError::UnsupportedOperation {\n                    node: product,\n                    operation: Operation::MatMul,\n                },\n            )),\n        })",
          )
          replace_regex(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              r"Some\(GraphSessionPreparationError::KernelLowering \{\s*source: LoweringError::InvalidReshape \{ node: reshaped \},\s*\}\)",
              "Some(GraphSessionPreparationError::CompilerPipeline {\n            source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(\n                LoweringError::InvalidReshape { node: reshaped },\n            )),\n        })",
          )
          replace_regex(
              "scirust-tensor-runtime/tests/reference_graph_session.rs",
              r"Some\(GraphSessionPreparationError::KernelLowering \{\s*source: LoweringError::OperandTypeMismatch \{ \.\. \},\s*\}\)",
              "Some(GraphSessionPreparationError::CompilerPipeline {\n                source: CompilerPipelineError::Lowering(CompilerIrLoweringError::Lowering(\n                    LoweringError::OperandTypeMismatch { .. },\n                )),\n            })",
          )

      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Test Reference graph session
        run: cargo test -p scirust-tensor-runtime --test reference_graph_session

      - name: Clippy tensor runtime
        run: cargo +nightly-2026-07-02 clippy -p scirust-tensor-runtime --all-targets -- -D warnings

      - name: Commit validated source patch and remove staging driver
        run: |
          rm .github/workflows/graph-session-pipeline-driver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tensor-runtime): route graph sessions through compiler pipeline"
          git push origin HEAD:research/tensor-graph-session-pipeline

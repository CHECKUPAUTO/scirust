name: Temporary CLI contract test patch

on:
  push:
    branches:
      - fix/issue-1231-cli-contract
    paths:
      - .github/workflows/_tmp_patch_cli_contract_test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/issue-1231-cli-contract
          fetch-depth: 0
      - name: Add exact dispatch regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scirust-cli/src/lib.rs")
          text = path.read_text()
          anchor = '''    #[test]\n    fn unknown_command_is_rejected() {\n        assert_eq!(run(&s(&["frobnicate"])), 2);\n    }\n'''
          addition = anchor + '''\n    #[test]\n    fn library_capability_crates_are_not_dispatchable_subcommands() {\n        for command in [\n            "scirust-vision",\n            "scirust-audio",\n            "scirust-graph",\n            "scirust-sequential",\n            "scirust-multivariate",\n            "scirust-unsupervised",\n            "scirust-seasonal",\n            "scirust-nlp-advanced",\n            "scirust-automl",\n            "scirust-synthesis",\n            "scirust-algogen",\n            "scirust-codetrans",\n            "scirust-rl-algo",\n            "scirust-scaffold",\n        ]\n        {\n            assert_eq!(\n                run(&s(&[command])),\n                2,\n                "library-only capability `{command}` must not be dispatched as a command"\n            );\n        }\n    }\n'''
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f"expected one exact anchor, found {count}")
          path.write_text(text.replace(anchor, addition, 1))
          PY
          cargo fmt --all -- --check || cargo fmt --all
          git diff --check
          git diff -- scirust-cli/src/lib.rs
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/_tmp_patch_cli_contract_test.yml
          git add scirust-cli/src/lib.rs
          git config user.name "scirust-cli-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(cli): reject library-only crates as subcommands"
          git push origin HEAD:fix/issue-1231-cli-contract

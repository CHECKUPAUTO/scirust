name: tmp-m28-final-format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/m28-scirust-naive-vs-flat
          fetch-depth: 0
      - name: Apply repository-pinned rustfmt
        run: cargo fmt --all
      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-m28-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/examples/flat_m28_naive_vs_fused.rs .github/workflows/tmp-m28-final-format.yml
          git commit -m 'style(gpu): apply repository rustfmt to M28 baseline'
          git push origin HEAD:bench/m28-scirust-naive-vs-flat

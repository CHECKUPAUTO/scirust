name: SciAgent B42 finalizer

on:
  push:
    branches:
      - perf/sciagent-b39-thor-production-bench
    paths:
      - scripts/sciagent_b42_patch.py
      - .github/workflows/sciagent-b42-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/sciagent-b39-thor-production-bench
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Ensure B40 and B41 are applied
        run: |
          if ! grep -q 'GQA-correct RoPE without per-head slicing' scirust-sciagent/src/cuda_model.rs; then
            python3 scripts/sciagent_b40_patch.py
          fi
          if ! grep -q 'save_interval_seconds' scirust-sciagent/src/cuda_model.rs; then
            python3 scripts/sciagent_b41_patch.py
          fi
      - name: Apply B42 semantics guard
        run: python3 scripts/sciagent_b42_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test CPU and WGPU SCIAGENT surfaces
        run: |
          cargo test -p scirust-sciagent --lib
          cargo test -p scirust-gpu --lib
          cargo test -p scirust-sciagent --features gpu --test gpu_parity -- --nocapture
      - name: Check CUDA production surfaces
        run: |
          cargo check -p scirust-cuda --features cuda
          cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
          cargo check -p scirust-sciagent --features cuda,eval --example cuda_eval
          cargo check -p scirust-sciagent --features cuda --example cuda_production_bench
          cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Clippy changed production crates
        run: |
          cargo clippy -p scirust-cuda --features cuda --all-targets -- -D warnings
          cargo clippy -p scirust-gpu --all-targets -- -D warnings
          cargo clippy -p scirust-sciagent --features gpu,cuda,eval --all-targets -- -D warnings
      - name: Remove one-shot and diagnostic scaffolding
        run: |
          rm -f scripts/sciagent_b40_patch.py scripts/sciagent_b41_patch.py scripts/sciagent_b42_patch.py
          rm -f .github/workflows/sciagent-b40-apply.yml .github/workflows/sciagent-b41-apply.yml
          rm -f .github/workflows/sciagent-b42-finalize.yml
          rm -f .github/workflows/sciagent-final-diagnostics.yml
          rm -f .github/workflows/sciagent-wgpu-diagnostic.yml
          rm -f .github/workflows/sciagent-ci-report.yml
          rm -f SCIAGENT_CI_REPORT.tmp.md
          rm -rf ci-diagnostics
      - name: Commit validated production state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sciagent): finalize exact resume and head-local CUDA path"
          git push origin HEAD:perf/sciagent-b39-thor-production-bench

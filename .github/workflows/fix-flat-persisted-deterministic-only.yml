name: Fix persisted deterministic-only FLAT invariant

on:
  push:
    branches:
      - feat/flat-elastic-persisted-bootstrap-final

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-elastic-persisted-bootstrap-final
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Reapply deterministic-only invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/src/flat_autotune.rs')
          s = p.read_text()

          old = '''    if record.plan.objective != config.objective\n    {\n        return Err(FlatElasticError::PersistedObjectiveMismatch);\n    }\n    if record.plan.problem.family() != FLAT_ELASTIC_FAMILY\n'''
          new = '''    if record.plan.objective != config.objective\n    {\n        return Err(FlatElasticError::PersistedObjectiveMismatch);\n    }\n    if config.objective == ElasticObjective::DeterministicOnly\n        && !record.plan.evidence.candidate.deterministic\n    {\n        return Err(FlatElasticError::Selection(\n            ElasticSelectionError::NonDeterministicCandidate,\n        ));\n    }\n    if record.plan.problem.family() != FLAT_ELASTIC_FAMILY\n'''
          if s.count(old) != 1:
              raise SystemExit('persisted objective validation block changed')
          s = s.replace(old, new, 1)

          marker = '''    #[test]\n    fn persisted_bootstrap_rejects_missing_dependencies_stale_candidates_and_duplicates() {\n'''
          test = '''    #[test]\n    fn persisted_bootstrap_rejects_nondeterministic_deterministic_only_plan() {\n        let planner = planner(1, 17);\n        let hardware = hardware();\n        let locked = tuner(ElasticMode::Locked, ElasticObjective::MinLatency);\n        let mut plan = measured_plan(\n            &planner,\n            &locked,\n            hardware.clone(),\n            current_candidate().unwrap(),\n        );\n        assert!(!plan.evidence.candidate.deterministic);\n        plan.objective = ElasticObjective::DeterministicOnly;\n        let encoded = ElasticPersistedPlan::new(\n            plan,\n            ElasticMeasurementProtocol::new(\n                1,\n                3,\n                ElasticTimingSource::HostWallClock,\n                ElasticResidenceMode::Resident,\n                ElasticSynchronizationBoundary::PerIteration,\n            ),\n            true,\n            1,\n            b"forged-deterministic-only".to_vec(),\n            vec![FLAT_KERNEL_REVISION.to_vec()],\n        )\n        .unwrap()\n        .encode()\n        .unwrap();\n        let deterministic = ElasticConfig {\n            mode: ElasticMode::Locked,\n            objective: ElasticObjective::DeterministicOnly,\n            max_ranked_candidates: 0,\n        };\n        assert!(matches!(\n            persisted_cache_from_records(deterministic, &hardware, &[encoded], &[]),\n            Err(FlatElasticError::Selection(\n                ElasticSelectionError::NonDeterministicCandidate\n            ))\n        ));\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit('persisted bootstrap test insertion point changed')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: Qualify corrected bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 test -p scirust-gpu --features flat-autotune --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-gpu --features flat-autotune --all-targets --locked -- -D warnings
          cargo +1.89.0 check -p scirust-gpu --features flat-autotune --locked
      - name: Publish clean corrected head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/flat-elastic-persisted-bootstrap-final
          test "$(git rev-parse origin/feat/flat-elastic-persisted-bootstrap-final)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-flat-persisted-deterministic-only.yml
          git add scirust-gpu/src/flat_autotune.rs
          git commit -m "fix(autotune): reject nondeterministic locked plans"
          git push origin HEAD:feat/flat-elastic-persisted-bootstrap-final

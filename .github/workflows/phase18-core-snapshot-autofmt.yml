name: Phase 18 Core Snapshot Autofmt

on:
  push:
    branches:
      - research/phase18-wgpu-resident-minillm
    paths:
      - .github/workflows/phase18-core-snapshot-autofmt.yml

permissions:
  contents: write

jobs:
  patch-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase18-wgpu-resident-minillm
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
      - name: Add read-only MiniLLM inference snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-core/src/nn/transformer/mini_llm.rs')
          text = path.read_text()
          if 'pub struct MiniLlmInferenceSnapshot' not in text:
              marker = 'impl MiniLLM {\n'
              if marker not in text:
                  raise SystemExit('MiniLLM impl insertion point not found')
              replacement = '''/// Borrowed, read-only view of the parameters required for incremental inference.\n///\n/// This keeps `MiniLLM` internals encapsulated while allowing accelerator crates\n/// to snapshot inference weights without depending on training/tape state.\npub struct MiniLlmInferenceSnapshot<'a> {\n    pub config: &'a MiniLLMConfig,\n    pub embedding: &'a crate::nn::embedding::Embedding,\n    pub positional_encoding: &'a PositionalEncoding,\n    pub encoder: &'a TransformerEncoder,\n    pub final_norm: &'a LayerNorm,\n    pub lm_head: &'a Linear,\n}\n\nimpl MiniLLM {\n    /// Borrow the immutable parameters and topology needed by an inference backend.\n    #[must_use]\n    pub fn inference_snapshot(&self) -> MiniLlmInferenceSnapshot<'_> {\n        MiniLlmInferenceSnapshot {\n            config: &self.config,\n            embedding: &self.embed,\n            positional_encoding: &self.pos_enc,\n            encoder: &self.encoder,\n            final_norm: &self.ln_f,\n            lm_head: &self.lm_head,\n        }\n    }\n\n'''
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
      - run: cargo +nightly-2026-07-02 fmt --all
      - name: Commit snapshot API
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-core/src/nn/transformer/mini_llm.rs
          git commit -m "feat(transformer): expose read-only MiniLLM inference snapshot"
          git push origin HEAD:research/phase18-wgpu-resident-minillm

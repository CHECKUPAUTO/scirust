name: SciAgent B32 exact optimizer resume

on:
  pull_request:
    branches:
      - perf/sciagent-b31-cuda-kv-cache

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sciagent-b32-exact-resume
          fetch-depth: 0
      - name: Apply B32 source patch
        run: python3 scripts/sciagent_b32_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check CUDA backend
        run: cargo check -p scirust-cuda --features cuda
      - name: Check SciAgent CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
      - name: Compile CUDA parity test
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Test checkpoint/CPU surface
        run: cargo test -p scirust-sciagent --lib
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b32_patch.py .github/workflows/sciagent-b32-apply.yml
      - name: Commit and push validated B32
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): resume CUDA AdamW state exactly"
          git push origin HEAD:fix/sciagent-b32-exact-resume

name: Elastic Latent KV Phase 13 Legacy Inference

on:
  push:
    branches:
      - research/elastic-latent-kv-phase13-legacy-infer
    paths:
      - scirust-core/src/nn/elastic_latent_transformer.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE13_LEGACY_INTEGRATION.md
      - .github/workflows/elastic-latent-kv-phase13-legacy.yml
  pull_request:
    branches: [master]
    paths:
      - scirust-core/src/nn/elastic_latent_transformer.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE13_LEGACY_INTEGRATION.md
      - .github/workflows/elastic-latent-kv-phase13-legacy.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +nightly-2026-07-02 fmt --all -- --check
      - run: cargo +nightly-2026-07-02 clippy -p scirust-core --all-targets --locked -- -D warnings
      - run: cargo +1.89.0 check -p scirust-core --all-targets --locked
      - run: cargo +1.89.0 test -p scirust-core elastic_encoder_ --locked
      - run: cargo +1.89.0 run --quiet --locked -p scirust-core --example latent_kv_phase13

name: Temporary PR1260 Landlock finalizer 2

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/tmp-landlock1260-finalizer2.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply strict Landlock hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          landlock = Path('scirust-sciagent/src/agentic/sandbox/landlock.rs')
          text = landlock.read_text()

          replacements = [
              ('    const MAX_ABI: u32 = 5;', '    const MIN_STRICT_ABI: u32 = 3;\n    const MAX_ABI: u32 = 5;'),
              ('''        let abi = u32::try_from(abi).ok()?;
        Some(Support {
            abi,
            enforcement: enforcement_for_abi(abi),
        })''', '''        let abi = u32::try_from(abi).ok()?;
        if abi < MIN_STRICT_ABI
        {
            return None;
        }
        Some(Support {
            abi,
            enforcement: enforcement_for_abi(abi),
        })'''),
              ('''    fn enforcement_for_abi(abi: u32) -> SandboxEnforcement {
        if abi < MAX_ABI
        {
            SandboxEnforcement::Partial
        }
        else
        {
            SandboxEnforcement::Full
        }
    }''', '''    fn enforcement_for_abi(_abi: u32) -> SandboxEnforcement {
        SandboxEnforcement::Partial
    }'''),
              ('''        if matches!(mode, SandboxMode::WorkspaceWrite)
        {
            rules.push(rule(Path::new("/tmp"), handled)?);
            rules.push(rule(workspace_root, handled)?);
        }''', '''        if matches!(mode, SandboxMode::WorkspaceWrite)
        {
            rules.push(rule(workspace_root, handled)?);
        }'''),
              ('''        #[test]
        fn enforcement_is_partial_before_abi_five() {
            assert_eq!(enforcement_for_abi(1), SandboxEnforcement::Partial);
            assert_eq!(enforcement_for_abi(4), SandboxEnforcement::Partial);
            assert_eq!(enforcement_for_abi(5), SandboxEnforcement::Full);
            assert_eq!(enforcement_for_abi(9), SandboxEnforcement::Full);
        }''', '''        #[test]
        fn landlock_is_always_reported_as_partial_enforcement() {
            assert_eq!(enforcement_for_abi(3), SandboxEnforcement::Partial);
            assert_eq!(enforcement_for_abi(4), SandboxEnforcement::Partial);
            assert_eq!(enforcement_for_abi(5), SandboxEnforcement::Partial);
            assert_eq!(enforcement_for_abi(9), SandboxEnforcement::Partial);
        }'''),
          ]
          for old, new in replacements:
              if new not in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected source anchor once, found {text.count(old)}: {old[:60]!r}')
                  text = text.replace(old, new, 1)

          old = '''        #[test]
        fn workspace_write_adds_tmp_and_workspace_rw() {
            let plan = build_plan(SandboxMode::WorkspaceWrite, Path::new("/workspace"), 5).unwrap();
            assert_eq!(plan.rules.len(), 4);
            assert_eq!(plan.rules[2].path.to_bytes(), b"/tmp");
            assert_eq!(plan.rules[2].access, plan.handled);
            assert_eq!(plan.rules[3].path.to_bytes(), b"/workspace");
            assert_eq!(plan.rules[3].access, plan.handled);
        }'''
          new = '''        #[test]
        fn workspace_write_grants_only_the_workspace_beyond_dev_null() {
            let plan = build_plan(SandboxMode::WorkspaceWrite, Path::new("/workspace"), 5).unwrap();
            assert_eq!(plan.rules.len(), 3);
            assert_eq!(plan.rules[2].path.to_bytes(), b"/workspace");
            assert_eq!(plan.rules[2].access, plan.handled);
        }

        #[test]
        fn live_landlock_enforces_workspace_boundary_when_supported() {
            let Some(support) = probe()
            else
            {
                return;
            };
            assert!(support.abi >= MIN_STRICT_ABI);

            let nonce = format!(
                "{}-{}",
                std::process::id(),
                std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)
                    .unwrap()
                    .as_nanos()
            );
            let base = std::env::temp_dir().join(format!("scirust-landlock-{nonce}"));
            let workspace = base.join("workspace");
            let outside = base.join("outside.txt");
            let inside = workspace.join("inside.txt");
            std::fs::create_dir_all(&workspace).unwrap();
            std::fs::write(&inside, b"seed").unwrap();

            let write_command = |path: &Path, mode: SandboxMode| {
                let mut command = Command::new("sh");
                command.args(["-c", r#"printf '%s' "$1" > "$2""#, "sh", "payload"]);
                command.arg(path);
                configure_command(&mut command, mode, &workspace, support).unwrap();
                command.output().unwrap()
            };

            let read_only = write_command(&inside, SandboxMode::ReadOnly);
            assert!(!read_only.status.success());
            assert_eq!(std::fs::read(&inside).unwrap(), b"seed");

            let workspace_write = write_command(&inside, SandboxMode::WorkspaceWrite);
            assert!(workspace_write.status.success());
            assert_eq!(std::fs::read(&inside).unwrap(), b"payload");

            let outside_write = write_command(&outside, SandboxMode::WorkspaceWrite);
            assert!(!outside_write.status.success());
            assert!(!outside.exists());
            std::fs::remove_dir_all(&base).unwrap();
        }'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected workspace test once, found {text.count(old)}')
              text = text.replace(old, new, 1)
          landlock.write_text(text)

          sandbox = Path('scirust-sciagent/src/agentic/sandbox.rs')
          text = sandbox.read_text()
          old = '''        let full = landlock_support(5, SandboxEnforcement::Full);
        assert_eq!(
            select_backend(SandboxMode::WorkspaceWrite, None, Some(full), true).unwrap(),
            (
                SandboxBackend::Landlock(full),
                Some(SandboxEnforcement::Full)
            )
        );'''
          new = '''        let abi_five = landlock_support(5, SandboxEnforcement::Partial);
        assert_eq!(
            select_backend(SandboxMode::WorkspaceWrite, None, Some(abi_five), true).unwrap(),
            (
                SandboxBackend::Landlock(abi_five),
                Some(SandboxEnforcement::Partial)
            )
        );'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected Landlock selection test once, found {text.count(old)}')
              text = text.replace(old, new, 1)

          marker = '''    for variable in SECRET_ENV_VARS
    {
        command.env_remove(variable);
    }'''
          injected = '''    if matches!(backend, SandboxBackend::Landlock(_))
        && matches!(config.mode, SandboxMode::WorkspaceWrite)
    {
        let private_tmp = root.join("target/.sciagent-tmp");
        std::fs::create_dir_all(&private_tmp).map_err(|error| {
            sandbox_unavailable(
                config.mode,
                format!(
                    "cannot prepare workspace-local TMPDIR `{}` for Landlock: {error}",
                    private_tmp.display()
                ),
            )
        })?;
        command.env("TMPDIR", private_tmp);
    }

    for variable in SECRET_ENV_VARS
    {
        command.env_remove(variable);
    }'''
          if injected not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected secret-env marker once, found {text.count(marker)}')
              text = text.replace(marker, injected, 1)
          sandbox.write_text(text)
          PY
          rustup run nightly-2026-07-02 cargo fmt --all
          git diff --check
      - name: Prove live Landlock enforcement
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent live_landlock_enforces_workspace_boundary_when_supported --locked -- --nocapture
          rustup run nightly-2026-07-02 cargo test -p scirust-sciagent agentic::sandbox:: --locked -- --nocapture
      - name: Commit proven source and self-delete
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-sciagent/src/agentic/sandbox.rs scirust-sciagent/src/agentic/sandbox/landlock.rs
          git rm .github/workflows/tmp-landlock1260-finalizer2.yml
          git diff --cached --check
          git commit -m "fix(sciagent): harden native Landlock fallback"
          git push origin "HEAD:${HEAD_REF}"

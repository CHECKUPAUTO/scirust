name: Rustdoc fix scirust-rsi

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/rustdoc-fix-rsi.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
          fetch-depth: 0
      - name: Fix redundant BootstrapTask rustdoc target
        shell: python
        run: |
          from pathlib import Path
          path = Path('scirust-rsi/src/llm.rs')
          text = path.read_text()
          old = '/// [`BootstrapTask`](crate::star::BootstrapTask).'
          new = '/// [`BootstrapTask`].'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one BootstrapTask explicit link, found {count}')
          path.write_text(text.replace(old, new))
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rustdoc-fix-rsi.yml
          git config user.name "CHECKUPAUTO"
          git config user.email "194770978+CHECKUPAUTO@users.noreply.github.com"
          git add scirust-rsi/src/llm.rs .github/workflows/rustdoc-fix-rsi.yml
          git commit -m "docs: fix scirust-rsi BootstrapTask link"
          git push origin HEAD:codex/gate-workspace-rustdoc

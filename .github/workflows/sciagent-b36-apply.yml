name: SciAgent B36 distributed validation

on:
  push:
    branches:
      - fix/sciagent-b36-distributed-validation
    paths:
      - scripts/sciagent_b36_patch.py
      - .github/workflows/sciagent-b36-apply.yml
  pull_request:
    branches:
      - fix/sciagent-b35-deterministic-gradnorm

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sciagent-b36-distributed-validation
          fetch-depth: 0
      - name: Apply B36 source patch
        run: python3 scripts/sciagent_b36_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test SciAgent CPU surface
        run: cargo test -p scirust-sciagent --lib
      - name: Check CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
      - name: Check CUDA eval
        run: cargo check -p scirust-sciagent --features cuda,eval --example cuda_eval
      - name: Compile CUDA parity
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b36_patch.py .github/workflows/sciagent-b36-apply.yml
      - name: Commit and push validated B36
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): distribute held-out validation across corpus"
          git push origin HEAD:fix/sciagent-b36-distributed-validation

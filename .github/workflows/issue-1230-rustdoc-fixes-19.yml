name: Issue 1230 rustdoc fixes 19

on:
  push:
    branches: [fix/issue-1230-workspace-rustdoc]
    paths:
      - ".github/workflows/issue-1230-rustdoc-fixes-19.yml"

permissions:
  contents: write

jobs:
  patch-rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fix nonlocal-relativity rustdoc links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'scirust-nonlocal-relativity/src/geometric_error.rs': [
                  ('this crate\'s [`NonlocalRelativityError`] contract (see [`map_tetrad_error`]),',
                   'this crate\'s [`NonlocalRelativityError`] contract (see `map_tetrad_error`),'),
              ],
              'scirust-nonlocal-relativity/src/transport.rs': [
                  ('/// [`HistoryBackend::push_velocity`] path), transport is limited to the',
                   '/// `HistoryBackend::push_velocity` path), transport is limited to the'),
                  ('/// [`HistoryBackend::push_entry`] implementations. It performs `O(len)`',
                   '/// `HistoryBackend::push_entry` implementations. It performs `O(len)`'),
                  ('/// This is the same per-segment mechanism [`HistoryBackend::push_entry`]',
                   '/// This is the same per-segment mechanism `HistoryBackend::push_entry`'),
                  ('/// [`HistoryBackend::push_entry`] calls this once per accepted segment for',
                   '/// `HistoryBackend::push_entry` calls this once per accepted segment for'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit rustdoc fixes
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-nonlocal-relativity/src/geometric_error.rs scirust-nonlocal-relativity/src/transport.rs
          git diff --cached --check
          git commit -m "docs(nonlocal-relativity): fix rustdoc links"
          git push origin "HEAD:${HEAD_REF}"

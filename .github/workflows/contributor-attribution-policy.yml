name: Contributor attribution policy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  attribution-policy:
    name: Enforce canonical author
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit attribution
        shell: bash
        env:
          CANONICAL_AUTHOR_NAME: ZEKRITI Tarek
          CANONICAL_AUTHOR_EMAIL: 194770978+CHECKUPAUTO@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            range="$head"
          else
            range="$base..$head"
          fi

          mapfile -t commits < <(git rev-list --reverse "$range")

          if (( ${#commits[@]} == 0 )); then
            echo "No commits to validate."
            exit 0
          fi

          failed=0
          for sha in "${commits[@]}"; do
            author_name="$(git show -s --format='%an' "$sha")"
            author_email="$(git show -s --format='%ae' "$sha")"

            if [[ "$author_name" != "$CANONICAL_AUTHOR_NAME" || "$author_email" != "$CANONICAL_AUTHOR_EMAIL" ]]; then
              echo "::error::Commit $sha has unauthorized author: $author_name <$author_email>. Expected: $CANONICAL_AUTHOR_NAME <$CANONICAL_AUTHOR_EMAIL>."
              failed=1
            fi

            if git show -s --format='%B' "$sha" | grep -qiE '^[[:space:]]*co-authored-by:[[:space:]]*'; then
              echo "::error::Commit $sha contains a forbidden Co-authored-by trailer."
              failed=1
            fi
          done

          if (( failed != 0 )); then
            exit 1
          fi

          echo "Attribution policy satisfied for ${#commits[@]} commit(s)."

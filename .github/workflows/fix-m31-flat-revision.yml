# registration trigger v4
name: Fix M31 FLAT revision identity

on:
  push:
    branches:
      - feat/m31-stable-flat-adapter

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/m31-stable-flat-adapter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Bind Elastic candidate identity to the pinned M30 FLAT revision
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/src/flat_autotune.rs')
          s = p.read_text()
          old = 'flat-attention@311f6b89e001d69f53cddcd2f9ba396a6f80c746'
          new = 'flat-attention@24d3340edeb059e40e0fe0c400e814685701d855'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old FLAT identity, found {s.count(old)}')
          s = s.replace(old, new, 1)
          marker = 'const FLAT_WGSL_MAX_HEAD_DIM: usize = 128;\n'
          guard = '''\n#[cfg(test)]\n#[test]\nfn flat_candidate_revision_matches_manifest_pin() {\n    let revision = FLAT_KERNEL_REVISION\n        .strip_prefix(b"flat-attention@")\n        .expect("FLAT candidate revision must use the flat-attention@<sha> identity");\n    let revision = core::str::from_utf8(revision).expect("FLAT revision SHA must be UTF-8");\n    let dependency = include_str!("../Cargo.toml")\n        .lines()\n        .find(|line| line.trim_start().starts_with("flat-attention = {"))\n        .expect("scirust-gpu manifest must declare the FLAT dependency");\n    let expected = format!("rev = \\"{revision}\\"");\n    assert!(\n        dependency.contains(&expected),\n        "Elastic candidate identity {revision} does not match Cargo FLAT pin: {dependency}"\n    );\n}\n\n'''
          if 'fn flat_candidate_revision_matches_manifest_pin()' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected one insertion marker, found {s.count(marker)}')
              s = s.replace(marker, guard + marker, 1)
          p.write_text(s)
          PY
          grep -F 'rev = "24d3340edeb059e40e0fe0c400e814685701d855"' scirust-gpu/Cargo.toml
          grep -F 'flat-attention@24d3340edeb059e40e0fe0c400e814685701d855' scirust-gpu/src/flat_autotune.rs
          ! grep -F 'flat-attention@311f6b89e001d69f53cddcd2f9ba396a6f80c746' scirust-gpu/src/flat_autotune.rs
      - name: Qualify corrected FLAT Elastic contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 test -p scirust-gpu --features flat-autotune --lib --locked
          cargo +nightly-2026-07-02 clippy -p scirust-gpu --features flat-autotune --all-targets --locked -- -D warnings
      - name: Publish clean corrected head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m31-stable-flat-adapter
          test "$(git rev-parse origin/feat/m31-stable-flat-adapter)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-m31-flat-revision.yml
          git add scirust-gpu/src/flat_autotune.rs
          git commit -m "fix(autotune): bind candidates to M30 FLAT revision"
          git push origin HEAD:feat/m31-stable-flat-adapter

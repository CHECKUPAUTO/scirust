name: PR 941 one-shot synchronization

on:
  push:
    branches:
      - claude/tensor-parity-reduction-extra-2q8v
    paths:
      - .github/workflows/pr941-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: claude/tensor-parity-reduction-extra-2q8v
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Synchronize and validate tensor parity changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin master
          git merge --no-edit origin/master

          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 test -p scirust-tensor-reference --all-targets
          cargo +nightly-2026-07-02 test -p scirust-tensor-runtime --all-targets
          cargo +nightly-2026-07-02 clippy -p scirust-tensor-reference --all-targets -- -D warnings
          cargo +nightly-2026-07-02 clippy -p scirust-tensor-runtime --all-targets -- -D warnings

          rm -f .github/workflows/pr941-sync.yml
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No synchronization changes were produced" >&2
            exit 1
          fi

          git commit -m "merge: synchronize tensor parity operations with master"
          git push origin HEAD:claude/tensor-parity-reduction-extra-2q8v

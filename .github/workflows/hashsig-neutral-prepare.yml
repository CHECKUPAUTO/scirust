name: Hashsig neutral-core preparation

on:
  push:
    branches:
      - refactor/hashsig-neutral-core

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install pinned SciRust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Extract neutral hash-signature crate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old = root / 'scirust-license/src/hashsig.rs'
          source = old.read_text()
          source = source.replace('pub(crate) const fn effective_height', 'pub const fn effective_height')
          source = source.replace('pub(crate) const fn capacity_for_height', 'pub const fn capacity_for_height')

          crate = root / 'scirust-hashsig'
          (crate / 'src').mkdir(parents=True, exist_ok=True)
          (crate / 'Cargo.toml').write_text('''[package]\nname = "scirust-hashsig"\nversion = "0.1.0"\nedition = "2021"\nrust-version = "1.85"\ndescription = "Pure-Rust deterministic Lamport/Merkle hash signatures shared across SciRust"\nlicense-file = "../LICENSE.md"\nrepository = "https://github.com/Memorithm/scirust"\n\n[dependencies]\nsha2 = "0.10"\n\n[lints.rust]\nunsafe_code = "deny"\n''')
          (crate / 'src/lib.rs').write_text(source)

          old.write_text('''//! Backward-compatible hash-signature namespace for `scirust-license`.\n//!\n//! The implementation now lives in the neutral `scirust-hashsig` crate so\n//! licensing, provenance, SciCapsule and verification products can share the\n//! same audited Lamport/Merkle primitive without depending on licensing.\n\npub use scirust_hashsig::*;\n''')

          license_toml = root / 'scirust-license/Cargo.toml'
          text = license_toml.read_text()
          dep = 'scirust-hashsig = { path = "../scirust-hashsig" }\n'
          if dep not in text:
              anchor = '[dependencies]\n'
              if anchor not in text:
                  raise SystemExit('scirust-license dependency anchor missing')
              text = text.replace(anchor, anchor + dep, 1)
              license_toml.write_text(text)

          workspace = root / 'Cargo.toml'
          text = workspace.read_text()
          member = '    "scirust-hashsig",\n'
          if member not in text:
              anchor = '    "scirust-license",\n'
              if anchor not in text:
                  raise SystemExit('workspace license anchor missing')
              text = text.replace(anchor, member + anchor, 1)
              workspace.write_text(text)
          PY

      - name: Format affected crates
        run: cargo +nightly-2026-07-02 fmt -p scirust-hashsig -p scirust-license -p scirust-provenance

      - name: Check neutral core and compatibility consumers
        run: cargo +nightly-2026-07-02 check -p scirust-hashsig -p scirust-license -p scirust-provenance

      - name: Clippy neutral core and compatibility consumers
        run: cargo +nightly-2026-07-02 clippy -p scirust-hashsig -p scirust-license -p scirust-provenance --all-targets --locked -- -D warnings

      - name: Test neutral core and compatibility consumers
        run: cargo +nightly-2026-07-02 test -p scirust-hashsig -p scirust-license -p scirust-provenance --locked

      - name: Install legacy license MSRV
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.85.0

      - name: Preserve license/hashsig MSRV 1.85
        run: cargo +1.85.0 check -p scirust-hashsig -p scirust-license --locked

      - name: Commit deterministic extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock scirust-hashsig scirust-license/Cargo.toml scirust-license/src/hashsig.rs
          if ! git diff --cached --quiet; then
            git commit -m "refactor(hashsig): extract neutral Lamport Merkle core"
            git push origin HEAD:refactor/hashsig-neutral-core
          fi

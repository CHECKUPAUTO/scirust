name: Rustdoc fix scirust-itd once

on:
  push:
    branches:
      - codex/gate-workspace-rustdoc
    paths:
      - .github/workflows/rustdoc-fix-itd-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/gate-workspace-rustdoc
      - name: Apply exact rustdoc fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          material = Path('scirust-itd/src/material.rs')
          text = material.read_text()
          old = '[`simulate`](crate::simulate::simulate)'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 explicit simulate links in material.rs, found {count}')
          text = text.replace(old, '[`simulate`]')
          material.write_text(text)

          lib = Path('scirust-itd/src/lib.rs')
          text = lib.read_text()
          old = '3. **The simulation driver** ([`simulate`])'
          if text.count(old) != 1:
              raise SystemExit('expected exactly 1 ambiguous simulation-driver link in lib.rs')
          text = text.replace(old, '3. **The simulation driver** ([`simulate()`])')
          lib.write_text(text)
          PY

          git diff --check
          grep -nF 'simulation ([`simulate`]) unchanged' scirust-itd/src/material.rs
          grep -nF '[`simulate`]); `advection`' scirust-itd/src/material.rs
          grep -nF 'The simulation driver** ([`simulate()`])' scirust-itd/src/lib.rs
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rustdoc-fix-itd-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-itd/src/material.rs scirust-itd/src/lib.rs .github/workflows/rustdoc-fix-itd-once.yml
          git commit -m 'docs: fix scirust-itd rustdoc links'
          git push origin HEAD:codex/gate-workspace-rustdoc

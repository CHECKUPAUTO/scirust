name: Fix FLAT evidence record identity v2

on:
  push:
    branches:
      - feat/flat-elastic-m15-evidence-bench-final

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-elastic-m15-evidence-bench-final
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Install MSRV and lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Derive collision-checked filenames from canonical plan keys
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/examples/flat_elastic_evidence_bench.rs')
          s = p.read_text()

          old = '''    use scirust_gpu::flat_autotune::{\n        ElasticAutoTuner, ElasticCandidate, ElasticConfig, ElasticEvidence, ElasticMode,\n        ElasticObjective, FlatElasticPlanner, FlatElasticRequest, FlatKvRepresentation,\n    };\n'''
          new = '''    use scirust_gpu::flat_autotune::{\n        ElasticAutoTuner, ElasticCandidate, ElasticConfig, ElasticEvidence, ElasticExecutionPlan,\n        ElasticMode, ElasticObjective, ElasticPlanKey, FlatElasticPlanner, FlatElasticRequest,\n        FlatKvRepresentation,\n    };\n'''
          if s.count(old) != 1:
              raise SystemExit('unexpected benchmark import block')
          s = s.replace(old, new, 1)

          old_write = '''            let record = ElasticPersistedPlan::new(\n                selected,\n                protocol,\n                true,\n                recorded_unix_ns,\n                provenance,\n                vec![\n                    BENCH_SCHEMA.to_vec(),\n                    FLAT_REVISION.to_vec(),\n                    source_dependency,\n                ],\n            )\n            .expect("build canonical selected-plan record");\n            let encoded = record\n                .encode()\n                .expect("encode canonical selected-plan record");\n            let path = dir.join(format!("flat-elastic-kv-{kv_len}.elauto"));\n            fs::write(&path, encoded).expect("write selected-plan record");\n'''
          new_write = '''            let plan_key = ElasticPlanKey::new(\n                selected.hardware.clone(),\n                selected.problem.clone(),\n                selected.objective,\n            );\n            let record_name = record_file_name(&selected);\n            let record = ElasticPersistedPlan::new(\n                selected,\n                protocol,\n                true,\n                recorded_unix_ns,\n                provenance,\n                vec![\n                    BENCH_SCHEMA.to_vec(),\n                    FLAT_REVISION.to_vec(),\n                    source_dependency,\n                ],\n            )\n            .expect("build canonical selected-plan record");\n            let encoded = record\n                .encode()\n                .expect("encode canonical selected-plan record");\n            let path = dir.join(record_name);\n            if path.exists()\n            {\n                let existing = fs::read(&path).expect("read existing selected-plan record");\n                let existing = ElasticPersistedPlan::decode(&existing)\n                    .expect("existing evidence record must remain canonically decodable");\n                let existing_key = ElasticPlanKey::new(\n                    existing.plan.hardware,\n                    existing.plan.problem,\n                    existing.plan.objective,\n                );\n                assert_eq!(\n                    existing_key, plan_key,\n                    "evidence record filename collision across different validity regions"\n                );\n            }\n            fs::write(&path, encoded).expect("write selected-plan record");\n'''
          if s.count(old_write) != 1:
              raise SystemExit('unexpected record write block')
          s = s.replace(old_write, new_write, 1)

          marker = '    fn assert_flat_revision_matches_manifest() {\n'
          helper = '''    fn record_file_name(plan: &ElasticExecutionPlan) -> String {\n        let mut hash = 0xcbf2_9ce4_8422_2325u64;\n        stable_hash_bytes(&mut hash, &plan.schema_version.to_le_bytes());\n        stable_hash_component(&mut hash, plan.hardware.canonical_bytes());\n        stable_hash_component(&mut hash, plan.problem.family().as_bytes());\n        stable_hash_component(&mut hash, plan.problem.class_key());\n        stable_hash_bytes(&mut hash, &[objective_id(plan.objective)]);\n        format!("flat-elastic-plan-{hash:016x}.elauto")\n    }\n\n    fn stable_hash_component(hash: &mut u64, bytes: &[u8]) {\n        let len = u64::try_from(bytes.len()).expect("plan-key component length exceeds u64");\n        stable_hash_bytes(hash, &len.to_le_bytes());\n        stable_hash_bytes(hash, bytes);\n    }\n\n    fn stable_hash_bytes(hash: &mut u64, bytes: &[u8]) {\n        for &byte in bytes\n        {\n            *hash ^= u64::from(byte);\n            *hash = hash.wrapping_mul(0x0000_0100_0000_01b3);\n        }\n    }\n\n    const fn objective_id(objective: ElasticObjective) -> u8 {\n        match objective\n        {\n            ElasticObjective::MinLatency => 0,\n            ElasticObjective::MaxThroughput => 1,\n            ElasticObjective::MinTemporaryMemory => 2,\n            ElasticObjective::BalancedLatencyMemory => 3,\n            ElasticObjective::DeterministicOnly => 4,\n        }\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit('record filename insertion point changed')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: Qualify compile lint and MSRV
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 check -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked
          cargo +nightly-2026-07-02 clippy -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked -- -D warnings
          cargo +1.89.0 check -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked
      - name: Prove distinct plan keys do not overwrite records
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flat-elastic-identity-records
          common_env=(
            SCIRUST_FLAT_ELASTIC_BENCH_KV_LENS=1
            SCIRUST_FLAT_ELASTIC_BENCH_WARMUPS=0
            SCIRUST_FLAT_ELASTIC_BENCH_REPEATS=1
            SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS=1
            SCIRUST_FLAT_ELASTIC_SOURCE_REVISION=identity-test
            SCIRUST_FLAT_ELASTIC_RECORD_DIR=/tmp/flat-elastic-identity-records
          )
          env "${common_env[@]}" SCIRUST_FLAT_ELASTIC_BENCH_Q_HEADS=8 \
            cargo +nightly-2026-07-02 run --quiet --release --locked -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench >/tmp/identity-a.csv
          env "${common_env[@]}" SCIRUST_FLAT_ELASTIC_BENCH_Q_HEADS=16 \
            cargo +nightly-2026-07-02 run --quiet --release --locked -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench >/tmp/identity-b.csv
          test "$(find /tmp/flat-elastic-identity-records -maxdepth 1 -type f -name '*.elauto' | wc -l)" -eq 2
          find /tmp/flat-elastic-identity-records -maxdepth 1 -type f -name '*.elauto' -printf '%f\n' | sort
      - name: Publish clean corrected head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/flat-elastic-m15-evidence-bench-final
          test "$(git rev-parse origin/feat/flat-elastic-m15-evidence-bench-final)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-flat-evidence-record-identity.yml
          git rm .github/workflows/fix-flat-evidence-record-identity-v2.yml
          git add scirust-gpu/examples/flat_elastic_evidence_bench.rs
          git commit -m "fix(autotune): key evidence records by validity region"
          git push origin HEAD:feat/flat-elastic-m15-evidence-bench-final

name: tmp-m31-export-fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m31-stable-flat-adapter
          fetch-depth: 0
      - name: Wire stable adapter and self-clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/src/lib.rs')
          s = p.read_text()
          mod_anchor = '#[cfg(feature = "flat-attention")]\nmod flat_training;\n'
          exp_anchor = '#[cfg(feature = "flat-attention")]\npub use flat_training::{\n    FlatGroupedTrainingConfig, FlatGroupedTrainingResult, WgpuFlatGroupedTrainingBridge,\n};\n'
          if 'mod flat_stable;' not in s:
              if mod_anchor not in s:
                  raise SystemExit('flat_training module anchor missing')
              s = s.replace(mod_anchor, mod_anchor + '#[cfg(feature = "flat-attention")]\nmod flat_stable;\n', 1)
          if 'pub use flat_stable::' not in s:
              if exp_anchor not in s:
                  raise SystemExit('flat_training export anchor missing')
              s = s.replace(exp_anchor, exp_anchor + '#[cfg(feature = "flat-attention")]\npub use flat_stable::{FlatStableFallbackPolicy, WgpuFlatStableAdapter};\n', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/src/lib.rs
          git rm .github/workflows/tmp-m31-export-fix.yml
          git commit -m 'feat(gpu): export stable FLAT adapter cleanly'
          git push origin HEAD:feat/m31-stable-flat-adapter

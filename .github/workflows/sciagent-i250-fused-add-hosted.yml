name: SciAgent I250 fused-add hosted

on:
  pull_request:
    branches: [ci/i250-fused-add-base]
    paths:
      - "scirust-cuda/**"
      - ".github/workflows/sciagent-i250-fused-add-hosted.yml"

permissions:
  contents: write

concurrency:
  group: sciagent-i250-fused-add-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  hosted:
    name: Fused add format + CUDA compile + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Add local API-shape Clippy allowance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scirust-cuda/src/bf16_tiled_gemv.rs")
          text = path.read_text()
          marker = "    /// `[1,K] × [K,N]`, BF16 projection boundary, then BF16 residual add.\n    pub fn gemv_kn_add_into(\n"
          replacement = "    /// `[1,K] × [K,N]`, BF16 projection boundary, then BF16 residual add.\n    #[allow(clippy::too_many_arguments)] // Mirrors the explicit GEMV + residual contract.\n    pub fn gemv_kn_add_into(\n"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("fused-add method marker not found")
              path.write_text(text.replace(marker, replacement, 1))
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: CUDA compile
        run: cargo +nightly-2026-07-02 check -p scirust-cuda --features cuda --all-targets --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust-cuda --features cuda --all-targets --locked -- -D warnings
      - name: Commit validated fused-add source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-cuda/src/bf16_tiled_gemv.rs
          if ! git diff --cached --quiet; then
            git commit -m "perf(cuda): keep fused tiled residual add Clippy-clean"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

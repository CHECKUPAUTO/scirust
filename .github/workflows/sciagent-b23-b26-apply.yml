name: SciAgent B23-B26 CUDA optimization

on:
  push:
    branches:
      - perf/sciagent-b23-b26-kernel-path
    paths:
      - scripts/sciagent_b23_b26_patch.py
      - .github/workflows/sciagent-b23-b26-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sciagent-b23-b26-kernel-path
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 scripts/sciagent_b23_b26_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Check CUDA backend without hardware
        run: cargo check -p scirust-cuda --features cuda

      - name: Check SciAgent CUDA pretrain path
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain

      - name: Check SciAgent library
        run: cargo check -p scirust-sciagent --features cuda

      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b23_b26_patch.py .github/workflows/sciagent-b23-b26-apply.yml

      - name: Commit validated optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sciagent): remove Route-B scalar CUDA bottlenecks"
          git push origin HEAD:perf/sciagent-b23-b26-kernel-path

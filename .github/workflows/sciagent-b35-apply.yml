name: SciAgent B35 deterministic grad norm

on:
  pull_request:
    branches:
      - fix/sciagent-b34-data-resume

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sciagent-b35-deterministic-gradnorm
          fetch-depth: 0
      - name: Apply B35 source patch
        run: python3 scripts/sciagent_b35_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check CUDA backend
        run: cargo check -p scirust-cuda --features cuda
      - name: Check SciAgent CUDA
        run: cargo check -p scirust-sciagent --features cuda
      - name: Compile CUDA parity
        run: cargo test -p scirust-sciagent --features cuda --test cuda_parity --no-run
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b35_patch.py .github/workflows/sciagent-b35-apply.yml
      - name: Commit and push validated B35
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sciagent): make CUDA grad norm deterministic"
          git push origin HEAD:fix/sciagent-b35-deterministic-gradnorm

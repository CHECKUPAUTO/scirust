name: tmp-m31-final-wire

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m31-stable-flat-adapter
          fetch-depth: 0
      - name: Export adapter and pin verified FLAT M30
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('scirust-gpu/src/lib.rs')
          text = lib.read_text()
          module_anchor = '''#[cfg(feature = "flat-attention")]\nmod flat_training;\n'''
          if 'mod flat_stable;' not in text:
              text = text.replace(
                  module_anchor,
                  module_anchor + '#[cfg(feature = "flat-attention")]\nmod flat_stable;\n',
                  1,
              )
          export_anchor = '''#[cfg(feature = "flat-attention")]\npub use flat_training::{\n    FlatGroupedTrainingConfig, FlatGroupedTrainingResult, WgpuFlatGroupedTrainingBridge,\n};\n'''
          if 'pub use flat_stable::' not in text:
              text = text.replace(
                  export_anchor,
                  export_anchor + '#[cfg(feature = "flat-attention")]\npub use flat_stable::{FlatStableFallbackPolicy, WgpuFlatStableAdapter};\n',
                  1,
              )
          lib.write_text(text)

          cargo = Path('scirust-gpu/Cargo.toml')
          text = cargo.read_text()
          old = '311f6b89e001d69f53cddcd2f9ba396a6f80c746'
          new = '24d3340edeb059e40e0fe0c400e814685701d855'
          if old not in text and new not in text:
              raise SystemExit('FLAT pin marker not found')
          text = text.replace(old, new)
          text = text.replace(
              'includes the M19-M24 native GQA/MQA backward, device-resident training-chain and\n# caller-owned grouped-forward surfaces without changing the feature from opt-in.',
              'includes the M19-M30 grouped forward/backward, resident training-chain, runtime\n# telemetry and stable api::v1 surfaces without changing the feature from opt-in.',
          )
          cargo.write_text(text)
          PY
          cargo update -p flat-attention --precise 24d3340edeb059e40e0fe0c400e814685701d855
          grep -F '24d3340edeb059e40e0fe0c400e814685701d855' Cargo.lock
          if grep -Fq '311f6b89e001d69f53cddcd2f9ba396a6f80c746' Cargo.lock; then
            echo 'old FLAT revision still present in Cargo.lock' >&2
            exit 1
          fi
          cargo fmt --all
      - name: Commit non-workflow generated files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/src/lib.rs scirust-gpu/src/flat_stable.rs scirust-gpu/Cargo.toml Cargo.lock
          git commit -m 'feat(gpu): wire rebased stable FLAT M30 adapter'
          git push origin HEAD:feat/m31-stable-flat-adapter

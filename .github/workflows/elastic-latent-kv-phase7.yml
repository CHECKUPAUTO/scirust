name: Elastic Latent KV Phase 7

on:
  push:
    branches:
      - research/elastic-latent-kv-phase7-runtime
    paths:
      - scirust-core/src/nn/latent_kv_cache.rs
      - scirust-core/src/nn/latent_kv_backend.rs
      - scirust-core/src/nn/mod.rs
      - scirust-core/examples/latent_kv_phase7.rs
      - experiments/elastic-latent-kv/PHASE7_SPEC.md
      - experiments/elastic-latent-kv/README.md
      - .github/workflows/elastic-latent-kv-phase7.yml
  pull_request:
    paths:
      - scirust-core/src/nn/latent_kv_cache.rs
      - scirust-core/src/nn/latent_kv_backend.rs
      - scirust-core/src/nn/mod.rs
      - scirust-core/examples/latent_kv_phase7.rs
      - experiments/elastic-latent-kv/PHASE7_SPEC.md
      - experiments/elastic-latent-kv/README.md
      - .github/workflows/elastic-latent-kv-phase7.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elastic-latent-kv-phase7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt
          rustup toolchain install 1.89.0 --profile minimal --component clippy

      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Clippy
        run: cargo +1.89.0 clippy -p scirust-core --all-targets -- -D warnings

      - name: Phase 7 tests
        run: cargo +1.89.0 test -p scirust-core latent_kv -- --test-threads=1

      - name: scirust-core library tests
        run: cargo +1.89.0 test -p scirust-core --lib -- --test-threads=1

      - name: Deterministic runtime harness
        run: |
          cargo +1.89.0 run --quiet --release -p scirust-core --example latent_kv_phase7 > phase7-a.csv
          cargo +1.89.0 run --quiet --release -p scirust-core --example latent_kv_phase7 > phase7-b.csv
          cmp phase7-a.csv phase7-b.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("phase7-a.csv")
          with path.open("r", encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None
          assert len(fields) == 12, len(fields)
          assert len(rows) == 4, len(rows)
          assert {row["format"] for row in rows} == {"f32", "int8", "int4"}
          assert len({row["output_fingerprint"] for row in rows}) == 4
          assert all(row["quality_guard_met"] == "1" for row in rows)
          assert all(float(row["compression_ratio"]) > 0.0 for row in rows)
          compressed = [row for row in rows if row["format"] != "f32"]
          assert all(int(row["allocated_bytes"]) < int(row["dense_bytes"]) for row in compressed)
          print("Phase 7 runtime CSV: CONFORME")
          PY

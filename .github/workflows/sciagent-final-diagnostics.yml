name: SciAgent final diagnostics

on:
  push:
    branches:
      - perf/sciagent-b39-thor-production-bench
    paths:
      - .github/workflows/sciagent-final-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/sciagent-b39-thor-production-bench
          fetch-depth: 0

      - name: Install exact toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install nightly-2026-07-02 --profile minimal --component clippy
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-07-02
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user gcc-aarch64-linux-gnu

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics

          cargo +1.89.0 check --workspace --all-targets --locked \
            > ci-diagnostics/msrv.log 2>&1
          echo $? > ci-diagnostics/msrv.exit

          cargo +nightly-2026-07-02 clippy --workspace --all-targets --locked -- -D warnings \
            > ci-diagnostics/clippy.log 2>&1
          echo $? > ci-diagnostics/clippy.exit

          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER='qemu-aarch64 -L /usr/aarch64-linux-gnu'
          {
            cargo +nightly-2026-07-02 test -p scirust-core --lib portable_f32 --release --locked --target aarch64-unknown-linux-gnu
            cargo +nightly-2026-07-02 test -p scirust-core --lib lowprec --release --locked --target aarch64-unknown-linux-gnu
            cargo +nightly-2026-07-02 test -p scirust-core --lib tree_allreduce --release --locked --target aarch64-unknown-linux-gnu
            cargo +nightly-2026-07-02 test -p scirust-core --lib formal_proof --release --locked --target aarch64-unknown-linux-gnu
          } > ci-diagnostics/cross-aarch64.log 2>&1
          echo $? > ci-diagnostics/cross-aarch64.exit

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics
          git commit -m "ci(sciagent): capture portable failure diagnostics"
          git push origin HEAD:perf/sciagent-b39-thor-production-bench

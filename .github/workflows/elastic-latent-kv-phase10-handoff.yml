name: Elastic Latent KV Phase 10 Runtime Handoff

on:
  push:
    branches:
      - master
    paths:
      - scirust-core/src/nn/elastic_latent_basis_handoff.rs
      - scirust-core/src/nn/elastic_latent_encoder_handoff.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE10_RUNTIME_HANDOFF.md
      - .github/workflows/elastic-latent-kv-phase10-handoff.yml
  pull_request:
    branches:
      - master
    paths:
      - scirust-core/src/nn/elastic_latent_basis_handoff.rs
      - scirust-core/src/nn/elastic_latent_encoder_handoff.rs
      - scirust-core/src/nn/mod.rs
      - experiments/elastic-latent-kv/PHASE10_RUNTIME_HANDOFF.md
      - .github/workflows/elastic-latent-kv-phase10-handoff.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - run: cargo +nightly-2026-07-02 fmt --all -- --check
      - run: cargo +nightly-2026-07-02 clippy -p scirust-core --all-targets --locked -- -D warnings
      - run: cargo +1.89.0 check -p scirust-core --all-targets --locked
      - run: cargo +1.89.0 test -p scirust-core elastic_latent_basis_handoff --locked -- --test-threads=1
      - run: cargo +1.89.0 test -p scirust-core elastic_latent_encoder_handoff --locked -- --test-threads=1

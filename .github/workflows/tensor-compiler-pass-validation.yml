name: Tensor Compiler Pass Validation

on:
  push:
    branches:
      - research/tensor-compiler-passes

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +nightly-2026-07-02 fmt --all -- --check
      - name: Test tensor compiler
        run: cargo +nightly-2026-07-02 test -p scirust-tensor-compile --locked
      - name: Clippy tensor compiler
        run: cargo +nightly-2026-07-02 clippy -p scirust-tensor-compile --all-targets --locked -- -D warnings

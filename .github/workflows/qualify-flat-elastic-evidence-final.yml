name: Qualify final FLAT Elastic evidence harness

on:
  push:
    branches:
      - feat/flat-elastic-m15-evidence-bench-final

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/flat-elastic-m15-evidence-bench-final
          fetch-depth: 0
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Install MSRV and lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
      - name: Materialize and harden benchmark harness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --silent --show-error \
            https://raw.githubusercontent.com/Memorithm/scirust/0cb3d0d7557782ff6be5b718944b7d5442dde7af/scirust-gpu/examples/flat_elastic_evidence_bench.rs \
            --output scirust-gpu/examples/flat_elastic_evidence_bench.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/examples/flat_elastic_evidence_bench.rs')
          s = p.read_text()

          def once(old: str, new: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:120]!r}')
              s = s.replace(old, new, 1)

          once(
              '    use std::env;\n    use std::fs;\n    use std::path::PathBuf;\n',
              '    use std::collections::BTreeSet;\n    use std::env;\n    use std::fs;\n    use std::path::{Path, PathBuf};\n',
          )
          once(
              '        b"flat-attention@311f6b89e001d69f53cddcd2f9ba396a6f80c746";\n',
              '        b"flat-attention@24d3340edeb059e40e0fe0c400e814685701d855";\n',
          )
          once(
              '            &[1, 17, 64, 256, 1024],\n',
              '            &[1, 2, 5, 17, 65, 257, 1025, 4097],\n',
          )
          once(
              '        let recorded_unix_ns = env_u64("SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS", 0);\n        let record_dir = env::var_os("SCIRUST_FLAT_ELASTIC_RECORD_DIR").map(PathBuf::from);\n',
              '        let recorded_unix_ns = env_u64("SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS", 0);\n        let record_dir = env::var_os("SCIRUST_FLAT_ELASTIC_RECORD_DIR").map(PathBuf::from);\n        let source_revision = env::var("SCIRUST_FLAT_ELASTIC_SOURCE_REVISION").ok();\n',
          )
          once(
              '        assert!(kv_lens.iter().all(|&len| len > 0));\n\n        let warmup_iterations',
              '        assert!(kv_lens.iter().all(|&len| len > 0));\n        assert_flat_revision_matches_manifest();\n\n        let warmup_iterations',
          )
          once(
              '        if let Some(dir) = &record_dir\n        {\n            fs::create_dir_all(dir).expect("create Elastic record output directory");\n        }\n',
              '        if let Some(dir) = &record_dir\n        {\n            assert!(\n                recorded_unix_ns > 0,\n                "SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS must be non-zero when records are written"\n            );\n            assert!(\n                source_revision\n                    .as_deref()\n                    .is_some_and(|revision| !revision.trim().is_empty()),\n                "SCIRUST_FLAT_ELASTIC_SOURCE_REVISION is required when records are written"\n            );\n            fs::create_dir_all(dir).expect("create Elastic record output directory");\n        }\n',
          )
          once(
              '        for kv_len in kv_lens\n        {\n            run_case(\n',
              '        let mut recorded_problem_classes = BTreeSet::new();\n        for kv_len in kv_lens\n        {\n            let recorded_problem_classes = record_dir\n                .as_ref()\n                .map(|_| &mut recorded_problem_classes);\n            run_case(\n',
          )
          once(
              '                protocol,\n                recorded_unix_ns,\n                record_dir.as_ref(),\n',
              '                protocol,\n                recorded_unix_ns,\n                source_revision.as_deref(),\n                record_dir.as_deref(),\n                recorded_problem_classes,\n',
          )
          once(
              '        recorded_unix_ns: u64,\n        record_dir: Option<&PathBuf>,\n    ) {\n',
              '        recorded_unix_ns: u64,\n        source_revision: Option<&str>,\n        record_dir: Option<&Path>,\n        recorded_problem_classes: Option<&mut BTreeSet<Vec<u8>>>,\n    ) {\n',
          )
          once(
              '        let planner = FlatElasticPlanner::new(request).expect("build FLAT Elastic planner");\n        let hardware = planner\n',
              '        let planner = FlatElasticPlanner::new(request).expect("build FLAT Elastic planner");\n        if let Some(seen) = recorded_problem_classes\n        {\n            let class_key = planner.problem_class().class_key().to_vec();\n            assert!(\n                seen.insert(class_key),\n                "duplicate H2 problem class for kv_len={kv_len}; write at most one record per validity region"\n            );\n        }\n        let hardware = planner\n',
          )
          once(
              '        if let Some(dir) = record_dir\n        {\n            let provenance = format!(\n                "scirust-flat-elastic-evidence-v1;adapter={};kv_len={kv_len};q_heads={q_heads};kv_heads={kv_heads};head_dim={head_dim}",\n                bridge.adapter_name()\n            )\n            .into_bytes();\n',
              '        if let Some(dir) = record_dir\n        {\n            let source_revision =\n                source_revision.expect("source revision validated before benchmark");\n            let provenance = format!(\n                "scirust-flat-elastic-evidence-v1;source={source_revision};adapter={};kv_len={kv_len};q_heads={q_heads};kv_heads={kv_heads};head_dim={head_dim}",\n                bridge.adapter_name()\n            )\n            .into_bytes();\n            let source_dependency = format!("scirust@{source_revision}").into_bytes();\n',
          )
          once(
              '                vec![BENCH_SCHEMA.to_vec(), FLAT_REVISION.to_vec()],\n',
              '                vec![\n                    BENCH_SCHEMA.to_vec(),\n                    FLAT_REVISION.to_vec(),\n                    source_dependency,\n                ],\n',
          )
          marker = '    fn candidate_named(\n'
          guard = '''    fn assert_flat_revision_matches_manifest() {\n        let revision = FLAT_REVISION\n            .strip_prefix(b"flat-attention@")\n            .expect("benchmark FLAT revision must use flat-attention@<sha>");\n        let revision = core::str::from_utf8(revision).expect("FLAT revision SHA must be UTF-8");\n        let dependency = include_str!("../Cargo.toml")\n            .lines()\n            .find(|line| line.trim_start().starts_with("flat-attention = {"))\n            .expect("scirust-gpu manifest must declare the FLAT dependency");\n        let expected = format!("rev = \\"{revision}\\"");\n        assert!(\n            dependency.contains(&expected),\n            "benchmark FLAT revision {revision} does not match Cargo pin: {dependency}"\n        );\n    }\n\n'''
          once(marker, guard + marker)
          p.write_text(s)
          PY
          cargo +nightly-2026-07-02 fmt --all
      - name: Compile, lint and MSRV-check harness
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all -- --check
          cargo +nightly-2026-07-02 check -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked
          cargo +nightly-2026-07-02 clippy -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked -- -D warnings
          cargo +1.89.0 check -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench --locked
      - name: Freeze qualified final tree identity
        shell: bash
        run: |
          set -euo pipefail
          git add scirust-gpu/examples/flat_elastic_evidence_bench.rs
          git rm .github/workflows/qualify-flat-elastic-evidence-final.yml
          echo "QUAL_TREE=$(git write-tree)" >> "$GITHUB_ENV"
      - name: Execute positive paired evidence smoke on lavapipe
        shell: bash
        env:
          SCIRUST_FLAT_ELASTIC_BENCH_KV_LENS: "1,2"
          SCIRUST_FLAT_ELASTIC_BENCH_WARMUPS: "1"
          SCIRUST_FLAT_ELASTIC_BENCH_REPEATS: "3"
          SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS: "1"
          SCIRUST_FLAT_ELASTIC_RECORD_DIR: /tmp/flat-elastic-records
        run: |
          set -euo pipefail
          export SCIRUST_FLAT_ELASTIC_SOURCE_REVISION="tree:${QUAL_TREE}"
          cargo +nightly-2026-07-02 run --quiet --release --locked -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench > /tmp/flat-elastic-evidence.csv
          cat /tmp/flat-elastic-evidence.csv
          test "$(find /tmp/flat-elastic-records -type f -name '*.elauto' | wc -l)" -eq 2
          test "$(wc -l < /tmp/flat-elastic-evidence.csv)" -eq 5
          grep -q 'flat-m11-external-asymmetric-projection' /tmp/flat-elastic-evidence.csv
          grep -q 'flat-m15-resident-decode' /tmp/flat-elastic-evidence.csv
      - name: Reject duplicate H2 records
        shell: bash
        env:
          SCIRUST_FLAT_ELASTIC_BENCH_KV_LENS: "17,64"
          SCIRUST_FLAT_ELASTIC_BENCH_WARMUPS: "0"
          SCIRUST_FLAT_ELASTIC_BENCH_REPEATS: "1"
          SCIRUST_FLAT_ELASTIC_RECORDED_UNIX_NS: "1"
          SCIRUST_FLAT_ELASTIC_RECORD_DIR: /tmp/flat-elastic-duplicate-records
        run: |
          set -euo pipefail
          export SCIRUST_FLAT_ELASTIC_SOURCE_REVISION="tree:${QUAL_TREE}"
          if cargo +nightly-2026-07-02 run --quiet --release --locked -p scirust-gpu --features flat-autotune --example flat_elastic_evidence_bench >/tmp/duplicate.csv 2>/tmp/duplicate.err; then
            echo "duplicate H2 class unexpectedly succeeded" >&2
            exit 1
          fi
          cat /tmp/duplicate.err
          grep -F 'duplicate H2 problem class for kv_len=64' /tmp/duplicate.err
      - name: Publish clean qualified harness head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/flat-elastic-m15-evidence-bench-final
          test "$(git rev-parse origin/feat/flat-elastic-m15-evidence-bench-final)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$QUAL_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bench(autotune): collect H2 M11 M15 evidence"
          git push origin HEAD:feat/flat-elastic-m15-evidence-bench-final

name: Temporary Core2 lock refresh

on:
  push:
    branches: [core2-foundation-a-e]

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh-core2-lock]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: core2-foundation-a-e
          fetch-depth: 0
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89.0
      - name: Refresh lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(core2): refresh Cargo.lock'
          git push origin HEAD:core2-foundation-a-e

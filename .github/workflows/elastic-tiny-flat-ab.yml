name: ElasticTokenizer TinyScan flat-rule A/B probe

on:
  pull_request:
    paths:
      - ".github/workflows/elastic-tiny-flat-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout baseline master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 00d868f69e982c5ba72786f5fb2d12dbc77eb57e
          path: baseline

      - name: Checkout flat-rule candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: a67eb2e78fbddde94ac18158c938a2f0fd483d7b
          path: candidate

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Record runner identity
        run: |
          {
            uname -a
            echo
            lscpu
          } > /tmp/tiny-ab-runner.txt

      - name: Train one deterministic canonical tokenizer
        working-directory: baseline
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin train-tokenizer -- \
            --input scirust-sciagent/src/elastic_tiny.rs \
            --input scirust-sciagent/src/model.rs \
            --vocab-size 1024 \
            --min-frequency 2 \
            --merge-semantics canonical-rank-v1 \
            --output /tmp/tiny-ab-tokenizer.json

      - name: Measure baseline
        working-directory: baseline
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin tokenizer-autotune -- \
            --tokenizer /tmp/tiny-ab-tokenizer.json \
            --input scirust-sciagent/src/elastic_tiny.rs \
            --input scirust-sciagent/src/model.rs \
            --output /tmp/tiny-ab-baseline-profile.json \
            --report /tmp/tiny-ab-baseline-report.json \
            --probe-lengths 8,16,32,64,96,128 \
            --cases-per-length 3 \
            --warmup-runs 2 \
            --measured-runs 11 \
            --device same-github-runner

      - name: Measure candidate on exact baseline corpus
        working-directory: candidate
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin tokenizer-autotune -- \
            --tokenizer /tmp/tiny-ab-tokenizer.json \
            --input ../baseline/scirust-sciagent/src/elastic_tiny.rs \
            --input ../baseline/scirust-sciagent/src/model.rs \
            --output /tmp/tiny-ab-candidate-profile.json \
            --report /tmp/tiny-ab-candidate-report.json \
            --probe-lengths 8,16,32,64,96,128 \
            --cases-per-length 3 \
            --warmup-runs 2 \
            --measured-runs 11 \
            --device same-github-runner

      - name: Verify parity and summarize TinyScan medians
        run: |
          test "$(jq '[.measurements[] | select(.semantic_match == false)] | length' /tmp/tiny-ab-baseline-report.json)" = "0"
          test "$(jq '[.measurements[] | select(.semantic_match == false)] | length' /tmp/tiny-ab-candidate-report.json)" = "0"

          jq -r '
            [.measurements[] | select(.kernel == "tiny_scan" and .semantic_match)]
            | group_by(.piece_len)
            | .[]
            | sort_by(.elapsed_nanos) as $g
            | ($g | length) as $n
            | [$g[0].piece_len, $g[($n / 2 | floor)].elapsed_nanos]
            | @tsv' /tmp/tiny-ab-baseline-report.json > /tmp/tiny-ab-baseline.tsv

          jq -r '
            [.measurements[] | select(.kernel == "tiny_scan" and .semantic_match)]
            | group_by(.piece_len)
            | .[]
            | sort_by(.elapsed_nanos) as $g
            | ($g | length) as $n
            | [$g[0].piece_len, $g[($n / 2 | floor)].elapsed_nanos]
            | @tsv' /tmp/tiny-ab-candidate-report.json > /tmp/tiny-ab-candidate.tsv

          echo -e "piece_len\tbaseline_ns\tflat_ns\tspeedup_x" | tee /tmp/tiny-ab-summary.tsv
          join -t $'\t' -1 1 -2 1 /tmp/tiny-ab-baseline.tsv /tmp/tiny-ab-candidate.tsv \
            | awk -F '\t' 'BEGIN { OFS="\t" } { printf "%s\t%s\t%s\t%.6f\n", $1, $2, $3, $2 / $3 }' \
            | tee -a /tmp/tiny-ab-summary.tsv

      - name: Publish A/B summary
        if: always()
        run: |
          echo "### TinyScan flat-rule A/B" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tiny-ab-summary.tsv >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline: 00d868f69e982c5ba72786f5fb2d12dbc77eb57e" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: a67eb2e78fbddde94ac18158c938a2f0fd483d7b" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-tiny-flat-ab
          path: |
            /tmp/tiny-ab-runner.txt
            /tmp/tiny-ab-tokenizer.json
            /tmp/tiny-ab-baseline-report.json
            /tmp/tiny-ab-candidate-report.json
            /tmp/tiny-ab-summary.tsv
          if-no-files-found: warn

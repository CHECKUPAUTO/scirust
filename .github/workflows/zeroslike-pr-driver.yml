name: ZerosLike PR driver

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'research/tensor-zeroslike-lowering' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/tensor-zeroslike-lowering
          fetch-depth: 0

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt

      - name: Apply ZerosLike source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}"
                  )
              p.write_text(text.replace(old, new, expected))

          # Logical lowering: preserve the existing one-operand ABI/provenance.
          replace_exact(
              "scirust-tensor-compile/src/lowering.rs",
              "    Log,\n    Scale { factor: Scalar },",
              "    Log,\n    ZerosLike,\n    Scale { factor: Scalar },",
          )
          replace_exact(
              "scirust-tensor-compile/src/lowering.rs",
              "        Operation::Log => uniform_unary(node, UnaryKernel::Log, instruction, operands),\n",
              "        Operation::Log => uniform_unary(node, UnaryKernel::Log, instruction, operands),\n"
              "        Operation::ZerosLike => {\n"
              "            uniform_unary(node, UnaryKernel::ZerosLike, instruction, operands)\n"
              "        },\n",
          )
          replace_exact(
              "scirust-tensor-compile/src/lib.rs",
              "//! * `Relu`, `Exp`, `Log`, `Scale` — [`KernelFamily::ElementwiseUnary`];",
              "//! * `Relu`, `Exp`, `Log`, `ZerosLike`, `Scale` — [`KernelFamily::ElementwiseUnary`];",
          )

          # Reference generation: v1.1 already reserves opcode 0x0006.
          replace_exact(
              "scirust-tensor-reference/src/generator.rs",
              "            UnaryKernel::Log => Ok((ReferenceOpcode::Log, AttributeSource::None)),\n",
              "            UnaryKernel::Log => Ok((ReferenceOpcode::Log, AttributeSource::None)),\n"
              "            UnaryKernel::ZerosLike => {\n"
              "                Ok((ReferenceOpcode::ZerosLike, AttributeSource::None))\n"
              "            },\n",
          )

          # Reference preparation/execution. ZerosLike remains unary even though
          # its operand bits do not affect the result.
          replace_exact(
              "scirust-tensor-reference/src/interpreter.rs",
              "            ReferenceOpcode::Relu\n            | ReferenceOpcode::Scale\n",
              "            ReferenceOpcode::Relu\n"
              "            | ReferenceOpcode::ZerosLike\n"
              "            | ReferenceOpcode::Scale\n",
          )
          replace_exact(
              "scirust-tensor-reference/src/interpreter.rs",
              "                ReferenceOpcode::Relu\n                | ReferenceOpcode::Add\n",
              "                ReferenceOpcode::Relu\n"
              "                    | ReferenceOpcode::ZerosLike\n"
              "                    | ReferenceOpcode::Add\n",
          )
          replace_exact(
              "scirust-tensor-reference/src/interpreter.rs",
              "            ReferenceOpcode::Scale =>\n",
              "            ReferenceOpcode::ZerosLike =>\n"
              "            {\n"
              "                let _ = first_operand(operands)?;\n"
              "                output.fill(0.0);\n"
              "            },\n"
              "            ReferenceOpcode::Scale =>\n",
          )
          replace_exact(
              "scirust-tensor-reference/src/interpreter.rs",
              "            | ReferenceOpcode::ZerosLike\n",
              "",
              expected=2,
          )

          # Invocation-time validation must accept the same opcode/attribute ABI.
          replace_exact(
              "scirust-tensor-reference/src/invocation.rs",
              "        ReferenceOpcode::Relu\n        | ReferenceOpcode::Scale\n",
              "        ReferenceOpcode::Relu\n"
              "        | ReferenceOpcode::ZerosLike\n"
              "        | ReferenceOpcode::Scale\n",
          )
          replace_exact(
              "scirust-tensor-reference/src/invocation.rs",
              "                ReferenceOpcode::Relu\n                    | ReferenceOpcode::Add\n",
              "                ReferenceOpcode::Relu\n"
              "                    | ReferenceOpcode::ZerosLike\n"
              "                    | ReferenceOpcode::Add\n",
          )
          replace_exact(
              "scirust-tensor-reference/src/invocation.rs",
              "        | ReferenceOpcode::ZerosLike\n",
              "",
          )

          # Reference generation regression.
          replace_exact(
              "scirust-tensor-reference/src/tests.rs",
              "#[test]\nfn add_generates_the_add_opcode_with_two_operands() {\n",
              "#[test]\n"
              "fn zeros_like_generates_the_v1_1_zeros_like_opcode() {\n"
              "    let plan = single_unary_plan(Operation::ZerosLike, f32_type(vec![4]));\n"
              "    let artifact = only_artifact(&plan);\n\n"
              "    assert_eq!(artifact.opcode(), ReferenceOpcode::ZerosLike);\n"
              "    assert_eq!(artifact.operands().len(), 1);\n"
              "    assert_eq!(artifact.attributes(), &ReferenceAttributes::None);\n"
              "    assert_eq!(artifact.version(), REFERENCE_FORMAT_VERSION);\n"
              "}\n\n"
              "#[test]\nfn add_generates_the_add_opcode_with_two_operands() {\n",
          )

          # Real built-in compiler pass regression.
          replace_exact(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              "    use scirust_tensor_ir::{DType, Graph, Operation, Shape, TensorType};",
              "    use scirust_tensor_ir::{DType, Graph, Operation, Scalar, Shape, TensorType};",
          )
          replace_exact(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              "        KernelLowerer, OperationRewrite, PassResult, Rewriter, UnaryKernel,\n",
              "        KernelLowerer, OperationRewrite, PassResult, Rewriter,\n"
              "        ScaleZeroCanonicalizationPass, UnaryKernel,\n",
          )
          replace_exact(
              "scirust-tensor-compile/src/compiler_pipeline.rs",
              "    #[test]\n    fn pipeline_lowers_the_post_pass_operation() {\n",
              "    #[test]\n"
              "    fn scale_zero_pass_lowers_to_zeros_like_end_to_end() {\n"
              "        let mut graph = Graph::new();\n"
              "        let input = graph.add_input(\"input\", ty()).unwrap();\n"
              "        let scaled = graph\n"
              "            .add_node(\n"
              "                Operation::Scale {\n"
              "                    factor: Scalar::f32(0.0),\n"
              "                },\n"
              "                vec![input],\n"
              "                ty(),\n"
              "            )\n"
              "            .unwrap();\n"
              "        graph.set_outputs(vec![scaled]).unwrap();\n\n"
              "        let execution = CanonicalCompiler::new().compile(&graph).unwrap();\n"
              "        let mut pipeline = CompilerPipeline::new();\n"
              "        pipeline.push_pass(ScaleZeroCanonicalizationPass);\n"
              "        let compiled = pipeline.compile_execution_plan(&execution).unwrap();\n\n"
              "        assert!(matches!(\n"
              "            compiled.compiler_ir().operations()[1].operation(),\n"
              "            Operation::ZerosLike\n"
              "        ));\n"
              "        assert!(matches!(\n"
              "            compiled\n"
              "                .lowered_plan()\n"
              "                .kernel(compiled.lowered_plan().instructions()[0].kernel)\n"
              "                .unwrap()\n"
              "                .family(),\n"
              "            KernelFamily::ElementwiseUnary(UnaryKernel::ZerosLike)\n"
              "        ));\n"
              "    }\n\n"
              "    #[test]\n    fn pipeline_lowers_the_post_pass_operation() {\n",
          )

          # Real CPU execution: NaN/Inf/-0/input value all become positive zero.
          replace_exact(
              "scirust-tensor-runtime/tests/reference_cpu_plan.rs",
              "// The eight supported opcodes",
              "// The nine supported opcodes",
          )
          replace_exact(
              "scirust-tensor-runtime/tests/reference_cpu_plan.rs",
              "#[test]\nfn executes_scale() {\n",
              "#[test]\n"
              "fn executes_zeros_like_as_positive_zero_for_every_input_class() {\n"
              "    let plan = unary_plan(Operation::ZerosLike, vec![5]);\n"
              "    let input = [f32::NAN, f32::INFINITY, f32::NEG_INFINITY, -0.0, 7.5];\n"
              "    let output = run_unary(&plan, &input);\n\n"
              "    assert_eq!(bits(&output), vec![0u32; input.len()]);\n"
              "}\n\n"
              "#[test]\nfn executes_scale() {\n",
          )
          PY

      - name: Format
        run: cargo +nightly-2026-07-02 fmt --all

      - name: Test tensor compiler
        run: cargo test -p scirust-tensor-compile --all-targets

      - name: Test Reference format and interpreter
        run: cargo test -p scirust-tensor-reference --all-targets

      - name: Test Reference CPU runtime
        run: cargo test -p scirust-tensor-runtime --test reference_cpu_plan

      - name: Commit validated patch and remove staging workflows
        run: |
          rm .github/workflows/zeroslike-one-shot.yml .github/workflows/zeroslike-pr-driver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tensor): lower zeros-like through reference CPU"
          git push origin HEAD:research/tensor-zeroslike-lowering

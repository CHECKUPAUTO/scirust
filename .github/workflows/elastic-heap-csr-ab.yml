name: ElasticTokenizer Heap CSR counterbalanced A/B

on:
  pull_request:
    paths:
      - ".github/workflows/elastic-heap-csr-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: ed0e814073854fb9d74d92cff46372e2dfd8448b
  CANDIDATE_SHA: a78db7a91a1a46fe4071ff5c70902144229d4487

jobs:
  heap-csr-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout Heap CSR candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Record runner identity
        run: |
          {
            uname -a
            echo
            lscpu
          } > /tmp/heap-csr-ab-runner.txt

      - name: Train one deterministic canonical tokenizer
        working-directory: baseline
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin train-tokenizer -- \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --vocab-size 2048 \
            --min-frequency 2 \
            --merge-semantics canonical-rank-v1 \
            --output /tmp/heap-csr-ab-tokenizer.json

      - name: Build both measurement binaries before timing
        run: |
          cargo +1.89.0 build --locked --release -p scirust-sciagent --bin tokenizer-autotune --manifest-path baseline/Cargo.toml
          cargo +1.89.0 build --locked --release -p scirust-sciagent --bin tokenizer-autotune --manifest-path candidate/Cargo.toml

      - name: Measure ABBA sequence
        shell: bash
        run: |
          set -euo pipefail

          measure() {
            local tree="$1"
            local label="$2"
            local input_prefix="$3"
            (
              cd "$tree"
              ./target/release/tokenizer-autotune \
                --tokenizer /tmp/heap-csr-ab-tokenizer.json \
                --input "$input_prefix/scirust-sciagent/src/model.rs" \
                --input "$input_prefix/scirust-sciagent/src/elastic_heap.rs" \
                --output "/tmp/heap-csr-ab-${label}-profile.json" \
                --report "/tmp/heap-csr-ab-${label}-report.json" \
                --probe-lengths 128,256,512,1024,2048,4096,8192 \
                --cases-per-length 1 \
                --warmup-runs 1 \
                --measured-runs 5 \
                --device same-github-runner
            )
          }

          # ABBA counterbalancing: each implementation is measured once early and once late.
          measure baseline b1 .
          measure candidate c1 ../baseline
          measure candidate c2 ../baseline
          measure baseline b2 .

      - name: Verify semantic parity
        run: |
          set -euo pipefail
          for label in b1 c1 c2 b2; do
            mismatches="$(jq '[.measurements[] | select(.semantic_match == false)] | length' "/tmp/heap-csr-ab-${label}-report.json")"
            test "$mismatches" = "0"
          done

      - name: Summarize paired counterbalanced medians
        shell: bash
        run: |
          set -euo pipefail

          extract_medians() {
            local label="$1"
            jq -r '
              [.measurements[] | select(.kernel == "heap" and .semantic_match)]
              | group_by(.piece_len)
              | .[]
              | sort_by(.elapsed_nanos) as $g
              | [$g[0].piece_len, $g[($g | length) / 2 | floor].elapsed_nanos]
              | @tsv' "/tmp/heap-csr-ab-${label}-report.json" \
              > "/tmp/heap-csr-ab-${label}.tsv"
          }

          for label in b1 c1 c2 b2; do
            extract_medians "$label"
          done

          join -t $'\t' -1 1 -2 1 /tmp/heap-csr-ab-b1.tsv /tmp/heap-csr-ab-c1.tsv > /tmp/heap-csr-ab-pair1.tsv
          join -t $'\t' -1 1 -2 1 /tmp/heap-csr-ab-b2.tsv /tmp/heap-csr-ab-c2.tsv > /tmp/heap-csr-ab-pair2.tsv
          join -t $'\t' -1 1 -2 1 /tmp/heap-csr-ab-pair1.tsv /tmp/heap-csr-ab-pair2.tsv \
            | awk -F '\t' 'BEGIN { OFS="\t"; print "piece_len","b1_ns","c1_ns","b2_ns","c2_ns","pair1_x","pair2_x","geomean_x" }
              {
                r1=$2/$3;
                r2=$4/$5;
                printf "%s\t%s\t%s\t%s\t%s\t%.6f\t%.6f\t%.6f\n", $1,$2,$3,$4,$5,r1,r2,sqrt(r1*r2)
              }' \
            | tee /tmp/heap-csr-ab-summary.tsv

      - name: Publish A/B summary
        if: always()
        run: |
          echo "### Heap CSR counterbalanced A/B" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/heap-csr-ab-summary.tsv >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Order: baseline → candidate → candidate → baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline: $BASELINE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-heap-csr-counterbalanced-ab
          path: |
            /tmp/heap-csr-ab-runner.txt
            /tmp/heap-csr-ab-tokenizer.json
            /tmp/heap-csr-ab-b1-report.json
            /tmp/heap-csr-ab-c1-report.json
            /tmp/heap-csr-ab-c2-report.json
            /tmp/heap-csr-ab-b2-report.json
            /tmp/heap-csr-ab-summary.tsv
          if-no-files-found: warn

name: SciAgent B30 deferred telemetry

on:
  pull_request:
    branches:
      - perf/sciagent-b29-attention-assembly

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sciagent-b30-deferred-telemetry
          fetch-depth: 0
      - name: Apply B30 source patch
        run: python3 scripts/sciagent_b30_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check CUDA backend
        run: cargo check -p scirust-cuda --features cuda
      - name: Check SciAgent CUDA pretrain
        run: cargo check -p scirust-sciagent --features cuda --example cuda_pretrain
      - name: Check SciAgent CUDA library
        run: cargo check -p scirust-sciagent --features cuda
      - name: Test SciAgent CPU surface
        run: cargo test -p scirust-sciagent --lib
      - name: Remove one-shot helpers
        run: rm -f scripts/sciagent_b30_patch.py .github/workflows/sciagent-b30-apply.yml
      - name: Commit and push validated B30
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sciagent): defer Route-B host telemetry"
          git push origin HEAD:perf/sciagent-b30-deferred-telemetry

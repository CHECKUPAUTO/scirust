name: Temporary Elastic profile formatter

on:
  push:
    branches:
      - perf/elastic-tokenizer-robust-model-selection

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: perf/elastic-tokenizer-robust-model-selection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Format exact branch
        run: |
          cargo +nightly-2026-07-02 fmt --all
          git diff --check
      - name: Commit formatter result and remove bootstrap workflow
        run: |
          git rm .github/workflows/tmp-elastic-profile-fmt.yml
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add scirust-sciagent/src/elastic_profile_fit.rs scirust-sciagent/src/elastic_model_selection.rs scirust-sciagent/src/bin/tokenizer-model-select.rs
          git commit -m 'style(sciagent): format robust tokenizer selection stack'
          git push origin HEAD:perf/elastic-tokenizer-robust-model-selection

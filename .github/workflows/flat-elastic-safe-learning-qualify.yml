name: Temporary FLAT safe learning qualification

on:
  push:
    branches:
      - feat/flat-elastic-safe-learning

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/flat-elastic-safe-learning

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Add isolated evidence evaluation and Learn-only promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/flat_autotune.rs")
          text = path.read_text()

          old = "    ElasticAutoTuner, ElasticCandidate, ElasticCandidateError, ElasticConfig, ElasticEvidence,\n    ElasticExecutionPlan, ElasticHardwareProfile, ElasticMode, ElasticObjective, ElasticParameter,\n    ElasticProblemClass, ElasticSelectionError, InMemoryElasticPlanCache, RankedCandidate,\n"
          new = "    ElasticAutoTuner, ElasticCandidate, ElasticCandidateError, ElasticConfig, ElasticEvidence,\n    ElasticEvidenceError, ElasticExecutionPlan, ElasticHardwareProfile, ElasticMode, ElasticObjective,\n    ElasticParameter, ElasticProblemClass, ElasticSelectionError, InMemoryElasticPlanCache,\n    RankedCandidate,\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected public re-export anchor")
          text = text.replace(old, new)

          anchor = "    /// Fail closed when persisted evidence names a stale, modified, or foreign\n"
          methods = """    /// Evaluate caller-collected, already-qualified evidence outside the latency-sensitive\n    /// execution path. This method never reads a clock, launches a benchmark, mutates the plan\n    /// cache, or broadens the statically qualified candidate set.\n    pub fn evaluate_measured_evidence(\n        &self,\n        tuner: &ElasticAutoTuner,\n        hardware: ElasticHardwareProfile,\n        evidence: &[ElasticEvidence],\n    ) -> Result<ElasticExecutionPlan, FlatElasticError> {\n        tuner.require_measurement().map_err(FlatElasticError::Mode)?;\n        for record in evidence\n        {\n            self.require_current_candidate(&record.candidate)?;\n        }\n        let ranked = self.rank_candidates(tuner, &hardware);\n        let selected = tuner\n            .select_measured_evidence(&ranked, evidence)\n            .map_err(FlatElasticError::Selection)?;\n        tuner\n            .plan_from_evidence(hardware, self.problem_class.clone(), selected)\n            .map_err(FlatElasticError::Evidence)\n    }\n\n    /// Promote already-qualified measured evidence to the production cache. Exploration and\n    /// selection mutation are both required, so the existing mode contract permits this only\n    /// in `Learn`. `Audit` may call `evaluate_measured_evidence` but cannot enter this method.\n    pub fn promote_measured_evidence<C: ElasticPlanCache>(\n        &self,\n        tuner: &ElasticAutoTuner,\n        hardware: ElasticHardwareProfile,\n        evidence: &[ElasticEvidence],\n        cache: &mut C,\n    ) -> Result<ElasticExecutionPlan, FlatElasticError> {\n        tuner.require_exploration().map_err(FlatElasticError::Mode)?;\n        let plan = self.evaluate_measured_evidence(tuner, hardware.clone(), evidence)?;\n        let key = self.plan_key(tuner, hardware);\n        tuner\n            .store_plan_for_mode(cache, key, plan.clone())\n            .map_err(FlatElasticError::Mode)?;\n        Ok(plan)\n    }\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit("unexpected method insertion anchor")
          text = text.replace(anchor, methods + anchor)

          old = "    CandidateEncoding(ElasticCandidateError),\n    Mode(ElasticModeError),\n    NoQualifiedCandidate,\n"
          new = "    CandidateEncoding(ElasticCandidateError),\n    Evidence(ElasticEvidenceError),\n    Selection(ElasticSelectionError),\n    Mode(ElasticModeError),\n    NoQualifiedCandidate,\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected error enum anchor")
          text = text.replace(old, new)

          old = "            Self::CandidateEncoding(error) => write!(f, \"cannot encode FLAT candidate: {error}\"),\n            Self::Mode(error) => write!(f, \"Elastic mode rejected FLAT plan resolution: {error}\"),\n"
          new = "            Self::CandidateEncoding(error) => write!(f, \"cannot encode FLAT candidate: {error}\"),\n            Self::Evidence(error) => write!(f, \"invalid FLAT tuning evidence: {error}\"),\n            Self::Selection(error) => write!(f, \"cannot select measured FLAT evidence: {error}\"),\n            Self::Mode(error) => write!(f, \"Elastic mode rejected FLAT plan resolution: {error}\"),\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected error display anchor")
          text = text.replace(old, new)

          anchor = "    #[test]\n    fn foreign_persisted_candidate_is_rejected_after_cache_validation() {\n"
          tests = """    fn evidence(candidate: ElasticCandidate, median_ns: u64) -> ElasticEvidence {\n        ElasticEvidence::validated(\n            candidate,\n            vec![1],\n            ElasticMeasurement {\n                sample_count: 5,\n                median_ns,\n                p95_ns: median_ns + 1,\n                p99_ns: median_ns + 2,\n                mad_ns: 1,\n            },\n        )\n        .unwrap()\n    }\n\n    #[test]\n    fn cold_and_locked_cannot_evaluate_new_measurements() {\n        let planner = planner(1, 17);\n        let hardware = hardware();\n        let records = [evidence(current_candidate().unwrap(), 10)];\n        for mode in [ElasticMode::Cold, ElasticMode::Locked]\n        {\n            let tuner = tuner(mode, ElasticObjective::MinLatency);\n            assert!(matches!(\n                planner.evaluate_measured_evidence(&tuner, hardware.clone(), &records),\n                Err(FlatElasticError::Mode(ElasticModeError::MeasurementForbidden { mode: rejected }))\n                    if rejected == mode\n            ));\n        }\n    }\n\n    #[test]\n    fn audit_can_replay_evidence_but_cannot_promote_selection() {\n        let planner = planner(1, 17);\n        let hardware = hardware();\n        let audit = tuner(ElasticMode::Audit, ElasticObjective::MinLatency);\n        let records = [evidence(current_candidate().unwrap(), 10)];\n        let plan = planner\n            .evaluate_measured_evidence(&audit, hardware.clone(), &records)\n            .unwrap();\n        assert_eq!(plan.evidence.candidate, records[0].candidate);\n\n        let mut cache = InMemoryElasticPlanCache::default();\n        assert!(matches!(\n            planner.promote_measured_evidence(\n                &audit,\n                hardware.clone(),\n                &records,\n                &mut cache,\n            ),\n            Err(FlatElasticError::Mode(ElasticModeError::ExplorationForbidden {\n                mode: ElasticMode::Audit\n            }))\n        ));\n        let key = planner.plan_key(&audit, hardware);\n        assert!(cache.load(&key).is_none());\n    }\n\n    #[test]\n    fn learn_promotes_validated_evidence_and_resolves_persisted_plan() {\n        let planner = planner(1, 17);\n        let hardware = hardware();\n        let learn = tuner(ElasticMode::Learn, ElasticObjective::MinLatency);\n        let records = [evidence(current_candidate().unwrap(), 10)];\n        let mut cache = InMemoryElasticPlanCache::default();\n        let promoted = planner\n            .promote_measured_evidence(&learn, hardware.clone(), &records, &mut cache)\n            .unwrap();\n        assert_eq!(promoted.evidence.candidate, records[0].candidate);\n\n        let resolved = planner\n            .resolve_for_mode(&learn, hardware, &cache)\n            .unwrap();\n        match resolved\n        {\n            FlatPlanResolution::Production(plan) =>\n            {\n                assert_eq!(plan.origin(), FlatPlanOrigin::Persisted);\n                assert_eq!(plan.candidate(), &records[0].candidate);\n            },\n            FlatPlanResolution::AuditOnly => panic!(\"Learn must resolve the promoted plan\"),\n        }\n    }\n\n    #[test]\n    fn foreign_evidence_fails_closed_before_measured_selection() {\n        let planner = planner(1, 17);\n        let learn = tuner(ElasticMode::Learn, ElasticObjective::MinLatency);\n        let current = current_candidate().unwrap();\n        let foreign = ElasticCandidate::new(\n            \"foreign-flat-family\",\n            current.kernel_revision.clone(),\n            current.parameters().iter().cloned(),\n            false,\n            0,\n        )\n        .unwrap();\n        let records = [evidence(foreign, 1)];\n        assert!(matches!(\n            planner.evaluate_measured_evidence(&learn, hardware(), &records),\n            Err(FlatElasticError::UnknownCandidate)\n        ));\n    }\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit("unexpected test insertion anchor")
          text = text.replace(anchor, tests + anchor)
          path.write_text(text)
          PY

      - name: Canonical format
        run: |
          rustfmt +nightly-2026-07-02 --edition 2021 src/flat_autotune.rs
          cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Locked check and focused tests
        run: |
          cargo +nightly-2026-07-02 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +nightly-2026-07-02 check -p scirust --features flat-autotune --locked
          cargo +nightly-2026-07-02 test -p scirust --features flat-autotune --lib --locked

      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust --features flat-autotune --lib --locked -- -D warnings

      - name: MSRV check
        run: cargo +1.89.0 check -p scirust --features flat-autotune --locked

      - name: Verify isolated H3 scope
        run: |
          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = "src/flat_autotune.rs"

      - name: Finalize qualified H3 head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/flat_autotune.rs
          git rm .github/workflows/flat-elastic-safe-learning-qualify.yml
          git commit -m "feat(autotune): add safe FLAT evidence promotion"
          git push origin HEAD:feat/flat-elastic-safe-learning

name: tmp fix phase26 debug
on:
  workflow_dispatch:
  push:
    branches: [research/phase26-integrate-parallel-sampler]
    paths: [.github/workflows/tmp-fix-phase26-debug.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase26-integrate-parallel-sampler
      - name: Remove unnecessary Debug derive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scirust-gpu/src/elastic_latent_encoder_device/minillm/sampled.rs')
          s = p.read_text()
          old = '#[derive(Debug)]\nenum ResidentSampler {'
          if old not in s:
              raise SystemExit('ResidentSampler Debug derive pattern not found')
          p.write_text(s.replace(old, 'enum ResidentSampler {', 1))
          PY
          cargo +nightly-2026-07-02 fmt --all -- --check
      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-phase26-debug.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-gpu/src/elastic_latent_encoder_device/minillm/sampled.rs .github/workflows/tmp-fix-phase26-debug.yml
          git commit -m 'fix(gpu): remove unnecessary sampler debug bound'
          git push origin HEAD:research/phase26-integrate-parallel-sampler

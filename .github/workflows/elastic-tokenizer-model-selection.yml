name: ElasticTokenizer robust model selection

on:
  pull_request:
    paths:
      - "scirust-sciagent/src/elastic_*.rs"
      - "scirust-sciagent/src/bin/tokenizer-autotune.rs"
      - "scirust-sciagent/src/bin/tokenizer-model-select.rs"
      - "scirust-sciagent/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/elastic-tokenizer-model-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-x86-selection:
    name: Hosted x86_64 robust selection
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install exact MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Record hardware identity
        run: |
          uname -a > /tmp/elastic-selection-hardware.txt
          lscpu >> /tmp/elastic-selection-hardware.txt
      - name: Train one deterministic canonical tokenizer
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin train-tokenizer -- \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --vocab-size 2048 \
            --min-frequency 2 \
            --merge-semantics canonical-rank-v1 \
            --output /tmp/elastic-selection-tokenizer.json
      - name: Build measurement and selector binaries before timing
        run: |
          cargo +1.89.0 build --locked --release -p scirust-sciagent --bin tokenizer-autotune --bin tokenizer-model-select
      - name: Run semantics-gated interleaved calibration
        run: |
          ./target/release/tokenizer-autotune \
            --tokenizer /tmp/elastic-selection-tokenizer.json \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --output /tmp/elastic-selection-profile.json \
            --report /tmp/elastic-selection-raw.json \
            --probe-lengths 8,16,32,64,96,128,192,256,384,512,768,1024,1536,2048,3072,4096,6144,8192 \
            --cases-per-length 3 \
            --warmup-runs 3 \
            --measured-runs 21 \
            --device github-hosted-x86_64
      - name: Select robust winners with SciRust statistics
        run: |
          ./target/release/tokenizer-model-select \
            --report /tmp/elastic-selection-raw.json \
            --output /tmp/elastic-selection-robust.json
          test "$(jq '.rejected_semantic_measurements' /tmp/elastic-selection-robust.json)" = "0"
      - name: Run single-case temporal stability calibration
        run: |
          ./target/release/tokenizer-autotune \
            --tokenizer /tmp/elastic-selection-tokenizer.json \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --output /tmp/elastic-stability-profile.json \
            --report /tmp/elastic-stability-raw.json \
            --probe-lengths 16,64,128,512,2048,8192 \
            --cases-per-length 1 \
            --warmup-runs 5 \
            --measured-runs 63 \
            --device github-hosted-x86_64
          ./target/release/tokenizer-model-select \
            --report /tmp/elastic-stability-raw.json \
            --output /tmp/elastic-stability.json
          test "$(jq '.stability_protocol_valid' /tmp/elastic-stability.json)" = "true"
          test "$(jq '.rejected_semantic_measurements' /tmp/elastic-stability.json)" = "0"
      - name: Publish selection and stability tables
        run: |
          echo "### ElasticTokenizer robust model selection — hosted x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| bytes | winner | median ns | p95 ns | CV | runner-up | speedup | Welch p | confidence |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---:|---:|---:|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.selections[] | "| \(.piece_len) | \(.winner) | \(.winner_median_nanos|floor) | \(.winner_p95_nanos|floor) | \(.winner_coefficient_of_variation*10000|round/10000) | \(.runner_up // "-") | \((.median_speedup // 0)*1000|round/1000) | \((.welch_p_value // 1)*1000000|round/1000000) | \(.confidence) |"' \
            /tmp/elastic-selection-robust.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Single-case Allan stability" >> "$GITHUB_STEP_SUMMARY"
          echo "| bytes | winner | Allan m=1 ns | Allan m=2 ns | Allan m=4 ns | m1/median |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---:|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.selections[] | "| \(.piece_len) | \(.winner) | \((.winner_allan_m1_nanos // 0)|floor) | \((.winner_allan_m2_nanos // 0)|floor) | \((.winner_allan_m4_nanos // 0)|floor) | \((.winner_allan_m1_over_median // 0)*10000|round/10000) |"' \
            /tmp/elastic-stability.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fitted production profile:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/elastic-selection-profile.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact model-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-tokenizer-robust-selection-x86_64
          path: |
            /tmp/elastic-selection-hardware.txt
            /tmp/elastic-selection-tokenizer.json
            /tmp/elastic-selection-profile.json
            /tmp/elastic-selection-raw.json
            /tmp/elastic-selection-robust.json
            /tmp/elastic-stability-profile.json
            /tmp/elastic-stability-raw.json
            /tmp/elastic-stability.json
          if-no-files-found: warn

  thor-arm64-selection:
    name: Jetson Thor ARM64 robust selection
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: .ci-elastic-tokenizer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: .ci-elastic-tokenizer
      - name: Prepare isolated build directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$RUNNER_TEMP/elastic-selection.XXXXXX")"
          chmod 700 "$tmpdir"
          mkdir -p "$tmpdir/tmp"
          chmod 700 "$tmpdir/tmp"
          echo "TMPDIR=$tmpdir/tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmpdir/target" >> "$GITHUB_ENV"
          echo "ELASTIC_SELECTION_TMP=$tmpdir" >> "$GITHUB_ENV"
      - name: Install exact MSRV
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Record Thor identity and system load
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            echo
            lscpu
            echo
            cat /proc/meminfo
            echo
            uptime
            echo
            command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || true
          } > "$ELASTIC_SELECTION_TMP/hardware.txt"
      - name: Train the identical deterministic canonical tokenizer
        run: |
          cargo +1.89.0 run --locked --release -p scirust-sciagent --bin train-tokenizer -- \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --vocab-size 2048 \
            --min-frequency 2 \
            --merge-semantics canonical-rank-v1 \
            --output "$ELASTIC_SELECTION_TMP/tokenizer.json"
      - name: Build measurement and selector binaries before timing
        run: |
          cargo +1.89.0 build --locked --release -p scirust-sciagent --bin tokenizer-autotune --bin tokenizer-model-select
      - name: Run semantics-gated interleaved calibration on Thor CPU
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/release/tokenizer-autotune" \
            --tokenizer "$ELASTIC_SELECTION_TMP/tokenizer.json" \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --output "$ELASTIC_SELECTION_TMP/profile.json" \
            --report "$ELASTIC_SELECTION_TMP/raw.json" \
            --probe-lengths 8,16,32,64,96,128,192,256,384,512,768,1024,1536,2048,3072,4096,6144,8192 \
            --cases-per-length 3 \
            --warmup-runs 3 \
            --measured-runs 21 \
            --device jetson-agx-thor-arm64
      - name: Select robust Thor winners with SciRust statistics
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/release/tokenizer-model-select" \
            --report "$ELASTIC_SELECTION_TMP/raw.json" \
            --output "$ELASTIC_SELECTION_TMP/robust.json"
          test "$(jq '.rejected_semantic_measurements' "$ELASTIC_SELECTION_TMP/robust.json")" = "0"
      - name: Run single-case Thor temporal stability calibration
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/release/tokenizer-autotune" \
            --tokenizer "$ELASTIC_SELECTION_TMP/tokenizer.json" \
            --input scirust-sciagent/src \
            --recursive \
            --extension rs \
            --output "$ELASTIC_SELECTION_TMP/stability-profile.json" \
            --report "$ELASTIC_SELECTION_TMP/stability-raw.json" \
            --probe-lengths 16,64,128,512,2048,8192 \
            --cases-per-length 1 \
            --warmup-runs 5 \
            --measured-runs 63 \
            --device jetson-agx-thor-arm64
          "$CARGO_TARGET_DIR/release/tokenizer-model-select" \
            --report "$ELASTIC_SELECTION_TMP/stability-raw.json" \
            --output "$ELASTIC_SELECTION_TMP/stability.json"
          test "$(jq '.stability_protocol_valid' "$ELASTIC_SELECTION_TMP/stability.json")" = "true"
          test "$(jq '.rejected_semantic_measurements' "$ELASTIC_SELECTION_TMP/stability.json")" = "0"
      - name: Publish Thor selection and stability tables
        shell: bash
        run: |
          set -euo pipefail
          echo "### ElasticTokenizer robust model selection — Jetson Thor ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| bytes | winner | median ns | p95 ns | CV | runner-up | speedup | Welch p | confidence |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---:|---:|---:|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.selections[] | "| \(.piece_len) | \(.winner) | \(.winner_median_nanos|floor) | \(.winner_p95_nanos|floor) | \(.winner_coefficient_of_variation*10000|round/10000) | \(.runner_up // "-") | \((.median_speedup // 0)*1000|round/1000) | \((.welch_p_value // 1)*1000000|round/1000000) | \(.confidence) |"' \
            "$ELASTIC_SELECTION_TMP/robust.json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Single-case Allan stability" >> "$GITHUB_STEP_SUMMARY"
          echo "| bytes | winner | Allan m=1 ns | Allan m=2 ns | Allan m=4 ns | m1/median |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---:|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.selections[] | "| \(.piece_len) | \(.winner) | \((.winner_allan_m1_nanos // 0)|floor) | \((.winner_allan_m2_nanos // 0)|floor) | \((.winner_allan_m4_nanos // 0)|floor) | \((.winner_allan_m1_over_median // 0)*10000|round/10000) |"' \
            "$ELASTIC_SELECTION_TMP/stability.json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fitted Thor profile:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$ELASTIC_SELECTION_TMP/profile.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact Thor model-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-tokenizer-robust-selection-thor-arm64
          path: |
            ${{ env.ELASTIC_SELECTION_TMP }}/hardware.txt
            ${{ env.ELASTIC_SELECTION_TMP }}/tokenizer.json
            ${{ env.ELASTIC_SELECTION_TMP }}/profile.json
            ${{ env.ELASTIC_SELECTION_TMP }}/raw.json
            ${{ env.ELASTIC_SELECTION_TMP }}/robust.json
            ${{ env.ELASTIC_SELECTION_TMP }}/stability-profile.json
            ${{ env.ELASTIC_SELECTION_TMP }}/stability-raw.json
            ${{ env.ELASTIC_SELECTION_TMP }}/stability.json
          if-no-files-found: warn

name: PR1056 one-shot rustfmt

on:
  push:
    branches:
      - feat/elastic-tokenizer-versioned-bpe

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/elastic-tokenizer-versioned-bpe
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Apply pinned workspace rustfmt and remove helper
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-02 fmt --all
          rm .github/workflows/pr1056-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(sciagent): apply pinned workspace rustfmt"
          git push origin HEAD:feat/elastic-tokenizer-versioned-bpe

name: Fix PR1012 rustfmt
on:
  push:
    branches: [research/phase26-integrate-parallel-sampler]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/phase26-integrate-parallel-sampler
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt
      - name: Format Phase 26
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-pr1012-rustfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scirust-gpu/src/deterministic_sampling_parallel.rs scirust-gpu/src/elastic_latent_encoder_device/minillm/sampled.rs scirust-gpu/tests/elastic_latent_minillm_sampled_resident.rs .github/workflows/fix-pr1012-rustfmt.yml
          git commit -m 'style(gpu): format Phase 26 integration'
          git push origin HEAD:research/phase26-integrate-parallel-sampler

name: Temporary FLAT planner semantic qualification

on:
  push:
    branches:
      - feat/flat-elastic-planner

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/flat-elastic-planner

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Fix semantic precedence and complete bucket boundary tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/flat_autotune.rs")
          text = path.read_text()
          old = "    pub const fn problem_kind(self) -> FlatProblemKind {\n        if self.config.query_len == 1\n        {\n            FlatProblemKind::Decode\n        }\n        else if !self.config.causal && self.config.query_len != self.config.kv_len\n        {\n            FlatProblemKind::CrossAttention\n        }\n        else\n        {\n            FlatProblemKind::Prefill\n        }\n    }\n"
          new = "    pub const fn problem_kind(self) -> FlatProblemKind {\n        if !self.config.causal && self.config.query_len != self.config.kv_len\n        {\n            FlatProblemKind::CrossAttention\n        }\n        else if self.config.query_len == 1\n        {\n            FlatProblemKind::Decode\n        }\n        else\n        {\n            FlatProblemKind::Prefill\n        }\n    }\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected problem_kind anchor")
          text = text.replace(old, new)
          anchor = "    #[test]\n    fn current_candidate_is_exact_and_stale_candidates_fail_closed() {\n"
          addition = "    #[test]\n    fn noncausal_rectangular_single_query_is_cross_attention() {\n        let mut cross = config(1, 17);\n        cross.causal = false;\n        let request =\n            FlatElasticRequest::new(cross, FlatKvRepresentation::PreRotated).unwrap();\n        assert_eq!(request.problem_kind(), FlatProblemKind::CrossAttention);\n    }\n\n    #[test]\n    fn every_length_bucket_boundary_is_an_explicit_plan_transition() {\n        for (left, right) in [\n            (1, 2),\n            (4, 5),\n            (16, 17),\n            (64, 65),\n            (256, 257),\n            (1024, 1025),\n            (4096, 4097),\n        ]\n        {\n            assert_ne!(length_bucket(left), length_bucket(right));\n        }\n\n        for (left, right) in [\n            (2, 4),\n            (5, 16),\n            (17, 64),\n            (65, 256),\n            (257, 1024),\n            (1025, 4096),\n            (4097, 8192),\n        ]\n        {\n            assert_eq!(length_bucket(left), length_bucket(right));\n        }\n    }\n\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected test insertion anchor")
          path.write_text(text.replace(anchor, addition + anchor))
          PY

      - name: Canonical format
        run: |
          rustfmt +nightly-2026-07-02 --edition 2021 src/flat_autotune.rs
          cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Locked check and tests
        run: |
          cargo +nightly-2026-07-02 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +nightly-2026-07-02 check -p scirust --features flat-autotune --locked
          cargo +nightly-2026-07-02 test -p scirust --features flat-autotune --lib --locked

      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust --features flat-autotune --lib --locked -- -D warnings

      - name: MSRV check
        run: cargo +1.89.0 check -p scirust --features flat-autotune --locked

      - name: Verify scoped change
        run: |
          changed="$(git diff --name-only HEAD)"
          test "$changed" = "src/flat_autotune.rs"

      - name: Finalize qualified semantic fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/flat_autotune.rs
          git rm .github/workflows/flat-elastic-semantic-qualify.yml .github/flat-elastic-semantic-trigger
          git commit -m "fix(autotune): classify FLAT cross attention before decode"
          git push origin HEAD:feat/flat-elastic-planner

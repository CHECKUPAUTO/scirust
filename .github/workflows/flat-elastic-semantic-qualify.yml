name: Temporary FLAT planner semantic qualification

on:
  push:
    branches:
      - feat/flat-elastic-planner

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/flat-elastic-planner

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Fix semantic precedence and complete bucket boundary tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/flat_autotune.rs")
          text = path.read_text()

          old = '''    pub const fn problem_kind(self) -> FlatProblemKind {
        if self.config.query_len == 1
        {
            FlatProblemKind::Decode
        }
        else if !self.config.causal && self.config.query_len != self.config.kv_len
        {
            FlatProblemKind::CrossAttention
        }
        else
        {
            FlatProblemKind::Prefill
        }
    }
'''
          new = '''    pub const fn problem_kind(self) -> FlatProblemKind {
        if !self.config.causal && self.config.query_len != self.config.kv_len
        {
            FlatProblemKind::CrossAttention
        }
        else if self.config.query_len == 1
        {
            FlatProblemKind::Decode
        }
        else
        {
            FlatProblemKind::Prefill
        }
    }
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected problem_kind anchor")
          text = text.replace(old, new)

          anchor = '''    #[test]
    fn current_candidate_is_exact_and_stale_candidates_fail_closed() {
'''
          addition = '''    #[test]
    fn noncausal_rectangular_single_query_is_cross_attention() {
        let mut cross = config(1, 17);
        cross.causal = false;
        let request =
            FlatElasticRequest::new(cross, FlatKvRepresentation::PreRotated).unwrap();
        assert_eq!(request.problem_kind(), FlatProblemKind::CrossAttention);
    }

    #[test]
    fn every_length_bucket_boundary_is_an_explicit_plan_transition() {
        for (left, right) in [
            (1, 2),
            (4, 5),
            (16, 17),
            (64, 65),
            (256, 257),
            (1024, 1025),
            (4096, 4097),
        ]
        {
            assert_ne!(length_bucket(left), length_bucket(right));
        }

        for (left, right) in [
            (2, 4),
            (5, 16),
            (17, 64),
            (65, 256),
            (257, 1024),
            (1025, 4096),
            (4097, 8192),
        ]
        {
            assert_eq!(length_bucket(left), length_bucket(right));
        }
    }

'''
          if text.count(anchor) != 1:
              raise SystemExit("unexpected test insertion anchor")
          text = text.replace(anchor, addition + anchor)
          path.write_text(text)
          PY

      - name: Canonical format
        run: |
          rustfmt +nightly-2026-07-02 --edition 2021 src/flat_autotune.rs
          cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Locked check and tests
        run: |
          cargo +nightly-2026-07-02 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +nightly-2026-07-02 check -p scirust --features flat-autotune --locked
          cargo +nightly-2026-07-02 test -p scirust --features flat-autotune --lib --locked

      - name: Strict Clippy
        run: cargo +nightly-2026-07-02 clippy -p scirust --features flat-autotune --lib --locked -- -D warnings

      - name: MSRV check
        run: cargo +1.89.0 check -p scirust --features flat-autotune --locked

      - name: Verify scoped change
        run: |
          changed="$(git diff --name-only HEAD)"
          test "$changed" = "src/flat_autotune.rs"

      - name: Finalize qualified semantic fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/flat_autotune.rs
          git rm .github/workflows/flat-elastic-semantic-qualify.yml
          git commit -m "fix(autotune): classify FLAT cross attention before decode"
          git push origin HEAD:feat/flat-elastic-planner

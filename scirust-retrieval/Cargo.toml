[package]
name = "scirust-retrieval"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "SciRust pure semantic (dense transformer) retrieval — deterministic exact index, late-interaction reranking, and ranking metrics; an auditable alternative to RAG"

[dependencies]
scirust-core = { path = "../scirust-core", optional = true }
scirust-graph = { path = "../scirust-graph", optional = true }
scirust-license = { path = "../scirust-license" }
# SciRust's noise-processing toolkit, backing `vsa::fuse_observations`.
scirust-signal = { path = "../scirust-signal", optional = true }
serde = { version = "1", features = ["derive"] }

[features]
# Preserve the historical default behaviour while allowing external consumers to
# request only the learned primitive they actually need.
default = ["learned", "fusion"]

# Backward-compatible umbrella for the complete learned retrieval stack.
learned = [
    "ann",
    "contrastive",
    "feedback",
    "causal-rerank",
    "scirust-encoder",
]

# Random-hyperplane LSH/SimHash ANN with exact cosine reranking. It currently
# needs scirust-core only for the deterministic PCG engine; it does not need the
# causal graph.
ann = ["dep:scirust-core"]

# Deterministic InfoNCE ProjectionHead training backed by scirust-core autodiff.
contrastive = ["dep:scirust-core"]

# Feedback-driven retraining of ProjectionHead. Kept separate so an inference-
# only consumer can use a trained projection without pulling the improvement loop.
feedback = ["contrastive"]

# Causal reranking is graph-specific and does not require scirust-core.
causal-rerank = ["dep:scirust-graph"]

# Adapter implementing this crate's Encoder trait for scirust-core's
# EmbeddingEngine. External consumers with their own encoder do not need it.
scirust-encoder = ["dep:scirust-core"]

# Observation fusion for the VSA cleanup memory.
fusion = ["dep:scirust-signal"]

# The end-to-end demo and benchmark intentionally exercise the complete learned
# stack and therefore keep using the compatibility umbrella.
[[example]]
name = "rag_challenge"
required-features = ["learned"]

[[test]]
name = "contrastive_benchmark"
required-features = ["learned"]

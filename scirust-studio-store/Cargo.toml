[package]
name = "scirust-studio-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "SciRust Studio: immutable, content-hashed run storage — every execution's scenario, result, and provenance manifest written once and never modified, with interrupted-run detection and hash verification."

[dependencies]
scirust-studio-runtime = { path = "../scirust-studio-runtime" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is required, not optional: a stored result must load back
# bit-for-bit identical to the one that was written, or "immutable storage"
# would be true of the bytes on disk but false of the numbers read out of
# them. See `a_stored_result_loads_back_bit_for_bit`.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "scirust-agent-protocol"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89"
description = "Deterministic, capability-safe message protocol for SciAgent, COGNO-1 and external agents"
license-file = "../LICENSE.md"
repository = "https://github.com/Memorithm/scirust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
